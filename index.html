了解了不少。","py":"Zhège jiémù wǒ yìzhí zài kàn, tā jièshàole hěnduō shēnghuó zhōng de xiǎo zhīshi. Hěnduō yǐqián wǒ méiyǒu zhùyì dào de wèntí, xiànzài tōngguò tā liǎojiěle bùshǎo.","en":"I have always watched this programme; it introduces lots of small bits of everyday knowledge. Through it I have learned a lot about things I never noticed before."}]},{"label":"verb — pass through","items":[{"zh":"这条街只能步行通过。","py":"Zhètiáo jiē zhǐnéng bùxíng tōngguò.","en":"This street can only be passed on foot."}]},{"label":"verb — meet requirement","items":[{"zh":"我通过那家公司的面试了。经理对我印象不错，他要我明天就正式去上班。","py":"Wǒ tōngguò nàjiā gōngsī de miànshì le. Jīnglǐ duì wǒ yìnxiàng búcuò, tā yào wǒ míngtiān jiù zhèngshì qù shàngbān.","en":"I passed that company's interview. The manager had a good impression of me and wants me to start work officially tomorrow."}]}],"practice":{"label":"Complete the sentences/dialogues.","items":["《人与自然》这个节目一直很受欢迎，______ (通过)","A: 这次HSK考试你考得怎么样? B: ______ (通过)","A: 您为什么会写这本书呢? B: ______ (通过)"]}},{"n":3,"title":"可是","structure":"虽然……，可是……","usage":["The conjunction \"可是\" is used in the second clause of a complex sentence to indicate a transition in meaning.","Often coordinating with a clause introduced by \"虽然\" before it."],"examples":[{"label":"","items":[{"zh":"A: 你怎么又想换工作了，这儿的收入不是挺高的吗? B: 虽然收入高，可是经常要加班，很少有时间和家人在一起。","py":"A: Nǐ zěnme yòu xiǎng huàn gōngzuò le, zhèr de shōurù búshì tǐng gāo de ma? B: Suīrán shōurù gāo, kěshì jīngcháng yào jiābān, hěnshǎo yǒu shíjiān hé jiārén zài yìqǐ.","en":"A: Why do you want to change jobs again — isn't the income here quite high? B: The income is high, but I often have to work overtime and rarely have time with my family."},{"zh":"小时候，大家都说我像我妈，尤其是性格。可是长大后，他们说我更像爸爸。","py":"Xiǎoshíhou, dàjiā dōu shuō wǒ xiàng wǒ mā, yóuqí shì xìnggé. Kěshì zhǎngdà hòu, tāmen shuō wǒ gèng xiàng bàbà.","en":"When I was little everyone said I looked like my mum, especially in personality. But after I grew up they said I look more like my dad."},{"zh":"当时她的父母和亲戚都不支持她，可是她坚持自己的选择，现在终于向所有人证明了她的选择是正确的。","py":"Dāngshí tā de fùmǔ hé qīnqi dōu bù zhīchí tā, kěshì tā jiānchí zìjǐ de xuǎnzé, xiànzài zhōngyú xiàng suǒyǒu rén zhèngmíngle tā de xuǎnzé shì zhèngquè de.","en":"At the time her parents and relatives didn't support her, but she stuck to her choice and has now finally proved to everyone that her choice was right."}]}],"practice":{"label":"Complete the dialogues.","items":["他虽然写得比较慢，______ (可是)","A: 你为什么不喜欢小王? 他不是挺诚实的吗? B: ______ (可是)","A: 我约了几个同学星期六上午去打网球，你也去吧。 B: ______ (可是)"]}},{"n":4,"title":"结果","structure":"Action, 结果 + Outcome","usage":["As a noun: indicates the final state that something has developed into.","As a conjunction: indicates a cause-effect relationship, usually used in the second clause of a complex sentence, introducing the result of the situation mentioned in the first clause."],"examples":[{"label":"noun","items":[{"zh":"小张，你这份计划书写得不错，就按照这个计划去做市场调查吧。下个月把调查结果交上来。","py":"Xiǎo Zhāng, nǐ zhèfèn jìhuàshū xiě de búcuò, jiù ànzhào zhège jìhuà qù zuò shìchǎng diàochá ba. Xiàge yuè bǎ diàochá jiéguǒ jiāoshànglái.","en":"Xiao Zhang, you wrote this plan well — go and do the market survey according to it. Hand in the survey results next month."},{"zh":"如果你想做什么事情，那就勇敢地去做，不要担心结果，不要考虑会不会失败。","py":"Rúguǒ nǐ xiǎng zuò shénme shìqing, nà jiù yǒnggǎn de qù zuò, búyào dānxīn jiéguǒ, búyào kǎolǜ huì bú huì shībài.","en":"If you want to do something, then do it bravely; don't worry about the result and don't think about whether you might fail."}]},{"label":"conjunction","items":[{"zh":"我妻子想减肥，所以她每天早上都去骑马。结果马竟然在一个月之内瘦了二十斤。","py":"Wǒ qīzi xiǎng jiǎnféi, suǒyǐ tā měitiān zǎoshang dōu qù qímǎ. Jiéguǒ mǎ jìngrán zài yígeyuè zhīnèi shòule èrshíjīn.","en":"My wife wanted to lose weight, so she rode a horse every morning. As a result, the horse actually lost twenty jin within a month."},{"zh":"有些人爱说\"差不多\"。例如，每天的工作都是完成得差不多，结果，积累下来，就变成差很多了。","py":"Yǒuxiē rénài shuō\"chàbuduō\". Lìrú, měitiān de gōngzuò dōu shì wánchéng de chàbuduō, jiéguǒ, jīlěi xiàlái, jiù biànchéng chà hěnduō le.","en":"Some people like to say \"about right\". For example, if each day's work is only about done, then over time it accumulates into a big shortfall."}]}],"practice":{"label":"Complete the sentences/dialogues.","items":["没有人能随随便便成功，成功都是 ______ (结果)","昨天晚上我一直工作到很晚才睡，______ (结果)","A: 昨天的面试 ______? (结果) B: 明天或者后天吧，他们会打电话通知。"]}},{"n":5,"title":"上","structure":"上 + [Quantity object]","usage":["The verb \"上\" means \"to achieve or reach (a certain quantity or degree)\".","Often followed by an object indicating quantity."],"examples":[{"label":"","items":[{"zh":"这个城市的地铁已经有上百年的历史了。","py":"Zhège chéngshì de dìtiě yǐjīng yǒu shàngbǎinián de lìshǐ le.","en":"The subway in this city already has a history of over a hundred years."},{"zh":"每年有成千上万的高中毕业生参加艺术考试。","py":"Měinián yǒu chéngqiānshàngwàn de gāozhōng bìyèshēng cānjiā yìshù kǎoshì.","en":"Every year tens of thousands of high-school graduates take art exams."},{"zh":"爱迪生就是在找了上千种材料后才找到了能点亮电灯的材料。","py":"Àidíshēng jiù shì zài zhǎole shàng qiān zhǒng cáiliào hòu cái zhǎodàole néng diǎnliàng diàndēng de cáiliào.","en":"Edison only found the material that could light a lamp after trying thousands of materials."}]}],"practice":{"label":"Complete the sentences.","items":["这件事发生在1914年，______ (上)","这张本来值两三毛钱的旧报纸可以卖出两三百元的高价，______ (上)","这个电影很有名，______ (上)"]}}],"compare":{"a":"通过","b":"经过","sim":[{"title":"","lines":[{"k":"text","t":"Both can indicate the attainment of a certain goal via somebody or by means of something."},{"k":"ex","t":"通过/经过大家的努力，公司的生意越做越大。","py":"Tōngguò / jīngguò dàjiā de nǔlì, gōngsī de shēngyi yuèzuòyuè dà.","en":"Through everyone's efforts, the company's business has grown bigger and bigger."}]}],"diff":[{"title":"Word class & emphasis","lines":[{"k":"text","t":"\"通过\" is a preposition → emphasizes the method or means."},{"k":"text","t":"\"经过\" is a verb → emphasizes the process."},{"k":"ex","t":"希望通过这次活动引起大家的兴趣，让大家更了解我们公司。","py":"Xīwàng tōngguò zhè cì huódòng yǐnqǐ dàjiā de xìngqù, ràng dàjiā gèng liǎojiě wǒmen gōngsī.","en":"We hope this event will arouse everyone's interest and let people know our company better."},{"k":"ex","t":"经过一次次失败之后，他终于成功了。","py":"Jīngguò yīcìcì shībài zhīhòu, tā zhōngyú chénggōng le.","en":"After failing again and again, he finally succeeded."}]},{"title":"As verbs","lines":[{"k":"text","t":"\"通过\" means \"to pass through someplace from one end (side) to another end (side)\"."},{"k":"text","t":"\"经过\" means \"to go...by way of...\" without the meaning of \"passing through\"."},{"k":"ex","t":"这里正在修路，汽车无法通过。","py":"Zhèli zhèngzài xiūlù, qìchē wúfǎ tōngguò.","en":"The road is being repaired here, so cars cannot pass."},{"k":"ex","t":"我正好经过这儿，顺便过来看看你。","py":"Wǒ zhènghǎo jīngguò zhèr, shùnbiàn guòlái kànkan nǐ.","en":"I happened to pass by here, so I dropped in to see you."}]},{"title":"As noun","lines":[{"k":"text","t":"\"经过\" can also be used as a noun, indicating the development process of something."},{"k":"text","t":"\"通过\" has no such usage."},{"k":"ex","t":"小王把事情的经过告诉我了，原来这件事真的跟你没关系。","py":"Xiǎo Wáng bǎ shìqing de jīngguò gàosu wǒ le, yuánlái zhè jiàn shì zhēn de gēn nǐ méiguānxi.","en":"Xiao Wang told me how things happened — so it really had nothing to do with you."}]}],"drill":[["","通过","经过"],["(1) ______调查我们发现，客人住宾馆最关心的是干净不干净。","√","√"],["(2) 这是保修卡，遇到什么问题，您可以______上面的电话联系我们。","√","×"],["(3) 我不了解这件事情的______，你问问其他人吧。","",""],["(4) 这段时间的学习，他的汉语水平提高了不少。","",""],["(5) 有些人______节食的方法来减肥，虽然有效，但是时间长了对身体没有好处。","",""]],"core":"介词 vs. 动词；\"经过\"可做名词","drill_label":"Tick or cross."}},"10":{"points":[{"n":1,"title":"不过","structure":"Statement, 不过 + Statement","usage":["As a conjunction: used at the beginning of the second clause to indicate a transition in meaning, supplementing and revising what has been said in the first clause.","As an adverb: means \"merely\", emphasizing the amount or scale is small."],"examples":[{"label":"conjunction","items":[{"zh":"我现在上有老，下有小。除了工作以外，家里还有母亲和儿子需要照顾。不过现在我很幸福。","py":"Wǒ xiànzài shàng yǒu lǎo, xià yǒu xiǎo. Chúle gōngzuò yǐwài, jiā li hái yǒu mǔqīn hé érzi xūyào zhàogù. Búguò xiànzài wǒ hěn xìngfú.","en":"I now have old people above and young ones below. Besides work, I have my mother and son to look after at home. But now I'm very happy."},{"zh":"你再早来一会儿就好了，那辆车刚开走，你只能等下一辆了。不过也不用多长时间，估计十几分钟就来了。","py":"Nǐ zài zǎolái yíhuìr jiù hǎo le, nàliàngchē gāng kāizǒu, nǐ zhǐnéng děng xià yí liàng le. Búguò yě búyòng duōchángshíjiān, gūjì shíjǐfēnzhōng jiù lái le.","en":"If you had come a little earlier — that bus has just left, so you can only wait for the next one. It won't be long though; I reckon it will come in ten-odd minutes."}]},{"label":"adverb","items":[{"zh":"我们不过谈了点儿工作方面的问题，别的都没谈。","py":"Wǒmen búguò tánle diǎnr gōngzuò fāngmiàn de wèntí, biéde dōu méi tán.","en":"We only talked about a few work matters; we didn't discuss anything else."},{"zh":"A: 没有你的帮助，我们肯定不能按时完成任务，真是太谢谢你了。 B: 你太客气了，我不过是给了些建议，这一切都是你们辛苦努力的结果。","py":"A: Méiyǒu nǐ de bāngzhù, wǒmen kěndìng bùnéng ànshí wánchéng rènwu, zhēnshì tài xièxie nǐ le. B: Nǐ tài kèqì le, wǒ búguò shì gěile xiē jiànyì, zhè yīqièdōushì nǐmen xīnkǔ nǔlì de jiéguǒ.","en":"A: Without your help we could never have finished the task on time — thank you so much. B: You're too kind; I only gave some suggestions — it is all the result of your hard work."}]}],"practice":{"label":"Complete the sentences/dialogues.","items":["这么漂亮的衣服 ______，买一件吧。(不过)","A: 中午吃西红柿鸡蛋面怎么样? B: 可以，______ (不过)","A: 你知道怎么去世界公园吗? 我明天要去那儿附近办点儿事。 B: 我对那儿也不太熟悉，______ (不过)"]}},{"n":2,"title":"确实","structure":"Subject + 确实 + Verb/Adj","usage":["The adverb \"确实\" confirms the veracity of an objective condition."],"examples":[{"label":"","items":[{"zh":"爱情确实是结婚的重要原因，但仅有爱情是不够的。","py":"Àiqíng quèshí shì jiéhūn de zhòngyào yuányīn, dàn jǐn yǒu àiqíng shì búgòu de.","en":"Love is indeed an important reason for marriage, but love alone is not enough."},{"zh":"A: 好几年没见，你还是这么爱开玩笑，我哪儿有你说的那么年轻。 B: 我说的是真的，你确实比以前更年轻、更漂亮了。","py":"A: Hǎojǐnián méi jiàn, nǐ háishì zhème ài kāiwánxiào, wǒ nǎr yǒu nǐ shuō de nàme niánqīng. B: Wǒ shuō de shì zhēn de, nǐ quèshí bǐ yǐqián gèng niánqīng, gèng piàoliang le.","en":"A: We haven't seen each other for years and you still like joking — I'm not nearly as young as you say. B: I mean it — you really look younger and prettier than before."},{"zh":"我女儿确实不错，记得她刚拿到第一个月工资时，就兴奋地拉着���和她爸俩去商场，给我们买礼物，那时我和她爸心里别提多美了！","py":"Wǒ nǚ'ér quèshí búcuò, jìde tā gāng nádào dì-yī ge yuè gōngzī shí, jiù xīngfèn de lāzhe wǒ hé tā bà liǎ qù shāngchǎng, gěi wǒmen mǎi lǐwù, nà shí wǒ hé tā bà xīnli biétí duō měi le!","en":"My daughter really is good; I remember when she got her first month's pay she excitedly pulled her dad and me to the mall to buy us gifts — we were so happy then!"}]}],"practice":{"label":"Complete the dialogues/sentences.","items":["A: 终于爬上来了，累死我了，这山太高了! B: ______ (确实)","A: 教室里太热了，把窗户打开吧。 B: ______ (确实)","有一句歌词是这样写的：\"我能想到最浪漫的事，就是和你一起慢慢变老。\"世界那么大，两个人相识已经不容易，还要互相了解、互相喜欢，一起生活，一直到生命的最后，______ (确实)"]}},{"n":3,"title":"在……看来","structure":"在 + Person + 看来","usage":["\"在……看来\" is a parenthesis, indicating what is to be followed is an opinion or idea."],"examples":[{"label":"","items":[{"zh":"在很多人看来，听流行音乐仅仅是年轻人的爱好，其实现在不少中老年人对流行歌曲也很感兴趣。","py":"Zài hěnduō rén kànlái, tīng liúxíngyīnyuè jǐnjǐn shì niánqīngrén de àihào, qíshí xiànzài bùshǎo zhōng lǎoniánrén duì liúxínggēqǔ yě hěn gǎnxìngqù.","en":"In many people's view, listening to pop music is just a young people's hobby, but actually quite a few middle-aged and older people are interested in pop songs too."},{"zh":"在我看来，比赛结果并不是最重要的，在参加比赛的过程中使自己获得提高更重要。","py":"Zài wǒ kànlái, bǐsài jiéguǒ bìng búshì zuì zhòngyào de, zài cānjiā bǐsài de guòchéng zhōngshǐ zìjǐ huòdé tígāo gèng zhòngyào.","en":"In my view the result of a match is not the most important thing; improving yourself during the match matters more."},{"zh":"A: 你觉得在选择职业时，收入重要吗? B: 在我看来，赚钱多少不是最重要的，兴趣才是关键。","py":"A: Nǐ juéde zài xuǎnzé zhíyè shí, shōurù zhòngyào ma? B: Zàiwǒkànlái, zhuànqián duōshao bú shì zuì zhòngyào de, xìngqù cái shì guānjiàn.","en":"A: Do you think income is important when choosing a career? B: In my view, how much you earn is not the most important; interest is the key."}]}],"practice":{"label":"Complete the sentences/dialogues.","items":["有人说时间就是金钱，______ (在……看来)","邓亚萍是中国的乒乓球运动员，她的身高只有一米五五，______ (在……看来)","A: 你觉得男人和女人在性格上有什么区别? B: ______ (在……看来)"]}},{"n":4,"title":"由于","structure":"由于 + Cause, (Result)","usage":["As a conjunction: indicates the reason for something, usually followed by a sentence and used in the first clause of a complex sentence.","As a preposition: indicates a reason, followed by a nominal phrase."],"examples":[{"label":"conjunction","items":[{"zh":"今年春节他们本来打算出国去逛逛，但是由于家里的老人突然生病了，所以他们只好放弃了这个计划。","py":"Jīnnián Chūn Jié tāmen běnlái dǎsuàn chūguó qùguàng guàng, dànshì yóuyú jiāli de lǎorén tūrán shēngbìng le, suǒyǐ tāmen zhǐhǎo fàngqìle zhège jìhuà.","en":"They originally planned to go abroad for a trip this Spring Festival, but because an elderly relative suddenly fell ill, they had to give up the plan."},{"zh":"当你生病了，如果由于缺钱而不能及时去看医生，你的健康都很难得到保证，就更别说幸福了。","py":"Dāng nǐ shēngbìng le, rúguǒ yóuyú quē qián ér bù néng jíshí qù kàn yīshēng, nǐ de jiànkāng dōu hěn nán dédào bǎozhèng, jiù gèng biéshuō xìngfú le.","en":"When you are ill, if you can't see a doctor in time for lack of money, even your health is hard to guarantee — let alone happiness."}]},{"label":"preposition","items":[{"zh":"由于种种原因，我们不得不改变原来的计划。","py":"Yóuyú zhǒngzhǒngyuányīn, wǒmen bùdébù gǎibiàn yuánlái de jìhuà.","en":"For various reasons, we have no choice but to change the original plan."},{"zh":"由于工作的需要，我去年十月去了趟上海，跟一家公司去谈生意。","py":"Yóuyú gōngzuò de xūyào, wǒ qùnián shíyuè qùle tàng Shànghǎi, gēn yījiā gōngsī qù tán shēngyi.","en":"Because of work needs, I made a trip to Shanghai last October to negotiate business with a company."}]}],"practice":{"label":"Complete the sentences/dialogues.","items":["______，今天考得不怎么样。(由于)","______，这次活动的举办时间不得不改到下周。(由于)","A: 飞机怎么还没起飞? B: ______ (由于)"]}},{"n":5,"title":"比如","structure":"Statement, 比如 + Noun","usage":["The verb \"比如\" introduces the examples to explain something or some situation."],"examples":[{"label":"","items":[{"zh":"还有人说，小时候幸福是一件东西，比如一块橡皮、一块糖，得到了就很幸福。","py":"Háiyǒu rén shuō, xiǎoshíhou xìngfú shì yí jiàn dōngxi, bǐrú yí kuài xiàngpí, yí kuài táng, dédàole jiù hěn xìngfú.","en":"Some also say that when you are small happiness is a thing, such as an eraser or a sweet — getting it makes you very happy."},{"zh":"每个人都有自己特别感兴趣的东西，比如，作家爱写小说，画家爱画画儿。我们只有了解了自己的兴趣爱好后，才能更好地发展自己。","py":"Měi ge rén dōu yǒu zìjǐ tèbié gǎnxìngqù de dōngxi, bǐrú, zuòjiā àixiě xiǎoshuō, huàjiā ài huàhuà ér. Wǒmen zhǐyǒu liǎojiěle zìjǐ de xìngqùàihào hòu, cáinéng gènghǎo de fāzhǎn zìjǐ.","en":"Everyone has things they are especially interested in; for example, writers love writing novels and painters love painting. Only after understanding our own interests can we develop ourselves better."},{"zh":"旅游前最好做个计划，比如要去几个地方，怎么坐车，带哪些东西，一共要玩儿多少天等。把这些都提前想好，旅游时才会更轻松。","py":"Lǚyóu qián zuìhǎo zuòge jìhuà, bǐrú yào qù jǐ ge dìfang, zěnme zuòchē, dài nǎxiē dōngxi, yígòng yào wánr duōshao tiānděng. Bǎ zhèxiē dōu tíqián xiǎng hǎo, lǚyóu shícái huì gèng qīngsōng.","en":"Before travelling it's best to make a plan — for example how many places to go, how to travel, what to bring, how many days to spend, etc. If you think these through in advance, the trip will be more relaxing."}]}],"practice":{"label":"Complete the sentences.","items":["有时候，质量很好的东西也会很便宜。______ (比如)","刚到一个新环境，有很多种方法来使自己快一点儿适应。______ (比如)","在汉语里，我们把\"海\"、\"江\"、\"河\"这些字左边的部分叫作\"三点水\"。如果一个字中有这个部分，说明这个字的意思可能和水有关系。这样的汉字还有很多，______ (比如)"]}}],"compare":{"a":"不过","b":"但是","sim":[{"title":"","lines":[{"k":"text","t":"Both are used at the beginning of the second clause to indicate a transition in meaning."},{"k":"ex","t":"我本来想当律师，不过/但是后来我发现自己对新闻更感兴趣。","py":"Wǒ běnlái xiǎngdāng lǜshī, búguò / dànshì hòulái wǒ fāxiànzìjǐ duì xīnwén gèng gǎnxìngqù.","en":"I originally wanted to be a lawyer, but later I found I was more interested in journalism."}]}],"diff":[{"title":"Tone & usage","lines":[{"k":"text","t":"\"不过\" is often used in spoken Chinese to politely give a suggestion or express refusal."},{"k":"text","t":"\"但是\" conveys a harder tone."},{"k":"ex","t":"对不起，先生，那种蛋糕已经卖完了，不过，您可以尝一下这种饼干，味道也很不错。","py":"Duìbuqǐ, xiānsheng, nàzhǒng dàngāo yǐjīng màiwán le, búguò, nín kěyǐ cháng yíxià zhèzhǒng bǐnggān, wèidào yě hěn búcuò.","en":"Sorry, sir, that cake is sold out; however, you could try this biscuit — it tastes very good too."},{"k":"ex","t":"别人的方法也许很有效，但是并不一定适合你。","py":"Biérén de fāngfǎ yěxǔ hěn yǒuxiào, dànshì bìngbùyídìng shìhé nǐ.","en":"Other people's methods may be very effective, but they are not necessarily right for you."}]},{"title":"As adverb","lines":[{"k":"text","t":"\"不过\" can also be used as an adverb, meaning \"only, merely\", usually followed by a numeral."},{"k":"text","t":"\"但是\" has no such usage."},{"k":"ex","t":"去年我不过50公斤，今年怎么这么胖了?","py":"Qùnián wǒ búguò wǔshí gōngjīn, jīnnián zěnme zhème pàngle?","en":"Last year I was only 50 kg — why am I so fat this year?"}]}],"drill":[["","不过","但是"],["(1) 每天喝一点儿葡萄酒，对身体是有好处的。______不能喝太多。","√","√"],["(2) 他结婚的时候______20岁。","√","×"],["(3) 大部分人每天晚上至少应该睡7个小时，______这个标准并不适合每一个人。","",""],["(4) 对不起，先生，我们店的刷卡机坏了，只能用现金。商场附近有家银行，您出了门右转，走到头儿就能看到。","",""],["(5) 这次亲戚来北京住两三天，就让他来家里住吧，不用住宾馆了。","",""]],"core":"委婉 vs. 语气更重；\"不过\"可做副词","drill_label":"Tick or cross."}},"11":{"points":[{"n":1,"title":"连","structure":"连 + [Extreme case] + 也/都 + [Verb]","usage":["The preposition \"连\" is often used in the structure \"连……也/都……\" for emphasis.","The speaker explains another kind of situation by emphasizing an extreme case.","The noun following \"连\" can be the subject or a prepositive object."],"examples":[{"label":"","items":[{"zh":"如果连你自己都不喜欢自己，又怎么能让别人喜欢你呢？","py":"Rúguǒ lián nǐ zìjǐ dōu bù xǐhuan zìjǐ, yòu zěnme néng ràng biérén xǐhuan nǐ ne?","en":"If even you don't like yourself, how can you make others like you?"},{"zh":"广告越来越多，几乎无处不在。不只是电视上有广告，公共汽车、地铁上也有很多广告，连我住的楼的电梯里都有三个广告。","py":"Guǎnggào yuèláiyuè duō, jīhū wúchǔbùzài. Bù zhǐshì diànshì shàng yǒu guǎnggào, gōnggòngqìchē, dìtiě shàng yě yǒu hěnduō guǎnggào, lián wǒ zhù de lóu de diàntī li dōu yǒu sān ge guǎnggào.","en":"Advertisements are increasing and are almost everywhere. Not only are there ads on TV — there are also many on buses and the subway, and even the lift in my building has three."},{"zh":"你太厉害了！连中文报纸都看得懂。","py":"Nǐ tài lìhai le! Lián Zhōngwén bàozhǐ dōu kàn de dǒng.","en":"You're amazing! You can even understand Chinese newspapers."}]}],"practice":{"label":"Complete the sentences.","items":["______，小孩子更拿不动了。(连)","______，我们更解决不了了。(连)","安娜因为这件事很生气，______ (连)"]}},{"n":2,"title":"否则","structure":"[Clause 1], 否则 + [Result/Alternative]","usage":["The conjunction \"否则\" means \"if not..., then...\".","The sentence following it indicates the result inferred from the previous sentence or offers another choice."],"examples":[{"label":"","items":[{"zh":"他一定有重要的事找你，否则不会打这么多次电话来。","py":"Tā yídìng yǒu zhòngyào de shì zhǎo nǐ, fǒuzé búhuì dǎ zhème duōcì diànhuà lái.","en":"He must have something important to see you about, otherwise he wouldn't have phoned so many times."},{"zh":"你最好下午四点前去公司找她，否则就明天早上再去。","py":"Nǐ zuìhǎo xiàwǔ sìdiǎn qiánqù gōngsī zhǎo tā, fǒuzé jiù míngtiān zǎoshang zài qù.","en":"You'd better go to her company before four this afternoon; otherwise go tomorrow morning."},{"zh":"看来要想考好，不但要认真复习，还得注意考试的方法，否则会做的题也没时间做了。","py":"Kànlái yào xiǎng kǎohǎo, búdàn yào rènzhēn fùxí, hái děi zhùyì kǎoshì de fāngfǎ, fǒuzé huì zuò de tí yě méi shíjiān zuò le.","en":"To do well in exams you need to revise carefully and also pay attention to exam technique; otherwise you won't have time even for the questions you can do."}]}],"practice":{"label":"Complete the sentences.","items":["理想的广告不应该太长，______ (否则)","要想减肥成功，一定要坚持，______ (否则)","去美国留学前应该先学好英语，______ (否则)"]}},{"n":3,"title":"无论","structure":"无论 + [Alternatives/Interrogative pronoun], 都/也 + [Result]","usage":["The conjunction \"无论\" means the result or conclusion won't change under any circumstances.","Usually used in the structure \"无��……都/也……\".","Can be followed by:","Coordinate alternatives (A还是B)","An interrogative pronoun referring to anybody or anything."],"examples":[{"label":"","items":[{"zh":"无论是普通杂志，还是著名小说，只要打开它们，就会发现，世界上有那么多有意思的事情，有那么多不一样的生活。","py":"Wúlùn shì pǔtōng zázhì, háishì zhùmíng xiǎoshuō, zhǐyào dǎkāi tāmen, jiù huì fāxiàn, shìjiè shang yǒu nàme duō yǒu yìsi de shìqing, yǒu nàme duō bù yíyàng de shēnghuó.","en":"Whether it is an ordinary magazine or a famous novel, once you open them you'll find there are so many interesting things in the world and so many different ways of living."},{"zh":"无论做什么事都要注意方法，正确的方法可以让我们做得更好。","py":"Wúlùn zuò shénme shì dōu yào zhùyì fāngfǎ, zhèngquè de fāngfǎ kěyǐ ràng wǒmen zuò de gènghǎo.","en":"Whatever you do, pay attention to method; the right method lets us do better."},{"zh":"这次比赛他已经打出了自己最好的水平，无论结果怎么样，我们都应该为他高兴。","py":"Zhè cì bǐsài tā yǐjīng dǎchūle zìjǐ zuìhǎo de shuǐpíng, wúlùn jiéguǒ zěnmeyàng, wǒmen dōu yīnggāi wèi tā gāoxìng.","en":"In this match he played at his best level; whatever the result, we should be happy for him."}]}],"practice":{"label":"Complete the sentences.","items":["______，她都非常认真。(无论)","做事情如果不注意方法，______ (无论)","______，我们都会为您免费送货。(无论)"]}},{"n":4,"title":"然而","structure":"Statement, 然而 + Contrasting Statement","usage":["The conjunction \"然而\" is used at the beginning of the second half of a sentence to indicate a turn in meaning.","Usually used in written Chinese.","Can be followed by a comma to indicate a pause."],"examples":[{"label":"","items":[{"zh":"他虽然失败了很多次，然而一直没有放弃。","py":"Tā suīrán shībàile hěn duōcì, ránér yìzhí méiyǒu fàngqì.","en":"Although he failed many times, he never gave up."},{"zh":"很多人觉得自己的生活是幸福的，然而每个人对幸福的看法却不完全相同。","py":"Hěnduō rén juéde zìjǐ de shēnghuó shì xìngfú de, ránér měi ge rén duì xìngfú de kànfǎ què bù wánquánxiāngtóng.","en":"Many people think their lives are happy; however, each person's view of happiness is not entirely the same."},{"zh":"另外，在看完一篇文章或一本书之后，还可以把它的主要内容和自己的想法写下来。然而，你不能完全相信书本上的内容，要有自己的看法和判断。","py":"Lìngwài, zài kànwán yì piān wénzhāng huò yì běn shū zhīhòu, hái kěyǐ bǎ tā de zhǔyào nèiróng hé zìjǐ de xiǎngfǎ xiě xiàlái. Rán'ér, nǐ bù néng wánquán xiāngxìn shūběn shang de nèiróng, yào yǒu zìjǐ de kànfǎ hé pànduàn.","en":"After finishing an article or a book you can also write down its main content and your own thoughts. However, you cannot fully trust what is in books — you need your own views and judgement."}]}],"practice":{"label":"Complete the sentences.","items":["他从小就想成为一名警察，______ (然而)","把简单的问题说复杂并不难，______ (然而)","有的人觉得只要有钱就会幸福，______ (然而)"]}},{"n":5,"title":"同时","structure":"Subject + 同时 + Verb","usage":["As a conjunction: introduces a further remark, often used together with \"又/也/还\".","As a noun: indicates that two actions take place at the same time, often used in the structure \"在……(的)同时\"."],"examples":[{"label":"conjunction","items":[{"zh":"因为小孩子的想法没有那么复杂，所以他们总是很快乐。同时，小孩子也是最诚实的。","py":"Yīnwèi xiǎoháizi de xiǎngfǎ méiyǒu nàme fùzá, suǒyǐ tāmen zǒngshì hěn kuàilè. Tóngshí, xiǎoháizi yě shì zuì chéngshí de.","en":"Children's thinking is not that complicated, so they are always happy. At the same time, children are also the most honest."},{"zh":"阅读有许多好处，它能丰富你的知识，让你找到解决问题的办法；同时，它还会丰富你的情感，使你的生活更精彩。","py":"Yuèdú yǒu xǔduō hǎochu, tā néng fēngfù nǐ de zhīshi, ràng nǐ zhǎodào jiějué wèntí de bànfǎ; tóngshí, tā hái huì fēngfù nǐ de qínggǎn, shǐ nǐ de shēnghuó gèng jīngcǎi.","en":"Reading has many benefits: it enriches your knowledge and helps you find ways to solve problems; at the same time, it enriches your feelings and makes your life more colourful."}]},{"label":"noun","items":[{"zh":"李教授讲的这个故事让人觉得好笑的同时，又让人觉得有些难过。","py":"Lǐ jiàoshòu jiǎng de zhège gùshi ràng rén juéde hǎoxiào de tóngshí, yòu ràng rén juéde yǒuxiē nánguò.","en":"The story Professor Li told made people laugh and, at the same time, feel a little sad."},{"zh":"在学习汉语的同时，我还了解了中国文化，认识了很多中国朋友。","py":"Zài xuéxí hànyǔ de tóngshí, wǒ hái liǎojiěle Zhōngguó wénhuà, rènshile hěnduō Zhōngguó péngyou.","en":"While studying Chinese I also learned about Chinese culture and made many Chinese friends."}]}],"practice":{"label":"Complete the sentences.","items":["他是我们的老师，______ (同时)","她是著名的科学家，______ (同时)","______，还在一个公司工作。(在……同时)"]}}],"compare":{"a":"无论","b":"不管","sim":[{"title":"","lines":[{"k":"text","t":"Both can be used as conjunctions, usually together with \"都/也\", to indicate that the result or conclusion won't change under any circumstances."},{"k":"text","t":"Both can be followed by an interrogative pronoun referring to anybody or anything or by coordinate alternatives."},{"k":"ex","t":"无论/不管干什么事情，最好都能提前做好计划。","py":"Wúlùn / bùguǎn gànshénme shìqing, zuìhǎo dōu néng tíqián zuòhǎo jìhuà.","en":"Whatever you do, it's best to make a plan in advance."},{"k":"ex","t":"无论/不管是烦恼的事，还是愉快的事，我每天都会在日记里记下来。","py":"Wúlùn / bùguǎn shì fánnǎo de shì, háishì yúkuài de shì, wǒ měitiān dōu huì zài rìjì li jìxiàlái.","en":"Whether it's something troubling or something pleasant, I write it down in my diary every day."}]}],"diff":[{"title":"Register & formal words","lines":[{"k":"text","t":"\"不管\" is often used in spoken Chinese and cannot take formal/classical words such as \"如何\" and \"是否\"."},{"k":"text","t":"\"无论\" is often used in written Chinese and has no such restriction."},{"k":"ex","t":"无论如何，我都不会离开你。","py":"Wúlùnrúhé, wǒ dōu búhuì líkāi nǐ.","en":"No matter what, I will never leave you."}]},{"title":"Affirmative-negative form","lines":[{"k":"text","t":"\"不管\" can be followed by an affirmative-negative form."},{"k":"text","t":"When \"无论\" is followed by an affirmative-negative form, \"还是/跟/与\" is usually used between the affirmative and negative constituents."},{"k":"ex","t":"不管热不热，他总是穿这么多。","py":"Bùguǎn rèbùrè, tā zǒngshì chuān zhème duō.","en":"Hot or not, he always wears this much."},{"k":"ex","t":"无论/不管热还是不热，他总是穿这么多。","py":"Wúlùn / bùguǎn rè háishì bú rè, tā zǒngshì chuān zhème duō.","en":"Whether it's hot or not, he always wears this much."}]}],"drill":[["","无论","不管"],["(1) ______别人说什么，我只相信自己眼睛看见的东西。","√","√"],["(2) ______去不去，最后都别忘了告诉我一声。","×","√"],["(3) ______是工作还是学习，\"光说不练\"都是不行的。","",""],["(4) 虽然压力很大，但是为了我们共同的理想，______如何一定不能放弃。","",""],["(5) 阳光、空气和水，______是对动植物，还是对人来说，这三样东西都是不可缺少的。","",""]],"core":"书面 vs. 口语；正反形式搭配不同","drill_label":"Tick or cross."}},"12":{"points":[{"n":1,"title":"并且","structure":"Clause 1 + 并且 + Clause 2","usage":["Connecting coordinate verbs or adjectives: indicates several actions or qualities taking place or existing at the same time.","Connecting sentences: indicates a further meaning."],"examples":[{"label":"","items":[{"zh":"他做事很认真，并且有丰富的经验，让他负责很合适。","py":"Tā zuòshì hěn rènzhēn, bìngqiě yǒu fēngfù de jīngyàn, ràng tā fùzé hěn héshì.","en":"He works carefully and also has rich experience, so putting him in charge is very suitable."},{"zh":"这种植物开的花比普通的花大很多，并且特别漂亮。","py":"Zhèzhǒng zhíwù kāi de huā bǐ pǔtōng de huādà hěnduō, bìngqiě tèbié piàoliang.","en":"The flowers this plant produces are much bigger than ordinary flowers, and especially beautiful."},{"zh":"这房子家具全，电视、空调、冰箱都很新，并且价格也便宜，真的很值得考虑。","py":"Zhè fángzi jiājù quán, diànshì, kōngtiáo, bīngxiāng dōu hěn xīn, bìngqiě jiàgé yě piányi, zhēn de hěn zhíde kǎolǜ.","en":"This house has a full set of furniture; the TV, air conditioner and fridge are all new, and the price is also cheap — it is really worth considering."},{"zh":"好，我再跟同事商量商量，希望能及时发现问题，并且准确地找到解决问题的方法。","py":"Hǎo, wǒ zài gēn tóngshì shāngliang shāngliang, xīwàng néng jíshí fāxiàn wèntí, bìngqiě zhǔnquè de zhǎodào jiějué wèntí de fāngfǎ.","en":"Good, I'll talk it over with my colleagues, hoping to find problems in time and also find the solution accurately."}]}],"practice":{"label":"Complete the sentences.","items":["所以我们只好留在家里了。______ (并且)","很多人都选择坐地铁上下班，______ (并且)","______最��就一定能获得成功。(并且)"]}},{"n":2,"title":"再……也……","structure":"再 + [Verb/Adjective/Clause] + 也 + [Result]","usage":["The structure \"再……也……\" is usually used in a hypothetical sentence indicating concession.","\"再\" can be followed by a verb, an adjective or a sentence etc., meaning \"even if, no matter how\"."],"examples":[{"label":"","items":[{"zh":"事情已经发生了，你再后悔也无法改变，别伤心了。","py":"Shìqing yǐjīng fāshēng le, nǐ zài hòuhuǐ yě wúfǎ gǎibiàn, bié shāngxīn le.","en":"It has already happened; no matter how much you regret it you can't change it. Don't be sad."},{"zh":"用盐水来洗新衣服，这样穿得再久、洗的次数再多，衣服也不容易掉颜色。","py":"Yòng yánshuǐ lái xǐ xīn yīfu, zhèyàng chuān de zài jiǔ, xǐ de cìshù zài duō, yīfu yě bù róngyì diào yánsè.","en":"Washing new clothes in salt water, however long you wear them and however many times you wash them, they won't fade easily."},{"zh":"如果我们有什么看法或者意见，不管别人再怎么不同意、不支持，也应该说出来，让别人知道我们的想法和态度。","py":"Rúguǒ wǒmen yǒu shénme kànfǎ huòzhě yìjiàn, bùguǎn biérén zài zěnme bùtóng yì, bù zhīchí, yě yīnggāi shuō chūlái, ràng biérén zhīdào wǒmen de xiǎngfǎ hé tàidù.","en":"If we have any views or opinions, however much others disagree or fail to support us, we should say them so that others know our thoughts and attitude."}]}],"practice":{"label":"Complete the sentences.","items":["如果一个人不积极、不努力，______ (再……也……)","同学们只要平时认真学习，______ (再……也……)","有些事情过去了就过去了，不要后悔，______ (再……也……)"]}},{"n":3,"title":"对于","structure":"对于 + [Object], [Subject] + [Verb/Adjective]\nOr: [Subject] + 对于 + [Object] + [Verb/Adjective]","usage":["The preposition \"对于\" introduces the object that a certain attitude or situation is concerned with.","\"对于……\" can either precede or follow the subject."],"examples":[{"label":"","items":[{"zh":"对于这件事，我跟大家的看法不同。","py":"Duìyú zhè jiàn shì, wǒ gēn dàjiā de kànfǎ bùtóng.","en":"On this matter, my view differs from everyone else's."},{"zh":"对于中国人来说，春节是一年之中最重要的节日，春节的时候人们会举行各种各样的迎新年活动。","py":"Duìyú Zhōngguó rén láishuō, Chūn Jié shì yì nián zhīzhōng zuì zhòngyào de jiérì, Chūn Jié de shíhou rénmen huì jǔxíng gèzhǒnggèyàng de yíngxīnnián huódòng.","en":"For Chinese people, the Spring Festival is the most important festival of the year, and people hold all kinds of activities to welcome the new year."},{"zh":"那您认为对于老师来说，什么是最难做到的？","py":"Nà nín rènwéi duìyú lǎoshī lái shuō, shénme shì zuì nán zuòdào de?","en":"Then what do you think is the hardest thing for a teacher to do?"}]}],"practice":{"label":"Complete the sentences.","items":["______，她都非常认真。(对于)","______，他们很难做出决定。(对于)","______，这个阅读题有点儿难。(对于)"]}},{"n":4,"title":"名量词重叠","structure":"AA (e.g., 人人、天天、件件、本本、年年)","usage":["A noun or measure word is often reduplicated in the form of \"AA\" to mean \"each, every\".","The head word modified by a reduplicated measure word can serve as:","The subject","The attribute of the subject","The adverbial","Cannot serve as the object or the attribute of the object."],"examples":[{"label":"","items":[{"zh":"人人都会使用语言，但是怎么用语言把话说好却是一门艺术。","py":"Rénrén dōu huì shǐyòng yǔyán, dànshì zěnme yòng yǔyán bǎ huà shuōhǎo què shì yì mén yìshù.","en":"Everyone can use language, but using language to speak well is an art."},{"zh":"白先生天天都去那家咖啡馆坐一会儿，因为他觉得，工作了一天，只有安静的地方才能让他得到放松。","py":"Bái xiānsheng tiāntiān dōu qù nàjiā kāfēiguǎn zuò yíhuìr, yīnwèi tā juéde, gōngzuòle yì tiān, zhǐyǒu ānjìng de dìfang cáinéng ràng tā dédào fàngsōng.","en":"Mr Bai goes to that café every day to sit a while, because he feels that after a day's work only a quiet place lets him relax."},{"zh":"做好小事是完成大事的第一步，因此，件件小事都应该被看成是一次学习的机会。","py":"Zuòhǎo xiǎoshì shì wánchéng dàshì de dìyībù, yīncǐ, jiàn jiàn xiǎoshì dōu yīnggāi bèi kànchéng shì yí cì xuéxí de jīhuì.","en":"Doing small things well is the first step to completing big things, so every small thing should be seen as a chance to learn."}]}],"practice":{"label":"Complete the sentences.","items":["______，就都可以变得越来越优秀。(人人)","这个作家的语言很幽默，______ (本本)","______，这为找工作的毕业生提供了很多机会。(年年)"]}},{"n":5,"title":"相反","structure":"相反 + Statement","usage":["As a conjunction: used at the beginning or in the middle of the following sentence to indicate a contrary or further meaning.","As an adjective: indicates the two aspects of something oppose or contradict each other. Can serve as the predicate or modify a noun (must be followed by \"的\")."],"examples":[{"label":"conjunction","items":[{"zh":"如果还是使用以前的办法，不但不能解决任何问题，相反，会使问题变得更复杂。","py":"Rúguǒ háishì shǐyòng yǐqián de bànfǎ, búdàn bùnéng jiějué rènhé wèntí, xiāngfǎn, huì shǐ wèntí biàn de gèng fùzá.","en":"If we still use the old methods, we not only can't solve any problem — on the contrary, we will make the problem more complicated."},{"zh":"使用正确的方法，我们做起事来能\"事半功倍\"……相反，如果方法不对，可能花五倍甚至十倍的时间都不能完成任务，结果变成了\"事倍功半\"。","py":"Shǐyòng zhèngquè de fāngfǎ, wǒmen zuòqǐ shìlái néng\"shìbàngōngbèi\"… … xiāngfǎn, rúguǒ fāngfǎ bú duì, kěnéng huā wǔ bèi shènzhì shí bèi de shíjiān dōu bù néng wánchéng rènwu, jiéguǒ biànchéngle\"shìbèigōngbàn\".","en":"By using the right method we can do things with \"twice the result for half the effort\"… On the contrary, with the wrong method it may take five or ten times as long and still not finish, turning it into \"half the result for twice the effort\"."}]},{"label":"adjective","items":[{"zh":"调查结果和他们想的几乎完全相反，他们不得不改变原来的计划。","py":"Diàochá jiéguǒ hé tāmen xiǎng de jīhū wánquán xiāngfǎn, tāmen bùdébù gǎibiàn yuánlái de jìhuà.","en":"The survey results were almost the complete opposite of what they expected, so they had to change their original plan."},{"zh":"我本来以为任务能顺利完成，没想到事情正好向相反的方向发展。","py":"Wǒ běnlái yǐwéi rènwu néng shùnlì wánchéng, méixiǎngdào shìqing zhènghǎo xiàng xiāngfǎn de fāngxiàng fāzhǎn.","en":"I originally thought the task could be completed smoothly, but unexpectedly things developed in exactly the opposite direction."}]}],"practice":{"label":"Complete the sentences.","items":["一个正确的选择，往往是成功的开始，______ (相反)","姐姐非常安静，很少说话，______ (相反)","老年人总是喜欢回忆自己的过去，______ (相反)"]}}],"compare":{"a":"对于","b":"关于","sim":[],"diff":[{"title":"Meaning & focus","lines":[{"k":"text","t":"\"对于\" points out the object (often the patient of an action or the thing a certain situation is concerned with)."},{"k":"text","t":"\"关于\" points out the scope, introducing the thing to be talked about."},{"k":"ex","t":"关于这次调查计划，经理特别满意。","py":"Guānyú zhè cì diàochá jìhuà, jīnglǐ tèbié mǎnyì.","en":"Regarding this survey plan, the manager is especially satisfied."},{"k":"ex","t":"关于这次调查计划，经理说有很多不清楚的地方。","py":"Guānyú zhè cì diàochá jìhuà, jīnglǐ shuō yǒu hěnduō bù qīngchu de dìfang.","en":"Regarding this survey plan, the manager says there are many unclear points."}]},{"title":"Position","lines":[{"k":"text","t":"\"对于\" can be put either before or after the subject."},{"k":"text","t":"\"关于\" can only precede the subject."},{"k":"ex","t":"对于每个需要帮助的人，他都会热情、耐心地提供帮助。","py":"Duìyú měi ge xūyào bāngzhù de rén, tā dōu huì rèqíng, nàixīn de tígōng bāngzhù.","en":"For everyone who needs help, he offers help warmly and patiently."},{"k":"ex","t":"他对于每个需要帮助的人都会热情、耐心地提供帮助。","py":"Tā duìyú měi ge xūyào bāngzhù de rén dōu huì rèqíng, nàixīn de tígōng bāngzhù.","en":"He offers help warmly and patiently to everyone who needs it."},{"k":"ex","t":"关于什么是幸福，每个人都有自己不同的看法。","py":"Guānyú shénme shì xìngfú, měi ge rén dōu yǒu zìjǐ bùtóng de kànfǎ.","en":"As for what happiness is, everyone has their own view."}]},{"title":"In titles","lines":[{"k":"text","t":"\"关于…��\" can appear in the title of a book or article."},{"k":"text","t":"\"对于\" cannot be used this way."},{"k":"ex","t":"《关于中国经济的几个问题》","py":"«Guānyú Zhōngguó jīngjì de jǐ ge wèntí»","en":"\"Several Questions About the Chinese Economy\""}]}],"drill":[["","对于","关于"],["(1) ______这个问题，你应该再认真地考虑一下。","√","√"],["(2) ______这方面的情况，大家最好上网去查一查。","×","√"],["(3) ______怎样提高中文阅读能力，这一学习方法实践证明是有效的。","",""],["(4) 现在人们______自然环境越来越注意保护了。","",""],["(5) 昨天在报纸上看到一篇______这位明星的新闻，才知道她竟然还只是一位在校大学生。","",""]],"core":"指出对象 vs. 指出范围；位置和标题用法不同","drill_label":"Tick or cross."}},"13":{"points":[{"n":1,"title":"大概","structure":"大概 + Verb/Number","usage":["As an adverb: used for approximate speculation about an amount, time or a situation, indicating a big possibility.","As an adjective: means \"not accurate or detailed\"."],"examples":[{"label":"adverb","items":[{"zh":"他8岁就开始上台演出，到现在大概唱了60多年了，他对这门艺术的喜爱从来没有改变过。","py":"Tā bā suì jiù kāishǐ shàngtái yǎnchū, dào xiànzài dàgài chàngle liùshí duō nián le, tā duì zhè mén yìshù de xǐ'ài cónglái méiyǒu gǎibiàn guo.","en":"He started performing on stage at eight and has been singing for about sixty years now; his love for this art has never changed."},{"zh":"你的这个关于举办传统文化节活动的计划，我想校长大概会同意。","py":"Nǐ de zhège guānyú jǔbàn chuántǒng wénhuàjié huódòng de jìhuà, wǒ xiǎng xiàozhǎng dàgài huì tóngyì.","en":"As for your plan about holding a traditional culture festival, I think the principal will probably agree."},{"zh":"经过这段时间的学习，他的汉语水平提高了不少，不但可以听懂一些较短的句子，还可以进行简单的交流，现在即使不用翻译也能理解大概的意思了。","py":"Jīngguò zhè duànshíjiān de xuéxí, tā de hànyǔ shuǐpíng tígāole bùshǎo, búdàn kěyǐ tīngdǒng yìxiē jiào duǎn de jùzi, hái kěyǐ jìnxíng jiǎndān de jiāoliú, xiànzài jíshǐ búyòng fānyì yě néng lǐjiě dàgài de yìsi le.","en":"After this period of study his Chinese has improved a lot: he can understand some short sentences and hold simple conversations, and now even without an interpreter he can grasp the general meaning."}]}],"practice":{"label":"Complete the dialogues/sentences.","items":["A: 师傅，我去火车站。______? (大概) B: 现在不堵车，估计二十分钟就能到。","A: 请问附近有银行吗? B: 有一个交通银行，______ (大概)","读书应该有选择，有些书只要快速阅读，有些书却需要多花些时间来仔细阅读。______ (大概)"]}},{"n":2,"title":"偶尔","structure":"偶尔 + Verb","usage":["The adverb \"偶尔\" means something seldom occurs."],"examples":[{"label":"","items":[{"zh":"我常常跟着电视学唱京剧，然后一遍一遍地练习，偶尔跟中国人一起唱上几句。","py":"Wǒ chángcháng gēnzhe diànshì xué chàng jīngjù, ránhòu yí biàn yí biàn de liànxí, ǒu'ěr gēn Zhōngguó rén yìqǐ chàngshang jǐ jù.","en":"I often learn to sing Beijing opera from TV, practise it over and over, and occasionally sing a few lines with Chinese people."},{"zh":"我们调查的近7000名上班族中，有64%的人经常加班，28%偶尔加班，而每次加班时间超过两小时的竟然有59%。","py":"Wǒmen diàochá de jìn qīqiānmíng shàngbānzú zhōng, yǒu bǎifēnzhī liùshísì de rén jīngcháng jiābān, bǎifēnzhī èrshíbā ǒuěr jiābān, ér měicì jiābān shíjiān chāoguò liǎng xiǎoshí de jìngrán yǒu bǎifēnzhī wǔshíjiǔ.","en":"Among the nearly 7,000 office workers we surveyed, 64% often work overtime, 28% occasionally, and for as many as 59% each overtime session exceeds two hours."},{"zh":"三叶草的叶子一般为三个，但偶尔也会出现四个叶子的，这种四个叶子的叫\"四叶草\"，因为很少见，所以有人说，找到这种\"四叶草\"的人会得到幸福。","py":"Sānyècǎo de yèzi yìbān wèi sān ge, dàn ǒuěr yě huì chūxiàn sìge yèzi de, zhèzhǒng sìge yèzi de jiào\"sìyècǎo\", yīnwèi hěnshǎo jiàn, suǒyǐ yǒurén shuō, zhǎodào zhèzhǒng\"sìyècǎo\"de rénhuì dédào xìngfú.","en":"Clover leaves generally come in threes, but occasionally four-leaf ones appear, called \"four-leaf clover\"; because they are rare, some say whoever finds one will be happy."}]}],"practice":{"label":"Complete the sentences.","items":["为了减肥，我几乎每天晚上都坚持跑步，______ (偶尔)","我平时上班忙，很少有时间运动。但是周末我会约朋友们见面，一块儿去打篮球或者踢足球，______ (偶尔)","她和丈夫很少在家吃饭。平时上班的时候两个人都在公司吃，周末不上班的时候就一起去饭馆儿吃，______ (偶尔)"]}},{"n":3,"title":"由","structure":"由 + [Person] + [Verb]","usage":["The preposition \"由\" introduces the person in charge of something."],"examples":[{"label":"","items":[{"zh":"按照规定，这件事情应该由王大夫负责。","py":"Ànzhào guīdìng, zhè jiàn shìqing yīnggāi yóu Wáng dàifu fùzé.","en":"According to the regulations, this matter should be handled by Dr Wang."},{"zh":"\"幽默\"这个词最早是由林语堂先生翻译过来的。","py":"\"Yōumò\"zhège cí zuìzǎo shì yóu Lín Yǔtáng xiānsheng fānyì guòlái de.","en":"The word \"幽默\" (humour) was first translated by Mr Lin Yutang."},{"zh":"上次的春游活动你们办得非常有趣，大家都玩儿得很开心，这次活动继续由你们负责，相信也一定会很成功。","py":"Shàng cì de chūnyóu huódòng nǐmen bàn de fēicháng yǒuqù, dàjiā dōu wánr de hěn kāixīn, zhè cì huódòng jìxù yóu nǐmen fùzé, xiāngxìn yě yídìng huì hěn chénggōng.","en":"You ran the last spring outing very interestingly and everyone had a great time; this time you'll be in charge again, and I'm sure it will also succeed."}]}],"practice":{"label":"Complete the dialogues/sentences.","items":["A: 这件事不是马经理专门负责吗? B: 他已经离开公司了，现在 ______ (由)","这篇文章是介绍京剧的，______前一部分介绍京剧的发展历史，第二部分主要谈京剧的发展方向。(由)","上次的秋游活动小夏组织得不错，大家都玩儿得很高兴，这次 ______ (由)"]}},{"n":4,"title":"进行","structure":"进行 + [Disyllabic verb]","usage":["The verb \"进行\" means to engage in a certain activity or work, etc.","Usually used before a disyllabic verb denoting a formal, serious behavior.","Temporary or everyday behaviors are usually not used with \"进行\"."],"examples":[{"label":"","items":[{"zh":"大家请注意，现在休息十五分钟，十点半会议继续进行。","py":"Dàjiā qǐng zhùyì, xiànzài xiūxi shíwǔfēnzhōng, shídiǎn bàn huìyì jìxù jìnxíng.","en":"Attention, everyone: we now take a fifteen-minute break, and the meeting will continue at half past ten."},{"zh":"有人在互联网上专门进行过调查，结果发现每六个中国人中就有一个使用筷子的方法是错误的。","py":"Yǒu rén zài hùliánwǎng shang zhuānmén jìnxíngguo diàochá, jiéguǒ fāxiàn měi liù ge Zhōngguó rén zhōng jiù yǒu yí ge shǐyòng kuàizi de fāngfǎ shì cuòwù de.","en":"Someone ran a special survey on the internet and found that one in every six Chinese people uses chopsticks incorrectly."},{"zh":"成功的语言学习者，在学习方面往往都是积极主动的，他们会主动与他人进行交流，并且请别人帮助他们改错。","py":"Chénggōng de yǔyán xuéxízhě, zài xuéxí fāngmiàn wǎngwǎng dōu shì jījízhǔdòng de, tāmen huì zhǔdòng yǔ tārén jìnxíng jiāoliú, bìngqiě qǐng biérén bāngzhù tāmen gǎicuò.","en":"Successful language learners are usually proactive in learning; they actively communicate with others and ask people to help correct their mistakes."}]}],"practice":{"label":"Complete the dialogues/sentences.","items":["A: 都六点了，会议怎么还没结束? B: ______ (进行)","A: 听说你要申请去国外留学，准备得怎么样了? B: ______ (进行)","______，结果发现，在接受调查的学生中，有超过80%的人希望自己能有机会出国留学，但这其中只有大约20%的人开始申请国外学校。(进行)"]}},{"n":5,"title":"随着","structure":"随着 + [Disyllabic verb with modifier], [Main clause]","usage":["The preposition \"随着\" indicates something is the condition under which something else happens.","Usually followed by a disyllabic verb modified by an adjunct."],"examples":[{"label":"","items":[{"zh":"随着社会的发展，京剧也在改变，以适应不同年龄观众的需要。","py":"Suízhe shèhuì de fāzh��n, jīngjù yě zài gǎibiàn, yǐ shìyìng bùtóng niánlíng guānzhòng de xūyào.","en":"With the development of society, Beijing opera is also changing to suit the needs of audiences of different ages."},{"zh":"有些人喜欢为自己的生活做长远的计划。但是，随着年龄的增长，他们会发现生活总是在不停地变化，生活往往不会按照我们的计划来进行。","py":"Yǒuxiē rén xǐhuan wèi zìjǐ de shēnghuó zuò chángyuǎn de jìhuà. Dànshì, suízhe niánlíng de zēngzhǎng, tāmen huì fāxiàn shēnghuó zǒngshì zài bùtíng de biànhuà, shēnghuó wǎngwǎng búhuì ànzhào wǒmen de jìhuà lái jìnxíng.","en":"Some people like to make long-term plans for their lives. But as they grow older they find life keeps changing and often doesn't go according to plan."},{"zh":"最早的时候，茶只是被当作一种药，而不是饮料。后来，随着人们对茶的认识的加深，慢慢开始把它当作解渴的饮料，这才慢慢有了中国的茶文化。","py":"Zuì zǎo de shíhou, chá zhǐshì bèi dàngzuò yì zhǒng yào, ér bú shì yǐnliào. Hòulái, suízhe rénmen duì chá de rènshi de jiāshēn, mànman kāishǐ bǎ tā dàngzuò jiěkě de yǐnliào, zhè cái mànman yǒule Zhōngguó de chá wénhuà.","en":"At first tea was treated only as a medicine, not a drink. Later, as people's understanding of tea deepened, they gradually began to treat it as a thirst-quenching drink, and only then did Chinese tea culture slowly develop."}]}],"practice":{"label":"Complete the sentences.","items":["______，越来越多的人喜欢在网上写日记。(随着)","______，美的标准一直在变。过去有的时候人们以胖为美，现在的人以瘦为美。(随着)","小时候，我们往往会有许多浪漫的理想。但是 ______，我们天天忙于工作和生活，那些梦慢慢地离我们远去了。(随着)"]}}],"compare":{"a":"大概","b":"也许","sim":[{"title":"","lines":[{"k":"text","t":"Both are adverbs indicating a speculation or estimation about a certain situation."},{"k":"ex","t":"他总说自己特别喜欢看书，可是这本书他看了一个月才��到第5页，大概/也许是因为工作太忙吧。","py":"Tā zǒng shuō zìjǐ tèbié xǐhuan kànshū, kěshì zhè běnshū tā kànle yígeyuè cái kàndào dìwǔ yè, dàgài / yěxǔ shìyīnwèi gōngzuò tàimáng ba.","en":"He always says he especially likes reading, but he took a month to reach page 5 of this book — perhaps because work is too busy."}]}],"diff":[{"title":"Degree of certainty","lines":[{"k":"text","t":"\"大概\" expresses a stronger judgment and a more positive meaning."},{"k":"text","t":"\"也许\" indicates a guess and a smaller possibility."},{"k":"ex","t":"老张这个人一直很准时，开会从来不迟到。今天到现在还没来，大概是有什么事情，你打个电话问问他吧。","py":"Lǎo Zhāng zhège rén yìzhí hěn zhǔnshí, kāihuì cónglái bù chídào. Jīntiān dào xiànzài hái méi lái, dàgài shì yǒu shénme shìqing, nǐ dǎge diànhuà wènwèn tā ba.","en":"Lao Zhang has always been punctual and never late for meetings. He still hasn't come today — probably something came up; give him a call."},{"k":"ex","t":"这次电影艺术节也许会在北京举行。","py":"Zhè cì diànyǐng yìshùjié yěxǔ huì zài Běijīng jǔxíng.","en":"This film arts festival may be held in Beijing."}]},{"title":"Quantity estimation","lines":[{"k":"text","t":"\"大概\" can signify an estimation of quantity."},{"k":"text","t":"\"也许\" has no such usage."},{"k":"ex","t":"大概有三分之二的人反对这样做。","py":"Dàgài yǒu sānfēnzhīèr de rén fǎnduì zhèyàng zuò.","en":"About two-thirds of people are against doing it this way."}]},{"title":"Future plans","lines":[{"k":"text","t":"\"也许\" can indicate that the speaker is not sure about his/her future plans."},{"k":"text","t":"\"大概\" has no such usage."},{"k":"ex","t":"我原来想学习法律，不过后来我发现自己对新闻更感兴趣，也许以后我会成为一名记者。","py":"Wǒ yuánlái xiǎng xuéxí fǎlǜ, búguò hòulái wǒ fāxiànzìjǐ duì xīnwén gèng gǎnxìngqù, yěxǔ yǐhòu wǒhuì chéngwéi yīmíng jìzhě.","en":"I originally wanted to study law, but later found I was more interested in journalism; maybe I'll become a reporter in future."}]},{"title":"As adjective","lines":[{"k":"text","t":"\"大概\" can also be used as an adjective or attributive word meaning \"not quite accurate or detailed\"."},{"k":"text","t":"\"也许\" cannot."},{"k":"ex","t":"不管做什么事情，最好提前做计划，不用安排得特别详细，但必须有一个大概的想法。","py":"Bùguǎn zuò shénme shìqing, zuìhǎo tíqián zuò jìhuà, búyòng ānpái de tèbié xiángxì, dàn bìxū yǒu yí ge dàgài de xiǎngfǎ.","en":"Whatever you do, it's best to plan ahead — no need to arrange it in great detail, but you must have a rough idea."}]}],"drill":[["","大概","也许"],["(1) 这次调查发现，超过70%的儿童更愿意让爸爸给自己读书。为什么会出现这种情况? ______是因为父亲平时陪孩子玩儿的时间太少。","√","√"],["(2) 穷人的孩子早当家，他们______没有很多钱，却可能比富人家的孩子经历得更多。","×","√"],["(3) 师傅，我去机场。______要多长时间? 半小时能到吗?","",""],["(4) 小孩儿的脾气变化很快。刚才还对你哭个不停，一下子就没事了，好像什么都没发生过。","",""],["(5) 您最近在拍哪部电影? 能谈谈电影的______内容吗?","",""]],"core":"判断性强 vs. 猜测性；数量估计和未来计划不同","drill_label":"Tick or cross."}},"14":{"points":[{"n":1,"title":"够","structure":"够 + Adjective + 的 / 够 + Verb","usage":["As a verb: means being enough in quantity.","As an adverb: means the degree has reached a certain standard. When \"够 + Adj\" is used in an affirmative sentence, the adjective is usually followed by \"的\"."],"examples":[{"label":"verb","items":[{"zh":"客人来了，中国人一定要把家里最好吃的东西拿出来请客人吃，并且让客人吃够、吃饱。","py":"Kèrén lái le, Zhōngguó rén yídìng yào bǎ jiāli zuì hǎochī de dōngxi ná chūlái qǐng kèrén chī, bìngqiě ràng kèrén chīgòu, chībǎo.","en":"When guests come, Chinese people always bring out the tastiest food in the house to treat them and make sure they eat enough and are full."},{"zh":"医生提醒我们，睡觉时间太长并不好，有时甚至会引起头疼，一般睡够八小时就可以了。","py":"Yīshēng tíxǐng wǒmen, shuìjiào shíjiān tàizhǎng bìng bùhǎo, yǒushí shènzhì huì yǐnqǐ tóuténg, yìbān shuìgòu bā xiǎoshí jiù kěyǐ le.","en":"Doctors remind us that sleeping too long isn't good and sometimes even causes headaches; eight hours is generally enough."}]},{"label":"adverb","items":[{"zh":"不用拿这些，宾馆都会免费提供的。再说，箱子已经够重的了！","py":"Búyòng ná zhèxiē, bīnguǎn dōu huì miǎnfèi tígōng de. Zàishuō, xiāngzi yǐjīng gòu zhòng de le!","en":"No need to bring these — hotels always provide them free. Besides, the suitcase is already heavy enough!"},{"zh":"有的人害怕失败，无法接受失败。这不仅是因为他们不够勇敢，还因为他们对自己要求太高。","py":"Yǒu de rén hàipà shībài, wúfǎ jiēshòu shībài. Zhè bùjǐn shìyīnwèi tāmen búgòu yǒnggǎn, hái yīnwèi tāmen duì zìjǐ yāoqiú tàigāo.","en":"Some people fear failure and cannot accept it. This is not only because they are not brave enough, but also because they demand too much of themselves."}]}],"practice":{"label":"Complete the dialogues/sentences.","items":["A: 一共两百三十九块七。您付现金还是刷卡? B: ______，还是刷卡吧。(够)"]}},{"n":2,"title":"以","structure":"以 + Noun/Phrase + Verb","usage":["As a preposition: means \"using, taking, by means of\", usually used in the structure \"以……+V\".","\"以……为……\": means \"to take...as...\" or \"to regard...as...\".","As a conjunction: indicates purpose, meaning \"used for, in order to\". Usually used at the beginning of the latter clause, and the two clauses should share the same subject."],"examples":[{"label":"preposition","items":[{"zh":"经理您放心，我一定以最快的速度完成。","py":"Jīnglǐ nín fàngxīn, wǒ yídìng yǐ zuì kuài de sùdù wánchéng.","en":"Rest assured, manager, I will finish it as fast as possible."},{"zh":"事情做到\"差不多\"就觉得满意的人往往不会成功，只有以严格的标准来要求自己才会让自己变得更优秀。","py":"Shìqing zuòdào\"chàbuduō\"jiù juéde mǎnyì de rén wǎngwǎng búhuì chénggōng, zhǐyǒu yǐ yángé de biāozhǔn lái yāoqiú zìjǐ cái huì ràng zìjǐ biàn de gèng yōuxiù.","en":"People who feel satisfied when things are done \"about right\" often don't succeed; only by demanding of yourself with strict standards will you become better."}]},{"label":"以……为……","items":[{"zh":"我们应该以那些敢说真话的人为镜子，这样才能及时发现自己的缺点。","py":"Wǒmen yīnggāi yǐ nàxiē gǎn shuō zhēnhuà de rénwéi jìngzi, zhèyàng cáinéng jíshífāxiàn zìjǐ de quēdiǎn.","en":"We should take people who dare to tell the truth as mirrors, so that we can discover our own shortcomings in time."}]},{"label":"conjunction","items":[{"zh":"如果是十分重要的朋友，中国人往往会请他们去饭店或餐厅吃饭，以表示对客人的尊重和礼貌。","py":"Rúguǒ shì shífēn zhòngyào de péngyou, Zhōngguó rén wǎngwǎng huì qǐng tāmen qù fàndiàn huò cāntīng chīfàn, yǐ biǎoshì duì kèrén de zūnzhòng hé lǐmào.","en":"For very important friends, Chinese people often invite them to a restaurant for a meal, to show respect and courtesy to the guest."}]}],"practice":{"label":"Complete the sentences.","items":["______，解决这个问题还有点儿困难。(以)","汉语普通话 ______ (以……为……)","我觉得应该降低公园门票价格，______ (以)"]}},{"n":3,"title":"既然","structure":"既然 + [Fact], 就/也/还 + [Conclusion]","usage":["The conjunction \"既然\" is used in the first clause of a complex sentence, meaning \"since this is the fact now\".","\"就\", \"也\" or \"还\" etc. is often used in coordination with it in the second clause, indicating the conclusion drawn from the situation mentioned."],"examples":[{"label":"","items":[{"zh":"A: 你既然不愿意打球，为什么还要打? B: 我是不得不打啊，因为这些天我又胖了好几斤。","py":"A: Nǐ jìrán bú yuànyì dǎqiú, wèishénme háiyào dǎ? B: Wǒ shì bùdébù dǎ a, yīnwèi zhèxiē tiān wǒ yòu pàngle hǎojǐjīn.","en":"A: Since you don't want to play, why do you still play? B: I have no choice — I've put on several more jin these days."},{"zh":"A: 真抱歉，明天我得出差，不能参加明天的会议了。 B: 既然这样，就只好安排在下周了。","py":"A: Zhēn bàoqiàn, míngtiān wǒ děi chūchāi, bùnéng cānjiā míngtiān de huìyì le. B: Jìrán zhèyàng, jiù zhǐhǎo ānpái zài xiàzhōu le.","en":"A: I'm sorry, I have to go on a business trip tomorrow and can't attend tomorrow's meeting. B: In that case, we'll have to schedule it for next week."},{"zh":"既然明天晚上公司会关灯停电，那么我们肯定不用加班了。","py":"Jìrán míngtiān wǎnshang gōngsī huì guān dēng tíng diàn, nàme wǒmen kěndìng búyòng jiābān le.","en":"Since the company will switch off the lights tomorrow evening, we definitely won't have to work overtime."}]}],"practice":{"label":"Complete the dialogues/sentences.","items":["A: 这里的景色确实很不错。阳光好，空气新鲜，来这儿散步真舒服。 B: ______，以后我们可以常来。(既然)","我刚才看了一下，一共二十个人，有十五个人同意这个计划，______，那我们就通过这个计划了。(既然)","有些事情过去了就是过去了，再也不能回头。______，那么就把那些过去的事情放在心里，当成一种回忆，然后勇敢地抬起头向前看，走好以后的路。(既然)"]}},{"n":4,"title":"于是","structure":"[Event A], 于是 + [Event B]","usage":["The conjunction \"于是\" is used in the second clause of a complex sentence.","Indicates an event happens immediately after the event mentioned previously, usually implying a successive relation."],"examples":[{"label":"","items":[{"zh":"听爷爷奶奶说，我妹妹出生那天，正好下了一场大雪，于是我爸妈就给她取名叫夏雪。","py":"Tīng yéye nǎinai shuō, wǒ mèimèi chūshēng nà tiān, zhènghǎo xiàle yì chǎng dàxuě, yúshì wǒ bàmā jiù gěi tā qǔmíng jiào Xià Xuě.","en":"My grandparents told me that on the day my younger sister was born it happened to snow heavily, so my parents named her Xia Xue."},{"zh":"他是一位著名的记者，五年里，他去了亚洲许多国家，尝遍了各地的美食。回国后，他用一年的时间整理材料，于是就有了这本关于亚洲美食的书。","py":"Tā shì yí wèi zhùmíng de jìzhě, wǔnián li, tā qùle Yàzhōu xǔduō guójiā, chángbiànle gèdì de měishí. Huíguó hòu, tāyòng yì nián de shíjiān zhěnglǐ cáiliào, yúshì jiù yǒule zhèběn guānyú Yàzhōu měishí de shū.","en":"He is a famous reporter. Over five years he visited many Asian countries and tasted the local food everywhere. After returning home he spent a year organising his material, and so this book on Asian cuisine came about."},{"zh":"……可是，它的大量使用也带来了严重的环境污染问题。于是，一些国家规定，超市、商场不能为顾客提供免费塑料袋，并且鼓励大家购买可以多次使用的购物袋。","py":"… … Kěshì, tā de dàliàng shǐyòng yě dàiláile yánzhòng de huánjìng wūrǎn wèntí. Yúshì, yìxiē guójiā guīdìng, chāoshì, shāngchǎng bù néng wèi gùkè tígōng miǎnfèi sùliàodài, bìngqiě gǔlì dàjiā gòumǎi kěyǐ duō cì shǐyòng de gòuwùdài.","en":"…But its massive use has also brought serious environmental pollution. So some countries have ruled that supermarkets and shops may not give customers free plastic bags, and they encourage people to buy reusable shopping bags."}]}],"practice":{"label":"Complete the sentences.","items":["我约了朋友在商场门口见面，我早到了一会儿，______ (于是)","最近几年，笔记本电脑的价格大大降低，______ (于是)","学习一种语言不是简单的事情，许多人在开始学的时候觉得很困难，______ (于是)"]}},{"n":5,"title":"什么的","structure":"Noun + 什么的","usage":["The particle \"什么的\" is used after the example(s) enumerated, meaning there are still other things that are similar to the example(s) listed.","Usually used in spoken Chinese."],"examples":[{"label":"","items":[{"zh":"既然你不喜欢新闻专业，那就考虑考虑其他专业吧，中文、国际关系什么的，我和你爸都不反对。","py":"Jìrán nǐ bù xǐhuan xīnwén zhuānyè, nà jiù kǎolǜ kǎolǜ qítā zhuānyè ba, zhōngwén, guójì guānxi shénmede, wǒ hé nǐ bà dōu bù fǎnduì.","en":"Since you don't like journalism, then consider other majors — Chinese, international relations and so on; your dad and I don't object to any of them."},{"zh":"A: 我们去趟超市吧，明天出去玩儿得买点儿饼干和面包。 B: 好，还有矿泉水、果汁什么的。","py":"A: Wǒmen qù tàng chāoshì ba, míngtiān chūqù wánr de mǎidiǎnr bǐnggān hé miànbāo. B: Hǎo, háiyǒu kuàngquánshuǐ, guǒzhī shénmede.","en":"A: Let's go to the supermarket — we need to buy some biscuits and bread for tomorrow's outing. B: OK, and mineral water, juice and so on."},{"zh":"实际上，我们只需注意一下身边的小事就可以。例如，夏天把空调的温度开得高一些，出门时记得关空调和电脑，这样可以节约用电；少开车，多骑车或者乘坐地铁和公共汽车，这样能降低空气污染；还有养成把垃圾丢进垃圾桶的习惯什么的。","py":"Shíjì shang, wǒmen zhǐ xū zhùyì yíxià shēnbiān de xiǎoshì jiù kěyǐ. Lìrú, xiàtiān bǎ kōngtiáo de wēndù kāi de gāo yìxiē, chūmén shí jìde guān kōngtiáo hé diànnǎo, zhèyàng kěyǐ jiéyuē yòng diàn; shǎo kāichē, duō qí chē huòzhě chéngzuò dìtiě hé gōnggòng qìchē, zhèyàng néng jiàngdī kōngqì wūrǎn; hái yǒu yǎngchéng bǎ lājī diūjìn lājītǒng de xíguàn shénme de.","en":"In fact we only need to pay attention to small things around us. For example, set the air conditioner a bit higher in summer, remember to turn off the air conditioner and computer when going out to save electricity; drive less and cycle or take the subway and buses more to reduce air pollution; also form the habit of putting rubbish in the bin, and so on."}]}],"practice":{"label":"Complete the sentences.","items":["我们有很多共同的爱好，经常一起 ______ (什么的)","很多东西是用钱买不到的，比如 ______ (什么的)","现在手机的作用越来越大，人们可以用它来 ______ (什么的)"]}}],"compare":{"a":"于是","b":"因此","sim":[{"title":"","lines":[{"k":"text","t":"Both are conjunctions that can be used in the structure \"A，于是/因此B\", meaning A causes B."},{"k":"ex","t":"小时候，他经常生病，于是/因此每天都去跑步锻炼身体。","py":"Xiǎoshíhou, tā jīngcháng shēngbìng, yúshì / yīncǐ měitiān dōu qù pǎobù duànliàn shēntǐ.","en":"As a child he was often ill, so he went running every day to exercise."}]}],"diff":[{"title":"","lines":[{"k":"text","t":"\"于是\" emphasizes that A happens before B."},{"k":"text","t":"\"因此\" emphasizes that A is the reason and B is the result."},{"k":"ex","t":"大家都同意寒假去旅行，于是，我们开始讨论去哪里旅行的问题。","py":"Dàjiā dōu tóngyì hánjià qù lǚxíng, yúshì, wǒmen kāishǐ tǎolùn qù nǎli lǚxíng de wèntí.","en":"Everyone agreed to travel in the winter holiday, so we began discussing where to go."},{"k":"ex","t":"他三岁跟父亲母亲一起来到这儿，就再也没离开过这里。因此，他对这个地方感情很深。","py":"Tā sānsuì gēn fùqīn mǔqīn yìqǐ láidào zhèr, jiù zàiyě méi líkāiguo zhèli. Yīncǐ, tā duì zhège dìfang gǎnqíng hěnshēn.","en":"He came here at three with his parents and has never left since. Therefore he has deep feelings for this place."}]}],"drill":[["","于是","因此"],["(1) 有些年轻人申请了信用卡，但在购物时却没有考虑自己的经济能力，最后不能按时还银行的钱，______出现严重的信用问题。","√","√"],["(2) 习惯是不容易改变的，在孩子小的时候，父母要帮他们养成好的生活、学习习惯。","×","√"],["(3) 不少人刚开始运动时，会感觉十分无聊，很快就放弃了。","",""],["(4) 那是1994年的冬天，那场雪下得特别大。大家都很激动，都跑到外面去玩儿雪。","",""],["(5) 生活往往不会按照我们的计划来进行。光有计划还不行，还需要我们能及时地对原来的计划做出改变。","",""]],"core":"强调先后 vs. 强调因果","drill_label":"Tick or cross."}},"15":{"points":[{"n":1,"title":"想起来","structure":"想 + 起来","usage":["\"起来\" can be used after another verb as a complement of direction or possibility, indicating an upward movement.","When \"起来\" is used after the verb \"想\", it means to recall somebody or something in the past."],"examples":[{"label":"direction","items":[{"zh":"你这样躺着看书对眼睛不好，快坐起来！","py":"Nǐ zhèyàng tǎngzhe kànshū duì yǎnjing bùhǎo, kuài zuò qǐlái!","en":"Reading while lying like that is bad for your eyes — sit up quickly!"},{"zh":"需要长时间坐着工作的人，一小时左右一定要站起来活动活动。","py":"Xūyào chángshíjiān zuòzhe gōngzuò de rén, yì xiǎoshí zuǒyòu yídìng yào zhàn qǐlái huódòng huódòng.","en":"People who need to sit and work for a long time should stand up and move around roughly once an hour."}]},{"label":"recall","items":[{"zh":"我突然想起来得去银行，所以不能陪你去大使馆了。","py":"Wǒ tūrán xiǎngqǐ lái de qù yínháng, suǒyǐ bùnéng péinǐqù dàshǐguǎn le.","en":"I suddenly remembered I have to go to the bank, so I can't go to the embassy with you."},{"zh":"我想起来了，这孩子又聪明又可爱，你们教育得真好！","py":"Wǒ xiǎng qǐlái le, zhè háizi yòu cōngming yòu kě'ài, nǐmen jiàoyù de zhēn hǎo!","en":"I remember now — this child is both clever and lovely; you've brought him up so well!"}]}],"practice":{"label":"Complete the sentences.","items":["当那个男孩走过来邀请她跳舞时，______ (起来)","你看见我钱包放哪儿了吗? ______ (想起来)","每个人都对小时候有美好的回忆，______ (想起来)"]}},{"n":2,"title":"弄","structure":"把 + Noun + 弄 + Adjective","usage":["The verb \"弄\" means \"to do, to make\".","It is often used in spoken Chinese instead of certain other verbs."],"examples":[{"label":"","items":[{"zh":"A: 关于那个新闻的材料你准备好了吗? 我们开会时要用。 B: 都弄(准备)好了，马上给您送过去。","py":"A: Guānyú nàge xīnwén de cáiliào nǐ zhǔnbèi hǎolema? Wǒmen k��ihuì shí yàoyòng. B: Dōu nòng (zhǔnbèi) hǎo le, mǎshàng gěi nín sòng guòqù.","en":"A: Have you got the materials for that news item ready? We need them for the meeting. B: Everything's done — I'll bring them over right away."},{"zh":"A: 一会儿搬沙发的时候要小心点儿，别弄(碰)坏了。 B: 没问题，我会注意看着脚下的。","py":"A: Yíhuìr bān shāfā de shíhou yào xiǎoxīn diǎnr, biénòng (pèng) huài le. B: Méi wèntí, wǒhuì zhùyì kànzhe jiǎoxià de.","en":"A: Be careful when moving the sofa in a moment — don't knock it and damage it. B: No problem, I'll watch where I step."},{"zh":"每天因为这些小事批评她，弄(批评)得我俩心情都不好。","py":"Měi tiān yīnwèi zhèxiē xiǎoshì pīpíng tā, nòng (pīpíng) de wǒliǎ xīnqíng dōu bùhǎo.","en":"Criticising her every day over these little things has put both of us in a bad mood."}]}],"practice":{"label":"Complete the sentences.","items":["老师提醒我们考试时要仔细，______ (弄)","住在这里，外面不管什么时候都很热闹，晚上即使关上了窗户声音也很大，______ (弄)","______，去西边的公共汽车应该在对面坐。(弄)"]}},{"n":3,"title":"千万","structure":"千万 + [Negative form]","usage":["The adverb \"千万\" means \"must\" or \"to be sure to\".","Usually followed by a negative structure."],"examples":[{"label":"","items":[{"zh":"不过表扬也是一门艺术，表扬千万不要太多，过多的表扬可能会给孩子带来压力。","py":"Búguò biǎoyáng yě shì yì mén yìshù, biǎoyáng qiānwàn búyào tài duō, guòduō de biǎoyáng kěnéng huì gěi háizi dàilái yālì.","en":"But praise is also an art: don't praise too much, as too much praise may put pressure on a child."},{"zh":"我要等她生日那天再送给她这个礼物，你现在千万别告诉她。","py":"Wǒyào děng tā shēngrì nà tiān zài sònggěi tā zhège lǐwù, nǐ xiànzài qiānwàn bié gàosu tā.","en":"I'll give her this gift on her birthday, so don't tell her now, whatever you do."},{"zh":"每个人都应该记住这句话：\"开车千万别喝酒，喝酒千万别开车。\"","py":"Měi ge rén dōu yīnggāi jìzhù zhèjù huà:\"kāichē qiānwàn bié hējiǔ, hējiǔ qiānwàn bié kāichē.\"","en":"Everyone should remember this saying: \"Never drink when you drive, never drive when you drink.\""}]}],"practice":{"label":"Complete the sentences.","items":["有些事情坚持了才会看到希望，______ (千万)","要是事情没有发生过，______ (千万)","这个箱子里都是杯子和盘子，______ (千万)"]}},{"n":4,"title":"来","structure":"来 + [Verb]","usage":["The verb \"来\" is used before another verb to mean \"to be going to do something\".","Usually used in spoken Chinese.","The meaning of the sentence won't change if \"来\" is removed from it."],"examples":[{"label":"","items":[{"zh":"这个沙发这么大，你们两个肯定抬不动，我来帮你们一起抬。","py":"Zhège shāfā zhème dà, nǐmen liǎng ge kěndìng táibùdòng, wǒlái bāng nǐmen yìqǐ tái.","en":"This sofa is so big the two of you definitely can't lift it — let me help you lift it together."},{"zh":"小王经验比较丰富，并且做事认真，这次就让他来负责吧。","py":"Xiǎo Wáng jīngyàn bǐjiào fēngfù, bìngqiě zuòshì rènzhēn, zhè cì jiùràng tālái fùzé ba.","en":"Xiao Wang has rich experience and works carefully, so let him be in charge this time."},{"zh":"有的孩子在得不到自己想要的东西的时候，会通过哭、扔东西或者故意敲打来引起父母的注意。","py":"Yǒude háizi zài dé bú dào zìjǐ xiǎng yào de dōngxi de shíhou, huì tōngguò kū, rēng dōngxi huòzhě gùyì qiāodǎ lái yǐnqǐ fùmǔ de zhùyì.","en":"When some children can't get what they want, they try to attract their parents' attention by crying, throwing things or banging deliberately."}]}],"practice":{"label":"Complete the sentences.","items":["这两件衣服我都喜欢，不知道买哪件好，______ (来)","我们学校经常会举办一些活动，______ (来)","记者总是需要到处调查，______ (来)"]}},{"n":5,"title":"左右","structure":"[Number] + 左右","usage":["The noun \"左右\" can only be used after numerals, indicating being slightly more or less than a certain quantity."],"examples":[{"label":"","items":[{"zh":"网上买的那本书估计三天左右就能到，你收到了记得给我打个电话说一声。","py":"Wǎngshang mǎi de nà běnshū gūjì sāntiān zuǒyòu jiù néng dào, nǐ shōudàole jìde gěi wǒ dǎge diànhuà shuō yīshēng.","en":"The book bought online should arrive in about three days; when you receive it, remember to call me."},{"zh":"这儿不能停车，前方500米左右有个免费停车场，您可以把车停到那儿。","py":"Zhèr bùnéng tíngchē, qiánfāng wǔbǎimǐ zuǒyòu yǒuge miǎnfèi tíngchēchǎng, nín kěyǐ bǎ chē tíngdào nàr.","en":"You can't park here; about 500 metres ahead there is a free car park where you can leave your car."},{"zh":"七岁左右的儿童普遍好动，坐不住，所以老师在教这个年龄段的孩子时，一定要想办法引起他们的兴趣。","py":"Qī suì zuǒyòu de értóng pǔbiàn hàodòng, zuò bu zhù, suǒyǐ lǎoshī zài jiāo zhège niánlíng duàn de háizi shí, yídìng yào xiǎng bànfǎ yǐnqǐ tāmen de xìngqù.","en":"Children around seven are generally active and can't sit still, so when teaching this age group teachers must find ways to arouse their interest."}]}],"practice":{"label":"Complete the sentences.","items":["______，我们还是坐地铁吧。(左右)","______，有消息我们会马上通知你。(左右)","马经理7月底去北京出差，______ (左右)"]}}],"compare":{"a":"千万","b":"一定","sim":[{"title":"","lines":[{"k":"text","t":"Both are adverbs indicating giving a requirement or used in exhortation."},{"k":"ex","t":"通过失败你能获得别人没有的经验，千万/一定不要因为失败就不努力了。","py":"Tōngguò shībài nǐ néng huòdé biérén méiyǒu de jīngyàn, qiānwàn / yídìng búyào yīnwèi shībài jiù bù nǔlì le.","en":"Through failure you can gain experience others don't have; whatever you do, don't stop trying because of failure."}]}],"diff":[{"title":"Negative vs. affirmative","lines":[{"k":"text","t":"\"千万\" is usually used in a negative sentence together with \"别\", \"要/不要\", or \"不能\"."},{"k":"text","t":"\"一定\" is usually used in an affirmative sentence together with \"要/不要\" or \"能/不能\"."},{"k":"ex","t":"工作只是生活的一部分，出去工作是为了让生活变得更好，因此，千万不要把工作中的不愉快带到生活中来。","py":"Gōngzuò zhǐshì shēnghuó de yíbùfen, chūqù gōngzuò shì wèile ràng shēnghuó biàn de gènghǎo, yīncǐ, qiānwàn búyào bǎ gōngzuò zhōng de bù yúkuài dàidào shēnghuó zhōnglái.","en":"Work is only part of life; we go out to work to make life better, so never bring unhappiness from work into your life."},{"k":"ex","t":"找工作的人一定要到这里看一看，这里提供的工作机会是最多的。","py":"Zhǎo gōngzuò de rén yídìng yào dào zhèli kànyīkàn, zhèli tígōng de gōngzuò jīhuì shì zuìduō de.","en":"Job seekers must come and look here — the job opportunities offered here are the most numerous."}]},{"title":"Tone","lines":[{"k":"text","t":"\"千万\" conveys a more polite and mild tone, often meaning \"hoping someone to do something\"."},{"k":"text","t":"\"��定\" expresses a stronger, usually commanding tone."},{"k":"ex","t":"当机会到来时，千万不要放手，有什么想做的事就马上去做吧。","py":"Dāng jīhuì dàolái shí, qiānwàn búyào fàngshǒu, yǒu shénme xiǎng zuò de shì jiù mǎshàng qù zuò ba.","en":"When an opportunity comes, never let it go; if there's something you want to do, do it right away."},{"k":"ex","t":"这几个动作你做得还是不太标准，在正式比赛前一定要练好。","py":"Zhè jǐ ge dòngzuò nǐ zuò de háishì bútài biāozhǔn, zài zhèngshì bǐsài qián yídìng yào liànhǎo.","en":"You still don't do these moves very accurately; you must practise them well before the formal match."}]},{"title":"First-person sentences","lines":[{"k":"text","t":"\"一定\" is usually used together with \"会/不会\" or \"能\" in a first-person sentence, meaning the speaker has made up his/her mind to do something."},{"k":"text","t":"\"千万\" cannot be used this way."},{"k":"ex","t":"感谢您的支持和鼓励，我一定会继续努力。","py":"Gǎnxiè nín de zhīchí hé gǔlì, wǒ yídìng huì jìxù nǔlì.","en":"Thank you for your support and encouragement; I will certainly keep working hard."}]},{"title":"Meaning \"surely\"","lines":[{"k":"text","t":"\"一定\" can also mean \"surely, undoubtedly\". \"不一定\" indicates the situation is unclear and conveys a negative implication."},{"k":"text","t":"\"千万\" cannot be used this way."},{"k":"ex","t":"只要你不放弃希望，不怕辛苦，能够一直坚持努力学习，提高自己的水平和能力，就一定能成功。","py":"Zhǐyào nǐ bú fàngqì xīwàng, búpà xīnkǔ, nénggòu yìzhí jiānchí nǔlì xuéxí, tígāo zìjǐ de shuǐpíng hé nénglì, jiù yídìng néng chénggōng.","en":"As long as you don't give up hope, aren't afraid of hardship, keep studying hard and improve your level and ability, you will certainly succeed."},{"k":"ex","t":"人们常说：\"便宜没好货，好货不便宜。\"其实不一定都是这样，有时候质量很好的东西也会很便宜。","py":"Rénmen chángshuō:\"piányi méi hǎohuò, hǎo huò bù piányi”.\"qíshí bù yídìng dōu shì zhèyàng, yǒushíhou zhìliàng hěn hǎo de dōngxi yě huì hěn piányi.","en":"People often say: \"Cheap goods aren't good, good goods aren't cheap.\" Actually it's not always so; sometimes very good things are also cheap."}]},{"title":"As adjective","lines":[{"k":"text","t":"\"一定\" can be used as an adjective meaning \"certain\" or \"proper\"."},{"k":"text","t":"\"千万\" cannot."},{"k":"ex","t":"如果你有一定的语言基础和经济条件，那么出国学习外语是最好的选择，因为语言环境对学习语言有重要的作用。","py":"Rúguǒ nǐ yǒu yídìng de yǔyán jīchǔ hé jīngjì tiáojiàn, nàme chūguó xuéxíwàiyǔ shì zuìhǎo de xuǎnzé, yīnwèi yǔyán huánjìng duì xuéxí yǔyán yǒu zhòngyào de zuòyòng.","en":"If you have a certain language foundation and financial means, then studying a foreign language abroad is the best choice, because the language environment plays an important role in learning a language."}]},{"title":"In replies","lines":[{"k":"text","t":"\"一定\" can be used in a shortened structure or by itself to give somebody a reply."},{"k":"text","t":"\"千万\" cannot."},{"k":"ex","t":"A: 王老师您刚来这儿工作三年就当了教授，这次你得请客啊。 B: 一定(请客)。","py":"A: Wáng lǎoshī nín gānglái zhèr gōngzuò sānnián jiù dāngle jiàoshòu, zhè cì nǐ děi qǐngkè a. B: Yídìng (qǐngkè).","en":"A: Teacher Wang, you became a professor only three years after starting here — you must treat us this time. B: Certainly."}]}],"drill":[["","千万","一定"],["(1) 不管压力有多么大，______不能放弃，而是要始终坚持下去。","√","√"],["(2) 这次你一定要按照要求认真填写，小心一点儿，______别写错了。","√","×"],["(3) 哭并不是______是件坏事，哭可以让人从坏心情中走出来，是一种减轻压力的好办法。","",""],["(4) 兴趣是最好的老师，如果孩子对一件事情感兴趣，那他______会努力地去学习，效果也会更好。","",""],["(5) 事情的原因和结果往往是互相联系的。______的原因会引起一定的结果，有时候一件事情的结果可能又是另一件事情的原因。","",""]],"core":"否定句 vs. 肯定句；语气和第一人称用法不同","drill_label":"Tick or cross."}},"16":{"points":[{"n":1,"title":"可","structure":"可 + Adjective/Verb + 了","usage":["The adverb \"可\" is used for emphasis.","When used in a rhetorical question, it strengthens the tone."],"examples":[{"label":"","items":[{"zh":"这可是个大问题，我也不太清楚。","py":"Zhè kě shì ge dà wèntí, wǒ yě bú tài qīngchu.","en":"This is a big problem; I'm not very clear about it either."},{"zh":"下个星期就要去使馆办签证了，这可怎么办？","py":"Xiàgexīngqī jiùyào qù shǐguǎn bàn qiānzhèng le, zhè kě zěnme bàn?","en":"Next week I'm going to the embassy for a visa — what am I going to do?"},{"zh":"我办了一张那个理发店的会员卡，理发可节约了不少钱。","py":"Wǒbànle yì zhāng nàge lǐfàdiàn de huìyuánkǎ, lǐfà kě jiéyuēle bùshǎo qián.","en":"I got a membership card for that hair salon, and I've saved quite a lot of money on haircuts."}]}],"practice":{"label":"Complete the sentences.","items":["______，竟然连火车票都没拿。(可)","______，把报名表格填好给我就可以了。(可)","他房间这么乱，______ (可)"]}},{"n":2,"title":"恐怕","structure":"恐怕 + Verb/Statement","usage":["As a verb: means \"to be afraid\".","As an adverb:","Means \"according to estimation, and being a little worried\".","Means \"probably, perhaps\" (indicating an estimation or guess)."],"examples":[{"label":"verb","items":[{"zh":"我的工作经验还比较少，那份工作我恐怕完成不了。","py":"Wǒ de gōngzuò jīngyàn hái bǐjiào shǎo, nàfèn gōngzuò wǒ kǒngpà wánchéng bùliǎo.","en":"My work experience is still limited; I'm afraid I can't complete that job."},{"zh":"这几个动作我恐怕做得不标准，所以比赛前要多多练习。","py":"Zhè jǐ ge dòngzuò wǒ kǒngpà zuò de bù biāozhǔn, suǒyǐ bǐsài qiányào duōduō liànxí.","en":"I'm afraid I don't do these moves accurately, so I need to practise a lot before the match."}]},{"label":"adverb — worried","items":[{"zh":"这个会议室的座位恐怕不够，还是换到旁边那个大的吧。","py":"Zhège huìyìshì de zuòwèi kǒngpà búgòu, háishì huàndào pángbiān nàge dà de ba.","en":"I'm afraid the seats in this meeting room are not enough; let's move to the big one next door."},{"zh":"有些事情如果你一定要找一个正确答案，恐怕会让简单的生活变得复杂。","py":"Yǒuxiē shìqing rúguǒ nǐ yídìng yào zhǎo yí ge zhèngquè dáàn, kǒngpà huì ràng jiǎndān de shēnghuó biàndefùzá.","en":"With some things, if you insist on finding a correct answer, I'm afraid it makes simple life complicated."}]},{"label":"adverb — probably","items":[{"zh":"听完我的回答，恐怕你已经知道我的答案了吧。","py":"Tīngwán wǒ de huídá, kǒngpà nǐ yǐjīng zhīdào wǒ de dá'àn le ba.","en":"After hearing my answer, I'm afraid you already know my answer."},{"zh":"京剧演出7点就开始了，现在恐怕已经结束了。","py":"Jīngjù yǎnchū qīdiǎn jiù kāishǐ le, xiànzài kǒngpà yǐjīng jiéshù le.","en":"The Beijing opera performance started at seven; I'm afraid it has already finished now."}]}],"practice":{"label":"Complete the sentences.","items":["______，你再去叫两个人过来一起抬。(恐怕)","车撞得不严重，就是把车门擦坏了，______ (恐怕)","这个行李箱有点儿小，______ (恐怕)"]}},{"n":3,"title":"到底","structure":"到底 + Question","usage":["As a verb: means \"till the end\".","As an adverb: used in an interrogative sentence or a sentence with an interrogative pronoun, indicating to probe further. Cannot be used in a yes-no question with \"吗\".","If the subject is the interrogative pronoun, \"到底\" can only be put before it."],"examples":[{"label":"verb","items":[{"zh":"今天我一定陪你逛街逛到底，保证让你买到合适的衣服。","py":"Jīntiān wǒ yídìng péi nǐ guàngjiē guàng dàodǐ, bǎozhèng ràng nǐ mǎidào héshì de yīfu.","en":"Today I will go shopping with you right to the end and guarantee you find suitable clothes."},{"zh":"要是你觉得情人节只送巧克力还不够浪漫，那就再带她看《将爱情进行到底》这个爱情电影吧。","py":"Yàoshi nǐ juéde qíngrénjié zhǐ sòng qiǎokèlì hái búgòu làngmàn, nà jiù zài dài tā kàn «jiāng àiqíng jìnxíng dàodǐ» zhège àiqíng diànyǐng ba.","en":"If you feel that only giving chocolate on Valentine's Day isn't romantic enough, then take her to see the romantic film \"Love Till the End\" as well."}]},{"label":"adverb","items":[{"zh":"你不是已经买好火车票了吗? 你到底怎么打算的呀?","py":"Nǐ búshì yǐjīng mǎihǎo huǒchēpiàole ma? Nǐ dàodǐ zěnme dǎsuàn de ya?","en":"Didn't you already buy your train ticket? What exactly do you plan to do?"},{"zh":"我给他打了好几次电话了，可是一直没人接，也不知道他到底是怎么回事。","py":"Wǒ gěi tā dǎle hǎo jǐcì diànhuà le, kěshì yìzhí méirénjiē, yě bù zhīdào tā dàodǐ shì zěnmehuíshì.","en":"I've phoned him several times but nobody answers — I wonder what on earth is going on with him."},{"zh":"到底谁去参加比赛，大家还没决定。","py":"Dàodǐ shuí qù cānjiā bǐsài, dàjiā hái méi juédìng.","en":"Who exactly will take part in the competition hasn't been decided yet."},{"zh":"每个人都希望自己健康，那么到底什么是健康呢? 不同的人有不同的理解。","py":"Měi ge rén dōu xīwàng zìjǐ jiànkāng, nàme dàodǐ shénme shì jiànkāng ne? Bùtóng de rényǒu bùtóng de lǐjiě.","en":"Everyone hopes to be healthy, so what exactly is health? Different people understand it differently."}]}],"practice":{"label":"Complete the sentences.","items":["虽然这是两棵不同的植物，______ (到底)","从这儿一直往前走，______ (到底)","明天就是报名的最后一天了，______ (到底)"]}},{"n":4,"title":"拿……来说","structure":"拿 + [Example] + 来说","usage":["In the structure \"拿……来说\", \"拿\" is a preposition used to introduce the matter or situation to be illustrated."],"examples":[{"label":"","items":[{"zh":"这次招聘很多人符合公司的要求，拿他来说，他不仅专业符合职业要求，而且还有工作经验。","py":"Zhè cì zhāopìn hěnduō rén fúhé gōngsī de yāoqiú, ná tā láishuō, tā bùjǐn zhuānyè fúhé zhíyè yāoqiú, érqiě háiyǒu gōngzuò jīngyàn.","en":"Many people met the company's requirements in this recruitment. Take him for example: not only does his major fit the job, he also has work experience."},{"zh":"如果一个汉字中有\";\"这个部分，说明这个字的意思很可能和水有关系，拿\"河、流、洗、汁\"这几个字来说，它们都跟水有关。","py":"Rúguǒ yí ge hànzì zhōngyǒu\";\"zhège bùfen, shuōmíng zhège zì de yìsi hěn kěnéng hé shuǐyǒu guānxi, ná\"hé, liú, xǐ, zhī\"zhè jǐ ge zì láishuō, tāmen dōu gēn shuǐ yǒuguān.","en":"If a Chinese character contains the component \"氵\", its meaning is probably related to water. Take 河, 流, 洗 and 汁 for example — all are related to water."},{"zh":"所以不要把什么事情都推到\"明天\"，一切从现在做起。就拿学汉语来说吧，首先要注意课前预习，找出第二天要学习的重点……","py":"Suǒyǐ búyào bǎ shénme shìqing dōu tuīdào\"míngtiān\", yíqiè cóng xiànzài zuòqǐ. Jiù ná xué Hànyǔ lái shuō ba, shǒuxiān yào zhùyì kèqián yùxí, zhǎochū dìèrtiān yào xuéxí de zhòngdiǎn … …","en":"So don't put everything off until \"tomorrow\"; start everything from now. Take learning Chinese: first, pay attention to previewing before class and find the key points to study the next day…"}]}],"practice":{"label":"Complete the sentences.","items":["有的人一遇到困难就想放弃，______ (拿……来说)","保护环境应该从小事做起，______ (拿……来说)","没有工作计划很容易让人手忙脚乱，______ (拿……来说)"]}},{"n":5,"title":"敢","structure":"敢 + [Verb]","usage":["The modal verb \"敢\" is used before a verb, indicating being confident about doing something."],"examples":[{"label":"","items":[{"zh":"我们应该把那些敢说真话的人当成\"镜子\"，这样才能及时发现自己的缺点。","py":"Wǒmen yīnggāi bǎ nàxiē gǎn shuō zhēnhuà de rén dàngchéng\"jìngzi\", zhèyàng cáinéng jíshífāxiàn zìjǐ de quēdiǎn.","en":"We should treat those who dare to tell the truth as \"mirrors\", so that we can discover our own shortcomings in time."},{"zh":"小时候我总喜欢躺在床上看书，结果眼睛越来越不好，所以从那儿以后我就不敢再躺着看书了。","py":"Xiǎoshíhou wǒ zǒng xǐhuan tǎng zài chuángshang kànshū, jiéguǒ yǎnjing yuèláiyuè bùhǎo, suǒyǐ cóng nàr yǐhòu wǒ jiù bùgǎn zài tǎngzhe kànshū le.","en":"As a child I always liked lying in bed reading, and as a result my eyes got worse and worse, so since then I haven't dared to read lying down."},{"zh":"如果你敢诚实地说出自己对哪方面不了解，并不说明自己比别人差，相反，这样做更能得到别人的尊重。","py":"Rúguǒ nǐ gǎn chéngshí de shuōchū zìjǐ duì nǎ fāngmiàn bù liǎojiě, bìng bù shuōmíng zìjǐ bǐ biérén chà, xiāngfǎn, zhèyàng zuò gèng néng dédào biérén de zūnzhòng.","en":"If you dare to say honestly which areas you don't understand, it doesn't mean you are worse than others — on the contrary, doing so earns you more respect."}]}],"practice":{"label":"Complete the sentences.","items":["______? 小心咳嗽得更厉害。(敢)","她打网球打得特别棒，______ (敢)","老师应该为学生提供一种愉快的学习环境，______ (敢)"]}}],"compare":{"a":"恐怕","b":"怕","sim":[{"title":"As verbs","lines":[{"k":"text","t":"Both mean \"to be afraid\"."},{"k":"ex","t":"从这儿坐地铁到那儿至少得五十分钟，马克恐怕/怕来不及了。","py":"Cóng zhèr zuòdìtiě dào nàr zhìshǎo de wǔshífēnzhōng, Mǎkè kǒngpà / pà láibují le.","en":"From here to there by subway takes at least fifty minutes; I'm afraid Mark won't make it in time."}]},{"title":"As adverbs","lines":[{"k":"text","t":"Both indicate estimation, often implying \"being worried\"."},{"k":"ex","t":"如果说一对夫妻缺少或者没有共同语言，那问题恐怕/怕就大了。","py":"Rúguǒshuō yīduì fūqī quēshǎo huòzhě méiyǒu gòngtóng yǔyán, nà wèntí kǒngpà / pà jiù dà le.","en":"If a married couple lacks or has no common language, I'm afraid the problem is big."}]}],"diff":[{"title":"Position & following element","lines":[{"k":"text","t":"\"恐怕\" can only be used before a verb, not before a noun."},{"k":"text","t":"\"怕\" can be used before either a verb or a noun."},{"k":"ex","t":"我恐怕/怕忘了这件事，所以把这件事记在本子上。","py":"Wǒ kǒngpà / pà wàngle zhè jiàn shì, suǒyǐ bǎ zhè jiàn shìjì zài běnzi shang.","en":"I'm afraid I'll forget this, so I wrote it in my notebook."},{"k":"ex","t":"我怕你忘了这件事，所以打电话提醒你一下。","py":"Wǒpà nǐ wàngle zhè jiàn shì, suǒyǐ dǎdiànhuà tíxǐng nǐ yíxià.","en":"I'm worried you'll forget this, so I'm calling to remind you."}]},{"title":"Position relative to subject","lines":[{"k":"text","t":"\"恐怕\" can be used either before or after the subject."},{"k":"text","t":"\"怕\" is only used after the subject."},{"k":"ex","t":"刚才听广播说明天可能会下大雨，恐怕足球比赛不能举行了。","py":"Gāngcái tīng guǎngbō shuō míngtiān kěnéng huìxià dàyǔ, kǒngpà zúqiúbǐsài bùnéng jǔxíng le.","en":"I just heard on the radio that it may rain heavily tomorrow; I'm afraid the football match can't be held."},{"k":"ex","t":"刚才听广播说明天可能会下大雨，足球比赛恐怕/怕不能举行了。","py":"Gāngcái tīng guǎngbō shuō míngtiān kěnéng huìxià dàyǔ, zúqiúbǐsài kǒngpà / pà bùnéng jǔxíng le.","en":"I just heard on the radio that it may rain heavily tomorrow; I'm afraid the football match can't be held."}]},{"title":"Taking an object","lines":[{"k":"text","t":"\"怕\" can take an object, meaning \"to fear (somebody, something, or a certain situation)\"."},{"k":"text","t":"\"恐怕\" has no such usage."},{"k":"ex","t":"找工作关键还是看能力，有能力的人不怕找不到好工作。","py":"Zhǎo gōngzuò guānjiàn háishì kàn nénglì, yǒu nénglì de rén búpà zhǎo búdào hǎo gōngzuò.","en":"In job hunting, ability is what matters most; people with ability needn't fear not finding a good job."}]},{"title":"Meaning \"perhaps\"","lines":[{"k":"text","t":"\"恐怕\" can indicate an estimation or guess, and can usually be replaced by \"也许/大概\"."},{"k":"text","t":"\"怕\" has no such usage."},{"k":"ex","t":"好久没见过他了，他离开这里恐怕有二十天了。","py":"Hǎojiǔméi jiànguo tā le, tā líkāi zhèli kǒngpà yǒu èrshítiān le.","en":"I haven't seen him for ages — it's probably been twenty days since he left here."}]}],"drill":[["","恐怕","怕"],["(1) 如果没有你们的帮助，这次找工作______不会这么顺利。","√","√"],["(2) 这次聚会你们怎么准备了这么多菜呢? 我______他们吃不了。","×","√"],["(3) 如果你们今晚还想看节目的话，最好现在就出发，再晚了______就没座位了。","",""],["(4) 我本来想放假就走，但______现在走不了，老师让我翻译几篇文章。","",""],["(5) 遇到任何困难都不要______，只要你努力，成功就离你越来越近。","",""]],"core":"位置和搭配不同；\"怕\"可带宾语","drill_label":"Tick or cross."}},"17":{"points":[{"n":1,"title":"倒","structure":"Subject + 倒 + Verb/Adjective","usage":["As a verb: means \"to pour something from a container\".","As an adverb: means contrary to the fact, implies blame, or indicates concession. Sometimes \"倒是\" is used instead."],"examples":[{"label":"verb","items":[{"zh":"麻烦你���我倒杯咖啡���，困死我了。","py":"Máfan nǐ gěi wǒ dàobēi kāfēiba, kùnsǐ wǒ le.","en":"Could you pour me a cup of coffee? I'm dying of sleepiness."},{"zh":"你怎么咳嗽得这么厉害? 我给你倒杯水吧。","py":"Nǐ zěnme késou de zhème lìhai? Wǒ gěi nǐ dàobēishuǐ ba.","en":"Why are you coughing so badly? Let me pour you a glass of water."}]},{"label":"adverb — contrary to expectation","items":[{"zh":"我以为坐出租车会快些，没想到倒比骑车还慢。","py":"Wǒ yǐwéi zuò chūzūchē huì kuàixiē, méixiǎngdào dào bǐ qíchē háimàn.","en":"I thought taking a taxi would be faster, but it turned out to be slower than cycling."}]},{"label":"adverb — blame","items":[{"zh":"你说得倒是容易，做起来可就难了！","py":"Nǐ shuō de dào shì róngyì, zuòqǐ lái kě jiù nán le!","en":"It's easy for you to say — doing it is another matter!"}]},{"label":"adverb — concession","items":[{"zh":"去长城倒是一个好主意，就是太远了。","py":"Qù Chángchéng dào shì yí ge hǎo zhǔyi, jiùshì tàiyuǎn le.","en":"Going to the Great Wall is indeed a good idea; it's just too far."}]}],"practice":{"label":"Complete the dialogues/sentences.","items":["A: ______ (倒) B: 好的。你想喝红茶还是绿茶?"]}},{"n":2,"title":"干","structure":"Subject + (Adverb) + 干","
