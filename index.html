function LessonPage({ level, lesson }){
  const words = lesson.words;
  const total = words.length;
  const gdata = hskGrammar[level.id] ? hskGrammar[level.id][lesson.id] : null;
  const grammarPoints = hskGrammar[level.id] ? (gdata ? gdata.points : []) : null;
  const hasStudyTabs = grammarPoints !== null;   /* HSK 4: vocabulary · important · grammar · texts · flashcards */
  const hasTexts = hasStudyTabs && !!(hskTexts[level.id] && hskTexts[level.id][lesson.id]);
  const TABS = hasStudyTabs
    ? [['vocabulary','Vocabulary','Vocabulary'], ['important','Important words','Important'], ['grammar','Grammar','Grammar'],
       ...(hasTexts ? [['texts','Texts','Texts']] : []), ['flashcards','Flashcards','Flashcards']]
    : [['vocabulary','Vocabulary','Vocabulary'], ['flashcards','Flashcards','Flashcards']];

  const [order, setOrder]     = useState(words.map((_, i) => i));
  const [shuffled, setShuffled] = useState(false);
  const [pos, setPos]         = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [done, setDone]       = useState(false);
  const [hidePinyin, setHidePinyin] = useState(false);
  const [focusPoint, setFocusPoint] = useState(null);
  const [activeTab, setActiveTab] = useState(() => {
    let saved = null;
    try { saved = localStorage.getItem('hf-tab-v1'); } catch(e){}
    return TABS.some(t => t[0] === saved) ? saved : 'vocabulary';
  });
  const [seen, setSeen]       = useState(() => new Set(progressStore.seenFor(level.id, lesson.id).filter(id => words.some(w => w.id === id))));

  const word = words[order[pos]];

  const go = (d) => {
    if (d > 0) {
      if (done) return;
      if (pos === total - 1) { setDone(true); setFlipped(false); return; }
      setPos(pos + 1); setFlipped(false);
    } else {
      if (done) { setDone(false); setFlipped(false); return; }
      if (pos === 0) return;
      setPos(pos - 1); setFlipped(false);
    }
  };
  const flip = () => {
    setFlipped(f => !f);
    if (!flipped) {
      const id = word.id;
      setSeen(s => { const n = new Set(s); n.add(id); return n; });
      progressStore.markSeen(level.id, lesson.id, id);
    }
  };
  const restart = () => { setPos(0); setDone(false); setFlipped(false); };
  const toggleShuffle = () => {
    if (!shuffled) {
      const arr = [...order];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      setOrder(arr);
    } else {
      setOrder(words.map((_, i) => i));
    }
    setShuffled(!shuffled);
    setPos(0); setDone(false); setFlipped(false);
  };
  const switchTab = (tab) => {
    setActiveTab(tab);
    setFlipped(false);
    try { localStorage.setItem('hf-tab-v1', tab); } catch(e){}
  };

  const seeInTexts = (n) => {
    setFocusPoint(n);
    switchTab('texts');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const actionsRef = useRef({ go, flip, tab: activeTab });
  actionsRef.current = { go, flip, tab: activeTab };

  /* Keyboard: arrows navigate, space/enter flips — flashcard tab only,
     so Space still scrolls the other tabs and never marks a hidden card as seen. */
  useEffect(() => {
    const onKey = (e) => {
      if (actionsRef.current.tab !== 'flashcards') return;
      const tag = (e.target && e.target.tagName) || '';
      if ((e.key === ' ' || e.key === 'Enter') && (tag === 'BUTTON' || tag === 'A')) return; // native click wins
      if (e.key === 'ArrowRight') actionsRef.current.go(1);
      else if (e.key === 'ArrowLeft') actionsRef.current.go(-1);
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); actionsRef.current.flip(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [level.id, lesson.id]);

  const onCards = activeTab === 'flashcards';
  const tabBtn = (id, long, short) => (
    <button key={id} type="button" role="tab" id={'tab-' + id} aria-selected={activeTab === id}
      onClick={() => switchTab(id)}
      className={'shrink-0 whitespace-nowrap px-1 pb-3 mr-4 sm:mr-6 last:mr-0 text-[13px] sm:text-sm font-semibold border-b-2 transition-colors ' +
        (activeTab === id ? 'border-jade text-jade' : 'border-transparent text-ink/45 dark:text-white/45 hover:text-ink dark:hover:text-white')}>
      {long === short ? long : (<><span className="sm:hidden">{short}</span><span className="hidden sm:inline">{long}</span></>)}
    </button>
  );

  return (
    <div className="relative page-h flex flex-col">
      {/* Focus layer — dims & blurs the background while the card is flipped */}
      <div aria-hidden="true"
        className={'focus-overlay fixed inset-0 z-10 pointer-events-none transition-opacity duration-500 ' + (onCards && flipped && !done ? 'opacity-100' : 'opacity-0')}/>

      <div className="relative z-20 flex-1 w-full max-w-3xl mx-auto flex flex-col px-4 sm:px-6 pt-5 pb-[max(2rem,env(safe-area-inset-bottom))]">
        {/* Header */}
        <header className="flex items-center justify-between gap-3 transition-opacity duration-500"
          style={{ opacity: onCards && flipped && !done ? .45 : 1 }}>
          <a href={levelHref(level)}
            className="inline-flex items-center gap-1 text-sm font-semibold text-ink/55 dark:text-white/55 hover:text-jade transition-colors shrink-0">
            <Icon name="chevron-left" size={16}/>
            <span className="hidden sm:inline">{level.label} lessons</span>
            <span className="sm:hidden">Lessons</span>
          </a>
          <div className="min-w-0 text-center">
            <p className="font-hanzi text-[11px] text-jade leading-none">第{CN_NUM[lesson.id]}课</p>
            <h1 className="mt-1 font-serif font-semibold text-base sm:text-lg truncate">{lesson.title}</h1>
          </div>
          <span className="shrink-0 text-xs font-bold tabular-nums text-ink/40 dark:text-white/40">
            {onCards ? (done ? total : pos + 1) + ' / ' + total : total + ' words'}
          </span>
        </header>

        {onCards && <span className="sr-only" aria-live="polite">Word {pos + 1} of {total}: {word.hanzi}</span>}

        <div className="mt-5 mb-4 flex overflow-x-auto no-scrollbar border-b border-ink/10 dark:border-white/10" role="tablist" aria-label="Lesson study mode">
          {TABS.map(t => tabBtn(t[0], t[1], t[2]))}
        </div>

        {activeTab === 'vocabulary' && (
          <VocabularySection words={words} proper={lesson.proper || []} hidePinyin={hidePinyin} onTogglePinyin={() => setHidePinyin(value => !value)}/>
        )}
        {activeTab === 'important' && hasStudyTabs && (
          <ImportantSection words={words} hidePinyin={hidePinyin} onTogglePinyin={() => setHidePinyin(value => !value)}/>
        )}
        {activeTab === 'grammar' && hasStudyTabs && (
          <GrammarSection levelId={level.id} lessonId={lesson.id} data={gdata} words={words} hidePinyin={hidePinyin}
            onTogglePinyin={() => setHidePinyin(value => !value)} onSeeInTexts={seeInTexts}/>
        )}
        {activeTab === 'texts' && hasTexts && (
          <TextsSection levelId={level.id} lessonId={lesson.id} points={grammarPoints} hidePinyin={hidePinyin}
            onTogglePinyin={() => setHidePinyin(value => !value)} focus={focusPoint} setFocus={setFocusPoint}/>
        )}
        {onCards && (
          <>
            {/* Card / completion */}
            <div className="flex-1 flex items-center justify-center py-4 sm:py-8">
              {done
                ? <Completion level={level} lesson={lesson} total={total} seenCount={seen.size} onRestart={restart}/>
                : <Flashcard word={word} pos={pos} total={total} flipped={flipped} onFlip={flip}/>}
            </div>

            {/* Controls */}
            {!done && (
              <div className="w-full max-w-[24rem] mx-auto">
                <div className="flex gap-1">
                  {order.map((wi, i) => {
                    const isSeen = seen.has(words[wi].id);
                    return (
                      <div key={i} title={words[wi].hanzi}
                        className={'h-1.5 flex-1 rounded-full transition-colors duration-300 ' +
                          (isSeen ? (i === pos ? 'bg-jade-deep' : 'bg-jade')
                                  : (i === pos ? 'bg-ink/40 dark:bg-white/40' : 'bg-ink/10 dark:bg-white/10'))}/>
                    );
                  })}
                </div>
                <div className="mt-3 flex items-center justify-between">
                  <span className="text-[11px] uppercase tracking-[0.18em] text-ink/45 dark:text-white/45">
                    Word {pos + 1} of {total}
                  </span>
                  <div className="flex items-center gap-1.5">
                    <button onClick={toggleShuffle} title="Shuffle deck" aria-label="Shuffle deck" aria-pressed={shuffled}
                      className={'btn-mini' + (shuffled ? ' is-on' : '')}><Icon name="shuffle" size={13}/></button>
                    <button onClick={restart} title="Restart lesson" aria-label="Restart lesson" className="btn-mini">
                      <Icon name="rotate-ccw" size={13}/>
                    </button>
                  </div>
                </div>
                <div className="mt-5 flex items-center justify-center gap-3">
                  <button onClick={() => go(-1)} disabled={pos === 0} aria-label="Previous word" className="btn-round">
                    <Icon name="chevron-left" size={20}/>
                  </button>
                  <button onClick={flip} className="btn-reveal">
                    {flipped ? 'Show hanzi' : 'Reveal meaning'}
                  </button>
                  <button onClick={() => go(1)} aria-label={pos === total - 1 ? 'Finish lesson' : 'Next word'} className="btn-round">
                    {pos === total - 1 ? <Icon name="check" size={20}/> : <Icon name="chevron-right" size={20}/>}
                  </button>
                </div>
                <p className="mt-4 text-center text-[11px] text-ink/35 dark:text-white/35">
                  {seen.size} of {total} reviewed · <span className="hidden sm:inline">keyboard: arrows navigate, space flips</span><span className="sm:hidden">tap the card to flip</span>
                </p>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* ================================================================
   404 + App shell
================================================================ */
function NotFound(){
  return (
    <div className="max-w-xl mx-auto px-6 py-24 text-center">
      <span className="seal w-14 h-14 text-2xl">迷</span>
      <h1 className="mt-6 font-serif text-4xl font-semibold tracking-tight">Lost your way?</h1>
      <p className="mt-3 text-ink/55 dark:text-white/55">That page isn't in the textbook. Head back to the levels and pick a deck.</p>
      <a href="#/" className="btn-primary mt-8">Back to levels <Icon name="arrow-right" size={16}/></a>
    </div>
  );
}

function App(){
  const route = useHashRoute();
  const [dark, setDark] = useDarkMode();
  const isLesson = route.name === 'lesson';
  let content = null, notFound = false;

  if (route.name === 'level') {
    const lv = api.getLevel(route.levelId);
    lv ? content = <LevelPage level={lv}/> : notFound = true;
  } else if (isLesson) {
    const lv = api.getLevel(route.levelId);
    const ls = lv && api.getLesson(route.levelId, route.lessonId);
    ls ? content = <LessonPage level={lv} lesson={ls}/> : notFound = true;
  } else {
    content = <HomePage/>;
  }

  useEffect(() => {
    let t = 'HanziBoss · HSK Flashcards';
    if (route.name === 'level') { const lv = api.getLevel(route.levelId); t = (lv ? lv.title : 'Not found') + ' · HanziBoss'; }
    if (route.name === 'lesson') { const ls = api.getLesson(route.levelId, route.lessonId); t = (ls ? ls.title : 'Lesson') + ' · HanziBoss'; }
    document.title = t;
  }, [route]);

  const totalWords = api.getLevels().reduce((a,l) => a + l.lessons.reduce((x,ls) => x + ls.words.length, 0), 0);

  return (
    <div className="min-h-screen flex flex-col">
      <Navbar dark={dark} onToggle={() => setDark(!dark)}/>
      <main key={window.location.hash || '#/'} className="page flex-1">
        {notFound ? <NotFound/> : content}
      </main>
      {!isLesson && !notFound && <Footer words={totalWords}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
