usage":["As a verb \"干(gàn)\": means \"to do (something)\", to engage in a certain cause, job or activity.","As an adjective \"干(gān)\": means \"dry\" (no moisture or very little moisture).","As a noun \"干(儿)(gānr)\": means \"dried food\" (processed to remove moisture)."],"examples":[{"label":"verb gàn","items":[{"zh":"每次你让它干什么，它就像能听懂你的话一样去做。","py":"Měi cì nǐ ràng tā gàn shénme, tā jiù xiàng néng tīngdǒng nǐ de huà yíyàng qù zuò.","en":"Every time you tell it to do something, it does it as if it could understand you."},{"zh":"A: 你这篇报道写得很好，以后要继续努力。 B: 谢谢您，我一定会好好儿干的。","py":"A: Nǐ zhèpiān bàodào xiě de hěn hǎo, yǐhòu yào jìxù nǔlì. B: Xièxienín, wǒ yídìng huì hǎohāor gàn de.","en":"A: You wrote this report well; keep working hard from now on. B: Thank you, I will definitely do my best."},{"zh":"干工作的时候一定要认真、仔细，要注意到计划上的每一个地方，否则就很容易出问题。","py":"Gàn gōngzuò de shíhou yídìng yào rènzhēn, zǐxì, yào zhùyì dào jìhuà shang de měi yí ge dìfang, fǒuzé jiù hěn róngyì chū wèntí.","en":"When you work you must be careful and meticulous and pay attention to every part of the plan, otherwise problems easily arise."}]},{"label":"adjective gān","items":[{"zh":"A: 妈，帮我拿条毛巾，外面雨真大啊! B: 又忘记带伞了吧? 头发都湿了，先把头发擦干，别感冒了。","py":"A: Mā, bāng wǒ ná tiáo máojīn, wàimiàn yǔ zhēndà a! B: Yòu wàngjì dàisǎnle ba? Tóufà dōu shī le, xiān bǎ tóufà cāgàn, bié gǎnmào le.","en":"A: Mum, get me a towel — it's raining so hard outside! B: Forgot your umbrella again? Your hair is wet — dry it first so you don't catch a cold."}]},{"label":"noun gānr","items":[{"zh":"A: 这牛肉干味道真不错，在哪儿买的? B: 不是我买的，是我男朋友从老家寄过来的。","py":"A: Zhè niúròugān wèidào zhēnbúcuò, zài nǎr mǎi de? B: Búshì wǒ mǎi de, shì wǒ nánpéngyou cóng lǎojiā jìguòlái de.","en":"A: This dried beef tastes really good — where did you buy it? B: I didn't buy it; my boyfriend sent it from his hometown."}]}],"practice":{"label":"Complete the dialogues/sentences.","items":["A: ______? 要我帮忙吗? (干) B: 我想在这面墙上挂一张中国地图，那面墙上挂一张世界地图。","新来的服务员 ______，来吃饭的客人都十分满意。(干)","你们有时间的话多帮帮小王，他手里的工作又多又难，______ (干)"]}},{"n":3,"title":"趟","structure":"[Verb] + 趟","usage":["The measure word \"趟\" is used for a round trip.","Used with actions involving coming and going, such as \"来、去、走、跑、接、送\" etc."],"examples":[{"label":"","items":[{"zh":"上个月我去了趟北京动物园，那里约有500多种动物。","py":"Shàng ge yuè wǒ qùle tàng Běijīng Dòngwùyuán, nàli yuē yǒu wǔbǎi duōzhǒng dòngwù.","en":"Last month I made a trip to the Beijing Zoo, which has about 500 kinds of animals."},{"zh":"我要出趟差，你能帮我照顾一下我的小狗吗?","py":"Wǒyào chūtàng chà, nǐ néng bāng wǒ zhàogù yíxià wǒ de xiǎogǒu ma?","en":"I have to go on a business trip — can you look after my puppy?"},{"zh":"A: 马上就要放暑假了，你有什么安排吗? B: 我打算先回一趟家，看看我奶奶，然后回学校准备研究生考试。","py":"A: Mǎshàng jiùyào fàngshǔjià le, nǐ yǒu shénme ānpái ma? B: Wǒ dǎsuàn xiānhuí yí tàng jiā, kànkan wǒ nǎinai, ránhòu huí xuéxiào zhǔnbèi yánjiūshēng kǎoshì.","en":"A: Summer vacation is coming soon — any plans? B: I plan to go home first to see my grandmother, then go back to school to prepare for the graduate-school exam."}]}],"practice":{"label":"Complete the dialogues/sentences.","items":["A: ______，你有什么要买的吗? (趟) B: 买点儿饼干和巧克力回来吧。","A: 经理，______，我想请一天假可以吗? (趟) B: 当然可以。怎么了? 身体不舒服?","今年寒假 ______，那里的气候和北方不同，尽管现在是冬天，但那儿非常暖和，还能吃到许多新鲜的水果。(趟)"]}},{"n":4,"title":"为了……而……","structure":"为了 + [Purpose] + 而 + [Action]","usage":["In the structure \"为了……而……\", the first clause indicates the purpose of the action or behavior in the second clause.","\"为了\" is followed by a word or phrase."],"examples":[{"label":"","items":[{"zh":"植物会为了阳光、空气和水而竞争。","py":"Zhíwù huì wèile yángguāng, kōngqì hé shuǐ ér jìngzhēng.","en":"Plants compete for sunlight, air and water."},{"zh":"北风与南风为了比谁更有能力而吵了起来。它们决定，谁能把人们身上的大衣脱掉，谁就赢了。","py":"Běifēng yǔ nánfēng wèile bǐ shuí gèng yǒu nénglì ér chǎole qǐlái. Tāmen juédìng, shuí néng bǎ rénmen shēnshàng de dàyī tuōdiào, shuí jiù yíng le.","en":"The north wind and the south wind quarrelled over who was more capable. They decided that whoever could make people take off their coats would win."},{"zh":"自然界中，不少动物和植物为了保护自己而改变身体的颜色或样子，使自己成为周围环境的一部分。","py":"Zìránjiè zhōng, bùshǎo dòngwù hé zhíwù wèile bǎohù zìjǐ ér gǎibiàn shēntǐ de yánsè huò yàngzi, shǐ zìjǐ chéngwéi zhōuwéihuánjìng de yíbùfen.","en":"In nature, many animals and plants change their body colour or shape to protect themselves, making themselves part of their surroundings."}]}],"practice":{"label":"Complete the sentences.","items":["胖一点儿没关系，健康最重要。千万不要 ______ (为了……而……)","我们不应该 ______，应该让钱为我们工作。(为了……而……)","不要 ______，找时间陪陪父母吧，或者给他们打个电话，不要等到来不及的时候才感到后悔。(为了……而……)"]}},{"n":5,"title":"仍然","structure":"Subject + 仍然 + Verb/Adjective","usage":["The adverb \"仍然\" means the situation is the same as before without any change."],"examples":[{"label":"","items":[{"zh":"就算在几公里深��海底也仍然能看到东西。","py":"Jiùsuàn zài jǐ gōnglǐ shēn de hǎidǐ yě réngrán néng kàndào dōngxi.","en":"Even at the bottom of the sea, several kilometres deep, you can still see things."},{"zh":"人比动物聪明，但动物仍然有很多值得人学习的地方。","py":"Rénbǐ dòngwù cōngming, dàn dòngwù réngrán yǒu hěnduō zhíde rén xuéxí de dìfang.","en":"Humans are smarter than animals, but animals still have many things humans can learn from."},{"zh":"足球决赛时，如果90分钟后仍然是0比0，按照规定，可以进行加时赛来决定输赢。","py":"Zúqiú juésài shí, rúguǒ jiǔshífēnzhōng hòu réngrán shì língbǐ líng, ànzhào guīdìng, kěyǐ jìnxíng jiāshísài lái juédìng shūyíng.","en":"In a football final, if after 90 minutes it is still 0–0, then according to the rules extra time can be played to decide the winner."}]}],"practice":{"label":"Complete the sentences/dialogues.","items":["A: 我又跟我丈夫谈了这件事，______ (仍然) B: 你再跟他好好儿商量一下。","尽管这只是一场误会，______ (仍然)","一个70岁还有梦的老人，一个20岁就放弃了理想的人，______，心已经老了。(仍然)"]}}],"compare":{"a":"趟","b":"次","sim":[{"title":"","lines":[{"k":"text","t":"Both indicate the number of times that an action takes place and are often interchangeable."},{"k":"text","t":"They are used with actions involving coming and going."},{"k":"ex","t":"今年寒假我去广东玩儿了一趟/次。","py":"Jīnnián hánjià wǒ qù Guǎngdōng wánrle yí tàng / cì.","en":"This winter holiday I went to Guangdong for a trip."}]}],"diff":[{"title":"Round trip vs. repetition","lines":[{"k":"text","t":"\"趟\" indicates a trip back and forth → only used for actions or behaviors that involve coming and going."},{"k":"text","t":"\"次\" indicates the number of times that an action, not necessarily a back-and-forth one, repeats."},{"k":"ex","t":"回来的路上我顺便去了趟银行。","py":"Huílái de lùshang wǒ shùnbiàn qùle tàng yínháng.","en":"On the way back I stopped by the bank."},{"k":"ex","t":"小时候，爷爷差不多每个月都带我去看一次京剧。","py":"Xiǎoshíhou, yéye chàbuduō měi ge yuè dōu dàiwǒqù kàn yí cì jīngjù.","en":"As a child, my grandfather took me to see Beijing opera almost every month."}]},{"title":"Other behaviors","lines":[{"k":"text","t":"\"次\" can be used for verbs indicating other behaviors, such as \"问、说、看、讨论\" etc."},{"k":"text","t":"\"趟\" has no such usage."},{"k":"ex","t":"你这么着急去哪儿啊? 我刚才叫了你两次，你都没听到。","py":"Nǐ zhème zháojí qù nǎr a? Wǒ gāngcái jiàole nǐ liǎngcì, nǐ dōu méi tīngdào.","en":"Where are you rushing off to? I called you twice just now and you didn't hear."}]},{"title":"Public transport","lines":[{"k":"text","t":"\"趟\" can also be used for buses or trains that travel at a scheduled time on a fixed route, similar to \"辆\" and \"列\"."},{"k":"text","t":"\"次\" cannot be used this way."},{"k":"ex","t":"附近有好几趟公共汽车都能到我工作的公司。","py":"Fùjìn yǒu hǎojǐtàng gōnggòngqìchē dōu néng dào wǒ gōngzuò de gōngsī.","en":"There are several bus routes nearby that can take you to the company where I work."}]}],"drill":[["","趟","次"],["(1) 去年放暑假的时候，我去了一______北京动物园。","√","√"],["(2) 我们去______超市吧，明天出去玩儿得买点儿饼干和面包。","√","×"],["(3) 中午我给你打了好几______电话，你怎么都不接呢?","",""],["(4) 他没赶上最后一______公共汽车，只好坐出租车回家了。","",""],["(5) 西红柿鸡蛋汤的做法很简单，我保证你一______就能学会。","",""]],"core":"来回 vs. 重复次数；\"趟\"可用于公共汽车","drill_label":"Tick or cross."}},"18":{"points":[{"n":1,"title":"是否","structure":"是否 + Verb/Adjective","usage":["The adverb \"是否\" means \"whether or not\", usually used in written Chinese."],"examples":[{"label":"","items":[{"zh":"不过她这么小，这本书我不知道她是否能读懂。","py":"Búguò tā zhème xiǎo, zhè běnshū wǒ bù zhīdào tā shìfǒu néng dúdǒng.","en":"But she's so young — I don't know whether she can understand this book."},{"zh":"有人认为有\"夫妻相\"的夫妻家庭生活幸福，实际上，婚姻是否幸福跟这个没有关系。","py":"Yǒurén rènwéi yǒu\"fūqī xiāng\"de fūqī jiātíng shēnghuó xìngfú, shíjì shang, hūnyīn shìfǒu xìngfú gēn zhège méiyǒu guānxi.","en":"Some people think couples who have a \"couple look\" have a happy family life; in fact, whether a marriage is happy has nothing to do with this."},{"zh":"现在，如果要问人们选择职业时主要考虑的是什么，不少人会以收入多少作为标准。当然，也有人主要看自己是否喜欢这份工作。","py":"Xiànzài, rúguǒ yào wèn rénmen xuǎnzé zhíyè shí zhǔyào kǎolǜ de shì shénme, bùshǎo rénhuì yǐ shōurù duōshao zuòwéi biāozhǔn. Dāngrán, yě yǒurén zhǔyào kàn zìjǐ shìfǒu xǐhuan zhèfèn gōngzuò.","en":"Now, if you ask what people mainly consider when choosing a career, many will use income as the standard. Of course, some mainly look at whether they like the job."}]}],"practice":{"label":"Complete the sentences/dialogues.","items":["A: 麻烦你帮我改签到后天的同一航班。 B: 您稍等，我查一下 ______ (是否)","当我们听到批评时，应该冷静地想想他们提出的意见或者建议 ______ (是否)","一个人 ______，对于他离成功的远近有着重要的影响。(是否)"]}},{"n":2,"title":"受不了","structure":"受不了 + [Noun/Noun phrase]","usage":["\"受不了\" means \"cannot bear (the pain, suffering, stress, misfortune, attitude, temper, etc.)\".","Usually used before a noun or noun phrase."],"examples":[{"label":"","items":[{"zh":"A: 我们再去对面的商店看看吧。 B: 我真的受不了你了，你到底还要逛多久?","py":"A: Wǒmen zài qù duìmiàn de shāngdiàn kànkan ba. B: Wǒ zhēn de shòubuliǎo nǐ le, nǐ dàodǐ háiyào guàng duōjiǔ?","en":"A: Let's go and look at the shop across the street. B: I really can't stand you — how much longer are you going to shop?"},{"zh":"不过天天对着电脑看，眼睛实在受不了。","py":"Búguò tiāntiān duìzhe diànnǎo kàn, yǎnjing shízài shòubuliǎo.","en":"But staring at a computer every day, my eyes really can't stand it."},{"zh":"A: 真受不了这样的老师! 一个简单的动作让我们练二三十遍。 B: 他对你们严格些好，这样可以让你们打好基础。","py":"A: Zhēn shòubuliǎo zhèyàng de lǎoshī! Yí ge jiǎndān de dòngzuò ràng wǒmen liàn èrsānshí biàn. B: Tā duì nǐmen yángé xiē hǎo, zhèyàng kěyǐ ràng nǐmen dǎhǎo jīchǔ.","en":"A: I can't stand teachers like this! One simple move and he makes us practise it twenty or thirty times. B: It's good that he's strict with you — it lays a solid foundation."}]}],"practice":{"label":"Complete the dialogues.","items":["A: ______，你桌子上太乱了，找时间好好儿整理一下。 B: 好的，我现在就收拾，一定弄得整整齐齐。(受不了)","A: 开一下窗户吧，______ (受不了) B: 是你穿得太多了，把外面那件衣服脱了吧。","A: 你怎么又想换工作了? 这儿的收入不是挺高的吗? B: 可是 ______ (受不了)"]}},{"n":3,"title":"接着","structure":"Statement, 接着 + Statement","usage":["The adverb \"接着\" means \"following immediately (in time)\", indicating something else happens right after the previous event."],"examples":[{"label":"","items":[{"zh":"这本书的内容非常有趣，你看完以后先不要还，我接着看。","py":"Zhè běnshū de nèiróng fēicháng yǒuqù, nǐ kànwán yǐhòu xiān búyào hái, wǒ jiēzhe kàn.","en":"This book is very interesting; don't return it after you finish — I'll read it next."},{"zh":"我昨天晚上做了一个特别奇怪的梦，梦到自己正在一座桥上走，走着走着，突然开过来一辆车，非常危险，接着又梦见我跳到车上，跟警察一起抓住了一个坏人。","py":"Wǒ zuótiān wǎnshang zuòle yí ge tèbié qíguài de mèng, mèngdào zìjǐ zhèngzài yí zuò qiáo shang zǒu, zǒuzhe zǒuzhe, tūrán kāi guòlái yí liàng chē, fēicháng wēixiǎn, jiēzhe yòu mèngjiàn wǒ tiàodào chē shang, gēn jǐngchá yìqǐ zhuāzhùle yí ge huàirén.","en":"Last night I had a very strange dream: I was walking on a bridge, and as I walked a car suddenly came towards me — very dangerous — then I dreamed I jumped onto the car and, together with the police, caught a bad guy."},{"zh":"妻子问：\"老公，怎么不见你和老王打网球了呢?\" 丈夫说：\"你愿意和一个赢了就得意，输了就不高兴的人打球吗?\" \"当然不愿意。我明白了，\" 妻子接着说，\"老王也不愿意跟这样的人打。\"","py":"Qīzi wèn:\"lǎogōng, zěnme bújiàn nǐ hé lǎowáng dǎ wǎngqiúle ne?\"zhàngfu shuō:\"nǐ yuànyì hé yí ge yíngle jiù déyì, shūle jiù bù gāoxìng de rén dǎqiú ma?\"\"dāngrán bú yuànyì. Wǒ míngbai le,\"qīzi jiēzhe shuō,\"lǎowáng yě bú yuànyì gēn zhèyàng de rén dǎ.\"","en":"The wife asked, \"Why don't you play tennis with Lao Wang any more?\" The husband said, \"Would you like to play with someone who gloats when he wins and gets unhappy when he loses?\" \"Of course not. I see,\" his wife went on, \"Lao Wang doesn't want to play with such a person either.\""}]}],"practice":{"label":"Complete the dialogues/sentences.","items":["A: 我刚才去打网球了，热死我了，快给我拿条毛巾吧。 B: ______ (接着)","他每天很早起床去锻炼，______ (接着)","遇到不认识的词语，我会马上查词典，______ (接着)"]}},{"n":4,"title":"除此以外","structure":"除此以外 + Statement","usage":["\"除此以外\" means \"besides this (referring to what's been mentioned previously)\", usually used in written Chinese."],"examples":[{"label":"","items":[{"zh":"他和弟弟同一天出生，兄弟俩长得很像，但除此以外几乎再找不到其他共同点。","py":"Tā hé dìdi tóngyītiān chūshēng, xiōngdìliǎ zhǎng de hěn xiàng, dàn chúcǐyǐwài jīhū zài zhǎo búdào qítā gòngtóngdiǎn.","en":"He and his younger brother were born on the same day and look very alike, but apart from this you can hardly find any other common ground."},{"zh":"北方人过年时爱吃饺子，是因为饺子味道鲜美，除此以外，还因为人们忙了一年，过年时全家人坐在一起包饺子，是很好的交流机会。","py":"Běifāng rén guònián shíài chī jiǎozi, shìyīnwèi jiǎozi wèidàoxiānměi, chúcǐ yǐwài, hái yīnwèi rénmen mángle yì nián, guònián shí quánjiārén zuòzài yìqǐ bāo jiǎozi, shì hěn hǎo de jiāoliú jīhuì.","en":"Northerners like to eat dumplings at New Year because they taste delicious; besides this, after a busy year it is also a good chance for the whole family to sit together making dumplings and talk."},{"zh":"……打电话、发短信已经成了人们普遍使用的联系方法。除此以外，你还可以用它来听音乐、看电影、阅读、玩儿游戏、付款购物等，这大大方便了人们的生活。","py":"… … Dǎdiànhuà, fā duǎnxìn yǐjīng chéngle rénmen pǔbiàn shǐyòng de liánxì fāngfǎ. Chúcǐ yǐwài, nǐ hái kěyǐ yòng tā lái tīng yīnyuè, kàn diànyǐng, yuèdú, wánr yóuxì, fùkuǎn gòuwù děng, zhè dàdà fāngbiànle rénmen de shēnghuó.","en":"…Making calls and sending texts have become commonly used means of contact. Besides this, you can also use it to listen to music, watch films, read, play games, pay and shop, etc., which greatly eases people's lives."}]}],"practice":{"label":"Complete the sentences.","items":["骑自行车是一种很好的、锻炼身体的方式。______ (除此以外)","冬季皮肤往往容易变得干燥，女性朋友尤其要注意保护皮肤。应该选择保湿的护肤品，______ (除此以外)","了解顾客的实际需要十分重要。买东西时，顾客当然会考虑它的质量和价格，______ (除此以外)"]}},{"n":5,"title":"把……叫作……","structure":"把 + [Noun/Pronoun/Noun phrase] + 叫作 + [Name]","usage":["In the structure \"把……叫作……\" (...is called...), the latter part is the name of the former part.","\"把\" is usually followed by a noun, pronoun or noun phrase."],"examples":[{"label":"","items":[{"zh":"现代科学技术的发展让世界变得越来越小，所以现在人们都把地球叫作\"地球村\"。","py":"Xiàndài kēxué jìshù de fāzhǎn ràng shìjiè biàn de yuè lái yuè xiǎo, suǒyǐ xiànzài rénmen dōu bǎ dìqiú jiàozuò\"dìqiúcūn\".","en":"The development of modern science and technology makes the world smaller and smaller, so people now call the Earth the \"global village\"."},{"zh":"黄河是中国第二大河，从中国西部流向东部，全长5464公里，人们把它叫作\"母亲河\"。","py":"Huáng Hé shì Zhōngguó dìèr dàhé, cóng Zhōngguó xībù liúxiàng dōngbù, quánzhǎng wǔqiān sìbǎi liùshísìgōnglǐ, rénmen bǎ tā jiàozuò\"mǔqīnhé\".","en":"The Yellow River is China's second-longest river, flowing from west to east for 5,464 km; people call it the \"Mother River\"."},{"zh":"中国人搬了新家后，一般都会邀请亲戚朋友到家里来吃顿饭，热闹一下。人们把这个习惯叫作\"暖房\"。","py":"Zhōngguó rén bānle xīnjiā hòu, yìbān dōu huì yāoqǐng qīnqipéngyou dào jiāli lái chī dùnfàn, rènao yíxià. Rénmen bǎ zhège xíguàn jiàozuò\"nuǎnfáng\".","en":"After Chinese people move into a new home they usually invite relatives and friends to eat a meal and liven things up. People call this custom \"warming the house\"."}]}],"practice":{"label":"Complete the sentences.","items":["在汉语里，像\"海\"\"河\"这些字左边的部分是一样的，______ (把……叫作……)","中国有56个民族，其中汉族人的数量最多，汉族以外的55个民族由于人数较少，______ (把……叫作……)","东西的质量和价格是有联系的，质量好的东西一般价格也会比较高。人们习惯上 ______ (把……叫作……)"]}}],"compare":{"a":"接着","b":"然后","sim":[{"title":"","lines":[{"k":"text","t":"Both indicate something else happens after the previous event."},{"k":"ex","t":"他毕业后在老家工作了一年，接着/然后又考上了北京大学，读研究生。","py":"Tā bìyè hòu zài lǎojiā gōngzuòle yì nián, jiēzhe / ránhòu yòu kǎoshàngle běijīngdàxué, dú yánjiūshēng.","en":"After graduating he worked a year in his hometown, then passed the entrance exam for Peking University to do a master's."}]}],"diff":[{"title":"Word class & structure","lines":[{"k":"text","t":"\"接着\" is an adverb emphasizing an immediate succession in time."},{"k":"text","t":"\"然后\" is a conjunction often used in the structure \"先……然后(再)……\"."},{"k":"ex","t":"大学毕业后，他接着又考上了��究生。","py":"Dàxuébìyè hòu, tā jiēzhe yòu kǎoshàngle yánjiūshēng.","en":"After graduating from university he then passed the postgraduate entrance exam."},{"k":"ex","t":"咱们先去吃晚饭，然后看电影，好不好?","py":"Zánmen xiānqù chī wǎnfàn, ránhòu kàn diànyǐng, hǎobùhǎo?","en":"Let's have dinner first and then watch a film — how about that?"}]},{"title":"Subject","lines":[{"k":"text","t":"For \"接着\", the two events may or may not have the same subject."},{"k":"text","t":"For \"然后\", they usually share the same subject."},{"k":"ex","t":"他已经学了一年汉语了，明年还要接着学。","py":"Tā yǐjīng xuéle yì nián hànyǔ le, míngnián háiyào jiēzhe xué.","en":"He has already studied Chinese for a year and will carry on next year."},{"k":"ex","t":"这本书你看完了我接着看吧。","py":"Zhè běnshū nǐ kànwánle wǒ jiēzhe kànba.","en":"When you finish this book, I'll read it next."},{"k":"ex","t":"遇到不认识的词语，我会马上查词典，然后写在本子上。","py":"Yùdào bú rènshi de cíyǔ, wǒhuì mǎshàng chá cídiǎn, ránhòu xiě zài běnzi shang.","en":"When I meet a word I don't know, I look it up in the dictionary right away and then write it in my notebook."}]}],"drill":[["","接着","然后"],["(1) 妹妹刚参加工作一年就买了房子，______就结了婚，今年又生了一个小男孩儿，生活得很幸福。","√","√"],["(2) 我说完了，______你说吧。","√","×"],["(3) 你先上网看看吧，多比较比较，______再做决定。","",""],["(4) 进了商店，妻子先买了一件衬衫，______又买了一条裤子。","",""],["(5) 今天的课就到这儿，下节课______讲这个问题。","",""]],"core":"副词 vs. 连词；主语是否相同","drill_label":"Tick or cross."}},"19":{"points":[{"n":1,"title":"疑问代词活用表示任指","structure":"[Interrogative pronoun] + 都/也 + [Verb]","usage":["Interrogative pronouns \"什么、谁、哪、哪儿、哪里、怎么\" etc. can be used to refer to anybody or anything.","For instance:","\"什么\" refers to anything.","\"谁\" refers to anybody.","They are often used together with \"都/也\" in a sentence."],"examples":[{"label":"","items":[{"zh":"没关系，不用道歉，谁都有粗心填错的时候。","py":"Méi guānxi, búyòng dàoqiàn, shéi dōu yǒu cūxīn tiáncuò de shíhou.","en":"It doesn't matter, no need to apologise — anyone can be careless and fill in something wrongly."},{"zh":"昨天我做了一个奇怪的梦，但是早上起来怎么想都想不起来。","py":"Zuótiān wǒ zuòle yí ge qíguài de mèng, dànshì zǎoshang qǐlái zěnme xiǎng dōu xiǎngbùqǐlái.","en":"I had a strange dream yesterday, but when I got up in the morning I couldn't remember it however hard I tried."},{"zh":"\"世界上没有免费的午餐\"这句话是说，什么东西都要通过努力才能得到。","py":"\"Shìjiè shàng méiyǒu miǎnfèi de wǔcān\"zhèjù huà shì shuō, shénme dōngxi dōu yào tōngguò nǔlì cáinéng dédào.","en":"The saying \"There's no such thing as a free lunch\" means that everything has to be obtained through effort."}]}],"practice":{"label":"Complete the sentences.","items":["每个人都有自己的生活，______? (谁)","______，所以他总是不开心。(什么)","我已经练习了好几遍了，______? (怎么)"]}},{"n":2,"title":"上","structure":"[Verb] + 上","usage":["The verb \"上\" is used after another verb as a complement of direction, indicating the purpose of an action or a behavior has been achieved.","Or as a complement of possibility, showing whether or not the purpose of an action or a behavior can be achieved."],"examples":[{"label":"","items":[{"zh":"看来今天吃不上羊肉饺子了。","py":"Kànlái jīntiān chī bú shàng yángròu jiǎozi le.","en":"It seems we can't have mutton dumplings today."},{"zh":"现在堵车这么厉害，看来今天坐不上8点那趟去上海的飞机了。","py":"Xiànzài dǔchē zhème lìhai, kànlái jīntiān zuòbùshàng bādiǎn nàtàng qù Shànghǎi de fēijī le.","en":"Traffic is so bad now that it looks like we can't make the 8 o'clock flight to Shanghai today."},{"zh":"一听到哥哥考上了经济专业的博士，我们全家都特别高兴。","py":"Yì tīngdào gēgē kǎoshàngle jīngjì zhuānyè de bóshì, wǒmen quánjiā dōu tèbié gāoxìng.","en":"As soon as we heard that my elder brother had been admitted to a doctoral programme in economics, our whole family was especially happy."}]}],"practice":{"label":"Complete the sentences.","items":["要是你想去云南旅游应该早点儿买火车票，______ (上)","早就听说这个饭馆儿的菜特别好吃，______ (上)","周末我们本来想去看电影，______ (上)"]}},{"n":3,"title":"出来","structure":"[Verb] + 出来","usage":["The verb \"出来\" can be used after another verb as a complement of direction, indicating a certain action or behavior makes the state of something change from:","being nonexistent to being existent","being hidden to being obvious"],"examples":[{"label":"","items":[{"zh":"有的人心里有什么看法或意见，嘴上就会直接说出来。","py":"Yǒu de rén xīnli yǒu shénme kànfǎ huò yìjiàn, zuǐshang jiù huì zhíjiē shuō chūlái.","en":"Some people say directly whatever views or opinions they have in mind."},{"zh":"你要的那篇文章我已经翻译出来了，你方便的时候就来取吧。","py":"Nǐ yào de nà piānwénzhāng wǒ yǐjīng fānyì chūlái le, nǐ fāngbiàn de shíhou jiù lái qǔ ba.","en":"I have already translated the article you wanted — come and pick it up whenever convenient."},{"zh":"刚才我在旁边看到你跳中国舞了，没看出来你跳得这么好！","py":"Gāngcái wǒ zài pángbiān kàndào nǐ tiào Zhōngguó wǔ le, méi kàn chūlái nǐ tiào de zhème hǎo!","en":"I saw you dancing a Chinese dance just now — I couldn't tell you danced so well!"}]}],"practice":{"label":"Complete the sentences.","items":["经理让小李写一篇文章，______ (出来)","今天老师问了个问题，______ (出来)","有的人虽然看到了别人的缺点，______ (出来)"]}},{"n":4,"title":"总的来说","structure":"总的来说 + Statement","usage":["\"总的来说\" is usually used as a parenthesis, meaning \"on the whole, generally speaking\"."],"examples":[{"label":"","items":[{"zh":"广告上说房子交通方便，周围很安静，厨房很大。总的来说，这套房子他很满意，于是他就记下了房东的手机号码。","py":"Guǎnggào shang shuō fángzi jiāotōng fāngbiàn, zhōuwéi hěn ānjìng, chúfáng hěn dà. Zǒng de lái shuō, zhè tào fángzi tā hěn mǎnyì, yúshì tā jiù jìxiàle fángdōng de shǒujī hàomǎ.","en":"The advertisement said the flat has convenient transport, a quiet neighbourhood and a big kitchen. On the whole he was very satisfied with the flat, so he noted down the landlord's mobile number."},{"zh":"这个公司的工资虽然不算很高，但是奖金很多，所以总的来说收入还不错。","py":"Zhège gōngsī de gōngzī suīrán bú suàn hěn gāo, dànshì jiǎngjīn hěnduō, suǒyǐ zǒngdeláishuō shōurù hái búcuò.","en":"This company's salary isn't very high, but the bonuses are large, so on the whole the income is fairly good."},{"zh":"很多人问去丽江旅游怎么样，总的来说，丽江景色不错，那里的人也很热情，去那里旅游是个不错的选择。","py":"Hěnduō rénwèn qù Lìjiāng lǚyóu zěnmeyàng, zǒng de lái shuō, Lìjiāng jǐngsè búcuò, nàli de rén yě hěn rèqíng, qù nàli lǚyóu shì ge búcuò de xuǎnzé.","en":"Many people ask what travelling to Lijiang is like. On the whole, Lijiang's scenery is good and its people are warm — it is a good choice for a trip."}]}],"practice":{"label":"Complete the sentences.","items":["去国外留学有好处也有坏处，______ (总的来说)","每个人虽然都会遇到一些困难，______ (总的来说)","这件衣服价格有点儿高，______ (总的来说)"]}},{"n":5,"title":"在于","structure":"[Subject] + 在于 + [Noun/Verb/Clause]","usage":["The verb \"在于\" is often used in written Chinese to point out the essence of something, meaning \"to be exactly, to lie in\".","\"在于\" usually has a noun phrase as its subject, and it must take a noun, verb or clause as its object."],"examples":[{"label":"","items":[{"zh":"人们常说\"生命在于运动\"，所以很多人一到周末就会到体育馆打几场球。","py":"Rénmen chángshuō\"shēngmìng zàiyú yùndòng\", suǒyǐ hěn duō rén yí dào zhōumò jiù huì dào tǐyùguǎn dǎ jǐ chǎng qiú.","en":"People often say \"life lies in movement\", so many people go to the gym to play a few games at weekends."},{"zh":"选择职业的关键在于兴趣，当你喜欢做一件事情的时候，你会带着热情去工作，就不会感到累，更不会觉得有太大的压力。","py":"Xuǎnzé zhíyè de guānjiàn zàiyú xìngqù, dāng nǐ xǐhuan zuò yí jiàn shìqing de shíhou, nǐhuì dàizhe rèqíng qù gōngzuò, jiù bú huì gǎndào lèi, gèng búhuì juéde yǒu tàidà de yālì.","en":"The key to choosing a career lies in interest: when you like doing something, you work with enthusiasm and don't feel tired, let alone under great pressure."},{"zh":"没有人能一生都顺顺利利、没有失败。区别在于有的人能接受失败，找到失败的原因并继续努力；而有的人却在失败面前停下了脚步。","py":"Méiyǒu rénnéng yīshēng dōu shùnshùnlìlì, méiyǒu shībài. Qūbié zàiyú yǒu de rénnéng jiēshòu shībài, zhǎodào shībài de yuányīn bìng jìxù nǔlì; ér yǒu de rén què zài shībài miànqián tíngxiàle jiǎobù.","en":"No one can go through life with everything smooth and no failure. The difference lies in that some people can accept failure, find its cause and keep trying, while others stop in the face of failure."}]}],"practice":{"label":"Complete the sentences.","items":["每个人对幸福的理解不同，______ (在于)","取得成功的人都经历过许多失败，______ (在于)","他做事情常常能达到事半功倍的效果，______ (在于)"]}}],"compare":{"a":"出来","b":"起来","sim":[],"diff":[{"title":"Direction of motion","lines":[{"k":"text","t":"Both can be used after verbs as complements of direction or possibility."},{"k":"text","t":"\"出来\" indicates a motion from inside to outside."},{"k":"text","t":"\"起来\" indicates an upward movement."},{"k":"ex","t":"我的日记本掉到沙发后面了，拿不出来了，你来帮我抬一下沙发吧。","py":"Wǒ de rìjì běndiào dào shāfā hòumiàn le, ná bù chūlái le, nǐ lái bāng wǒ tái yíxià shāfā ba.","en":"My diary has fallen behind the sofa and I can't get it out — come and help me lift the sofa."},{"k":"ex","t":"早上六点，他还睡着，电话突然响了，他连忙坐起来接电话。","py":"Zǎoshang liùdiǎn, tā hái shuìzháo, diànhuà tūrán xiǎng le, tā liánmáng zuò qǐlái jiēdiànhuà.","en":"At six in the morning he was still asleep when the phone suddenly rang; he hurriedly sat up to answer it."}]},{"title":"Extended meaning","lines":[{"k":"text","t":"\"出来\" can mean a certain action or behavior makes something come into existence or come into view."},{"k":"text","t":"\"起来\" indicates the beginning and continuation of an action."},{"k":"ex","t":"你能算出来这两个地方之间的距离是多少公里吗?","py":"Nǐ néngsuàn chūlái zhè liǎng ge dìfang zhījiān de jùlí shì duōshao gōnglǐ ma?","en":"Can you work out how many kilometres it is between these two places?"},{"k":"ex","t":"尽管现在才4月，天气已经开始慢慢热起来。","py":"Jǐnguǎn xiànzài cái sìyuè, tiānqì yǐjīng kāishǐ mànman rè qǐlái.","en":"Although it's only April, the weather has already started to get warm gradually."}]},{"title":"想出来 vs. 想起来","lines":[{"k":"text","t":"\"想出来\" means some new information has been produced after thinking."},{"k":"text","t":"\"想起来\" means some information which was forgotten has now been retrieved."},{"k":"ex","t":"有几个选择题，实在想不出来该选哪个，只好随便选一个。","py":"Yǒu jǐ ge xuǎnzetí, shízài xiǎng bù chūlái gāi xuǎn nǎge, zhǐhǎo suíbiàn xuǎn yí ge.","en":"There were a few multiple-choice questions I really couldn't work out; I had no choice but to pick one at random."},{"k":"ex","t":"我想起来了，那个唱歌的男孩子是高老师的孙子。","py":"Wǒ xiǎng qǐlái le, nàge chànggē de nánháizi shì Gāo lǎoshī de sūnzi.","en":"I remember now — the boy who sang is Teacher Gao's grandson."}]}],"drill":[["","出来","起来"],["(1) 久坐办公室的人有时间一定要站______活动活动。","×","√"],["(2) 这个主意好像是三班的一个学生想______的。","√","×"],["(3) 声音听着挺熟悉的，不过我一下子想不______了。","",""]],"core":"由里到外 vs. 由下到上；引申义不同","drill_label":"Tick or cross."}},"20":{"points":[{"n":1,"title":"V+着+V+着","structure":"V + 着 + V + 着","usage":["The two verbs in the structure \"V+着+V+着\" are the same, usually a monosyllabic one.","The structure is often followed by another verb, indicating another action occurs when the one mentioned is going on."],"examples":[{"label":"","items":[{"zh":"好，那我就放心了，别开着开着没油了。","py":"Hǎo, nà wǒ jiù fàngxīn le, bié kāizhe kāizhe méi yóu le.","en":"Good, then I can relax — just don't run out of petrol while driving."},{"zh":"她讲着讲着自己就先笑了，而大家却不明白她到底为什么笑。","py":"Tā jiǎngzhe jiǎngzhe zìjǐ jiù xiān xiào le, ér dàjiā què bù míngbai tā dàodǐ wèishénme xiào.","en":"She started laughing herself while talking, while everyone had no idea why she was laughing."},{"zh":"晚上躺在草地上看星星的感觉非常棒，有时候躺着躺着就安静地睡着了。","py":"Wǎnshang tǎng zài cǎodìshàng kàn xīngxing de gǎnjué fēicháng bàng, yǒushíhou tǎngzhe tǎngzhe jiù ānjìng de shuìzháo le.","en":"Lying on the grass at night looking at the stars feels wonderful; sometimes you drift quietly off to sleep as you lie there."}]}],"practice":{"label":"Complete the sentences.","items":["小时候的记忆总是那么美好，______ (V+着+V+着)","那天的羊肉饺子太好吃了，______ (V+着+V+着)","这篇小说写得太无聊了，______ (V+着+V+着)"]}},{"n":2,"title":"一……就……","structure":"一 + [Condition/Event 1] + 就 + [Result/Event 2]","usage":["The structure \"一……就……\" can indicate two events happening one immediately after the other. The two events may or may not share the same subject.","It can also mean \"if..., then...\", in which \"一\" is followed by a situation that indicates a condition, and \"就\" is followed by a situation that would occur under the condition. The two situations may or may not share the same subject."],"examples":[{"label":"immediate succession","items":[{"zh":"100年前，塑料一出���就受到人们的普遍欢迎。","py":"Yìbǎinián qián, sùliào yì chūxiàn jiù shòudào rénmen de pǔbiàn huānyíng.","en":"A hundred years ago, as soon as plastic appeared it was widely welcomed."},{"zh":"等女儿一回来我就告诉她这个好消息。","py":"Děng nǚ'ér yì huílái wǒ jiù gàosu tā zhège hǎo xiāoxi.","en":"I'll tell our daughter the good news as soon as she comes back."}]},{"label":"if...then...","items":[{"zh":"儿子小时候一说话就脸红，回答老师问题的时候声音也很小，我当时很为他担心。","py":"Érzi xiǎoshíhou yì shuōhuà jiù liǎnhóng, huídá lǎoshī wèntí de shíhou shēngyīn yě hěnxiǎo, wǒ dāngshí hěn wèi tā dānxīn.","en":"When my son was little he blushed as soon as he spoke, and his voice was very small when answering the teacher; I was very worried about him then."},{"zh":"妈妈一进房间，他就把手机装了起来。","py":"Māma yījìn fángjiān, tā jiù bǎ shǒujī zhuāngle qǐlái.","en":"As soon as his mother came into the room, he put his phone away."}]}],"practice":{"label":"Complete the sentences.","items":["明天我要去上海出差，______ (一……就……)","张阿姨还是不适应北方的气候，______ (一……就……)","马经理上午去开会了，______ (一……就……)"]}},{"n":3,"title":"究竟","structure":"究竟 + Question","usage":["The adverb \"究竟\" is used in an interrogative sentence or a sentence with an interrogative word to indicate inquiry and strengthen the interrogative mood.","Often used in written Chinese.","If the subject of the sentence is an interrogative pronoun, \"究竟\" can only be put before it."],"examples":[{"label":"","items":[{"zh":"究竟哪个季节去丽江旅游比较好呢?","py":"Jiūjìng nǎge jìjié qù Lìjiāng lǚyóu bǐjiào hǎo ne?","en":"Which season is actually best for travelling to Lijiang?"},{"zh":"随着科学技术的发展，很多问题已经得到解决。但有些问题我们仍然无法回答，例如，生命究竟从哪里来?","py":"Suízhe kēxuéjìshù de fāzhǎn, hěnduō wèntí yǐjīng dédào jiějué. Dàn yǒuxiē wèntí wǒmen réngrán wúfǎ huídá, lìrú, shēngmìng jiūjìng cóng nǎli lái?","en":"With the development of science and technology many problems have been solved. But there are still questions we can't answer — for example, where on earth does life come from?"},{"zh":"学习时，不仅要知道答案是什么，还要弄清楚答案究竟是怎么得来的，只有这样，才能把问题真正弄懂。","py":"Xuéxí shí, bùjǐn yào zhīdào dáàn shì shénme, háiyào nòngqīngchu dáàn jiūjìng shì zěnme delái de, zhǐyǒu zhèyàng, cáinéng bǎ wèntí zhēnzhèng nòngdǒng.","en":"When studying, you need to know not only what the answer is but also how exactly the answer was reached; only then can you truly understand the problem."}]}],"practice":{"label":"Complete the sentences.","items":["______，不同的人可能有不同的理解。(究竟)","我想试试网站上说的这个方法，______ (究竟)","最近每天来店里的顾客不超过20个，______ (究竟)"]}},{"n":4,"title":"起来","structure":"[Verb] + 起来","usage":["The verb \"起来\" can be used after another verb as a complement of direction, indicating:","An upward movement","The beginning and continuation of an action","The speaker's comment on a certain aspect of somebody or something"],"examples":[{"label":"upward","items":[{"zh":"你先把桌子上的东西拿起来，我擦完之后你再放下来。","py":"Nǐ xiān bǎ zhuōzi shang de dōngxi ná qǐlái, wǒ cā wán zhīhòu nǐ zài fàng xiàlái.","en":"First pick up the things on the table, and when I've finished wiping, put them back down."}]},{"label":"beginning & continuation","items":[{"zh":"邻居小王最近一定遇到了很多开心的事，你听，他又唱起来了。","py":"Línjū Xiǎo Wáng zuìjìn yídìng yùdàole hěnduō kāixīn de shì, nǐ tīng, tā yòu chàngqǐlái le.","en":"Neighbour Xiao Wang must have had many happy things happen recently — listen, he's singing again."}]},{"label":"comment","items":[{"zh":"比如你跟上海人对话时，会发现上海话听起来就像外语一样。","py":"Bǐrú nǐ gēn Shànghǎi rén duìhuà shí, huì fāxiàn Shànghǎi huà tīng qǐlái jiù xiàng wàiyǔ yíyàng.","en":"For example, when you talk with Shanghainese people, you'll find Shanghainese sounds like a foreign language."}]}],"practice":{"label":"Complete the sentences.","items":["我本来以为做生意很简单，______ (起来)","公园里每天都有很多老人唱京剧，______ (起来)","他的汉语语法虽然有点儿小错误，______ (起来)"]}},{"n":5,"title":"V+起","structure":"V + 起 + [Noun]","usage":["The structure \"V+起\" introduces the thing that an action involves.","The verb is usually one of the few transitive verbs \"说、谈、讲、问、提、聊、回忆\" etc.","The structure is usually followed by a noun."],"examples":[{"label":"","items":[{"zh":"说起吃的东西，给我印象最深的是湖南菜。","py":"Shuōqǐ chī de dōngxi, gěi wǒ yìnxiàng zuì shēn de shì Húnán cài.","en":"Speaking of food, what impressed me most is Hunan cuisine."},{"zh":"聊起那场网球比赛，他们俩就兴奋得停不下来了。","py":"Liáoqǐ nàchǎng wǎngqiú bǐsài, tāmen liǎ jiù xīngfèn de tíngbùxiàlái le.","en":"Once they started talking about that tennis match, the two of them got so excited they couldn't stop."},{"zh":"要是有人问起那件事，你就告诉他你还没接到通知，也不清楚怎么回事。","py":"Yàoshi yǒurén wènqǐ nàjiànshì, nǐ jiù gàosu tā nǐ hái méi jiēdào tōngzhī, yě bù qīngchu zěnmehuíshì.","en":"If anyone asks about that matter, tell him you haven't received a notice and don't know what's going on either."}]}],"practice":{"label":"Complete the sentences.","items":["______，大家总是有说不完的话。(V+起)","看着这些可爱的孩子，______ (V+起)","尽管已经过去十多年了，______ (V+起)"]}}],"compare":{"a":"究竟","b":"到底","sim":[{"title":"","lines":[{"k":"text","t":"Both can be used as adverbs in interrogative sentences or sentences with an interrogative word to indicate inquiry and strengthen the interrogative mood."},{"k":"text","t":"Both can only be put before the subject if the subject is an interrogative pronoun."},{"k":"ex","t":"无论做什么事情，只有试过才知道究竟/到底能不能成功。","py":"Wúlùn zuò shénme shìqing, zhǐyǒu shìguò cái zhīdào jiūjìng / dàodǐ néng bùnéng chénggōng.","en":"Whatever you do, only by trying will you know whether it can actually succeed."},{"k":"ex","t":"人的一生中，究竟什么是最重要的?","py":"Rén de yīshēng zhōng, jiūjìng shénme shì zuì zhòngyào de?","en":"In a person's life, what exactly is the most important thing?"}]}],"diff":[{"title":"","lines":[{"k":"text","t":"\"到底\" can be used as a verb, meaning \"till the end\"."},{"k":"text","t":"\"究竟\" has no such usage."},{"k":"ex","t":"你耐心点儿! 这个电影得看到底，才能知道那件事情的原因。","py":"Nǐ nàixīn diǎnr! Zhège diànyǐng de kàn dàodǐ, cáinéng zhīdào nàjiàn shìqing de yuányīn.","en":"Be patient! You have to watch this film to the end to know the reason for that matter."},{"k":"ex","t":"我们已经做了这么多努力了，一定要把这个计划坚持到底，现在放弃太可惜了。","py":"Wǒmen yǐjīng zuòle zhème duō nǔlì le, yídìng yào bǎ zhège jìhuà ji��nchí dàodǐ, xiànzài fàngqì tài kěxī le.","en":"We have already made so much effort; we must stick with this plan to the end — giving up now would be a pity."},{"k":"text","t":"比一比 (Compare) 总表"}]}],"drill":[["","究竟","到底"],["(1) 这场比赛太精彩了，你猜______谁能先进球?","√","√"],["(2) 她决心一定要将减肥进行______。","×","√"],["(3) 这个题我做了三遍，可每次算出来的答案都不一样，真奇怪，______是哪儿出问题了?","",""],["(4) 无论做什么事情都不会很容易就成功，只有坚持______才会有希望。","",""],["(5) 生气多是由误会引起的，因此当你觉得自己要生气的时候，最好先弄清楚______是怎么回事。","",""]],"core":"\"到底\"可做动词，表\"一直到结束\"","drill_label":"Tick or cross."}}} };

const hskTexts = { hsk4: {"1":{"cn":"简单的爱情","en":"Simple Love","texts":[{"k":1,"t":"d","lines":[{"sp":"孙月","zh":"听说你男朋友李进跟你是一个学校的，是你同学吗？","spPy":"Sūn Yuè","py":"Tīngshuō nǐ nánpéngyou Lǐ Jìn gēn nǐ shì yí ge xuéxiào de, shì nǐ tóngxué ma?"},{"sp":"王静","zh":"是的，他学的是新闻，我学的是法律，我和他不是一个班。","spPy":"Wáng Jìng","py":"Shì de, tā xué de shì xīnwén, wǒ xué de shì fǎlǜ, wǒ hé tā bú shì yí ge bān."},{"sp":"孙月","zh":"那你们俩是怎么认识的？","spPy":"Sūn Yuè","py":"Nà nǐmen liǎ shì zěnme rènshi de?"},{"sp":"王静","zh":"我们是在一次足球比赛中认识的。我们班跟他们班比赛，他一个人踢进两个球，我对他印象很深，后来就慢慢熟悉了。","spPy":"Wáng Jìng","py":"Wǒmen shì zài yí cì zúqiú bǐsài zhōng rènshi de. Wǒmen bān gēn tāmen bān bǐsài, tā yí ge rén tījìn liǎng ge qiú, wǒ duì tā yìnxiàng hěn shēn, hòulái jiù mànman shúxī le."},{"sp":"孙月","zh":"你为什么喜欢他？","spPy":"Sūn Yuè","py":"Nǐ wèi shénme xǐhuan tā?"},{"sp":"王静","zh":"他不仅足球踢得好，性格也不错。","spPy":"Wáng Jìng","py":"Tā bùjǐn zúqiú tī de hǎo, xìnggé yě búcuò."}]},{"k":2,"t":"d","lines":[{"sp":"王静","zh":"李老师，我下个月5号就要结婚了。","spPy":"Wáng Jìng","py":"Lǐ lǎoshī, wǒ xià ge yuè wǔ hào jiù yào jiéhūn le."},{"sp":"李老师","zh":"你是在开玩笑吧？你们不是才认识一个月？","spPy":"Lǐ lǎoshī","py":"Nǐ shì zài kāi wánxiào ba? Nǐmen bú shì cái rènshi yí ge yuè?"},{"sp":"王静","zh":"虽然我们认识的时间不长，但我从来没这么快乐过。","spPy":"Wáng Jìng","py":"Suīrán wǒmen rènshi de shíjiān bù cháng, dàn wǒ cónglái méi zhème kuàilè guo."},{"sp":"李老师","zh":"两个人在一起，最好能有共同的兴趣和爱好。","spPy":"Lǐ lǎoshī","py":"Liǎng ge rén zài yìqǐ, zuìhǎo néng yǒu gòngtóng de xìngqù hé àihào."},{"sp":"王静","zh":"我们有很多共同的爱好，经常一起打球、唱歌、做菜。","spPy":"Wáng Jìng","py":"Wǒmen yǒu hěn duō gòngtóng de àihào, jīngcháng yìqǐ dǎ qiú, chàng gē, zuò cài."},{"sp":"李老师","zh":"看来你真的找到适合你的人了。祝你们幸福！","spPy":"Lǐ lǎoshī","py":"Kànlái nǐ zhēn de zhǎodào shìhé nǐ de rén le. Zhù nǐmen xìngfú!"}]},{"k":3,"t":"d","lines":[{"sp":"高老师","zh":"听说您跟妻子结婚快二十年了？","spPy":"Gāo lǎoshī","py":"Tīngshuō nín gēn qīzi jiéhūn kuài èrshí nián le?"},{"sp":"李老师","zh":"到6月9号，我们就结婚二十年了。这么多年，我们的生活一直挺幸福的。","spPy":"Lǐ lǎoshī","py":"Dào liùyuè jiǔ hào, wǒmen jiù jiéhūn èrshí nián le. Zhème duō nián, wǒmen de shēnghuó yìzhí tǐng xìngfú de."},{"sp":"高老师","zh":"我和丈夫刚结婚的时候，每天都觉得很新鲜，在一起有说不完的话。但是现在……","spPy":"Gāo lǎoshī","py":"Wǒ hé zhàngfu gāng jiéhūn de shíhou, měi tiān dōu juéde hěn xīnxiān, zài yìqǐ yǒu shuō bu wán de huà. Dànshì xiànzài……"},{"sp":"李老师","zh":"两个人共同生活，只有浪漫和新鲜感是不够的。","spPy":"Lǐ lǎoshī","py":"Liǎng ge rén gòngtóng shēnghuó, zhǐyǒu làngmàn hé xīnxiāngǎn shì bú gòu de."},{"sp":"高老师","zh":"您说的对！我现在每天看到的都是他的缺点。","spPy":"Gāo lǎoshī","py":"Nín shuō de duì! Wǒ xiànzài měi tiān kàndào de dōu shì tā de quēdiǎn."},{"sp":"李老师","zh":"两个人在一起时间长了，就会有很多问题。只有接受了他的缺点，你们才能更好地一起生活。","spPy":"Lǐ lǎoshī","py":"Liǎng ge rén zài yìqǐ shíjiān cháng le, jiù huì yǒu hěn duō wèntí. Zhǐyǒu jiēshòule tā de quēdiǎn, nǐmen cái néng gèng hǎo de yìqǐ shēnghuó."}]},{"k":4,"t":"p","lines":[{"zh":"很多女孩子羡慕浪漫的爱情。那什么是浪漫呢？年轻人说：浪漫是她想要月亮时，你不会给她星星；中年人说：浪漫是即使晚上加班到零点，到家时，自己家里也还亮着灯；老年人说：浪漫其实就像歌中唱的那样，“我能想到最浪漫的事，就是和你一起慢慢变老。”其实，让我们感动的，就是生活中简单的爱情。有时候，简单就是最大的幸福。","py":"Hěn duō nǚháizi xiànmù làngmàn de àiqíng. Nà shénme shì làngmàn ne? Niánqīng rén shuō: Làngmàn shì tā xiǎng yào yuèliang shí, nǐ bú huì gěi tā xīngxing; zhōngnián rén shuō: Làngmàn shì jíshǐ wǎnshang jiā bān dào líng diǎn, dào jiā shí, zìjǐ jiā li yě hái liàngzhe dēng; lǎonián rén shuō: Làngmàn qíshí jiù xiàng gē zhōng chàng de nàyàng, “Wǒ néng xiǎngdào zuì làngmàn de shì, jiù shì hé nǐ yìqǐ mànmàn biàn lǎo.” Qíshí, ràng wǒmen gǎndòng de, jiù shì shēnghuó zhōng jiǎndān de àiqíng. Yǒu shíhou, jiǎndān jiù shì zuì dà de xìngfú."}]},{"k":5,"t":"p","lines":[{"zh":"说到结婚，人们就会很自然地想起爱情。爱情是结婚的重要原因，但两个人共同生活，不仅需要浪漫的爱情，更需要性格上互相吸引。","py":"Shuōdào jiéhūn, rénmen jiù huì hěn zìrán de xiǎngqǐ àiqíng. Àiqíng shì jiéhūn de zhòngyào yuányīn, dàn liǎng ge rén gòngtóng shēnghuó, bùjǐn xūyào làngmàn de àiqíng, gèng xūyào xìnggé shang hùxiāng xīyǐn."},{"zh":"我丈夫是个很幽默的人。即使是很普通的事情，从他嘴里说出来也会变得很有意思。在我难过的时候，他总是有办法让我高兴起来。而且他的脾气也不错，结婚快十年了，我们俩几乎没因为什么事红过脸，很多人都特别羡慕我们。","py":"Wǒ zhàngfu shì ge hěn yōumò de rén. Jíshǐ shì hěn pǔtōng de shìqing, cóng tā zuǐ li shuō chūlái yě huì biàn de hěn yǒu yìsi. Zài wǒ nánguò de shíhou, tā zǒngshì yǒu bànfǎ ràng wǒ gāoxìng qǐlái. Érqiě tā de píqi yě búcuò, jiéhūn kuài shí nián le, wǒmen liǎ jīhū méi yīnwèi shénme shì hóngguo liǎn, hěn duō rén dōu tèbié xiànmù wǒmen."}]}]},"2":{"cn":"真正的朋友","en":"A True Friend","texts":[{"k":1,"t":"d","lines":[{"sp":"小夏","zh":"来中国快一年了，你适应这儿的生活了吗？","spPy":"Xiǎo Xià","py":"Lái Zhōngguó kuài yì nián le, nǐ shìyìng zhèr de shēnghuó le ma?"},{"sp":"马克","zh":"开始有点儿不习惯，后来就慢慢适应了，最近我还交了一个中国朋友。","spPy":"Mǎkè","py":"Kāishǐ yǒudiǎnr bù xígu��n, hòulái jiù mànman shìyìng le, zuìjìn wǒ hái jiāole yí ge Zhōngguó péngyou."},{"sp":"小夏","zh":"那就好，快给我讲讲你新交的中国朋友。","spPy":"Xiǎo Xià","py":"Nà jiù hǎo, kuài gěi wǒ jiǎngjiǎng nǐ xīn jiāo de Zhōngguó péngyou."},{"sp":"马克","zh":"我们是在图书馆认识的。平时我们常常一起看书、逛街、踢足球。有时候他还给我发一些幽默短信。","spPy":"Mǎkè","py":"Wǒmen shì zài túshūguǎn rènshi de. Píngshí wǒmen chángcháng yìqǐ kàn shū, guàng jiē, tī zúqiú. Yǒu shíhou tā hái gěi wǒ fā yìxiē yōumò duǎnxìn."},{"sp":"小夏","zh":"你的这个朋友真不错！下次介绍我们认识认识，怎么样？","spPy":"Xiǎo Xià","py":"Nǐ de zhège péngyou zhēn búcuò! Xià cì jièshào wǒmen rènshi rènshi, zěnmeyàng?"},{"sp":"马克","zh":"没问题！我们下午要去踢足球，正好一起去吧。","spPy":"Mǎkè","py":"Méi wèntí! Wǒmen xiàwǔ yào qù tī zúqiú, zhènghǎo yìqǐ qù ba."}]},{"k":2,"t":"d","lines":[{"sp":"小李","zh":"星期天同学聚会，你能来吗？","spPy":"Xiǎo Lǐ","py":"Xīngqītiān tóngxué jùhuì, nǐ néng lái ma?"},{"sp":"小林","zh":"能来。班里同学你联系得怎么样了？来多少人？","spPy":"Xiǎo Lín","py":"Néng lái. Bān li tóngxué nǐ liánxì de zěnmeyàng le? Lái duōshao rén?"},{"sp":"小李","zh":"差不多一半儿吧，张远还专门从国外飞回来呢。","spPy":"Xiǎo Lǐ","py":"Chàbuduō yíbànr ba, Zhāng Yuǎn hái zhuānmén cóng guówài fēi huílái ne."},{"sp":"小林","zh":"是吗？毕业都快十年了，真想大家啊！对了，今天早上，我在地铁站遇到了王静，她毕业后就去上海工作了，她这次是来旅游的。","spPy":"Xiǎo Lín","py":"Shì ma? Bìyè dōu kuài shí nián le, zhēn xiǎng dàjiā a! Duìle, jīntiān zǎoshang, wǒ zài dìtiě zhàn yùdàole Wáng Jìng, tā bìyè hòu jiù qù Shànghǎi gōngzuò le, tā zhè cì shì lái lǚyóu de."},{"sp":"小李","zh":"那太好了！麻烦你跟她联系一下，请她一起来参加同学聚会。聚会就在学校门口那个饭店，六点半。别迟到啊！","spPy":"Xiǎo Lǐ","py":"Nà tài hǎo le! Máfan nǐ gēn tā liánxì yíxià, qǐng tā yìqǐ lái cānjiā tóngxué jùhuì. Jùhuì jiù zài xuéxiào ménkǒu nàge fàndiàn, liù diǎn bàn. Bié chídào a!"},{"sp":"小林","zh":"放心吧。星期天六点半见！","spPy":"Xiǎo Lín","py":"Fàngxīn ba. Xīngqītiān liù diǎn bàn jiàn!"}]},{"k":3,"t":"d","lines":[{"sp":"孙月","zh":"这是什么时候的照片？你真年轻！","spPy":"Sūn Yuè","py":"Zhè shì shénme shíhou de zhàopiàn? Nǐ zhēn niánqīng!"},{"sp":"王静","zh":"这是上大学时的照片。一看到这张照片，我就想起过去那段快乐的日子，好像重新回到了校园。","spPy":"Wáng Jìng","py":"Zhè shì shàng dàxué shí de zhàopiàn. Yí kàndào zhè zhāng zhàopiàn, wǒ jiù xiǎngqǐ guòqù nà duàn kuàilè de rìzi, hǎoxiàng chóngxīn huídàole xiàoyuán."},{"sp":"孙月","zh":"旁边这个人一定是你的好朋友吧？你们现在还联系吗？","spPy":"Sūn Yuè","py":"Pángbiān zhège rén yídìng shì nǐ de hǎo péngyou ba? Nǐmen xiànzài hái liánxì ma?"},{"sp":"王静","zh":"当然了，尽管已经毕业这么多年，我们还是经常联系的，每次都有说不完的话。","spPy":"Wáng Jìng","py":"Dāngrán le, jǐnguǎn yǐjīng bìyè zhème duō nián, wǒmen háishì jīngcháng liánxì de, měi cì dōu yǒu shuō bu wán de huà."},{"sp":"孙月","zh":"真羡慕你！我上大学时最好的朋友去了南方工作，我们俩已经好久没联系了。我一会儿就给她打个电话。","spPy":"Sūn Yuè","py":"Zhēn xiànmù nǐ! Wǒ shàng dàxué shí zuì hǎo de péngyou qùle nánfāng gōngzuò, wǒmen liǎ yǐjīng hǎojiǔ méi liánxì le. Wǒ yíhuìr jiù gěi tā dǎ ge diànhuà."},{"sp":"王静","zh":"对。要知道，能有一个真正的朋友，有一段真正的友谊，是多么不容易！","spPy":"Wáng Jìng","py":"Duì. Yào zhīdào, néng yǒu yí ge zhēnzhèng de péngyou, yǒu yí duàn zhēnzhèng de yǒuyì, shì duōme bù róngyì!"}]},{"k":4,"t":"p","lines":[{"zh":"每个人都需要朋友，朋友可以丰富我们的生活。离开朋友，我们的生活一定会非常无聊。那么，怎样才能交到更多的朋友呢？当然，要有好脾气。一个脾气不好的人虽然不一定让人讨厌，但是却很难跟人交朋友。因为没有人会喜欢跟一个总是容易生气的人在一起。我们还要经常跟周围的人交流。交流能让人们互相了解，如果有共同的兴趣、爱好或者习惯，就更容易成为朋友了。","py":"Měi ge rén dōu xūyào péngyou, péngyou kěyǐ fēngfù wǒmen de shēnghuó. Líkāi péngyou, wǒmen de shēnghuó yídìng huì fēicháng wúliáo. Nàme, zěnyàng cái néng jiāodào gèng duō de péngyou ne? Dāngrán, yào yǒu hǎo píqi. Yí ge píqi bù hǎo de rén suīrán bù yídìng ràng rén tǎoyàn, dànshì què hěn nán gēn rén jiāo péngyou. Yīnwèi méiyǒu rén huì xǐhuan gēn yí ge zǒngshì róngyì shēngqì de rén zài yìqǐ. Wǒmen hái yào jīngcháng gēn zhōuwéi de rén jiāoliú. Jiāoliú néng ràng rénmen hùxiāng liǎojiě, rúguǒ yǒu gòngtóng de xìngqù, àihào huòzhě xíguàn, jiù gèng róngyì chéngwéi péngyou le."}]},{"k":5,"t":"p","lines":[{"zh":"人的一生可以什么也没有，但不能没有朋友，而且必须要有自己真正的朋友。什么是真正的朋友？不同的人会有不同的理解。有些人觉得朋友就是能和自己一起快乐的人；有些人觉得朋友应该像镜子，能帮自己看到缺点。而我的理解是：当你遇到困难的时候，真正的朋友会站出来，及时给你帮助；当你无聊或者难过的时候，真正的朋友会陪在你身边，想办法让你感到幸福。","py":"Rén de yìshēng kěyǐ shénme yě méiyǒu, dàn bù néng méiyǒu péngyou, érqiě bìxū yào yǒu zìjǐ zhēnzhèng de péngyou. Shénme shì zhēnzhèng de péngyou? Bù tóng de rén huì yǒu bù tóng de lǐjiě. Yǒuxiē rén juéde péngyou jiù shì néng hé zìjǐ yìqǐ kuàilè de rén; yǒuxiē rén juéde péngyou yīnggāi xiàng jìngzi, néng bāng zìjǐ kàndào quēdiǎn. Ér wǒ de lǐjiě shì: Dāng nǐ yùdào kùnnan de shíhou, zhēnzhèng de péngyou huì zhàn chūlái, jíshí gěi nǐ bāngzhù; dāng nǐ wúliáo huòzhě nánguò de shíhou, zhēnzhèng de péngyou huì péi zài nǐ shēnbiān, xiǎng bànfǎ ràng nǐ gǎndào xìngfú."}]}]},"3":{"cn":"经理对我印象不错","en":"I've Made a Good Impression on the Manager","texts":[{"k":1,"t":"d","lines":[{"sp":"小夏","zh":"你上午的面试怎么样？","spPy":"Xiǎo Xià","py":"Nǐ shàngwǔ de miànshì zěnmeyàng?"},{"sp":"小雨","zh":"还可以，他们问的问题都挺容易的，就是我有点儿紧张。","spPy":"Xiǎoyǔ","py":"Hái kěyǐ, tāmen wèn de wèntí dōu tǐng róngyì de, jiù shì wǒ yǒudiǎnr jǐnzhāng."},{"sp":"小夏","zh":"面试的时候，一定要对自己有信心，要相信自己的能力。","spPy":"Xiǎo Xià","py":"Miànshì de shíhou, yídìng yào duì zìjǐ yǒu xìnxīn, yào xiāngxìn zìjǐ de nénglì."},{"sp":"小雨","zh":"你说的对！3月15号上午8点在学校体育馆还有一个招聘会，你去吗？","spPy":"Xiǎoyǔ","py":"Nǐ shuō de duì! Sānyuè shíwǔ hào shàngwǔ bā diǎn zài xuéxiào tǐyùguǎn hái yǒu yí ge zhāopìnhuì, nǐ qù ma?"},{"sp":"小夏","zh":"我还没决定呢。","spPy":"Xiǎo Xià","py":"Wǒ hái méi juédìng ne."},{"sp":"小雨","zh":"听说这次招聘会提供的工作机会很多，我们一起去看看吧。","spPy":"Xiǎoyǔ","py":"Tīngshuō zhè cì zhāopìnhuì tígōng de gōngzuò jīhuì hěn duō, wǒmen yìqǐ qù kànkan ba."}]},{"k":2,"t":"d","lines":[{"sp":"马经理","zh":"小林，这次招聘不是小李负责吗？","spPy":"Mǎ jīnglǐ","py":"Xiǎo Lín, zhè cì zhāopìn bú shì Xiǎo Lǐ fùzé ma?"},{"sp":"小林","zh":"本来是小李负责的，但是他突然生病住院了，所以就交给我来做了。","spPy":"Xiǎo Lín","py":"Běnlái shì Xiǎo Lǐ fùzé de, dànshì tā tūrán shēngbìng zhùyuàn le, suǒyǐ jiù jiāogěi wǒ lái zuò le."},{"sp":"马经理","zh":"哦，这次应聘的人多吗？","spPy":"Mǎ jīnglǐ","py":"Ó, zhè cì yìngpìn de rén duō ma?"},{"sp":"小林","zh":"经理，这次来应聘的一共有15人。经过笔试和面试，有两个不错。这是他们的材料，您看看。","spPy":"Xiǎo Lín","py":"Jīnglǐ, zhè cì lái yìngpìn de yígòng yǒu shíwǔ rén. Jīngguò bǐshì hé miànshì, yǒu liǎng ge búcuò. Zhè shì tāmen de cáiliào, nín kànkan."},{"sp":"马经理","zh":"这两个人的能力都比较符合我们的要求。你通知他们下周一上午九点来我办公室吧。","spPy":"Mǎ jīnglǐ","py":"Zhè liǎng ge rén de nénglì dōu bǐjiào fúhé wǒmen de yāoqiú. Nǐ tōngzhī tāmen xià zhōuyī shàngwǔ jiǔ diǎn lái wǒ bàngōngshì ba."},{"sp":"小林","zh":"好的，那我马上跟他们联系。","spPy":"Xiǎo Lín","py":"Hǎo de, nà wǒ mǎshàng gēn tāmen liánxì."}]},{"k":3,"t":"d","lines":[{"sp":"小林","zh":"王静，好久不见了！大学毕业后就没联系了，你现在在哪儿工作呢？","spPy":"Xiǎo Lín","py":"Wáng Jìng, hǎojiǔ bú jiàn le! Dàxué bìyè hòu jiù méi liánxì le, nǐ xiànzài zài nǎr gōngzuò ne?"},{"sp":"王静","zh":"我一毕业就去上海当律师了。","spPy":"Wáng Jìng","py":"Wǒ yí bìyè jiù qù Shànghǎi dāng lǜshī le."},{"sp":"小林","zh":"你对现在的工作一定非常满意吧？","spPy":"Xiǎo Lín","py":"Nǐ duì xiànzài de gōngzuò yídìng fēicháng mǎnyì ba?"},{"sp":"王静","zh":"我很喜欢现在的工作，因为我学的就是法律专业，而且同事们都很喜欢我。另外，收入也不错。","spPy":"Wáng Jìng","py":"Wǒ hěn xǐhuan xiànzài de gōngzuò, yīnwèi wǒ xué de jiù shì fǎlǜ zhuānyè, érqiě tóngshìmen dōu hěn xǐhuan wǒ. Lìngwài, shōurù yě búcuò."},{"sp":"小林","zh":"星期天咱们同学聚会，你能来参加吗？","spPy":"Xiǎo Lín","py":"Xīngqītiān zánmen tóngxué jùhuì, nǐ néng lái cānjiā ma?"},{"sp":"王静","zh":"能来。虽然这次来北京，时间安排得很紧张，但我一定借这次机会去跟大家见见面。","spPy":"Wáng Jìng","py":"Néng lái. Suīrán zhè cì lái Běijīng, shíjiān ānpái de hěn jǐnzhāng, dàn wǒ yídìng jiè zhè cì jīhuì qù gēn dàjiā jiànjian miàn."}]},{"k":4,"t":"p","lines":[{"zh":"面试的时候，经理对我印象不错，还通知我明天就可以上班了。真没想到，找工作这么顺利。你想知道面试需要注意什么吗？首先，要穿正式的衣服，这会给面试者留下一个好的印象，让他觉得你是一个认真的人。其次，应聘时不要紧张。回答问题时，说得不要太快，声音也不要太小，要相信自己有能力做好。当然，最重要的是回答问题要诚实。","py":"Miànshì de shíhou, jīnglǐ duì wǒ yìnxiàng búcuò, hái tōngzhī wǒ míngtiān jiù kěyǐ shàngbān le. Zhēn méi xiǎngdào, zhǎo gōngzuò zhème shùnlì. Nǐ xiǎng zhīdào miànshì xūyào zhùyì shénme ma? Shǒuxiān, yào chuān zhèngshì de yīfu, zhè huì gěi miànshìzhě liúxià yí ge hǎo de yìnxiàng, ràng tā juéde nǐ shì yí ge rènzhēn de rén. Qícì, yìngpìn shí búyào jǐnzhāng. Huídá wèntí shí, shuō de búyào tài kuài, shēngyīn yě búyào tài xiǎo, yào xiāngxìn zìjǐ yǒu nénglì zuòhǎo. Dāngrán, zuì zhòngyào de shì huídá wèntí yào chéngshí."}]},{"k":5,"t":"p","lines":[{"zh":"第一印象就是在第一次见面时给别人留下的印象。虽然第一印象不总是对的，但如果想改变却很困难。你给别人的第一印象会影响他们以后对你的感觉和判断。所以，给第一次见面的同事留下好的印象，以后的工作可能会更顺利；给第一次见面的顾客留下好的印象，你可能会卖出更多的东西。但是，如果第一次见面给别人留下像不准时这样的坏印象，那么以后就很难让别人相信你。所以不管是上课、上班，还是与别人约会，准时都非常重要。","py":"Dì-yī yìnxiàng jiù shì zài dì-yī cì jiànmiàn shí gěi biérén liúxià de yìnxiàng. Suīrán dì-yī yìnxiàng bù zǒngshì duì de, dàn rúguǒ xiǎng gǎibiàn què hěn kùnnan. Nǐ gěi biérén de dì-yī yìnxiàng huì yǐngxiǎng tāmen yǐhòu duì nǐ de gǎnjué hé pànduàn. Suǒyǐ, gěi dì-yī cì jiànmiàn de tóngshì liúxià hǎo de yìnxiàng, yǐhòu de gōngzuò kěnéng huì gèng shùnlì; gěi dì-yī cì jiànmiàn de gùkè liúxià hǎo de yìnxiàng, nǐ kěnéng huì màichū gèng duō de dōngxi. Dànshì, rúguǒ dì-yī cì jiànmiàn gěi biérén liúxià xiàng bù zhǔnshí zhèyàng de huài yìnxiàng, nàme yǐhòu jiù hěn nán ràng biérén xiāngxìn nǐ. Suǒyǐ bùguǎn shì shàngkè, shàngbān, háishì yǔ biérén yuēhuì, zhǔnshí dōu fēicháng zhòngyào."}]}]},"4":{"cn":"不要太着急赚钱","en":"Don't Be Anxious to Make Money","texts":[{"k":1,"t":"d","lines":[{"sp":"小林","zh":"听说你又换工作了？今年已经换了三次工作了吧？","spPy":"Xiǎo Lín","py":"Tīngshuō nǐ yòu huàn gōngzuò le? Jīnnián yǐjīng huànle sān cì gōngzuò le ba?"},{"sp":"小李","zh":"别提了！我以为新工作比以前的好，没想到还没有以前好呢。","spPy":"Xiǎo Lǐ","py":"Biétí le! Wǒ yǐwéi xīn gōngzuò bǐ yǐqián de hǎo, méi xiǎngdào hái méiyǒu yǐqián hǎo ne."},{"sp":"小林","zh":"上次那份工作你只做了两个月就离开了，其实，完全适应一个新的工作需要一年时间，所以，经常换工作不一定好。","spPy":"Xiǎo Lín","py":"Shàng cì nà fèn gōngzuò nǐ zhǐ zuòle liǎng ge yuè jiù líkāi le, qíshí, wánquán shìyìng yí ge xīn de gōngzuò xūyào yì nián shíjiān, suǒyǐ, jīngcháng huàn gōngzuò bù yídìng hǎo."},{"sp":"小李","zh":"我也明白。但是那份工作的收入太少了！","spPy":"Xiǎo Lǐ","py":"Wǒ yě míngbai. Dànshì nà fèn gōngzuò de shōurù tài shǎo le!"},{"sp":"小林","zh":"你才到新公司，不要太急着赚钱，多学习才是最重要的。","spPy":"Xiǎo Lín","py":"Nǐ cái dào xīn gōngsī, búyào tài jízhe zhuànqián, duō xuéxí cái shì zuì zhòngyào de."},{"sp":"小李","zh":"好。我一定会努力把现在这份工作做好。","spPy":"Xiǎo Lǐ","py":"Hǎo. Wǒ yídìng huì nǔlì bǎ xiànzài zhè fèn gōngzuò zuòhǎo."}]},{"k":2,"t":"d","lines":[{"sp":"王经理","zh":"那份调查还要多长时间才能做完？","spPy":"Wáng jīnglǐ","py":"Nà fèn diàochá hái yào duō cháng shíjiān cái néng zuòwán?"},{"sp":"小李","zh":"按原来的计划应该是两周，但是我们可以提前完成，周末保证做完。","spPy":"Xiǎo Lǐ","py":"Àn yuánlái de jìhuà yīnggāi shì liǎng zhōu, dànshì wǒmen kěyǐ tíqián wánchéng, zhōumò bǎozhèng zuòwán."},{"sp":"王经理","zh":"虽然最近工作很忙，但你们也要注意身体啊。","spPy":"Wáng jīnglǐ","py":"Suīrán zuìjìn gōngzuò hěn máng, dàn nǐmen yě yào zhùyì shēntǐ a."},{"sp":"小李","zh":"谢谢您！现在有很多事情等着我做，真不知道该先做哪个好。","spPy":"Xiǎo Lǐ","py":"Xièxie nín! Xiànzài yǒu hěn duō shìqing děngzhe wǒ zuò, zhēn bù zhīdào gāi xiān zuò nǎge hǎo."},{"sp":"王经理","zh":"每天早上我都把当天计划要做的事情写在笔记本上，提醒自己安排好时间。你也可以试试这样做。","spPy":"Wáng jīnglǐ","py":"Měi tiān zǎoshang wǒ dōu bǎ dàngtiān jìhuà yào zuò de shìqing xiě zài bǐjìběn shang, tíxǐng zìjǐ ānpái hǎo shíjiān. Nǐ yě kěyǐ shìshi zhèyàng zuò."},{"sp":"小李","zh":"这个办法真不错！这样我就不会手忙脚乱了。","spPy":"Xiǎo Lǐ","py":"Zhège bànfǎ zhēn búcuò! Zhèyàng wǒ jiù bú huì shǒumáng-jiǎoluàn le."}]},{"k":3,"t":"d","lines":[{"sp":"王经理","zh":"什么事让你这么高兴啊？","spPy":"Wáng jīnglǐ","py":"Shénme shì ràng nǐ zhème gāoxìng a?"},{"sp":"马经理","zh":"我们和上次那个公司的生意终于谈成了。","spPy":"Mǎ jīnglǐ","py":"Wǒmen hé shàng cì nàge gōngsī de shēngyi zhōngyú tánchéng le."},{"sp":"王经理","zh":"太好了！你工作那么努力，公司会越来越好的。","spPy":"Wáng jīnglǐ","py":"Tài hǎo le! Nǐ gōngzuò nàme nǔlì, gōngsī huì yuè lái yuè hǎo de."},{"sp":"马经理","zh":"我原来以为做生意很简单，后来才发现其实并不容易，现在赚钱越来越难了。","spPy":"Mǎ jīnglǐ","py":"Wǒ yuánlái yǐwéi zuò shēngyi hěn jiǎndān, hòulái cái fāxiàn qíshí bìng bù róngyì, xiànzài zhuànqián yuè lái yuè nán le."},{"sp":"王经理","zh":"慢慢来，万事开头难，重要的是要多积累经验。","spPy":"Wáng jīnglǐ","py":"Mànmàn lái, wànshì kāitóu nán, zhòngyào de shì yào duō jīlěi jīngyàn."},{"sp":"马经理","zh":"我相信经过我们大家的努力，公司的生意会越做越大，一切都会好的。","spPy":"Mǎ jīnglǐ","py":"Wǒ xiāngxìn jīngguò wǒmen dàjiā de nǔlì, gōngsī de shēngyi huì yuè zuò yuè dà, yíqiè dōu huì hǎo de."}]},{"k":4,"t":"p","lines":[{"zh":"我们今年的工作都已经按照计划完成了。这一段时间，尽管工作很紧张，中间也遇到了很多困难，但是因为有大家的努力，我们成功地解决了问题，顺利地完成了工作，非常感谢大家对我的帮助！另外，马经理让我告诉大家一个好消息，因为大家按时完成了工作，公司决定这个月给每人多发三千元奖金。感谢大家这三个多月的努力工作，希望明年能有更大的成绩！","py":"Wǒmen jīnnián de gōngzuò dōu yǐjīng ànzhào jìhuà wánchéng le. Zhè yí duàn shíjiān, jǐnguǎn gōngzuò hěn jǐnzhāng, zhōngjiān yě yùdàole hěn duō kùnnan, dànshì yīnwèi yǒu dàjiā de nǔlì, wǒmen chénggōng de jiějuéle wèntí, shùnlì de wánchéngle gōngzuò, fēicháng gǎnxiè dàjiā duì wǒ de bāngzhù! Lìngwài, Mǎ jīnglǐ ràng wǒ gàosu dàjiā yí ge hǎo xiāoxi, yīnwèi dàjiā ànshí wánchéngle gōngzuò, gōngsī juédìng zhège yuè gěi měi rén duō fā sānqiān yuán jiǎngjīn. Gǎnxiè dàjiā zhè sān ge duō yuè de nǔlì gōngzuò, xīwàng míngnián néng yǒu gèng dà de chéngjì!"}]},{"k":5,"t":"p","lines":[{"zh":"年轻人刚开始工作的时候，不要太急着赚钱，不要眼睛里只有工资和奖金。在工作的前几年，重要的是丰富自己的工作经验，学习与���事交流的方法，积累专业知识，这些比收入重要多了。但是很多时候，我们不得不去做一些自己不愿意做甚至是非常不喜欢的工作。这时，我们最需要的就是对工作的责任心。一个人即使能力再高，经验再丰富，如果对工作没有责任心，也很难把工作做好。","py":"Niánqīng rén gāng kāishǐ gōngzuò de shíhou, búyào tài jízhe zhuànqián, búyào yǎnjing li zhǐyǒu gōngzī hé jiǎngjīn. Zài gōngzuò de qián jǐ nián, zhòngyào de shì fēngfù zìjǐ de gōngzuò jīngyàn, xuéxí yǔ tóngshì jiāoliú de fāngfǎ, jīlěi zhuānyè zhīshi, zhèxiē bǐ shōurù zhòngyào duō le. Dànshì hěn duō shíhou, wǒmen bùdébù qù zuò yìxiē zìjǐ bú yuànyì zuò shènzhì shì fēicháng bù xǐhuan de gōngzuò. Zhè shí, wǒmen zuì xūyào de jiù shì duì gōngzuò de zérènxīn. Yí ge rén jíshǐ nénglì zài gāo, jīngyàn zài fēngfù, rúguǒ duì gōngzuò méiyǒu zérènxīn, yě hěn nán bǎ gōngzuò zuòhǎo."}]}]},"5":{"cn":"只买对的，不买贵的","en":"Buy the Right, Not the Expensive","texts":[{"k":1,"t":"d","lines":[{"sp":"售货员","zh":"小姐，您好！您想买什么家具？需要我为您介绍一下吗？","spPy":"Shòuhuòyuán","py":"Xiǎojiě, nín hǎo! Nín xiǎng mǎi shénme jiājù? Xūyào wǒ wèi nín jièshào yíxià ma?"},{"sp":"王静","zh":"谢谢，我想买沙发。","spPy":"Wáng Jìng","py":"Xièxie, wǒ xiǎng mǎi shāfā."},{"sp":"售货员","zh":"您看这个沙发怎么样？现在正在打折，比平时便宜了一千块。","spPy":"Shòuhuòyuán","py":"Nín kàn zhège shāfā zěnmeyàng? Xiànzài zhèngzài dǎzhé, bǐ píngshí piányile yìqiān kuài."},{"sp":"王静","zh":"价格还可以，就是不知道质量有没有保证。","spPy":"Wáng Jìng","py":"Jiàgé hái kěyǐ, jiù shì bù zhīdào zhìliàng yǒu méiyǒu bǎozhèng."},{"sp":"售货员","zh":"您放心，质量肯定不“打折”，这种沙发是今年最流行的。有很多种颜色可以选择，您可以看一下。","spPy":"Shòuhuòyuán","py":"Nín fàngxīn, zhìliàng kěndìng bù “dǎzhé”, zhè zhǒng shāfā shì jīnnián zuì liúxíng de. Yǒu hěn duō zhǒng yánsè kěyǐ xuǎnzé, nín kěyǐ kàn yíxià."},{"sp":"王静","zh":"这个蓝色的看上去不错，就要这个吧。","spPy":"Wáng Jìng","py":"Zhège lánsè de kàn shàngqù búcuò, jiù yào zhège ba."}]},{"k":2,"t":"d","lines":[{"sp":"王静","zh":"咱家的冰箱太旧了，商场正好打折，我们顺便也买一台吧。","spPy":"Wáng Jìng","py":"Zán jiā de bīngxiāng tài jiù le, shāngchǎng zhènghǎo dǎzhé, wǒmen shùnbiàn yě mǎi yì tái ba."},{"sp":"李进","zh":"今天买的东西太多了。再说，这个月家里已经花了五千多了。","spPy":"Lǐ Jìn","py":"Jīntiān mǎi de dōngxi tài duō le. Zàishuō, zhège yuè jiā li yǐjīng huāle wǔqiān duō le."},{"sp":"王静","zh":"这么多？你不会是记错了吧？","spPy":"Wáng Jìng","py":"Zhème duō? Nǐ bú huì shì jìcuò le ba?"},{"sp":"李进","zh":"没错。上个星期光买沙发就花了两千多。","spPy":"Lǐ Jìn","py":"Méi cuò. Shàng ge xīngqī guāng mǎi shāfā jiù huāle liǎngqiān duō."},{"sp":"王静","zh":"但是咱家的冰箱实在太旧了，制冷效果也不太好了，还是买个新的吧。","spPy":"Wáng Jìng","py":"Dànshì zán jiā de bīngxiāng shízài tài jiù le, zhìlěng xiàoguǒ yě bú tài hǎo le, háishì mǎi ge xīn de ba."},{"sp":"李进","zh":"那好吧，我带的现金不够，用你的信用卡吧。","spPy":"Lǐ Jìn","py":"Nà hǎo ba, wǒ dài de xiànjīn bú gòu, yòng nǐ de xìnyòngkǎ ba."}]},{"k":3,"t":"d","lines":[{"sp":"李进","zh":"李老师邀请咱们去他家做客，给他带点儿什么礼物好呢？","spPy":"Lǐ Jìn","py":"Lǐ lǎoshī yāoqǐng zánmen qù tā jiā zuòkè, gěi tā dài diǎnr shénme lǐwù hǎo ne?"},{"sp":"王静","zh":"他很喜欢葡萄酒，我们就给他买两瓶葡萄酒吧。","spPy":"Wáng Jìng","py":"Tā hěn xǐhuan pútaojiǔ, wǒmen jiù gěi tā mǎi liǎng píng pútaojiǔ ba."},{"sp":"李进","zh":"可是这里有这么多种，你知道哪种好吗？","spPy":"Lǐ Jìn","py":"Kěshì zhèli yǒu zhème duō zhǒng, nǐ zhīdào nǎ zhǒng hǎo ma?"},{"sp":"王静","zh":"我觉得这种不错，你看它酒瓶做得都这么艺术。而且电视上经常有它的广告，我想味道应该不错。","spPy":"Wáng Jìng","py":"Wǒ juéde zhè zhǒng búcuò, nǐ kàn tā jiǔpíng zuò de dōu zhème yìshù. Érqiě diànshì shang jīngcháng yǒu tā de guǎnggào, wǒ xiǎng wèidào yīnggāi búcuò."},{"sp":"李进","zh":"广告只会介绍优点，却不会说它的缺点。实际上，很多东西并不像广告上说的那么好，所以不能完全相信广告。","spPy":"Lǐ Jìn","py":"Guǎnggào zhǐ huì jièshào yōudiǎn, què bú huì shuō tā de quēdiǎn. Shíjì shang, hěn duō dōngxi bìng bú xiàng guǎnggào shang shuō de nàme hǎo, suǒyǐ bù néng wánquán xiāngxìn guǎnggào."},{"sp":"王静","zh":"你说的也对。","spPy":"Wáng Jìng","py":"Nǐ shuō de yě duì."}]},{"k":4,"t":"p","lines":[{"zh":"买衣服只考虑价格当然不好，但是只考虑买好看的也不一定对。我买衣服的标准是“只买对的，不买贵的”。第一，自己穿着舒服；第二，衣服的质量要好，而且又不能太贵。对我来说，衣服的样子流行不流行并不是很重要。很多年龄大的人喜欢在打折的时候买便宜的衣服，但对那些衣服是不是适合自己却考虑得不多。这点是我理解不了的，因为如果不适合自己，即使花钱很少，也是一种浪费。","py":"Mǎi yīfu zhǐ kǎolǜ jiàgé dāngrán bù hǎo, dànshì zhǐ kǎolǜ mǎi hǎokàn de yě bù yídìng duì. Wǒ mǎi yīfu de biāozhǔn shì “zhǐ mǎi duì de, bù mǎi guì de”. Dì-yī, zìjǐ chuānzhe shūfu; dì-èr, yīfu de zhìliàng yào hǎo, érqiě yòu bù néng tài guì. Duì wǒ lái shuō, yīfu de yàngzi liúxíng bù liúxíng bìng bú shì hěn zhòngyào. Hěn duō niánlíng dà de rén xǐhuan zài dǎzhé de shíhou mǎi piányi de yīfu, dàn duì nàxiē yīfu shì bú shì shìhé zìjǐ què kǎolǜ de bù duō. Zhè diǎn shì wǒ lǐjiě bù liǎo de, yīnwèi rúguǒ bú shìhé zìjǐ, jíshǐ huā qián hěn shǎo, yě shì yì zhǒng làngfèi."}]},{"k":5,"t":"p","lines":[{"zh":"现在网上购物变得越来越流行了，年轻人尤其喜欢在网上买东西。在网上几乎什么都可以买到，你可以上网买书、买衣服、买包，还可以买家具、买手机。网上购物能够受到人们的喜爱，原因主要有两个：首先，网上的东西很多，而且比去商店买便宜，这是吸引人们购买的主要原因。其次，人们可以在任何时间上网购买自己喜欢的东西，卖家可以把你买的东西寄到你办公室或者家里，非常方便。","py":"Xiànzài wǎngshang gòuwù biàn de yuè lái yuè liúxíng le, niánqīng rén yóuqí xǐhuan zài wǎngshang mǎi dōngxi. Zài wǎngshang jīhū shénme dōu kěyǐ mǎidào, nǐ kěyǐ shàngwǎng mǎi shū, mǎi yīfu, mǎi bāo, hái kěyǐ mǎi jiājù, mǎi shǒujī. Wǎngshang gòuwù nénggòu shòudào rénmen de xǐ'ài, yuányīn zhǔyào yǒu liǎng ge: Shǒuxiān, wǎngshang de dōngxi hěn duō, érqiě bǐ qù shāngdiàn mǎi piányi, zhè shì xīyǐn rénmen gòumǎi de zhǔyào yuányīn. Qícì, rénmen kěyǐ zài rènhé shíjiān shàngwǎng gòumǎi zìjǐ xǐhuan de dōngxi, màijiā kěyǐ bǎ nǐ mǎi de dōngxi jì dào nǐ bàngōngshì huòzhě jiā li, fēicháng fāngbiàn."}]}]},"6":{"cn":"一分钱一分货","en":"The Higher the Price, the Better the Quality","texts":[{"k":1,"t":"d","lines":[{"sp":"张远","zh":"昨天晚上我给你打电话一直没人接，你忙什么呢？","spPy":"Zhāng Yuǎn","py":"Zuótiān wǎnshang wǒ gěi nǐ dǎ diànhuà yìzhí méi rén jiē, nǐ máng shénme ne?"},{"sp":"李进","zh":"昨天妻子让我陪她去超市买果汁。我把手机忘在家里了。","spPy":"Lǐ Jìn","py":"Zuótiān qīzi ràng wǒ péi tā qù chāoshì mǎi guǒzhī. Wǒ bǎ shǒujī wàng zài jiā li le."},{"sp":"张远","zh":"买这么点儿东西也用不了那么长时间啊！","spPy":"Zhāng Yuǎn","py":"Mǎi zhème diǎnr dōngxi yě yòng bu liǎo nàme cháng shíjiān a!"},{"sp":"李进","zh":"我们先去逛了会儿商场。一进门，售货员就热情地为我们介绍这、介绍那，她买了一条裤子、一件衬衫、两双袜子，然后我们就高高兴兴地回家了。","spPy":"Lǐ Jìn","py":"Wǒmen xiān qù guàngle huìr shāngchǎng. Yí jìn mén, shòuhuòyuán jiù rèqíng de wèi wǒmen jièshào zhè, jièshào nà, tā mǎile yì tiáo kùzi, yí jiàn chènshān, liǎng shuāng wàzi, ránhòu wǒmen jiù gāogāoxìngxìng de huí jiā le."},{"sp":"张远","zh":"买东西时我只看自己想买的，而且喜欢自己看、自己选，不希望被别人打扰。","spPy":"Zhāng Yuǎn","py":"Mǎi dōngxi shí wǒ zhǐ kàn zìjǐ xiǎng mǎi de, érqiě xǐhuan zìjǐ kàn, zìjǐ xuǎn, bù xīwàng bèi biérén dǎrǎo."},{"sp":"李进","zh":"是啊！回家以后，我才发现，竟然忘了去商场的超市买果汁！","spPy":"Lǐ Jìn","py":"Shì a! Huí jiā yǐhòu, wǒ cái fāxiàn, jìngrán wàngle qù shāngchǎng de chāoshì mǎi guǒzhī!"}]},{"k":2,"t":"d","lines":[{"sp":"王静","zh":"西红柿新鲜吗？怎么卖？","spPy":"Wáng Jìng","py":"Xīhóngshì xīnxiān ma? Zěnme mài?"},{"sp":"售货员","zh":"七块钱一斤，您放心，保证百分之百新鲜。","spPy":"Shòuhuòyuán","py":"Qī kuài qián yì jīn, nín fàngxīn, bǎozhèng bǎifēnzhībǎi xīnxiān."},{"sp":"王静","zh":"怎么这么贵啊！我记得昨天才三块五一斤，今天的价格是昨天的两倍。","spPy":"Wáng Jìng","py":"Zěnme zhème guì a! Wǒ jìde zuótiān cái sān kuài wǔ yì jīn, jīntiān de jiàgé shì zuótiān de liǎng bèi."},{"sp":"售货员","zh":"您问的这种是“绿色”的。一分钱一分货。每天吃一两个这种新鲜的西红柿，对皮肤有好处。","spPy":"Shòuhuòyuán","py":"Nín wèn de zhè zhǒng shì “lǜsè” de. Yì fēn qián yì fēn huò. Měi tiān chī yì liǎng ge zhè zhǒng xīnxiān de xīhóngshì, duì pífū yǒu hǎochu."},{"sp":"王静","zh":"好，那我先买几个尝尝。","spPy":"Wáng Jìng","py":"Hǎo, nà wǒ xiān mǎi jǐ ge chángchang."},{"sp":"售货员","zh":"好的，给您西红柿，一共两斤，十四块。","spPy":"Shòuhuòyuán","py":"Hǎo de, gěi nín xīhóngshì, yígòng liǎng jīn, shísì kuài."}]},{"k":3,"t":"d","lines":[{"sp":"售货员","zh":"先生，我们店的行李箱都在这里，请问您要什么样的？","spPy":"Shòuhuòyuán","py":"Xiānsheng, wǒmen diàn de xínglixiāng dōu zài zhèli, qǐngwèn nín yào shénme yàng de?"},{"sp":"李进","zh":"我想买一个轻一点儿的。","spPy":"Lǐ Jìn","py":"Wǒ xiǎng mǎi yí ge qīng yìdiǎnr de."},{"sp":"售货员","zh":"您看看这个，不管从价格方面看，还是从质量上看，都是值得考虑的。","spPy":"Shòuhuòyuán","py":"Nín kànkan zhège, bùguǎn cóng jiàgé fāngmiàn kàn, háishì cóng zhìliàng shang kàn, dōu shì zhídé kǎolǜ de."},{"sp":"李进","zh":"质量是不错。请问这个多少钱？","spPy":"Lǐ Jìn","py":"Zhìliàng shì búcuò. Qǐngwèn zhège duōshao qián?"},{"sp":"售货员","zh":"现在我们商场正好有打折活动，打完折是999。另外，一年内我们都负责免费修理。","spPy":"Shòuhuòyuán","py":"Xiànzài wǒmen shāngchǎng zhènghǎo yǒu dǎzhé huódòng, dǎwán zhé shì jiǔbǎi jiǔshí jiǔ. Lìngwài, yì nián nèi wǒmen dōu fùzé miǎnfèi xiūlǐ."},{"sp":"李进","zh":"你们的服务不错，价格也可以，就买这个吧。","spPy":"Lǐ Jìn","py":"Nǐmen de fúwù búcuò, jiàgé yě kěyǐ, jiù mǎi zhège ba."}]},{"k":4,"t":"p","lines":[{"zh":"顾客朋友们，为了感谢大家的支持，我们书店今天举行“购书送好礼”活动，购书满100元送一个笔记本，满200元送一本词典。另外，一些图书还有打折活动，其中，小说7.5折，地图8折，留学考试用书6折。如果购书满500元可免费办会员卡，以后购书可打8折。今天过生日的朋友和所有的小朋友还可以获得一份小礼物。欢迎大家选购！","py":"Gùkè péngyoumen, wèile gǎnxiè dàjiā de zhīchí, wǒmen shūdiàn jīntiān jǔxíng “Gòu shū sòng hǎolǐ” huódòng, gòu shū mǎn yìbǎi yuán sòng yí ge bǐjìběn, mǎn èrbǎi yuán sòng yì běn cídiǎn. Lìngwài, yìxiē túshū hái yǒu dǎzhé huódòng, qízhōng, xiǎoshuō qīdiǎnwǔ zhé, dìtú bā zhé, liúxué kǎoshì yòngshū liù zhé. Rúguǒ gòu shū mǎn wǔbǎi yuán kě miǎnfèi bàn huìyuánkǎ, yǐhòu gòu shū kě dǎ bā zhé. Jīntiān guò shēngrì de péngyou hé suǒyǒu de xiǎopéngyou hái kěyǐ huòdé yí fèn xiǎo lǐwù. Huānyíng dàjiā xuǎngòu!"}]},{"k":5,"t":"p","lines":[{"zh":"人们常说“一分钱一分货”，意思是东西的质量和价格有很大的关系，也可以说“便宜没好货，好货不便宜”，一般情况下，你花的钱越多，买的东西也就越好。其实也不一定都是这样的。有的时候，质量很好的东西也会很便宜。例如，春天来了，冬天的衣服就会打折，质量很好，还很便宜，花很少的钱就可以买到。一到节日，商场也会举办各种各样的活动，降低价格，这个时候我们也可以买到又便宜又好的东西。","py":"Rénmen cháng shuō “yì fēn qián yì fēn huò”, yìsi shì dōngxi de zhìliàng hé jiàgé yǒu hěn dà de guānxi, yě kěyǐ shuō “piányi méi hǎo huò, hǎo huò bù piányi”, yìbān qíngkuàng xià, nǐ huā de qián yuè duō, mǎi de dōngxi yě jiù yuè hǎo. Qíshí yě bù yídìng dōu shì zhèyàng de. Yǒu de shíhou, zhìliàng hěn hǎo de dōngxi yě huì hěn piányi. Lìrú, chūntiān lái le, dōngtiān de yīfu jiù huì dǎzhé, zhìliàng hěn hǎo, hái hěn piányi, huā hěn shǎo de qián jiù kěyǐ mǎidào. Yí dào jiérì, shāngchǎng yě huì jǔbàn gè zhǒng gè yàng de huódòng, jiàngdī jiàgé, zhège shíhou wǒmen yě kěyǐ mǎidào yòu piányi yòu hǎo de dōngxi."}]}]},"7":{"cn":"最好的医生是自己","en":"The Best Doctor Is Yourself","texts":[{"k":1,"t":"d","lines":[{"sp":"小李","zh":"你的鼻子怎么流血了？快用纸擦擦。","spPy":"Xiǎo Lǐ","py":"Nǐ de bízi zěnme liú xiě le? Kuài yòng zhǐ cāca."},{"sp":"小林","zh":"我还不习惯北方的气候，估计是天气太干。今天天气不是很冷，你怎么穿这么多？","spPy":"Xiǎo Lín","py":"Wǒ hái bù xíguàn běifāng de qìhòu, gūjì shì tiānqì tài gān. Jīntiān tiānqì bú shì hěn lěng, nǐ zěnme chuān zhème duō?"},{"sp":"小李","zh":"就是因为昨天穿得太少，我都感冒了。","spPy":"Xiǎo Lǐ","py":"Jiù shì yīnwèi zuótiān chuān de tài shǎo, wǒ dōu gǎnmào le."},{"sp":"小林","zh":"最近感冒的人特别多。你去看医生了吗？","spPy":"Xiǎo Lín","py":"Zuìjìn gǎnmào de rén tèbié duō. Nǐ qù kàn yīshēng le ma?"},{"sp":"小李","zh":"没有，我只是咳嗽，有点儿头疼，不严重，多喝点儿水就好了。","spPy":"Xiǎo Lǐ","py":"Méiyǒu, wǒ zhǐshì késou, yǒudiǎnr tóuténg, bù yánzhòng, duō hē diǎnr shuǐ jiù hǎo le."},{"sp":"小林","zh":"春天天气时冷时热，特别容易感冒。这时候一定要多注意保暖，另外，最好经常打开窗户换换空气。","spPy":"Xiǎo Lín","py":"Chūntiān tiānqì shí lěng shí rè, tèbié róngyì gǎnmào. Zhè shíhou yídìng yào duō zhùyì bǎonuǎn, lìngwài, zuìhǎo jīngcháng dǎkāi chuānghu huànhuan kōngqì."}]},{"k":2,"t":"d","lines":[{"sp":"小夏","zh":"你咳嗽好点儿了吗？医生怎么说的？","spPy":"Xiǎo Xià","py":"Nǐ késou hǎo diǎnr le ma? Yīshēng zěnme shuō de?"},{"sp":"小雨","zh":"还是老样子，他让我以后不要再抽烟了。","spPy":"Xiǎoyǔ","py":"Háishì lǎo yàngzi, tā ràng wǒ yǐhòu búyào zài chōuyān le."},{"sp":"小夏","zh":"抽烟对身体一点儿好处也没有。","spPy":"Xiǎo Xià","py":"Chōuyān duì shēntǐ yìdiǎnr hǎochu yě méiyǒu."},{"sp":"小雨","zh":"我也知道，可是我觉得抽烟这个动作看上去很帅。","spPy":"Xiǎoyǔ","py":"Wǒ yě zhīdào, kěshì wǒ juéde chōuyān zhège dòngzuò kàn shàngqù hěn shuài."},{"sp":"小夏","zh":"等你身体出现问题了，后悔就来不及了。","spPy":"Xiǎo Xià","py":"Děng nǐ shēntǐ chūxiàn wèntí le, hòuhuǐ jiù láibují le."},{"sp":"小雨","zh":"其实家人也一直反对我抽烟，我自己却觉得没什么。但最近总是咳嗽，所以我有些担心了。","spPy":"Xiǎoyǔ","py":"Qíshí jiārén yě yìzhí fǎnduì wǒ chōuyān, wǒ zìjǐ què juéde méi shénme. Dàn zuìjìn zǒngshì késou, suǒyǐ wǒ yǒuxiē dānxīn le."},{"sp":"小夏","zh":"抽烟不仅对自己没好处，还会影响周围人的身体健康。为了你和你的家人，别再抽了。","spPy":"Xiǎo Xià","py":"Chōuyān bùjǐn duì zìjǐ méi hǎochu, hái huì yǐngxiǎng zhōuwéi rén de shēntǐ jiànkāng. Wèile nǐ hé nǐ de jiārén, bié zài chōu le."}]},{"k":3,"t":"d","lines":[{"sp":"小李","zh":"我最近眼睛总是跳，大夫说是因为我长时间看电脑，眼睛太累。","spPy":"Xiǎo Lǐ","py":"Wǒ zuìjìn yǎnjing zǒngshì tiào, dàifu shuō shì yīnwèi wǒ cháng shíjiān kàn diànnǎo, yǎnjing tài lèi."},{"sp":"小林","zh":"长时间坐在电脑前面工作，眼睛很容易累。最好是每过一小时就休息休息，然后再开始工作。","spPy":"Xiǎo Lín","py":"Cháng shíjiān zuò zài diànnǎo qiánmiàn gōngzuò, yǎnjing hěn róngyì lèi. Zuìhǎo shì měi guò yì xiǎoshí jiù xiūxi xiūxi, ránhòu zài kāishǐ gōngzuò."},{"sp":"小李","zh":"医生也这么说，他还告诉我要多向远处看看，尤其是多看看绿色的植物。","spPy":"Xiǎo Lǐ","py":"Yīshēng yě zhème shuō, tā hái gàosu wǒ yào duō xiàng yuǎnchù kànkan, yóuqí shì duō kànkan lǜsè de zhíwù."},{"sp":"小林","zh":"长时间对着电脑不仅对眼睛不好，身体也会不舒服。研究发现，如果人一天静坐超过6小时，就会影响身体健康。","spPy":"Xiǎo Lín","py":"Cháng shíjiān duìzhe diànnǎo bùjǐn duì yǎnjing bù hǎo, shēntǐ yě huì bù shūfu. Yánjiū fāxiàn, rúguǒ rén yì tiān jìngzuò chāoguò liù xiǎoshí, jiù huì yǐngxiǎng shēntǐ jiànkāng."},{"sp":"小李","zh":"是啊！像咱们这些久坐办公室的人要注意，有时间应该多站起来活动活动。","spPy":"Xiǎo Lǐ","py":"Shì a! Xiàng zánmen zhèxiē jiǔ zuò bàngōngshì de rén yào zhùyì, yǒu shíjiān yīnggāi duō zhàn qǐlái huódòng huódòng."},{"sp":"小林","zh":"好，咱们午饭后就去附近的公园散散步吧。","spPy":"Xiǎo Lín","py":"Hǎo, zánmen wǔfàn hòu jiù qù fùjìn de gōngyuán sànsan bù ba."}]},{"k":4,"t":"p","lines":[{"zh":"每���人都希望自己健康，那么什么才是健康呢？过去，人们认为健康就是指身体不生病。但是，现在人们认识到，健康还指精神上的健康。只有身体和精神都健康，才算是真正的健康。有一位教授用数字来说明健康有多么重要：要是健康是1，其他都是1后面的0；如果没有1，不管有多少0也没用。所以我们平时一定要注意锻炼，别等健康出问题了才后悔。","py":"Měi ge rén dōu xīwàng zìjǐ jiànkāng, nàme shénme cái shì jiànkāng ne? Guòqù, rénmen rènwéi jiànkāng jiù shì zhǐ shēntǐ bù shēngbìng. Dànshì, xiànzài rénmen rènshi dào, jiànkāng hái zhǐ jīngshén shang de jiànkāng. Zhǐyǒu shēntǐ hé jīngshén dōu jiànkāng, cái suàn shì zhēnzhèng de jiànkāng. Yǒu yí wèi jiàoshòu yòng shùzì lái shuōmíng jiànkāng yǒu duōme zhòngyào: Yàoshi jiànkāng shì yī, qítā dōu shì yī hòumiàn de líng; rúguǒ méiyǒu yī, bùguǎn yǒu duōshao líng yě méi yòng. Suǒyǐ wǒmen píngshí yídìng yào zhùyì duànliàn, bié děng jiànkāng chū wèntí le cái hòuhuǐ."}]},{"k":5,"t":"p","lines":[{"zh":"我听一位医生说过一句话：“最好的医生是自己，最好的药是时间，最好的运动是散步。”前两条我理解得不深，最后一条我完全同意。散步是生活中最简单的锻炼方法，既可以活动身体，又可以减肥，而且不会像跑步那样辛苦。晚饭后，一家人一起出去散散步，是一件很幸福的事情。肚子吃饱了需要活动，家人忙了一天需要交流，夫妻说说一天的工作能加深感情，听孩子谈谈学校里有意思的事，一天的烦恼就都跑掉了。","py":"Wǒ tīng yí wèi yīshēng shuōguo yí jù huà: “Zuì hǎo de yīshēng shì zìjǐ, zuì hǎo de yào shì shíjiān, zuì hǎo de yùndòng shì sànbù.” Qián liǎng tiáo wǒ lǐjiě de bù shēn, zuìhòu yì tiáo wǒ wánquán tóngyì. Sànbù shì shēnghuó zhōng zuì jiǎndān de duànliàn fāngfǎ, jì kěyǐ huódòng shēntǐ, yòu kěyǐ jiǎnféi, érqiě bú huì xiàng pǎobù nàyàng xīnkǔ. Wǎnfàn hòu, yì jiā rén yìqǐ chūqù sànsan bù, shì yí jiàn hěn xìngfú de shìqing. Dùzi chībǎo le xūyào huódòng, jiārén mángle yì tiān xūyào jiāoliú, fūqī shuōshuo yì tiān de gōngzuò néng jiāshēn gǎnqíng, tīng háizi tántan xuéxiào li yǒu yìsi de shì, yì tiān de fánnǎo jiù dōu pǎodiào le."}]}]},"8":{"cn":"生活中不缺少美","en":"Beauty Is Not Rare in Life","texts":[{"k":1,"t":"d","lines":[{"sp":"李老师","zh":"这种巧克力味道不错，你在哪儿买的？","spPy":"Lǐ lǎoshī","py":"Zhè zhǒng qiǎokèlì wèidào búcuò, nǐ zài nǎr mǎi de?"},{"sp":"高老师","zh":"不是我买的，是我女儿给我从国外带回来的礼物。","spPy":"Gāo lǎoshī","py":"Bú shì wǒ mǎi de, shì wǒ nǚ'ér gěi wǒ cóng guówài dài huílái de lǐwù."},{"sp":"李老师","zh":"很多人出国后常常会买外国的巧克力，回来送给亲戚朋友。","spPy":"Lǐ lǎoshī","py":"Hěn duō rén chūguó hòu chángcháng huì mǎi wàiguó de qiǎokèlì, huílái sònggěi qīnqi péngyou."},{"sp":"高老师","zh":"是啊，因为很多人都爱吃巧克力，尤其是女性。","spPy":"Gāo lǎoshī","py":"Shì a, yīnwèi hěn duō rén dōu ài chī qiǎokèlì, yóuqí shì nǚxìng."},{"sp":"李老师","zh":"这是为什么呢？","spPy":"Lǐ lǎoshī","py":"Zhè shì wèi shénme ne?"},{"sp":"高老师","zh":"巧克力大多是甜的，而很多女性都喜欢吃甜的。而且，听说伤心难过的时候吃块儿巧克力，还能使人的心情变得愉快。","spPy":"Gāo lǎoshī","py":"Qiǎokèlì dàduō shì tián de, ér hěn duō nǚxìng dōu xǐhuan chī tián de. Érqiě, tīngshuō shāngxīn nánguò de shíhou chī kuàir qiǎokèlì, hái néng shǐ rén de xīnqíng biàn de yúkuài."}]},{"k":2,"t":"d","lines":[{"sp":"小夏","zh":"这里的景色真美，空气也好。","spPy":"Xiǎo Xià","py":"Zhèli de jǐngsè zhēn měi, kōngqì yě hǎo."},{"sp":"马克","zh":"怎么样，心情好些了吗？","spPy":"Mǎkè","py":"Zěnmeyàng, xīnqíng hǎo xiē le ma?"},{"sp":"小夏","zh":"好多了，上次足球比赛后，好久都没这么放松了。","spPy":"Xiǎo Xià","py":"Hǎo duō le, shàng cì zúqiú bǐsài hòu, hǎojiǔ dōu méi zhème fàngsōng le."},{"sp":"马克","zh":"你不要有压力，好好儿准备下次比赛就好了。","spPy":"Mǎkè","py":"Nǐ búyào yǒu yālì, hǎohāor zhǔnbèi xià cì bǐsài jiù hǎo le."},{"sp":"小夏","zh":"这段时间我总是一个人坐在房间里回忆那次比赛。如果我们能再努力一点儿，就一定会多进一个球。","spPy":"Xiǎo Xià","py":"Zhè duàn shíjiān wǒ zǒngshì yí ge rén zuò zài fángjiān li huíyì nà cì bǐsài. Rúguǒ wǒmen néng zài nǔlì yìdiǎnr, jiù yídìng huì duō jìn yí ge qiú."},{"sp":"马克","zh":"事情已经发生了，过去的就让它成为过去吧。只要这次你好好儿准备，一定能把比赛踢好。","spPy":"Mǎkè","py":"Shìqing yǐjīng fāshēng le, guòqù de jiù ràng tā chéngwéi guòqù ba. Zhǐyào zhè cì nǐ hǎohāor zhǔnbèi, yídìng néng bǎ bǐsài tī hǎo."}]},{"k":3,"t":"d","lines":[{"sp":"马克","zh":"师傅，我去大使馆，你是不是走错了？","spPy":"Mǎkè","py":"Shīfu, wǒ qù dàshǐguǎn, nǐ shì bú shì zǒucuò le?"},{"sp":"师傅","zh":"现在是上班时间，前面有点儿堵车，我们走另外一条路，距离差不多。","spPy":"Shīfu","py":"Xiànzài shì shàngbān shíjiān, qiánmiàn yǒudiǎnr dǔchē, wǒmen zǒu lìngwài yì tiáo lù, jùlí chàbuduō."},{"sp":"马克","zh":"那就好，堵车浪费时间，遇到堵车，心情也“堵”。","spPy":"Mǎkè","py":"Nà jiù hǎo, dǔchē làngfèi shíjiān, yùdào dǔchē, xīnqíng yě “dǔ”."},{"sp":"师傅","zh":"可不是！上班堵车怕迟到，下班堵车怕回家晚。每天在马路上开车，要想不遇到堵车，还真难。","spPy":"Shīfu","py":"Kěbúshì! Shàngbān dǔchē pà chídào, xiàbān dǔchē pà huí jiā wǎn. Měi tiān zài mǎlù shang kāichē, yào xiǎng bú yùdào dǔchē, hái zhēn nán."},{"sp":"马克","zh":"一遇到堵车，人们就容易变得没有耐心。长期这样，还会影响脾气甚至性格。但是您的心情为什么这么好呢？","spPy":"Mǎkè","py":"Yí yùdào dǔchē, rénmen jiù róngyì biàn de méiyǒu nàixīn. Chángqī zhèyàng, hái huì yǐngxiǎng píqi shènzhì xìnggé. Dànshì nín de xīnqíng wèi shénme zhème hǎo ne?"},{"sp":"师傅","zh":"我们改变不了堵车，但是可以试着改变自己的心情。堵车时正好可以休息一下，还可以听听自己喜欢的音乐。","spPy":"Shīfu","py":"Wǒmen gǎibiàn bù liǎo dǔchē, dànshì kěyǐ shìzhe gǎibiàn zìjǐ de xīnqíng. Dǔchē shí zhènghǎo kěyǐ xiūxi yíxià, hái kěyǐ tīngting zìjǐ xǐhuan de yīnyuè."}]},{"k":4,"t":"p","lines":[{"zh":"草绿了，那是生命的颜色；花开了，那是大自然的礼物。生活中不缺少美，缺少的是发现美的眼睛。只要有心，生活中的美到处都是。生活的态度要自己选择，因此，遇到烦恼时，你应该想一些办法让自己从不高兴的心情中走出来。窗外是什么样子，我们无法改变，但我们可以选择站在哪个窗户前。选择一个能够带给我们快乐的窗户，这样才能选对心情，选对生活的态度。","py":"Cǎo lǜ le, nà shì shēngmìng de yánsè; huā kāi le, nà shì dàzìrán de lǐwù. Shēnghuó zhōng bù quēshǎo měi, quēshǎo de shì fāxiàn měi de yǎnjing. Zhǐyào yǒuxīn, shēnghuó zhōng de měi dàochù dōu shì. Shēnghuó de tàidù yào zìjǐ xuǎnzé, yīncǐ, yùdào fánnǎo shí, nǐ yīnggāi xiǎng yìxiē bànfǎ ràng zìjǐ cóng bù gāoxìng de xīnqíng zhōng zǒu chūlái. Chuāngwài shì shénme yàngzi, wǒmen wúfǎ gǎibiàn, dàn wǒmen kěyǐ xuǎnzé zhàn zài nǎge chuānghu qián. Xuǎnzé yí ge nénggòu dàigěi wǒmen kuàilè de chuānghu, zhèyàng cái néng xuǎnduì xīnqíng, xuǎnduì shēnghuó de tàidù."}]},{"k":5,"t":"p","lines":[{"zh":"科学研究证明，女孩子对衣服颜色的选择往往与她们的性格有关。喜欢穿白色衣服的女孩子性格比较阳光，生活态度积极向上是她们的共同特点；而喜欢穿红色衣服的女孩子性格比较浪漫。颜色也会影响人的心情，不同的颜色会给我们带来不同的感情变化。红色让人变得热情；黄色和白色让人心情愉快；黑色却容易让人感到伤心；人们在看到蓝色时会觉得很舒服，变得安静下来；绿色让我们的眼睛得到休息。","py":"Kēxué yánjiū zhèngmíng, nǚháizi duì yīfu yánsè de xuǎnzé wǎngwǎng yǔ tāmen de xìnggé yǒuguān. Xǐhuan chuān báisè yīfu de nǚháizi xìnggé bǐjiào yángguāng, shēnghuó tàidù jījí xiàngshàng shì tāmen de gòngtóng tèdiǎn; ér xǐhuan chuān hóngsè yīfu de nǚháizi xìnggé bǐjiào làngmàn. Yánsè yě huì yǐngxiǎng rén de xīnqíng, bù tóng de yánsè huì gěi wǒmen dàilái bù tóng de gǎnqíng biànhuà. Hóngsè ràng rén biàn de rèqíng; huángsè hé báisè ràng rén xīnqíng yúkuài; hēisè què róngyì ràng rén gǎndào shāngxīn; rénmen zài kàndào lánsè shí huì juéde hěn shūfu, biàn de ānjìng xiàlái; lǜsè ràng wǒmen de yǎnjing dédào xiūxi."}]}]},"9":{"cn":"阳光总在风雨后","en":"The Sun Will Shine Again After the Storm","texts":[{"k":1,"t":"d","lines":[{"sp":"王静","zh":"怎么又买了这么多饼干和巧克力？难道你不减肥了？","spPy":"Wáng Jìng","py":"Zěnme yòu mǎile zhème duō bǐnggān hé qiǎokèlì? Nándào nǐ bù jiǎnféi le?"},{"sp":"孙月","zh":"减了一个月都没瘦下来，我实在没有信心了。","spPy":"Sūn Yuè","py":"Jiǎnle yí ge yuè dōu méi shòu xiàlái, wǒ shízài méiyǒu xìnxīn le."},{"sp":"王静","zh":"如果你想减肥，就得少吃东西，而且要多运动。","spPy":"Wáng Jìng","py":"Rúguǒ nǐ xiǎng jiǎnféi, jiù děi shǎo chī dōngxi, érqiě yào duō yùndòng."},{"sp":"孙月","zh":"我就是这么做的，但这一个月下来，我只轻了一公斤。","spPy":"Sūn Yuè","py":"Wǒ jiù shì zhème zuò de, dàn zhè yí ge yuè xiàlái, wǒ zhǐ qīngle yì gōngjīn."},{"sp":"王静","zh":"一个月太短了。要想减肥成功，只能坚持，才会慢慢有效果。","spPy":"Wáng Jìng","py":"Yí ge yuè tài duǎn le. Yào xiǎng jiǎnféi chénggōng, zhǐnéng jiānchí, cái huì mànman yǒu xiàoguǒ."},{"sp":"孙月","zh":"我本来已经打算放弃了，但是你刚才的话让我改变了主意。这些饼干和巧克力送给你了。","spPy":"Sūn Yuè","py":"Wǒ běnlái yǐjīng dǎsuàn fàngqì le, dànshì nǐ gāngcái de huà ràng wǒ gǎibiànle zhǔyi. Zhèxiē bǐnggān hé qiǎokèlì sònggěi nǐ le."}]},{"k":2,"t":"d","lines":[{"sp":"李进","zh":"你网球打得真好，还得过那么多国际大奖！每次看你比赛，感觉你轻轻松松就赢了。","spPy":"Lǐ Jìn","py":"Nǐ wǎngqiú dǎ de zhēn hǎo, hái déguo nàme duō guójì dàjiǎng! Měi cì kàn nǐ bǐsài, gǎnjué nǐ qīngqīngsōngsōng jiù yíng le."},{"sp":"张远","zh":"哪里啊！那是你没看到我辛苦练习的一面，没有人随随便便就能成功的。","spPy":"Zhāng Yuǎn","py":"Nǎli a! Nà shì nǐ méi kàndào wǒ xīnkǔ liànxí de yí miàn, méiyǒu rén suísuibiànbiàn jiù néng chénggōng de."},{"sp":"李进","zh":"我从小也对网球感兴趣，但是现在还是打得不怎么样。","spPy":"Lǐ Jìn","py":"Wǒ cóngxiǎo yě duì wǎngqiú gǎn xìngqù, dànshì xiànzài háishì dǎ de bù zěnmeyàng."},{"sp":"张远","zh":"你知道吗？不管春夏秋冬，我练球从来没有休息过一天。","spPy":"Zhāng Yuǎn","py":"Nǐ zhīdào ma? Bùguǎn chūn xià qiū dōng, wǒ liàn qiú cónglái méiyǒu xiūxi guo yì tiān."},{"sp":"李进","zh":"真是不容易啊！看来我只看到了你成功时获得的鲜花，却没注意到你成功前流下的汗水。","spPy":"Lǐ Jìn","py":"Zhēn shì bù róngyì a! Kànlái wǒ zhǐ kàndàole nǐ chénggōng shí huòdé de xiānhuā, què méi zhùyì dào nǐ chénggōng qián liúxià de hànshuǐ."},{"sp":"张远","zh":"任何成功都要通过努力才能得到。只要你坚持练习，我相信你也会越打越好的。","spPy":"Zhāng Yuǎn","py":"Rènhé chénggōng dōu yào tōngguò nǔlì cái néng dédào. Zhǐyào nǐ jiānchí liànxí, wǒ xiāngxìn nǐ yě huì yuè dǎ yuè hǎo de."}]},{"k":3,"t":"d","lines":[{"sp":"小林","zh":"你还记得王红吗？我在报纸上看到一篇关于她的新闻，她现在已经是一个有名的作家了。","spPy":"Xiǎo Lín","py":"Nǐ hái jìde Wáng Hóng ma? Wǒ zài bàozhǐ shang kàndào yì piān guāny�� tā de xīnwén, tā xiànzài yǐjīng shì yí ge yǒumíng de zuòjiā le."},{"sp":"小李","zh":"听说她毕业后放弃了律师的工作，开始专门写小说，没想到她竟然成功了。","spPy":"Xiǎo Lǐ","py":"Tīngshuō tā bìyè hòu fàngqìle lǜshī de gōngzuò, kāishǐ zhuānmén xiě xiǎoshuō, méi xiǎngdào tā jìngrán chénggōng le."},{"sp":"小林","zh":"当时她的父母和亲戚都不支持她，可是她坚持自己的选择，现在终于向所有人证明了她的选择是正确的。","spPy":"Xiǎo Lín","py":"Dāngshí tā de fùmǔ hé qīnqi dōu bù zhīchí tā, kěshì tā jiānchí zìjǐ de xuǎnzé, xiànzài zhōngyú xiàng suǒyǒu rén zhèngmíngle tā de xuǎnzé shì zhèngquè de."},{"sp":"小李","zh":"看来为了自己的理想，放弃一些东西也是值得的。","spPy":"Xiǎo Lǐ","py":"Kànlái wèile zìjǐ de lǐxiǎng, fàngqì yìxiē dōngxi yě shì zhídé de."},{"sp":"小林","zh":"一个人只有两只手，不可能得到所有想要的东西，所以有时候放弃是一种聪明的选择。","spPy":"Xiǎo Lín","py":"Yí ge rén zhǐyǒu liǎng zhī shǒu, bù kěnéng dédào suǒyǒu xiǎng yào de dōngxi, suǒyǐ yǒu shíhou fàngqì shì yì zhǒng cōngming de xuǎnzé."},{"sp":"小李","zh":"是啊，只有学会放弃，才能把自己的能力用到最该做的事情上，最后获得成功。","spPy":"Xiǎo Lǐ","py":"Shì a, zhǐyǒu xuéhuì fàngqì, cái néng bǎ zìjǐ de nénglì yòng dào zuì gāi zuò de shìqing shang, zuìhòu huòdé chénggōng."}]},{"k":4,"t":"p","lines":[{"zh":"如果你想做什么事情，那就勇敢地去做，不要担心结果，不要考虑会不会失败。要是太看重结果，失败就会给人们带来很多烦恼。我们应该把注意力放在做事情的过程上，这样你会在做的过程中发现解决问题的快乐，这是其他任何东西都给不了的。即使最后失败了也没有关系，因为至少你已经努力过，而且我们还可以从失败中总结出有用的经验，有了这些积累，成功自然离我们越来越近。","py":"Rúguǒ nǐ xiǎng zuò shénme shìqing, nà jiù yǒnggǎn de qù zuò, búyào dānxīn jiéguǒ, búyào kǎolǜ huì bú huì shībài. Yàoshi tài kànzhòng jiéguǒ, shībài jiù huì gěi rénmen dàilái hěn duō fánnǎo. Wǒmen yīnggāi bǎ zhùyìlì fàng zài zuò shìqing de guòch��ng shang, zhèyàng nǐ huì zài zuò de guòchéng zhōng fāxiàn jiějué wèntí de kuàilè, zhè shì qítā rènhé dōngxi dōu gěi bù liǎo de. Jíshǐ zuìhòu shībài le yě méiyǒu guānxi, yīnwèi zhìshǎo nǐ yǐjīng nǔlì guo, érqiě wǒmen hái kěyǐ cóng shībài zhōng zǒngjié chū yǒuyòng de jīngyàn, yǒule zhèxiē jīlěi, chénggōng zìrán lí wǒmen yuè lái yuè jìn."}]},{"k":5,"t":"p","lines":[{"zh":"每一个人都希望成功，可是很多时候，在成功之前会遇到很多困难。有些人遇到困难就放弃，而有些人遇到困难却想办法解决它。对困难的态度不同，结果也是不一样的。爱迪生就是在找了上千种材料后才找到了能点亮电灯的材料。取得成功的人往往都经历过许多失败，他们和普通人的区别就是他们都坚持了下来。所以就算只有1%的希望，我们也要做出100%的努力。困难只是暂时的，“阳光总在风雨后”，只有我们勇敢地面对困难，才能有希望取得成功。","py":"Měi yí ge rén dōu xīwàng chénggōng, kěshì hěn duō shíhou, zài chénggōng zhīqián huì yùdào hěn duō kùnnan. Yǒuxiē rén yùdào kùnnan jiù fàngqì, ér yǒuxiē rén yùdào kùnnan què xiǎng bànfǎ jiějué tā. Duì kùnnan de tàidù bù tóng, jiéguǒ yě shì bù yíyàng de. Àidíshēng jiù shì zài zhǎole shàng qiān zhǒng cáiliào hòu cái zhǎodàole néng diǎnliàng diàndēng de cáiliào. Qǔdé chénggōng de rén wǎngwǎng dōu jīnglìguo xǔduō shībài, tāmen hé pǔtōng rén de qūbié jiù shì tāmen dōu jiānchíle xiàlái. Suǒyǐ jiùsuàn zhǐyǒu bǎifēnzhīyī de xīwàng, wǒmen yě yào zuòchū bǎifēnzhībǎi de nǔlì. Kùnnan zhǐshì zànshí de, “Yángguāng zǒng zài fēngyǔ hòu”, zhǐyǒu wǒmen yǒnggǎn de miànduì kùnnan, cái néng yǒu xīwàng qǔdé chénggōng."}]}]},"10":{"cn":"幸福的标准","en":"Standards of Happiness","texts":[{"k":1,"t":"d","lines":[{"sp":"孙月","zh":"礼拜天有空儿吗？陪我去逛街怎么样？我想去给丈夫买个生日礼物。","spPy":"Sūn Yuè","py":"Lǐbàitiān yǒu kòngr ma? Péi wǒ qù guàngjiē zěnmeyàng? Wǒ xiǎng qù gěi zhàngfu mǎi ge shēngrì lǐwù."},{"sp":"王静","zh":"我可能去不了，最近事情多。","spPy":"Wáng Jìng","py":"Wǒ kěnéng qù bù liǎo, zuìjìn shìqing duō."},{"sp":"孙月","zh":"你最近是不是工作特别忙？","spPy":"Sūn Yuè","py":"Nǐ zuìjìn shì bú shì gōngzuò tèbié máng?"},{"sp":"王静","zh":"我现在上有老，下有小。除了工作以外，家里还有母亲和儿子需要照顾。","spPy":"Wáng Jìng","py":"Wǒ xiànzài shàng yǒu lǎo, xià yǒu xiǎo. Chúle gōngzuò yǐwài, jiā li hái yǒu mǔqīn hé érzi xūyào zhàogù."},{"sp":"孙月","zh":"真是辛苦啊！你最近脸色不太好，是不是哪儿不舒服？要注意身体啊。","spPy":"Sūn Yuè","py":"Zhēn shì xīnkǔ a! Nǐ zuìjìn liǎnsè bú tài hǎo, shì bú shì nǎr bù shūfu? Yào zhùyì shēntǐ a."},{"sp":"王静","zh":"没事儿，谢谢！不过现在我很幸福，因为在母亲面前我可以做一个永远长不大的孩子；在孩子面前我又是个能照顾他的母亲，这让我有了努力的方向。","spPy":"Wáng Jìng","py":"Méi shìr, xièxie! Búguò xiànzài wǒ hěn xìngfú, yīnwèi zài mǔqīn miànqián wǒ kěyǐ zuò yí ge yǒngyuǎn zhǎng bú dà de háizi; zài háizi miànqián wǒ yòu shì ge néng zhàogù tā de mǔqīn, zhè ràng wǒ yǒule nǔlì de fāngxiàng."}]},{"k":2,"t":"d","lines":[{"sp":"高老师","zh":"你看人家王老师，刚来这儿工作三年就当了教授，还有个好妻子，真让人羡慕！","spPy":"Gāo lǎoshī","py":"Nǐ kàn rénjiā Wáng lǎoshī, gāng lái zhèr gōngzuò sān nián jiù dāngle jiàoshòu, hái yǒu ge hǎo qīzi, zhēn ràng rén xiànmù!"},{"sp":"李老师","zh":"其实，你在别人眼中也是很幸福的，只是你自己没有发现。","spPy":"Lǐ lǎoshī","py":"Qíshí, nǐ zài biérén yǎn zhōng yě shì hěn xìngfú de, zhǐshì nǐ zìjǐ méiyǒu fāxiàn."},{"sp":"高老师","zh":"是吗？我哪能跟王老师比啊？","spPy":"Gāo lǎoshī","py":"Shì ma? Wǒ nǎ néng gēn Wáng lǎoshī bǐ a?"},{"sp":"李老师","zh":"你有一个漂亮的女儿，还那么优秀，硕士毕业后就当了翻译。","spPy":"Lǐ lǎoshī","py":"Nǐ yǒu yí ge piàoliang de nǚ'ér, hái nàme yōuxiù, shuòshì bìyè hòu jiù dāngle fānyì."},{"sp":"高老师","zh":"我女儿确实不错，记得她刚拿到第一个月工资时，就兴奋地拉着我和她爸俩去商场，给我们买礼物，那时我和她爸心里别提多美了！","spPy":"Gāo lǎoshī","py":"Wǒ nǚ'ér quèshí búcuò, jìde tā gāng nádào dì-yī ge yuè gōngzī shí, jiù xīngfèn de lāzhe wǒ hé tā bà liǎ qù shāngchǎng, gěi wǒmen mǎi lǐwù, nà shí wǒ hé tā bà xīnli biétí duō měi le!"},{"sp":"李老师","zh":"所以说每个人有每个人的生活，不用羡慕别人。你羡慕别人的时候，他们可能也正在羡慕你呢。","spPy":"Lǐ lǎoshī","py":"Suǒyǐ shuō měi ge rén yǒu měi ge rén de shēnghuó, búyòng xiànmù biérén. Nǐ xiànmù biérén de shíhou, tāmen kěnéng yě zhèngzài xiànmù nǐ ne."}]},{"k":3,"t":"d","lines":[{"sp":"小雨","zh":
