/* ================================================================
   Texts tab — textbook lesson texts with the grammar points highlighted
   hskTexts : level -> lesson -> { cn, en, texts:[{k, t:'d'|'p', lines:[…]}] }
   hskMatch : level -> lesson -> point n -> { scope, tok[] } (regex tokens, in order)
================================================================ */
const GCOL = [
  { mark:'bg-jade/15 text-jade-deep dark:text-jade decoration-jade', chip:'border-jade/45 text-jade-deep dark:text-jade bg-jade/10', txt:'text-jade-deep dark:text-jade' },
  { mark:'bg-seal/10 text-seal dark:text-[#ef7f72] decoration-seal', chip:'border-seal/40 text-seal dark:text-[#ef7f72] bg-seal/10', txt:'text-seal dark:text-[#ef7f72]' },
  { mark:'bg-amber-400/20 text-amber-700 dark:text-amber-300 decoration-amber-500', chip:'border-amber-500/45 text-amber-700 dark:text-amber-300 bg-amber-400/10', txt:'text-amber-700 dark:text-amber-300' },
  { mark:'bg-sky-400/15 text-sky-700 dark:text-sky-300 decoration-sky-500', chip:'border-sky-500/45 text-sky-700 dark:text-sky-300 bg-sky-400/10', txt:'text-sky-700 dark:text-sky-300' },
  { mark:'bg-violet-400/15 text-violet-700 dark:text-violet-300 decoration-violet-500', chip:'border-violet-500/45 text-violet-700 dark:text-violet-300 bg-violet-400/10', txt:'text-violet-700 dark:text-violet-300' },
  { mark:'bg-pink-400/15 text-pink-700 dark:text-pink-300 decoration-pink-500', chip:'border-pink-500/45 text-pink-700 dark:text-pink-300 bg-pink-400/10', txt:'text-pink-700 dark:text-pink-300' }
];
const gcol = n => GCOL[(n - 1) % GCOL.length];

/* spans [start,end) in `str` where the grammar point is used */
function pointSpans(cfg, str, textOk){
  const out = [];
  if (cfg.scope === 't') {                     /* pattern spread over sentences (首先…其次) */
    if (!textOk) return out;
    cfg.tok.forEach(t => {
      const r = new RegExp(t, 'g'); let m;
      while ((m = r.exec(str)) !== null) { out.push([m.index, m.index + m[0].length]); if (!m[0].length) r.lastIndex++; }
    });
    return out;
  }
  const sentRx = /[^。！？]+[。！？]*|[。！？]+/g; let sm;
  while ((sm = sentRx.exec(str)) !== null) {   /* all tokens, in order, inside one sentence */
    const base = sm.index, s = sm[0]; let pos = 0, ok = true; const spans = [];
    for (const t of cfg.tok) {
      const r = new RegExp(t, 'g'); r.lastIndex = pos;
      const m = r.exec(s);
      if (!m) { ok = false; break; }
      spans.push([base + m.index, base + m.index + m[0].length]);
      pos = m.index + m[0].length;
    }
    if (ok) spans.forEach(sp => out.push(sp));
  }
  return out;
}
function mergeSpans(spans){
  const sorted = [...spans].sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  const out = []; let last = 0;
  sorted.forEach(sp => { if (sp.s >= last) { out.push(sp); last = sp.e; } });
  return out;
}
const usageCache = {};
function grammarUsage(levelId, lessonId){
  const key = levelId + '-' + lessonId;
  if (usageCache[key]) return usageCache[key];
  const lesson = hskTexts[levelId] && hskTexts[levelId][lessonId];
  const cfgs = (hskMatch[levelId] && hskMatch[levelId][lessonId]) || {};
  const perText = [], totals = {};
  if (lesson) lesson.texts.forEach(t => {
    const joined = t.lines.map(l => l.zh).join('');
    const ok = {}, counts = {};
    Object.keys(cfgs).forEach(n => {
      const c = cfgs[n];
      ok[n] = c.scope !== 't' || c.tok.every(tk => new RegExp(tk).test(joined));
      let spans = 0;
      t.lines.forEach(l => { spans += pointSpans(c, l.zh, ok[n]).length; });
      const cnt = c.scope === 't' ? spans : Math.round(spans / c.tok.length);
      if (cnt > 0) { counts[n] = cnt; (totals[n] = totals[n] || []).push({ k: t.k, count: cnt }); }
    });
    perText.push({ ok, counts });
  });
  return (usageCache[key] = { perText, totals, cfgs });
}

function MarkedLine({ zh, cfgs, ok, active }){
  const spans = [];
  Object.keys(cfgs).forEach(n => {
    if (active && String(active) !== n) return;
    pointSpans(cfgs[n], zh, ok[n]).forEach(sp => spans.push({ s: sp[0], e: sp[1], n: +n }));
  });
  const merged = mergeSpans(spans);
  const nodes = []; let i = 0;
  merged.forEach((sp, idx) => {
    if (sp.s > i) nodes.push(zh.slice(i, sp.s));
    nodes.push(
      <mark key={idx} className={'rounded-sm px-0.5 underline decoration-2 underline-offset-4 bg-transparent ' + gcol(sp.n).mark}>
        {zh.slice(sp.s, sp.e)}<sup className="ml-px font-sans text-[9px] font-bold no-underline align-super">{sp.n}</sup>
      </mark>
    );
    i = sp.e;
  });
  if (i < zh.length) nodes.push(zh.slice(i));
  return <>{nodes}</>;
}

function TextsSection({ levelId, lessonId, points, hidePinyin, onTogglePinyin, focus, setFocus }){
  const data = hskTexts[levelId][lessonId];
  const usage = grammarUsage(levelId, lessonId);
  const [showHL, setShowHL] = useState(true);
  const patOf = p => splitGrammarTitle(p.title).pattern;
  const totalOf = n => (usage.totals[n] || []).reduce((a, b) => a + b.count, 0);

  return (
    <section className="w-full mb-6 sm:mb-8" aria-labelledby="texts-heading">
      <div className="flex items-end justify-between gap-3 mb-1">
        <div className="min-w-0">
          <p className="eyebrow">Grammar in context</p>
          <h2 id="texts-heading" className="mt-1 font-serif text-2xl font-semibold tracking-tight">
            Texts <span className="font-hanzi text-base text-ink/40 dark:text-white/40">课文</span>
          </h2>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <PinyinToggle hidePinyin={hidePinyin} onTogglePinyin={onTogglePinyin}/>
          <button type="button" onClick={() => setShowHL(v => !v)} aria-pressed={!showHL}
            className={'btn-ghost h-9 px-3 text-xs' + (!showHL ? ' text-jade border-jade/50' : '')}>
            {showHL ? 'Hide highlights' : 'Show highlights'}
          </button>
        </div>
      </div>
      <p className="mb-4 text-xs text-ink/55 dark:text-white/55">
        <span className="font-hanzi">{data.cn}</span> · {data.en}
      </p>

      {/* Legend — tap a grammar point to focus it */}
      {points && points.length > 0 && (
        <div className="mb-5 rounded-xl border border-ink/10 dark:border-white/10 bg-white dark:bg-night-card p-3.5">
          <p className="text-[10px] uppercase tracking-[0.2em] text-ink/40 dark:text-white/40">Grammar of this lesson · tap to focus</p>
          <div className="mt-2 flex flex-wrap gap-1.5">
            {points.map(p => {
              const n = totalOf(p.n), on = focus === p.n;
              return (
                <button key={p.n} type="button" onClick={() => setFocus(on ? null : p.n)} aria-pressed={on}
                  className={'inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs transition-opacity ' + gcol(p.n).chip +
                    (focus && !on ? ' opacity-40' : '') + (n === 0 ? ' border-dashed' : '')}>
                  <span className="font-bold tabular-nums">{p.n}</span>
                  <span className="font-kai text-sm break-all text-left">{patOf(p)}</span>
                  <span className="tabular-nums opacity-70">{n > 0 ? '×' + n : '–'}</span>
                </button>
              );
            })}
          </div>
          {points.some(p => totalOf(p.n) === 0) && (
            <p className="mt-2 text-[11px] text-ink/40 dark:text-white/40">– = this pattern does not appear in the texts below.</p>
          )}
        </div>
      )}

      <div className="space-y-4">
        {data.texts.map((t, ti) => {
          const info = usage.perText[ti];
          const used = points ? points.filter(p => info.counts[p.n]) : [];
          return (
            <article key={t.k} className="rounded-2xl border border-ink/10 dark:border-white/10 bg-white dark:bg-night-card p-4 sm:p-5">
              <header className="flex items-center justify-between gap-3 mb-3">
                <div className="flex items-baseline gap-2.5">
                  <span className="font-hanzi text-lg text-jade">课文{t.k}</span>
                  <span className="text-[11px] uppercase tracking-[0.18em] text-ink/40 dark:text-white/40">
                    {t.t === 'd' ? 'Dialogue' : 'Passage'} · Text {t.k}
                  </span>
                </div>
                <SpeakButton text={t.lines.map(l => l.zh).join('')}/>
              </header>

              <div className="space-y-3.5">
                {t.lines.map((l, li) => {
                  const body = (
                    <>
                      <p className="font-kai text-lg sm:text-xl leading-[1.9] break-words">
                        {showHL ? <MarkedLine zh={l.zh} cfgs={usage.cfgs} ok={info.ok} active={focus}/> : l.zh}
                      </p>
                      <p className={'mt-0.5 text-[13px] font-serif italic leading-snug break-words ' + (hidePinyin ? 'select-none text-transparent' : 'text-jade')}
                        aria-hidden={hidePinyin}>{l.py}</p>
                    </>
                  );
                  if (t.t === 'p') return <div key={li}>{body}</div>;
                  if (!l.sp) return <div key={li} className="text-center text-sm text-ink/50 dark:text-white/50">{body}</div>;
                  return (
                    <div key={li} className="flex gap-3">
                      <div className="w-[3.75rem] sm:w-20 shrink-0 pt-1.5 text-right">
                        <div className="font-kai text-sm leading-tight text-ink/80 dark:text-white/80 break-words">{l.sp}</div>
                        <div className={'mt-0.5 text-[9px] leading-tight break-words ' + (hidePinyin ? 'select-none text-transparent' : 'text-ink/40 dark:text-white/40')}
                          aria-hidden={hidePinyin}>{l.spPy}</div>
                      </div>
                      <div className="min-w-0 flex-1 border-l border-ink/10 dark:border-white/10 pl-3">{body}</div>
                    </div>
                  );
                })}
              </div>

              {/* Grammar used in this text */}
              <div className="mt-4 border-t border-ink/10 dark:border-white/10 pt-3">
                <p className="text-[10px] uppercase tracking-[0.2em] text-ink/40 dark:text-white/40">Grammar used in this text</p>
                {used.length === 0 ? (
                  <p className="mt-1.5 text-xs text-ink/45 dark:text-white/45">No grammar point of this lesson is highlighted here.</p>
                ) : (
                  <ul className="mt-2 space-y-1.5">
                    {used.map(p => (
                      <li key={p.n} className="flex items-start gap-2 text-xs">
                        <span className={'shrink-0 inline-flex h-5 min-w-[1.25rem] items-center justify-center rounded-full border px-1.5 font-bold tabular-nums ' + gcol(p.n).chip}>{p.n}</span>
                        <span className="min-w-0 text-ink/70 dark:text-white/70 break-words">
                          <span className="font-kai text-sm text-ink dark:text-white">{patOf(p)}</span>
                          {' '}<span className="tabular-nums opacity-60">×{info.counts[p.n]}</span>
                          {p.structure && <span className="block font-kai text-[13px] text-ink/55 dark:text-white/55">{p.structure}</span>}
                        </span>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            </article>
          );
        })}
      </div>
    </section>
  );
}

function LessonPage({ level, lesson }){
  const words = lesson.words;
  const total = words.length;
  const grammarPoints = hskGrammar[level.id] ? (hskGrammar[level.id][lesson.id] || []) : null;
  const hasStudyTabs = grammarPoints !== null;   /* HSK 4: vocabulary · important · grammar · texts · flashcards */
  const hasTexts = hasStudyTabs && !!(hskTexts[level.id] && hskTexts[level.id][lesson.id]);
  const TABS = hasStudyTabs
    ? [['vocabulary','Vocabulary','Vocabulary'], ['important','Important words','Important'], ['grammar','Grammar','Grammar'],
       ...(hasTexts ? [['texts','Texts','Texts']] : []), ['flashcards','Flashcards','Flashcards']]
    : [['vocabulary','Vocabulary','Vocabulary'], ['flashcards','Flashcards','Flashcards']];

  const [order, setOrder]     = useState(words.map((_, i) => i));
  const [shuffled, setShuffled] = useState(false);
  const [pos, setPos]         = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [done, setDone]       = useState(false);
  const [hidePinyin, setHidePinyin] = useState(false);
  const [focusPoint, setFocusPoint] = useState(null);
  const [activeTab, setActiveTab] = useState(() => {
    let saved = null;
    try { saved = localStorage.getItem('hf-tab-v1'); } catch(e){}
    return TABS.some(t => t[0] === saved) ? saved : 'vocabulary';
  });
  const [seen, setSeen]       = useState(() => new Set(progressStore.seenFor(level.id, lesson.id)));

  const word = words[order[pos]];

  const go = (d) => {
    if (d > 0) {
      if (done) return;
      if (pos === total - 1) { setDone(true); setFlipped(false); return; }
      setPos(pos + 1); setFlipped(false);
    } else {
      if (done) { setDone(false); setFlipped(false); return; }
      if (pos === 0) return;
      setPos(pos - 1); setFlipped(false);
    }
  };
  const flip = () => {
    setFlipped(f => !f);
    if (!flipped) {
      const id = word.id;
      setSeen(s => { const n = new Set(s); n.add(id); return n; });
      progressStore.markSeen(level.id, lesson.id, id);
    }
  };
  const restart = () => { setPos(0); setDone(false); setFlipped(false); };
  const toggleShuffle = () => {
    if (!shuffled) {
      const arr = [...order];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      setOrder(arr);
    } else {
      setOrder(words.map((_, i) => i));
    }
    setShuffled(!shuffled);
    setPos(0); setDone(false); setFlipped(false);
  };
  const switchTab = (tab) => {
    setActiveTab(tab);
    setFlipped(false);
    try { localStorage.setItem('hf-tab-v1', tab); } catch(e){}
  };

  const seeInTexts = (n) => {
    setFocusPoint(n);
    switchTab('texts');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const actionsRef = useRef({ go, flip, tab: activeTab });
  actionsRef.current = { go, flip, tab: activeTab };

  /* Keyboard: arrows navigate, space/enter flips — flashcard tab only,
     so Space still scrolls the other tabs and never marks a hidden card as seen. */
  useEffect(() => {
    const onKey = (e) => {
      if (actionsRef.current.tab !== 'flashcards') return;
      const tag = (e.target && e.target.tagName) || '';
      if ((e.key === ' ' || e.key === 'Enter') && (tag === 'BUTTON' || tag === 'A')) return; // native click wins
      if (e.key === 'ArrowRight') actionsRef.current.go(1);
      else if (e.key === 'ArrowLeft') actionsRef.current.go(-1);
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); actionsRef.current.flip(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [level.id, lesson.id]);

  const onCards = activeTab === 'flashcards';
  const tabBtn = (id, long, short) => (
    <button key={id} type="button" role="tab" id={'tab-' + id} aria-selected={activeTab === id}
      onClick={() => switchTab(id)}
      className={'shrink-0 whitespace-nowrap px-1 pb-3 mr-4 sm:mr-6 last:mr-0 text-[13px] sm:text-sm font-semibold border-b-2 transition-colors ' +
        (activeTab === id ? 'border-jade text-jade' : 'border-transparent text-ink/45 dark:text-white/45 hover:text-ink dark:hover:text-white')}>
      {long === short ? long : (<><span className="sm:hidden">{short}</span><span className="hidden sm:inline">{long}</span></>)}
    </button>
  );

  return (
    <div className="relative page-h flex flex-col">
      {/* Focus layer — dims & blurs the background while the card is flipped */}
      <div aria-hidden="true"
        className={'focus-overlay fixed inset-0 z-10 pointer-events-none transition-opacity duration-500 ' + (onCards && flipped && !done ? 'opacity-100' : 'opacity-0')}/>

      <div className="relative z-20 flex-1 w-full max-w-3xl mx-auto flex flex-col px-4 sm:px-6 pt-5 pb-[max(2rem,env(safe-area-inset-bottom))]">
        {/* Header */}
        <header className="flex items-center justify-between gap-3 transition-opacity duration-500"
          style={{ opacity: onCards && flipped && !done ? .45 : 1 }}>
          <a href={levelHref(level)}
            className="inline-flex items-center gap-1 text-sm font-semibold text-ink/55 dark:text-white/55 hover:text-jade transition-colors shrink-0">
            <Icon name="chevron-left" size={16}/>
            <span className="hidden sm:inline">{level.label} lessons</span>
            <span className="sm:hidden">Lessons</span>
          </a>
          <div className="min-w-0 text-center">
            <p className="font-hanzi text-[11px] text-jade leading-none">第{CN_NUM[lesson.id]}课</p>
            <h1 className="mt-1 font-serif font-semibold text-base sm:text-lg truncate">{lesson.title}</h1>
          </div>
          <span className="shrink-0 text-xs font-bold tabular-nums text-ink/40 dark:text-white/40">
            {onCards ? (done ? total : pos + 1) + ' / ' + total : total + ' words'}
          </span>
        </header>

        {onCards && <span className="sr-only" aria-live="polite">Word {pos + 1} of {total}: {word.hanzi}</span>}

        <div className="mt-5 mb-4 flex overflow-x-auto no-scrollbar border-b border-ink/10 dark:border-white/10" role="tablist" aria-label="Lesson study mode">
          {TABS.map(t => tabBtn(t[0], t[1], t[2]))}
        </div>

        {activeTab === 'vocabulary' && (
          <VocabularySection words={words} hidePinyin={hidePinyin} onTogglePinyin={() => setHidePinyin(value => !value)}/>
        )}
        {activeTab === 'important' && hasStudyTabs && (
          <ImportantSection words={words} hidePinyin={hidePinyin} onTogglePinyin={() => setHidePinyin(value => !value)}/>
        )}
        {activeTab === 'grammar' && hasStudyTabs && (
          <GrammarSection levelId={level.id} lessonId={lesson.id} points={grammarPoints} words={words} hidePinyin={hidePinyin}
            onTogglePinyin={() => setHidePinyin(value => !value)} onSeeInTexts={seeInTexts}/>
        )}
        {activeTab === 'texts' && hasTexts && (
          <TextsSection levelId={level.id} lessonId={lesson.id} points={grammarPoints} hidePinyin={hidePinyin}
            onTogglePinyin={() => setHidePinyin(value => !value)} focus={focusPoint} setFocus={setFocusPoint}/>
        )}
        {onCards && (
          <>
            {/* Card / completion */}
            <div className="flex-1 flex items-center justify-center py-4 sm:py-8">
              {done
                ? <Completion level={level} lesson={lesson} total={total} seenCount={seen.size} onRestart={restart}/>
                : <Flashcard word={word} pos={pos} total={total} flipped={flipped} onFlip={flip}/>}
            </div>

            {/* Controls */}
            {!done && (
              <div className="w-full max-w-[24rem] mx-auto">
                <div className="flex gap-1">
                  {order.map((wi, i) => {
                    const isSeen = seen.has(words[wi].id);
                    return (
                      <div key={i} title={words[wi].hanzi}
                        className={'h-1.5 flex-1 rounded-full transition-colors duration-300 ' +
                          (isSeen ? (i === pos ? 'bg-jade-deep' : 'bg-jade')
                                  : (i === pos ? 'bg-ink/40 dark:bg-white/40' : 'bg-ink/10 dark:bg-white/10'))}/>
                    );
                  })}
                </div>
                <div className="mt-3 flex items-center justify-between">
                  <span className="text-[11px] uppercase tracking-[0.18em] text-ink/45 dark:text-white/45">
                    Word {pos + 1} of {total}
                  </span>
                  <div className="flex items-center gap-1.5">
                    <button onClick={toggleShuffle} title="Shuffle deck" aria-label="Shuffle deck" aria-pressed={shuffled}
                      className={'btn-mini' + (shuffled ? ' is-on' : '')}><Icon name="shuffle" size={13}/></button>
                    <button onClick={restart} title="Restart lesson" aria-label="Restart lesson" className="btn-mini">
                      <Icon name="rotate-ccw" size={13}/>
                    </button>
                  </div>
                </div>
                <div className="mt-5 flex items-center justify-center gap-3">
                  <button onClick={() => go(-1)} disabled={pos === 0} aria-label="Previous word" className="btn-round">
                    <Icon name="chevron-left" size={20}/>
                  </button>
                  <button onClick={flip} className="btn-reveal">
                    {flipped ? 'Show hanzi' : 'Reveal meaning'}
                  </button>
                  <button onClick={() => go(1)} aria-label={pos === total - 1 ? 'Finish lesson' : 'Next word'} className="btn-round">
                    {pos === total - 1 ? <Icon name="check" size={20}/> : <Icon name="chevron-right" size={20}/>}
                  </button>
                </div>
                <p className="mt-4 text-center text-[11px] text-ink/35 dark:text-white/35">
                  {seen.size} of {total} reviewed · <span className="hidden sm:inline">keyboard: arrows navigate, space flips</span><span className="sm:hidden">tap the card to flip</span>
                </p>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* ================================================================
   404 + App shell
================================================================ */
function NotFound(){
  return (
    <div className="max-w-xl mx-auto px-6 py-24 text-center">
      <span className="seal w-14 h-14 text-2xl">迷</span>
      <h1 className="mt-6 font-serif text-4xl font-semibold tracking-tight">Lost your way?</h1>
      <p className="mt-3 text-ink/55 dark:text-white/55">That page isn't in the textbook. Head back to the levels and pick a deck.</p>
      <a href="#/" className="btn-primary mt-8">Back to levels <Icon name="arrow-right" size={16}/></a>
    </div>
  );
}

function App(){
  const route = useHashRoute();
  const [dark, setDark] = useDarkMode();
  const isLesson = route.name === 'lesson';
  let content = null, notFound = false;

  if (route.name === 'level') {
    const lv = api.getLevel(route.levelId);
    lv ? content = <LevelPage level={lv}/> : notFound = true;
  } else if (isLesson) {
    const lv = api.getLevel(route.levelId);
    const ls = lv && api.getLesson(route.levelId, route.lessonId);
    ls ? content = <LessonPage level={lv} lesson={ls}/> : notFound = true;
  } else {
    content = <HomePage/>;
  }

  useEffect(() => {
    let t = 'HanziBoss · HSK Flashcards';
    if (route.name === 'level') { const lv = api.getLevel(route.levelId); t = (lv ? lv.title : 'Not found') + ' · HanziBoss'; }
    if (route.name === 'lesson') { const ls = api.getLesson(route.levelId, route.lessonId); t = (ls ? ls.title : 'Lesson') + ' · HanziBoss'; }
    document.title = t;
  }, [route]);

  const totalWords = api.getLevels().reduce((a,l) => a + l.lessons.reduce((x,ls) => x + ls.words.length, 0), 0);

  return (
    <div className="min-h-screen flex flex-col">
      <Navbar dark={dark} onToggle={() => setDark(!dark)}/>
      <main key={window.location.hash || '#/'} className="page flex-1">
        {notFound ? <NotFound/> : content}
      </main>
      {!isLesson && !notFound && <Footer words={totalWords}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
