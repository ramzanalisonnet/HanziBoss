"时间过得真快，马上就要毕业了。毕业后你打算做什么？","spPy":"Xiǎoyǔ","py":"Shíjiān guò de zhēn kuài, mǎshàng jiù yào bìyè le. Bìyè hòu nǐ dǎsuàn zuò shénme?"},{"sp":"小夏","zh":"我还没想好呢，正想听听你的建议。你觉得在选择职业时，收入重要吗？","spPy":"Xiǎo Xià","py":"Wǒ hái méi xiǎnghǎo ne, zhèng xiǎng tīngting nǐ de jiànyì. Nǐ juéde zài xuǎnzé zhíyè shí, shōurù zhòngyào ma?"},{"sp":"小雨","zh":"在我看来，赚钱多少不是最重要的，兴趣才是关键。只有做自己喜欢的事，才会觉得幸福，将来也会有更好的发展。","spPy":"Xiǎoyǔ","py":"Zài wǒ kànlái, zhuànqián duōshao bú shì zuì zhòngyào de, xìngqù cái shì guānjiàn. Zhǐyǒu zuò zìjǐ xǐhuan de shì, cái huì juéde xìngfú, jiānglái yě huì yǒu gèng hǎo de fāzhǎn."},{"sp":"小夏","zh":"我也这么想。如果我带着热情去做自己喜欢的工作，就不会感到累。不过，现在什么东西都那么贵，生活压力太大了，没有钱也不会过得幸福啊！","spPy":"Xiǎo Xià","py":"Wǒ yě zhème xiǎng. Rúguǒ wǒ dàizhe rèqíng qù zuò zìjǐ xǐhuan de gōngzuò, jiù bú huì gǎndào lèi. Búguò, xiànzài shénme dōngxi dōu nàme guì, shēnghuó yālì tài dà le, méiyǒu qián yě bú huì guò de xìngfú a!"},{"sp":"小雨","zh":"幸福其实很简单，它不是只要有钱就能买到的。我觉得工作结束回家后，洗个热水澡，然后躺在床上看看书、听听音乐，困了睡睡觉，就很幸福。","spPy":"Xiǎoyǔ","py":"Xìngfú qíshí hěn jiǎndān, tā bú shì zhǐyào yǒu qián jiù néng mǎidào de. Wǒ juéde gōngzuò jiéshù huí jiā hòu, xǐ ge rèshuǐzǎo, ránhòu tǎng zài chuáng shang kànkan shū, tīngting yīnyuè, kùnle shuìshui jiào, jiù hěn xìngfú."},{"sp":"小夏","zh":"你说的也对。如果能找到一份自己感兴趣，收入又不错的工作，那就最好了。","spPy":"Xiǎo Xià","py":"Nǐ shuō de yě duì. Rúguǒ néng zhǎodào yí fèn zìjǐ gǎn xìngqù, shōurù yòu búcuò de gōngzuò, nà jiù zuì hǎo le."}]},{"k":4,"t":"p","lines":[{"zh":"有的人希望穿得再好一些，房子再大一些，认为经济条件越好人就越幸福。其实有很多富人过得并不愉快，而有些穷人却过得很快乐。有钱不一定幸福，因为很多东西都是不能用钱买到的，例如时间、感情、生活经历等。但是，从另外一个方面看，如果没钱，也很难过得幸福。当你生病了，如果由于缺钱而不能及时去看医生，你的健康都很难得到保证，就更别说幸福了。","py":"Yǒude rén xīwàng chuān de zài hǎo yìxiē, fángzi zài dà yìxiē, rènwéi jīngjì tiáojiàn yuè hǎo rén jiù yuè xìngfú. Qíshí yǒu hěn duō fùrén guò de bìng bù yúkuài, ér yǒuxiē qióngrén què guò de hěn kuàilè. Yǒu qián bù yídìng xìngfú, yīnwèi hěn duō dōngxi dōu shì bù néng yòng qián mǎidào de, lìrú shíjiān, gǎnqíng, shēnghuó jīnglì děng. Dànshì, cóng lìngwài yí ge fāngmiàn kàn, rúguǒ méi qián, yě hěn nán guò de xìngfú. Dāng nǐ shēngbìng le, rúguǒ yóuyú quē qián ér bù néng jíshí qù kàn yīshēng, nǐ de jiànkāng dōu hěn nán dédào bǎozhèng, jiù gèng biéshuō xìngfú le."}]},{"k":5,"t":"p","lines":[{"zh":"什么是幸福？有的人认为，工资高、能赚钱就是幸福；有的人认为，心情放松、身体健康才是幸福；也有人认为，能帮助别人就是一种幸福。还有人说，小时候幸福是一件东西，比如一块橡皮、一块糖，得到了就很幸福；长大后幸福是一种态度，生活的态度决定了我们幸福感的高低。那怎样才算是真正的幸福？其实，幸福并没有一个标准答案，每个人对幸福都有不同的理解。不管你认为幸福是什么，只要你用心去找，就一定能发现它。","py":"Shénme shì xìngfú? Yǒude rén rènwéi, gōngzī gāo, néng zhuànqián jiù shì xìngfú; yǒude rén rènwéi, xīnqíng fàngsōng, shēntǐ jiànkāng cái shì xìngfú; yě yǒu rén rènwéi, néng bāngzhù biérén jiù shì yì zhǒng xìngfú. Háiyǒu rén shuō, xiǎoshíhou xìngfú shì yí jiàn dōngxi, bǐrú yí kuài xiàngpí, yí kuài táng, dédàole jiù hěn xìngfú; zhǎngdà hòu xìngfú shì yì zhǒng tàidù, shēnghuó de tàidù juédìngle wǒmen xìngfúgǎn de gāodī. Nà zěnyàng cái suàn shì zhēnzhèng de xìngfú? Qíshí, xìngfú bìng méiyǒu yí ge biāozhǔn dá'àn, měi ge rén duì xìngfú dōu yǒu bù tóng de lǐjiě. Bùguǎn nǐ rènwéi xìngfú shì shénme, zhǐyào nǐ yòngxīn qù zhǎo, jiù yídìng néng fāxiàn tā."}]}]},"11":{"cn":"读书好，读好书，好读书","en":"It's Good to Read; Read Good Books and Like Reading","texts":[{"k":1,"t":"d","lines":[{"sp":"大卫","zh":"你来中国才一年，汉语就说得这么流利，真厉害！","spPy":"Dàwèi","py":"Nǐ lái Zhōngguó cái yì nián, Hànyǔ jiù shuō de zhème liúlì, zhēn lìhai!"},{"sp":"马克","zh":"谢谢！其实我的语法不太好，很多句子说得都不太准确。","spPy":"Mǎkè","py":"Xièxie! Qíshí wǒ de yǔfǎ bú tài hǎo, hěn duō jùzi shuō de dōu bú tài zhǔnquè."},{"sp":"大卫","zh":"但是我看你跟中国人交流没什么问题，你是怎么做到的？","spPy":"Dàwèi","py":"Dànshì wǒ kàn nǐ gēn Zhōngguó rén jiāoliú méi shénme wèntí, nǐ shì zěnme zuò dào de?"},{"sp":"马克","zh":"平时多交一些中国朋友，经常和他们聊天儿，听说能力自然就能得到很大的提高。另外，我建议你坚持看中文报纸，这样能学到很多新词语。","spPy":"Mǎkè","py":"Píngshí duō jiāo yìxiē Zhōngguó péngyou, jīngcháng hé tāmen liáotiānr, tīngshuō nénglì zìrán jiù néng dédào hěn dà de tígāo. Lìngwài, wǒ jiànyì nǐ jiānchí kàn Zhōngwén bàozhǐ, zhèyàng néng xuédào hěn duō xīn cíyǔ."},{"sp":"大卫","zh":"你太厉害了！连中文报纸都看得懂。","spPy":"Dàwèi","py":"Nǐ tài lìhai le! Lián Zhōngwén bàozhǐ dōu kàn de dǒng."},{"sp":"马克","zh":"刚开始肯定有困难，不过遇到不认识的词语，你可以查词典，然后写在本子上，有空儿就拿出来复习一下，慢慢地就会发现中文报纸也没那么难了。","spPy":"Mǎkè","py":"Gāng kāishǐ kěndìng yǒu kùnnan, búguò yùdào bú rènshi de cíyǔ, nǐ kěyǐ chá cídiǎn, ránhòu xiě zài běnzi shang, yǒu kòngr jiù ná chūlái fùxí yíxià, mànman de jiù huì fāxiàn Zhōngwén bàozhǐ yě méi nàme nán le."}]},{"k":2,"t":"d","lines":[{"sp":"小夏","zh":"考试结束了，你对自己的成绩满意吗？","spPy":"Xiǎo Xià","py":"Kǎoshì jiéshù le, nǐ duì zìjǐ de chéngjì mǎnyì ma?"},{"sp":"小雨","zh":"说真的，我不太满意。这次阅读考试的题太多了，我没做完。","spPy":"Xiǎoyǔ","py":"Shuō zhēn de, wǒ bú tài mǎnyì. Zhè cì yuèdú kǎoshì de tí tài duō le, wǒ méi zuòwán."},{"sp":"小夏","zh":"两个小时的时间应该来得及吧？","spPy":"Xiǎo Xià","py":"Liǎng ge xiǎoshí de shíjiān yīnggāi láidejí ba?"},{"sp":"小雨","zh":"这次主要是因为我先做了比较难、比较复杂的问题，结果花了太多时间，后面简单的题我虽然会，可是时间来不及，最后只好放弃了。","spPy":"Xiǎoyǔ","py":"Zhè cì zhǔyào shì yīnwèi wǒ xiān zuòle bǐjiào nán, bǐjiào fùzá de wèntí, jiéguǒ huāle tài duō shíjiān, hòumiàn jiǎndān de tí wǒ suīrán huì, kěshì shíjiān láibují, zuìhòu zhǐhǎo fàngqì le."},{"sp":"小夏","zh":"其实我考得也不怎么样。有几个填空题不会做，有几个选择题，实在想不出来该选哪个，就随便猜了一个答案，结果一个都没猜对。","spPy":"Xiǎo Xià","py":"Qíshí wǒ kǎo de yě bù zěnmeyàng. Yǒu jǐ ge tiánkòngtí bú huì zuò, yǒu jǐ ge xuǎnzetí, shízài xiǎng bù chūlái gāi xuǎn nǎge, jiù suíbiàn cāile yí ge dá'àn, jiéguǒ yí ge dōu méi cāiduì."},{"sp":"小雨","zh":"看来要想考好，不但要认真复习，还得注意考试的方法，否则，会做的题也没时间做了。","spPy":"Xiǎoyǔ","py":"Kànlái yào xiǎng kǎohǎo, búdàn yào rènzhēn fùxí, hái děi zhùyì kǎoshì de fāngfǎ, fǒuzé, huì zuò de tí yě méi shíjiān zuò le."}]},{"k":3,"t":"d","lines":[{"sp":"小林","zh":"你的客厅里怎么到处是书啊？这些书你都喜欢看吗？","spPy":"Xiǎo Lín","py":"Nǐ de kètīng li zěnme dàochù shì shū a? Zhèxiē shū nǐ dōu xǐhuan kàn ma?"},{"sp":"小李","zh":"当然，我每天都要看书。无论是普通杂志，还是著名小说，只要打开它们，就会发现，世界上有那么多有意思的事情，有那么多不一样的生活。","spPy":"Xiǎo Lǐ","py":"Dāngrán, wǒ měi tiān dōu yào kàn shū. Wúlùn shì pǔtōng zázhì, háishì zhùmíng xiǎoshuō, zhǐyào dǎkāi tāmen, jiù huì fāxiàn, shìjiè shang yǒu nàme duō yǒu yìsi de shìqing, yǒu nàme duō bù yíyàng de shēnghuó."},{"sp":"小林","zh":"想不到你工作那么忙，还能每天坚持阅读。","spPy":"Xiǎo Lín","py":"Xiǎngbudào nǐ gōngzuò nàme máng, hái néng měi tiān jiānchí yuèdú."},{"sp":"小李","zh":"如果3分钟读一页书，半个小时就可以读10页。每天花半个小时来读书，一个月就可以读300页，差不多就是一本书了。","spPy":"Xiǎo Lǐ","py":"Rúguǒ sān fēnzhōng dú yí yè shū, bàn ge xiǎoshí jiù kěyǐ dú shí yè. Měi tiān huā bàn ge xiǎoshí lái dú shū, yí ge yuè jiù kěyǐ dú sānbǎi yè, chàbuduō jiù shì yì běn shū le."},{"sp":"小林","zh":"是啊，一个真正爱看书的人总能找出时间来阅读。","spPy":"Xiǎo Lín","py":"Shì a, yí ge zhēnzhèng ài kàn shū de rén zǒng néng zhǎochū shíjiān lái yuèdú."},{"sp":"小李","zh":"坚持阅读，除了能增加知识外，还能帮助我减轻压力，人也会变得轻松起来。","spPy":"Xiǎo Lǐ","py":"Jiānchí yuèdú, chúle néng zēngjiā zhīshi wài, hái néng bāngzhù wǒ jiǎnqīng yālì, rén yě huì biàn de qīngsōng qǐlái."}]},{"k":4,"t":"p","lines":[{"zh":"根据调查，阅读能力好的人，不但容易找到工作，而且工资也比较高。怎么才能有效提高自己的阅读能力呢？做读书笔记就是其中一种好方法。读书笔记有很多种，最简单的就是把自己喜欢或者觉得有用的词语和句子记下来。另外，在看完一篇文章或一本书之后，还可以把它的主要内容和自己的想法写下来。然而，你不能完全相信书本上的内容，要有自己的看法和判断。坚持做读书笔记，对提高阅读能力有很大帮助。","py":"Gēnjù diàochá, yuèdú nénglì hǎo de rén, búdàn róngyì zhǎodào gōngzuò, érqiě gōngzī yě bǐjiào gāo. Zěnme cái néng yǒuxiào tígāo zìjǐ de yuèdú nénglì ne? Zuò dúshū bǐjì jiù shì qízhōng yì zhǒng hǎo fāngfǎ. Dúshū bǐjì yǒu hěn duō zhǒng, zuì jiǎndān de jiù shì bǎ zìjǐ xǐhuan huòzhě juéde yǒuyòng de cíyǔ hé jùzi jì xiàlái. Lìngwài, zài kànwán yì piān wénzhāng huò yì běn shū zhīhòu, hái kěyǐ bǎ tā de zhǔyào nèiróng hé zìjǐ de xiǎngfǎ xiě xiàlái. Rán'ér, nǐ bù néng wánquán xiāngxìn shūběn shang de nèiróng, yào yǒu zìjǐ de kànfǎ hé pànduàn. Jiānchí zuò dúshū bǐjì, duì tígāo yuèdú nénglì yǒu hěn dà bāngzhù."}]},{"k":5,"t":"p","lines":[{"zh":"“读书好，读好书，好读书”。虽然这句话只用了三个相同的汉字，但是不同的顺序却表示了不同的意思。首先，“读书好”说的是读书有很多好处；其次，每个人的时间都是有限的，不可能把世界上每一本书都读完，所以要读好的书；最后，“好读书”就是要养成阅读的习惯，使读书真正成为自己的兴趣爱好。阅读有许多好处，它能丰富你的知识，让你找到解决问题的办法；同时，它还会丰富你的情感，使你的生活更精彩。所以，让阅读成为你的习惯吧！","py":"“Dú shū hǎo, dú hǎo shū, hào dú shū”. Suīrán zhè jù huà zhǐ yòngle sān ge xiāngtóng de Hànzì, dànshì bù tóng de shùnxù què biǎoshìle bù tóng de yìsi. Shǒuxiān, “dú shū hǎo” shuō de shì dú shū yǒu hěn duō hǎochu; qícì, měi ge rén de shíjiān dōu shì yǒuxiàn de, bù kěnéng bǎ shìjiè shang měi yì běn shū dōu dúwán, suǒyǐ yào dú hǎo de shū; zuìhòu, “hào dú shū” jiù shì yào yǎngchéng yuèdú de xíguàn, shǐ dú shū zhēnzhèng chéngwéi zìjǐ de xìngqù àihào. Yuèdú yǒu xǔduō hǎochu, tā néng fēngfù nǐ de zhīshi, ràng nǐ zhǎodào jiějué wèntí de bànfǎ; tóngshí, tā hái huì fēngfù nǐ de qínggǎn, shǐ nǐ de shēnghuó gèng jīngcǎi. Suǒyǐ, ràng yuèdú chéngwéi nǐ de xíguàn ba!"}]}]},"12":{"cn":"用心发现世界","en":"Discover the World with Your Heart","texts":[{"k":1,"t":"d","lines":[{"sp":"王经理","zh":"听说这次生意你到现在还没谈成。","spPy":"Wáng jīnglǐ","py":"Tīngshuō zhè cì shēngyi nǐ dào xiànzài hái méi tánchéng."},{"sp":"马经理","zh":"按我以前的经验，早应该谈成了，这次我也不知道哪儿出了问题。","spPy":"Mǎ jīnglǐ","py":"Àn wǒ yǐqián de jīngyàn, zǎo yīnggāi tánchéng le, zhè cì wǒ yě bù zhīdào nǎr chūle wèntí."},{"sp":"王经理","zh":"有句话叫“规定和经验是死的，人是活的”。当“规定”和“经验”不能解决问题时，建议你改变一下自己的态度和想法。","spPy":"Wáng jīnglǐ","py":"Yǒu jù huà jiào “guīdìng hé jīngyàn shì sǐ de, rén shì huó de”. Dāng “guīdìng” hé “jīngyàn” bù néng jiějué wèntí shí, jiànyì nǐ gǎibiàn yíxià zìjǐ de tàidù hé xiǎngfǎ."},{"sp":"马经理","zh":"很多时候，我都习惯根据过去的经验做事，可惜，经验不是全部都是对的。","spPy":"Mǎ jīnglǐ","py":"Hěn duō shíhou, wǒ dōu xíguàn gēnjù guòqù de jīngyàn zuò shì, kěxī, jīngyàn bú shì quánbù dōu shì duì de."},{"sp":"王经理","zh":"遇到不能解决的问题时，我们应该试着走走以前从来没走过的路，也许这样就能找到解决问题的方法了。","spPy":"Wáng jīnglǐ","py":"Yùdào bù néng jiějué de wèntí shí, wǒmen yīnggāi shìzhe zǒuzou yǐqián cónglái méi zǒuguo de lù, yěxǔ zhèyàng jiù néng zhǎodào jiějué wèntí de fāngfǎ le."},{"sp":"马经理","zh":"好，我再跟同事商量商量，希望能及时发现问题，并且准确地找到解决问题的方法。","spPy":"Mǎ jīnglǐ","py":"Hǎo, wǒ zài gēn tóngshì shāngliang shāngliang, xīwàng néng jíshí fāxiàn wèntí, bìngqiě zhǔnquè de zhǎodào jiějué wèntí de fāngfǎ."}]},{"k":2,"t":"d","lines":[{"sp":"女儿","zh":"妈，您看我刚买的裤子，洗完以后颜色怎么变得这么难看呢？","spPy":"Nǚ'ér","py":"Mā, nín kàn wǒ gāng mǎi de kùzi, xǐwán yǐhòu yánsè zěnme biàn de zhème nánkàn ne?"},{"sp":"高老师","zh":"看来是掉颜色了，你洗的时候在水里加点儿盐就不会这样了。","spPy":"Gāo lǎoshī","py":"Kànlái shì diào yánsè le, nǐ xǐ de shíhou zài shuǐ li jiā diǎnr yán jiù bú huì zhèyàng le."},{"sp":"女儿","zh":"放盐？！盐不是用来做饭的吗？难道它还能让衣服不掉颜色？","spPy":"Nǚ'ér","py":"Fàng yán?! Yán bú shì yòng lái zuòfàn de ma? Nándào tā hái néng ràng yīfu bú diào yánsè?"},{"sp":"高老师","zh":"当然。有些衣服第一次洗的时候会掉颜色，其实，有很多方法可以解决这个问题。在水里加勺盐再洗是最简单的方法。用盐水来洗新衣服，这样穿得再久、洗的次数再多，衣服也不容易掉颜色。","spPy":"Gāo lǎoshī","py":"Dāngrán. Yǒuxiē yīfu dì-yī cì xǐ de shíhou huì diào yánsè, qíshí, yǒu hěn duō fāngfǎ kěyǐ jiějué zhège wèntí. Zài shuǐ li jiā sháo yán zài xǐ shì zuì jiǎndān de fāngfǎ. Yòng yánshuǐ lái xǐ xīn yīfu, zhèyàng chuān de zài jiǔ, xǐ de cìshù zài duō, yīfu yě bù róngyì diào yánsè."},{"sp":"女儿","zh":"我第一次听说盐有保护衣服颜色的作用，生活中还真有不少课本上无法学到的知识。","spPy":"Nǚ'ér","py":"Wǒ dì-yī cì tīngshuō yán yǒu bǎohù yīfu yánsè de zuòyòng, shēnghuó zhōng hái zhēn yǒu bù shǎo kèběn shang wúfǎ xuédào de zhīshi."},{"sp":"高老师","zh":"实际上，很多问题的答案都可以从生活中找到。但这需要你用眼睛去发现，用心去总结。","spPy":"Gāo lǎoshī","py":"Shíjì shang, hěn duō wèntí de dá'àn dōu kěyǐ cóng shēnghuó zhōng zhǎodào. Dàn zhè xūyào nǐ yòng yǎnjing qù fāxiàn, yòngxīn qù zǒngjié."}]},{"k":3,"t":"d","lines":[{"sp":"高老师","zh":"王教授，今天听完您的这节课，我终于明白为什么您的课那么受学生欢迎了。","spPy":"Gāo lǎoshī","py":"Wáng jiàoshòu, jīntiān tīngwán nín de zhè jié kè, wǒ zhōngyú míngbai wèi shénme nín de kè nàme shòu xuésheng huānyíng le."},{"sp":"王教授","zh":"谢谢！您能详细谈谈对我的课的看法吗？","spPy":"Wáng jiàoshòu","py":"Xièxie! Nín néng xiángxì tántan duì wǒ de kè de kànfǎ ma?"},{"sp":"高老师","zh":"我发现您对学生特别了解，而且总是能用最简单的方法把复杂的问题解释清楚，让每个学生都能听懂，这一点真是值得我们好好儿学习。","spPy":"Gāo lǎoshī","py":"Wǒ fāxiàn nín duì xuésheng tèbié liǎojiě, érqiě zǒngshì néng yòng zuì jiǎndān de fāngfǎ bǎ fùzá de wèntí jiěshì qīngchu, ràng měi ge xuésheng dōu néng tīngdǒng, zhè yì diǎn zhēn shì zhídé wǒmen hǎohāor xuéxí."},{"sp":"王教授","zh":"哪里哪里，这只是因为我对每个学生的能力水平比较了解。","spPy":"Wáng jiàoshòu","py":"Nǎli nǎli, zhè zhǐshì yīnwèi wǒ duì měi ge xuésheng de nénglì shuǐpíng bǐjiào liǎojiě."},{"sp":"高老师","zh":"那您认为对于老师来说，什么是最难做到的？","spPy":"Gāo lǎoshī","py":"Nà nín rènwéi duìyú lǎoshī lái shuō, shénme shì zuì nán zuòdào de?"},{"sp":"王教授","zh":"世界上没有完全相同的叶子，同样地，世界上也没有完全一样的人。所以，在教育学生时，要根据学生的特点选择不同的方法，我想这应该是最不容易做到的。","spPy":"Wáng jiàoshòu","py":"Shìjiè shang méiyǒu wánquán xiāngtóng de yèzi, tóngyàng de, shìjiè shang yě méiyǒu wánquán yíyàng de rén. Suǒyǐ, zài jiàoyù xuésheng shí, yào gēnjù xuésheng de tèdiǎn xuǎnzé bù tóng de fāngfǎ, wǒ xiǎng zhè yīnggāi shì zuì bù róngyì zuòdào de."}]},{"k":4,"t":"p","lines":[{"zh":"人人都会使用语言，但是怎么用语言把话说好却是一门艺术。看一个人怎么说话，往往可以比较准确地判断出他是一个什么样的人。有的人心里怎么想，嘴上就怎么说，即使是别人的缺点，他也会直接说出来，这样的人虽然很诚实，但是可能会引起别人的误会；有的人虽然也看到了别人的缺点，但却不会直接指出来，而是通过别的方法来提醒，让他认识到自己的缺点，这样的人会让人觉得更友好。","py":"Rénrén dōu huì shǐyòng yǔyán, dànshì zěnme yòng yǔyán bǎ huà shuōhǎo què shì yì mén yìshù. Kàn yí ge rén zěnme shuōhuà, wǎngwǎng kěyǐ bǐjiào zhǔnquè de pànduàn chū tā shì yí ge shénmeyàng de rén. Yǒude rén xīnli zěnme xiǎng, zuǐ shang jiù zěnme shuō, jíshǐ shì biérén de quēdiǎn, tā yě huì zhíjiē shuō chūlái, zhèyàng de rén suīrán hěn chéngshí, dànshì kěnéng huì yǐnqǐ biérén de wùhuì; yǒude rén suīrán yě kàndàole biérén de quēdiǎn, dàn què bú huì zhíjiē zhǐ chūlái, ér shì tōngguò biéde fāngfǎ lái tíxǐng, ràng tā rènshi dào zìjǐ de quēdiǎn, zhèyàng de rén huì ràng rén juéde gèng yǒuhǎo."}]},{"k":5,"t":"p","lines":[{"zh":"无论做什么事情，都要注意方法，学习尤其是这样。使用正确的方法，我们做起事来能“事半功倍”，也就是说，能节约时间，用较少的力气，取得更好的效果。相反，如果方法不对，可能花五倍甚至十倍的时间都不能完成任务，结果变成了“事倍功半”。有一点需要提醒大家，别人的方法也许很有效，但是并不一定适合自己。因此，我们应该在听取别人意见的同时，仔细考虑一下，再根据不同的情况选择不同的方法，这样才能达到最好的效果。","py":"Wúlùn zuò shénme shìqing, dōu yào zhùyì fāngfǎ, xuéxí yóuqí shì zhèyàng. Shǐyòng zhèngquè de fāngfǎ, wǒmen zuòqǐ shì lái néng “shì bàn gōng bèi”, yě jiùshì shuō, néng jiéyuē shíjiān, yòng jiào shǎo de lìqi, qǔdé gèng hǎo de xiàoguǒ. Xiāngfǎn, rúguǒ fāngfǎ bú duì, kěnéng huā wǔ bèi shènzhì shí bèi de shíjiān dōu bù néng wánchéng rènwu, jiéguǒ biànchéngle “shì bèi gōng bàn”. Yǒu yì diǎn xūyào tíxǐng dàjiā, biérén de fāngfǎ yěxǔ hěn yǒuxiào, dànshì bìng bù yídìng shìhé zìjǐ. Yīncǐ, wǒmen yīnggāi zài tīngqǔ biérén yìjiàn de tóngshí, zǐxì kǎolǜ yíxià, zài gēnjù bù tóng de qíngkuàng xuǎnzé bù tóng de fāngfǎ, zhèyàng cái néng dádào zuì hǎo de xiàoguǒ."}]}]},"13":{"cn":"喝着茶看京剧","en":"Drink Tea While Watching Beijing Opera","texts":[{"k":1,"t":"d","lines":[{"sp":"小雨","zh":"小夏，你爷爷京剧唱得真专业，我还以为他是京剧演员呢。","spPy":"Xiǎoyǔ","py":"Xiǎo Xià, nǐ yéye jīngjù chàng de zhēn zhuānyè, wǒ hái yǐwéi tā shì jīngjù yǎnyuán ne."},{"sp":"小夏","zh":"对啊，他本来就是京剧演员，年轻时在我们那儿很有名，深受观众们的喜爱。","spPy":"Xiǎo Xià","py":"Duì a, tā běnlái jiù shì jīngjù yǎnyuán, niánqīng shí zài wǒmen nàr hěn yǒumíng, shēn shòu guānzhòngmen de xǐ'ài."},{"sp":"小雨","zh":"你爷爷一定对京剧有着很深厚的感情。","spPy":"Xiǎoyǔ","py":"Nǐ yéye yídìng duì jīngjù yǒuzhe hěn shēnhòu de gǎnqíng."},{"sp":"小夏","zh":"是呀，他8岁就开始上台演出，到现在大概唱了60多年了，他对这门艺术的喜爱从来没有改变过。","spPy":"Xiǎo Xià","py":"Shì ya, tā bā suì jiù kāishǐ shàngtái yǎnchū, dào xiànzài dàgài chàngle liùshí duō nián le, tā duì zhè mén yìshù de xǐ'ài cónglái méiyǒu gǎibiàn guo."},{"sp":"小雨","zh":"这么说你喜欢听京剧也是受了你爷爷的影响？","spPy":"Xiǎoyǔ","py":"Zhème shuō nǐ xǐhuan tīng jīngjù yě shì shòule nǐ yéye de yǐngxiǎng?"},{"sp":"小夏","zh":"我小时候经常去看他的演出。平时他还给我讲很多京剧里的历史故事，让我学到了很多知识。","spPy":"Xiǎo Xià","py":"Wǒ xiǎoshíhou jīngcháng qù kàn tā de yǎnchū. Píngshí tā hái gěi wǒ jiǎng hěn duō jīngjù li de lìshǐ gùshi, ràng wǒ xuédàole hěn duō zhīshi."}]},{"k":2,"t":"d","lines":[{"sp":"小雨","zh":"真没想到你一个来自美国的外国留学生，能把京剧唱得这么好。","spPy":"Xiǎoyǔ","py":"Zhēn méi xiǎngdào nǐ yí ge láizì Měiguó de wàiguó liúxuéshēng, néng bǎ jīngjù chàng de zhème hǎo."},{"sp":"马克","zh":"我常常跟着电视学唱京剧，然后一遍一遍地练习，偶尔跟中国人一起唱上几句。","spPy":"Mǎkè","py":"Wǒ chángcháng gēnzhe diànshì xué chàng jīngjù, ránhòu yí biàn yí biàn de liànxí, ǒu'ěr gēn Zhōngguó rén yìqǐ chàngshang jǐ jù."},{"sp":"小雨","zh":"难道你从来没有接受过京剧方面的专门教育吗？","spPy":"Xiǎoyǔ","py":"Nándào nǐ cónglái méiyǒu jiēshòuguo jīngjù fāngmiàn de zhuānmén jiàoyù ma?"},{"sp":"马克","zh":"别吃惊，因为我以前学习过音乐，有一些音乐基础，又对京剧这种表演艺术非常感兴趣，所以能比较容易地学会它的唱法。","spPy":"Mǎkè","py":"Bié chījīng, yīnwèi wǒ yǐqián xuéxíguo yīnyuè, yǒu yìxiē yīnyuè jīchǔ, yòu duì jīngjù zhè zhǒng biǎoyǎn yìshù fēicháng gǎn xìngqù, suǒyǐ néng bǐjiào róngyì de xuéhuì tā de chàngfǎ."},{"sp":"小雨","zh":"你真厉害！竟然连很多中国人都听不懂的京剧也能学会。我还是比较喜欢听流行音乐。","spPy":"Xiǎoyǔ","py":"Nǐ zhēn lìhai! Jìngrán lián hěn duō Zhōngguó rén dōu tīngbudǒng de jīngjù yě néng xuéhuì. Wǒ háishì bǐjiào xǐhuan tīng liúxíng yīnyuè."},{"sp":"马克","zh":"那是你不了解京剧的唱法。在音乐方面，京剧给了我很多新的想法。我还把京剧的一些特点增加到了自己的音乐中，达到了很好的效果。","spPy":"Mǎkè","py":"Nà shì nǐ bù liǎojiě jīngjù de chàngfǎ. Zài yīnyuè fāngmiàn, jīngjù gěile wǒ hěn duō xīn de xiǎngfǎ. Wǒ hái bǎ jīngjù de yìxiē tèdiǎn zēngjiā dàole zìjǐ de yīnyuè zhōng, dádàole hěn hǎo de xiàoguǒ."}]},{"k":3,"t":"d","lines":[{"sp":"李老师","zh":"校长，因为外国留学生不了解中国文化，有时候会影响他们和中国���之间的正常交流，甚至还可能引起误会，带来麻烦，所以我们想申请举办一次中国传统文化节活动。","spPy":"Lǐ lǎoshī","py":"Xiàozhǎng, yīnwèi wàiguó liúxuéshēng bù liǎojiě Zhōngguó wénhuà, yǒu shíhou huì yǐngxiǎng tāmen hé Zhōngguó rén zhījiān de zhèngcháng jiāoliú, shènzhì hái kěnéng yǐnqǐ wùhuì, dàilái máfan, suǒyǐ wǒmen xiǎng shēnqǐng jǔbàn yí cì Zhōngguó chuántǒng wénhuàjié huódòng."},{"sp":"校长","zh":"你们的想法很好，举办文化节活动，一方面能让各国学生更好地了解中国，另一方面也能为学生们提供互相交流和学习的机会。","spPy":"Xiàozhǎng","py":"Nǐmen de xiǎngfǎ hěn hǎo, jǔbàn wénhuàjié huódòng, yì fāngmiàn néng ràng gè guó xuésheng gèng hǎo de liǎojiě Zhōngguó, lìng yì fāngmiàn yě néng wèi xuéshengmen tígōng hùxiāng jiāoliú hé xuéxí de jīhuì."},{"sp":"李老师","zh":"谢谢您的支持！","spPy":"Lǐ lǎoshī","py":"Xièxie nín de zhīchí!"},{"sp":"校长","zh":"上次的春游活动你们办得非常有趣，大家都玩儿得很开心，这次活动继续由你负责，相信也一定会很成功。","spPy":"Xiàozhǎng","py":"Shàng cì de chūnyóu huódòng nǐmen bàn de fēicháng yǒuqù, dàjiā dōu wánr de hěn kāixīn, zhè cì huódòng jìxù yóu nǐ fùzé, xiāngxìn yě yídìng huì hěn chénggōng."},{"sp":"李老师","zh":"我们回去就开会讨论，星期五之前把详细的计划书发给您。","spPy":"Lǐ lǎoshī","py":"Wǒmen huíqù jiù kāihuì tǎolùn, xīngqīwǔ zhīqián bǎ xiángxì de jìhuàshū fā gěi nín."},{"sp":"校长","zh":"好的，准备过程中有什么问题，你们可以直接来找我。","spPy":"Xiàozhǎng","py":"Hǎo de, zhǔnbèi guòchéng zhōng yǒu shénme wèntí, nǐmen kěyǐ zhíjiē lái zhǎo wǒ."}]},{"k":4,"t":"p","lines":[{"zh":"筷子在中国大约已经有3000多年的历史了。对外国人来说，使用筷子吃饭并不容易，所以，国外的一些中国餐厅在放筷子的纸袋上会提供使用筷子的详细说明。不过，如果你认为每个中国人都会正确使用筷子，那就错了。有人在互联网上专门进行过调查，结果发现每六个中国人中就有一个使用筷子的方法是错误的。如果你想正确使用筷子，那就好好练习吧。","py":"Kuàizi zài Zhōngguó dàyuē yǐjīng yǒu sānqiān duō nián de lìshǐ le. Duì wàiguó rén lái shuō, shǐyòng kuàizi chīfàn bìng bù róngyì, suǒyǐ, guówài de yìxiē Zhōngguó cāntīng zài fàng kuàizi de zhǐdài shang huì tígōng shǐyòng kuàizi de xiángxì shuōmíng. Búguò, rúguǒ nǐ rènwéi měi ge Zhōngguó rén dōu huì zhèngquè shǐyòng kuàizi, nà jiù cuò le. Yǒu rén zài hùliánwǎng shang zhuānmén jìnxíngguo diàochá, jiéguǒ fāxiàn měi liù ge Zhōngguó rén zhōng jiù yǒu yí ge shǐyòng kuàizi de fāngfǎ shì cuòwù de. Rúguǒ nǐ xiǎng zhèngquè shǐyòng kuàizi, nà jiù hǎohāor liànxí ba."}]},{"k":5,"t":"p","lines":[{"zh":"茶在中国有几千年的历史，是中国最常见的饮料。最早的时候，茶只是被当作一种药，而不是饮料。后来，随着人们对茶的认识的加深，慢慢开始把它当作解渴的饮料，这才慢慢有了中国的茶文化。在中国，喝茶是一种十分普遍的生活习惯。对很多中国人来说，喝茶已成为他们生活中不可缺少的一部分。但是有的饮料虽然名字叫“茶”，却并不是真正的茶。比如广东省的人爱喝的“凉茶”，它的味道稍微有点儿苦，其实是一种用中药做成的饮料。","py":"Chá zài Zhōngguó yǒu jǐqiān nián de lìshǐ, shì Zhōngguó zuì chángjiàn de yǐnliào. Zuì zǎo de shíhou, chá zhǐshì bèi dàngzuò yì zhǒng yào, ér bú shì yǐnliào. Hòulái, suízhe rénmen duì chá de rènshi de jiāshēn, mànman kāishǐ bǎ tā dàngzuò jiěkě de yǐnliào, zhè cái mànman yǒule Zhōngguó de chá wénhuà. Zài Zhōngguó, hē chá shì yì zhǒng shífēn pǔbiàn de shēnghuó xíguàn. Duì hěn duō Zhōngguó rén lái shuō, hē chá yǐ chéngwéi tāmen shēnghuó zhōng bùkě quēshǎo de yí bùfen. Dànshì yǒude yǐnliào suīrán míngzi jiào “chá”, què bìng bú shì zhēnzhèng de chá. Bǐrú Guǎngdōng Shěng de rén ài hē de “liángchá”, tā de wèidào shāowēi yǒudiǎnr kǔ, qíshí shì yì zhǒng yòng zhōngyào zuòchéng de yǐnliào."}]}]},"14":{"cn":"保护地球母亲","en":"Protect Our Mother Earth","texts":[{"k":1,"t":"d","lines":[{"sp":"王静","zh":"这是明天你出差要带的毛巾、牙膏和牙刷，把它们放到箱子里吧。","spPy":"Wáng Jìng","py":"Zhè shì míngtiān nǐ chūchāi yào dài de máojīn, yágāo hé yáshuā, bǎ tāmen fàngdào xiāngzi li ba."},{"sp":"李进","zh":"不用拿这些，宾馆都会免费提供的。再说，箱子已经够重的了！","spPy":"Lǐ Jìn","py":"Búyòng ná zhèxiē, bīnguǎn dōu huì miǎnfèi tígōng de. Zàishuō, xiāngzi yǐjīng gòu zhòng de le!"},{"sp":"王静","zh":"我当然知道宾馆里有。你不是一直说要保护环境吗？现在就从身边的小事做起吧。","spPy":"Wáng Jìng","py":"Wǒ dāngrán zhīdào bīnguǎn li yǒu. Nǐ bú shì yìzhí shuō yào bǎohù huánjìng ma? Xiànzài jiù cóng shēnbiān de xiǎoshì zuòqǐ ba."},{"sp":"李进","zh":"行，没问题。我明天上午10点的飞机，你能开车把我送到机场吗？","spPy":"Lǐ Jìn","py":"Xíng, méi wèntí. Wǒ míngtiān shàngwǔ shí diǎn de fēijī, nǐ néng kāichē bǎ wǒ sòngdào jīchǎng ma?"},{"sp":"王静","zh":"那个时间路上堵车多严重啊！你还是坐地铁去机场吧。这样不仅省油钱，而且还不会污染空气。","spPy":"Wáng Jìng","py":"Nàge shíjiān lùshang dǔchē duō yánzhòng a! Nǐ háishì zuò dìtiě qù jīchǎng ba. Zhèyàng bùjǐn shěng yóuqián, érqiě hái bú huì wūrǎn kōngqì."},{"sp":"李进","zh":"好，那就听你的。","spPy":"Lǐ Jìn","py":"Hǎo, nà jiù tīng nǐ de."}]},{"k":2,"t":"d","lines":[{"sp":"经理","zh":"小王，卫生间怎么那么脏啊？这会给客人留下不好的印象，快去打扫一下。","spPy":"Jīnglǐ","py":"Xiǎo Wáng, wèishēngjiān zěnme nàme zāng a? Zhè huì gěi kèrén liúxià bù hǎo de yìnxiàng, kuài qù dǎsǎo yíxià."},{"sp":"服务员","zh":"经理，实在抱歉。今天店里太忙了，我还没来得及打扫。","spPy":"Fúwùyuán","py":"Jīnglǐ, shízài bàoqiàn. Jīntiān diàn li tài máng le, wǒ hái méi láidejí dǎsǎo."},{"sp":"经理","zh":"那张桌子下面还有一些空饮料瓶子和纸盒子。","spPy":"Jīnglǐ","py":"Nà zhāng zhuōzi xiàmiàn hái yǒu yìxiē kōng yǐnliàopíngzi hé zhǐhézi."},{"sp":"服务员","zh":"好的，我马上就去把它们扔掉。","spPy":"Fúwùyuán","py":"Hǎo de, wǒ mǎshàng jiù qù bǎ tāmen rēngdiào."},{"sp":"经理","zh":"以后你一定得注意这个问题，不管客人多多，生意多忙，我们都要保证餐厅干净卫生。","spPy":"Jīnglǐ","py":"Yǐhòu nǐ yídìng děi zhùyì zhège wèntí, bùguǎn kèrén duō duo, shēngyi duō máng, wǒmen dōu yào bǎozhèng cāntīng gānjìng wèishēng."},{"sp":"服务员","zh":"经理您放心，我一定以最快的速度完成。不过咱们真的应该再多招聘几个服务员了。","spPy":"Fúwùyuán","py":"Jīnglǐ nín fàngxīn, wǒ yídìng yǐ zuì kuài de sùdù wánchéng. Búguò zánmen zhēn de yīnggāi zài duō zhāopìn jǐ ge fúwùyuán le."}]},{"k":3,"t":"d","lines":[{"sp":"孙月","zh":"早上听新闻说明天有一个叫“地球一小时”的活动，你对这个活动了解吗？","spPy":"Sūn Yuè","py":"Zǎoshang tīng xīnwén shuō míngtiān yǒu yí ge jiào “Dìqiú Yī Xiǎoshí” de huódòng, nǐ duì zhège huódòng liǎojiě ma?"},{"sp":"王静","zh":"这个活动年年都有，最早是从2007年开始的。明天晚上很多人都会关灯一小时，支持这个活动。你没看到门口的通知吗��我们公司也参加。","spPy":"Wáng Jìng","py":"Zhège huódòng niánnián dōu yǒu, zuì zǎo shì cóng èr líng líng qī nián kāishǐ de. Míngtiān wǎnshang hěn duō rén dōu huì guān dēng yì xiǎoshí, zhīchí zhège huódòng. Nǐ méi kàndào ménkǒu de tōngzhī ma? Wǒmen gōngsī yě cānjiā."},{"sp":"孙月","zh":"真的吗？太好了！既然明天晚上公司会关灯停电，那么我们肯定不用加班了。","spPy":"Sūn Yuè","py":"Zhēn de ma? Tài hǎo le! Jìrán míngtiān wǎnshang gōngsī huì guān dēng tíng diàn, nàme wǒmen kěndìng búyòng jiābān le."},{"sp":"王静","zh":"看你得意的样子！还以为你高兴是为了支持环保，原来是因为不用加班啊！","spPy":"Wáng Jìng","py":"Kàn nǐ déyì de yàngzi! Hái yǐwéi nǐ gāoxìng shì wèile zhīchí huánbǎo, yuánlái shì yīnwèi búyòng jiābān a!"},{"sp":"孙月","zh":"环境保护我当然也支持了！对了，为什么会有这么一个活动啊？","spPy":"Sūn Yuè","py":"Huánjìng bǎohù wǒ dāngrán yě zhīchí le! Duìle, wèi shénme huì yǒu zhème yí ge huódòng a?"},{"sp":"王静","zh":"其实目的挺简单的，就是提醒人们节约用电，希望引起人们对气候变暖问题的关注。","spPy":"Wáng Jìng","py":"Qíshí mùdì tǐng jiǎndān de, jiù shì tíxǐng rénmen jiéyuē yòng diàn, xīwàng yǐnqǐ rénmen duì qìhòu biàn nuǎn wèntí de guānzhù."}]},{"k":4,"t":"p","lines":[{"zh":"塑料袋给人们的生活带来方便，受到人们的普遍欢迎，可是，它的大量使用也带来了严重的环境污染问题。于是，一些国家规定，超市、商场不能为顾客提供免费塑料袋，并且鼓励大家购买可以多次使用的购物袋。我们每个人都有责任保护环境，因此，请大家节约使用塑料袋，或者购物时自备购物袋，甚至拒绝使用塑料袋。虽然这是一件很小的事，但这样做可以减少塑料袋的使用数量，对环境保护有很大的作用。","py":"Sùliàodài gěi rénmen de shēnghuó dàilái fāngbiàn, shòudào rénmen de pǔbiàn huānyíng, kěshì, tā de dàliàng shǐyòng yě dàiláile yánzhòng de huánjìng wūrǎn wèntí. Yúshì, yìxiē guójiā guīdìng, chāoshì, shāngchǎng bù néng wèi gùkè tígōng miǎnfèi sùliàodài, bìngqiě gǔlì dàjiā gòumǎi kěyǐ duō cì shǐyòng de gòuwùdài. Wǒmen měi ge rén dōu yǒu zérèn bǎohù huánjìng, yīncǐ, qǐng dàjiā jiéyuē shǐyòng sùliàodài, huòzhě gòuwù shí zìbèi gòuwùdài, shènzhì jùjué shǐyòng sùliàodài. Suīrán zhè shì yí jiàn hěn xiǎo de shì, dàn zhèyàng zuò kěyǐ jiǎnshǎo sùliàodài de shǐyòng shùliàng, duì huánjìng bǎohù yǒu hěn dà de zuòyòng."}]},{"k":5,"t":"p","lines":[{"zh":"保护地球环境，并不是一件离我们很远、很难做到的事情。实际上，我们只需注意一下身边的小事就可以。例如，夏天把空调的温度开得高一些，出门时记得关空调和电脑，这样可以节约用电；少开车，多骑车或者乘坐地铁和公共汽车，这样能降低空气污染；还有养成把垃圾丢进垃圾桶的习惯什么的。这些是我们每个人都能够做到的小事，但却有实实在在的效果。地球是我们共同的家，只有大家共同努力，减少污染、保护环境，才能使我们的家变得更美丽。","py":"Bǎohù dìqiú huánjìng, bìng bú shì yí jiàn lí wǒmen hěn yuǎn, hěn nán zuòdào de shìqing. Shíjì shang, wǒmen zhǐ xū zhùyì yíxià shēnbiān de xiǎoshì jiù kěyǐ. Lìrú, xiàtiān bǎ kōngtiáo de wēndù kāi de gāo yìxiē, chūmén shí jìde guān kōngtiáo hé diànnǎo, zhèyàng kěyǐ jiéyuē yòng diàn; shǎo kāichē, duō qí chē huòzhě chéngzuò dìtiě hé gōnggòng qìchē, zhèyàng néng jiàngdī kōngqì wūrǎn; hái yǒu yǎngchéng bǎ lājī diūjìn lājītǒng de xíguàn shénme de. Zhèxiē shì wǒmen měi ge rén dōu nénggòu zuòdào de xiǎoshì, dàn què yǒu shíshízàizài de xiàoguǒ. Dìqiú shì wǒmen gòngtóng de jiā, zhǐyǒu dàjiā gòngtóng nǔlì, jiǎnshǎo wūrǎn, bǎohù huánjìng, cái néng shǐ wǒmen de jiā biàn de gèng měilì."}]}]},"15":{"cn":"教育孩子的艺术","en":"The Art of Educating Children","texts":[{"k":1,"t":"d","lines":[{"sp":"王静","zh":"那个一边弹钢琴一边唱歌的男孩子是谁？表演得真棒！","spPy":"Wáng Jìng","py":"Nàge yìbiān tán gāngqín yìbiān chànggē de nánháizi shì shéi? Biǎoyǎn de zhēn bàng!"},{"sp":"李老师","zh":"是我孙子。去年寒假前的新年晚会他也表演过一次。","spPy":"Lǐ lǎoshī","py":"Shì wǒ sūnzi. Qùnián hánjià qián de xīnnián wǎnhuì tā yě biǎoyǎnguo yí cì."},{"sp":"王静","zh":"我想起来了，这孩子又聪明又可爱，你们教育得真好！","spPy":"Wáng Jìng","py":"Wǒ xiǎng qǐlái le, zhè háizi yòu cōngming yòu kě'ài, nǐmen jiàoyù de zhēn hǎo!"},{"sp":"李老师","zh":"是他父母教育得好。父母是孩子最重要的老师。他父母不仅教他知识，而且还花了很长时间帮助他养成了非常好的习惯，现在他每天都自己练习弹钢琴。","spPy":"Lǐ lǎoshī","py":"Shì tā fùmǔ jiàoyù de hǎo. Fùmǔ shì háizi zuì zhòngyào de lǎoshī. Tā fùmǔ bùjǐn jiāo tā zhīshi, érqiě hái huāle hěn cháng shíjiān bāngzhù tā yǎngchéngle fēicháng hǎo de xíguàn, xiànzài tā měi tiān dōu zìjǐ liànxí tán gāngqín."},{"sp":"王静","zh":"让孩子养成一个好习惯实在太重要了，看来我得向他父母好好儿学习。","spPy":"Wáng Jìng","py":"Ràng háizi yǎngchéng yí ge hǎo xíguàn shízài tài zhòngyào le, kànlái wǒ děi xiàng tā fùmǔ hǎohāor xuéxí."},{"sp":"李老师","zh":"对。如果希望有一个优秀的孩子，你就要先成为一位优秀的父亲或者母亲。","spPy":"Lǐ lǎoshī","py":"Duì. Rúguǒ xīwàng yǒu yí ge yōuxiù de háizi, nǐ jiù yào xiān chéngwéi yí wèi yōuxiù de fùqīn huòzhě mǔqīn."}]},{"k":2,"t":"d","lines":[{"sp":"王静","zh":"看你脸色不太好，是不是昨晚没休息好？","spPy":"Wáng Jìng","py":"Kàn nǐ liǎnsè bú tài hǎo, shì bú shì zuówǎn méi xiūxi hǎo?"},{"sp":"孙月","zh":"别���了。我女儿昨晚做作业又做到11点。","spPy":"Sūn Yuè","py":"Biétí le. Wǒ nǚ'ér zuówǎn zuò zuòyè yòu zuòdào shíyī diǎn."},{"sp":"王静","zh":"睡觉太晚对孩子的身体没有好处。最近孩子作业是不是太多了？","spPy":"Wáng Jìng","py":"Shuìjiào tài wǎn duì háizi de shēntǐ méiyǒu hǎochu. Zuìjìn háizi zuòyè shì bú shì tài duō le?"},{"sp":"孙月","zh":"主要是她做事情比较慢，比如早上闹钟响了她不醒，我赶时间送她上学，她又急着上厕所。每天因为这些小事批评她，弄得我俩心情都不好。","spPy":"Sūn Yuè","py":"Zhǔyào shì tā zuò shìqing bǐjiào màn, bǐrú zǎoshang nàozhōng xiǎngle tā bù xǐng, wǒ gǎn shíjiān sòng tā shàngxué, tā yòu jízhe shàng cèsuǒ. Měi tiān yīnwèi zhèxiē xiǎoshì pīpíng tā, nòng de wǒ liǎ xīnqíng dōu bù hǎo."},{"sp":"王静","zh":"孩子做事慢，往往是因为他们不会安排自己的时间。你应该让孩子学会管理时间。","spPy":"Wáng Jìng","py":"Háizi zuò shì màn, wǎngwǎng shì yīnwèi tāmen bú huì ānpái zìjǐ de shíjiān. Nǐ yīnggāi ràng háizi xuéhuì guǎnlǐ shíjiān."},{"sp":"孙月","zh":"看来还是我的教育方法有问题。平时看她做事情慢，总想替她做，以后得让她学会安排时间，自己的事情自己做。","spPy":"Sūn Yuè","py":"Kànlái háishì wǒ de jiàoyù fāngfǎ yǒu wèntí. Píngshí kàn tā zuò shìqing màn, zǒng xiǎng tì tā zuò, yǐhòu děi ràng tā xuéhuì ānpái shíjiān, zìjǐ de shìqing zìjǐ zuò."}]},{"k":3,"t":"d","lines":[{"sp":"王静","zh":"明天又要带我儿子去医院打针，想想我就头疼。他就怕打针，每次打针都哭得特别厉害。","spPy":"Wáng Jìng","py":"Míngtiān yòu yào dài wǒ érzi qù yīyuàn dǎzhēn, xiǎngxiang wǒ jiù tóuténg. Tā jiù pà dǎzhēn, měi cì dǎzhēn dōu kū de tèbié lìhai."},{"sp":"孙月","zh":"记得我女儿小时候，带她去医院打针，刚开始，她害怕得要哭。我就小声地和护士说我女儿很勇敢，一点儿也不怕打针，女儿听了以后马上就不哭了。","spPy":"Sūn Yuè","py":"Jìde wǒ nǚ'ér xiǎoshíhou, dài tā qù yīyuàn dǎzhēn, gāng kāishǐ, tā hàipà de yào kū. Wǒ jiù xiǎoshēng de hé hùshi shuō wǒ nǚ'ér hěn yǒnggǎn, yìdiǎnr yě bú pà dǎzhēn, nǚ'ér tīngle yǐhòu mǎshàng jiù bù kū le."},{"sp":"王静","zh":"原来鼓励和表扬对小孩儿挺有用的，下次我也试试。","spPy":"Wáng Jìng","py":"Yuánlái gǔlì hé biǎoyáng duì xiǎoháir tǐng yǒuyòng de, xià cì wǒ yě shìshi."},{"sp":"孙月","zh":"不过表扬也是一门艺术，表扬千万不要太多，过多的表扬可能会给孩子带来压力。不仅起不到鼓励的作用，还可能让孩子怀疑自己的能力，变得没有信心。","spPy":"Sūn Yuè","py":"Búguò biǎoyáng yě shì yì mén yìshù, biǎoyáng qiānwàn búyào tài duō, guòduō de biǎoyáng kěnéng huì gěi háizi dàilái yālì. Bùjǐn qǐ bú dào gǔlì de zuòyòng, hái kěnéng ràng háizi huáiyí zìjǐ de nénglì, biàn de méiyǒu xìnxīn."},{"sp":"王静","zh":"那怎么表扬孩子才会更有效果呢？","spPy":"Wáng Jìng","py":"Nà zěnme biǎoyáng háizi cái huì gèng yǒu xiàoguǒ ne?"},{"sp":"孙月","zh":"我认为表扬要及时，而且表扬不仅仅要看结果，更要看过程，这样才能鼓励他的积极性，让他变得勇敢，不怕困难。","spPy":"Sūn Yuè","py":"Wǒ rènwéi biǎoyáng yào jíshí, érqiě biǎoyáng bù jǐnjǐn yào kàn jiéguǒ, gèng yào kàn guòchéng, zhèyàng cái néng gǔlì tā de jījíxìng, ràng tā biàn de yǒnggǎn, bú pà kùnnan."}]},{"k":4,"t":"p","lines":[{"zh":"有的孩子在得不到自己想要的东西的时候，会通过哭、扔东西或者故意敲打来引起父母的注意。在这种情况下，建议父母先不要生气，应该停下手中的事情，陪孩子整理整理东西，和他们聊聊天儿，弄清楚他们的问题。父母的关心，可以让孩子心情愉快起来。教育孩子应该选择合适的教育方法，最好不要为了解决问题而骗孩子，这是因为儿童缺少判断能力，看到父母骗人，他们也会学着说假话。","py":"Yǒude háizi zài dé bú dào zìjǐ xiǎng yào de dōngxi de shíhou, huì tōngguò kū, rēng dōngxi huòzhě gùyì qiāodǎ lái yǐnqǐ fùmǔ de zhùyì. Zài zhè zhǒng qíngkuàng xià, jiànyì fùmǔ xiān búyào shēngqì, yīnggāi tíngxià shǒu zhōng de shìqing, péi háizi zhěnglǐ zhěnglǐ dōngxi, hé tāmen liáoliao tiānr, nòng qīngchu tāmen de wèntí. Fùmǔ de guānxīn, kěyǐ ràng háizi xīnqíng yúkuài qǐlái. Jiàoyù háizi yīnggāi xuǎnzé héshì de jiàoyù fāngfǎ, zuìhǎo búyào wèile jiějué wèntí ér piàn háizi, zhè shì yīnwèi értóng quēshǎo pànduàn nénglì, kàndào fùmǔ piàn rén, tāmen yě huì xuézhe shuō jiǎhuà."}]},{"k":5,"t":"p","lines":[{"zh":"七岁左右的儿童普遍好动，坐不住，所以老师在教这个年龄段的孩子时，一定要想办法引起他们的兴趣。只有让他们觉得你教的内容有趣，他们才会愿意努力学习。当孩子不明白时，应该多鼓励他，不要用“懒”“笨”“粗心”这种词批评他，这样对他们的正常发展不好。而且，对不同性格的孩子要使用不同的教育方法。如果孩子比较骄傲，应该让他明白还有很多知识需要学习；要是孩子性格有些害羞，就要经常鼓励他说出自己的看法，这样才能让每一个孩子都健康地发展。","py":"Qī suì zuǒyòu de értóng pǔbiàn hàodòng, zuò bu zhù, suǒyǐ lǎoshī zài jiāo zhège niánlíng duàn de háizi shí, yídìng yào xiǎng bànfǎ yǐnqǐ tāmen de xìngqù. Zhǐyǒu ràng tāmen juéde nǐ jiāo de nèiróng yǒuqù, tāmen cái huì yuànyì nǔlì xuéxí. Dāng háizi bù míngbai shí, yīnggāi duō gǔlì tā, búyào yòng “lǎn” “bèn” “cūxīn” zhè zhǒng cí pīpíng tā, zhèyàng duì tāmen de zhèngcháng fāzhǎn bù hǎo. Érqiě, duì bù tóng xìnggé de háizi yào shǐyòng bù tóng de jiàoyù fāngfǎ. Rúguǒ háizi bǐjiào jiāo'ào, yīnggāi ràng tā míngbai hái yǒu hěn duō zhīshi xūyào xuéxí; yàoshi háizi xìnggé yǒuxiē hàixiū, jiù yào jīngcháng gǔlì tā shuōchū zìjǐ de kànfǎ, zhèyàng cái néng ràng měi yí ge háizi dōu jiànkāng de fāzhǎn."}]}]},"16":{"cn":"生活可以更美好","en":"Life Can Be Better","texts":[{"k":1,"t":"d","lines":[{"sp":"小雨","zh":"你马上就要硕士毕业了吧？将来有什么打算？","spPy":"Xiǎoyǔ","py":"Nǐ mǎshàng jiù yào shuòshì bìyè le ba? Jiānglái yǒu shénme dǎsuàn?"},{"sp":"小夏","zh":"我想出国读博士，一直在准备办签证需要的材料。","spPy":"Xiǎo Xià","py":"Wǒ xiǎng chūguó dú bóshì, yìzhí zài zhǔnbèi bàn qiānzhèng xūyào de cáiliào."},{"sp":"小雨","zh":"现在材料准备得怎么样了？","spPy":"Xiǎoyǔ","py":"Xiànzài cáiliào zhǔnbèi de zěnmeyàng le?"},{"sp":"小夏","zh":"成绩证明和护照已经准备好了，另外，还跟国外的大学取得了联系，填写了报名表格。","spPy":"Xiǎo Xià","py":"Chéngjì zhèngmíng hé hùzhào yǐjīng zhǔnbèi hǎo le, lìngwài, hái gēn guówài de dàxué qǔdéle liánxì, tiánxiěle bàomíng biǎogé."},{"sp":"小雨","zh":"还应该有国外大学给你的邀请信吧？他们把邀请信传真给你了吗？","spPy":"Xiǎoyǔ","py":"Hái yīnggāi yǒu guówài dàxué gěi nǐ de yāoqǐngxìn ba? Tāmen bǎ yāoqǐngxìn chuánzhēn gěi nǐ le ma?"},{"sp":"小夏","zh":"没有啊，下个星期我就要去使馆办签证了，这可怎么办？","spPy":"Xiǎo Xià","py":"Méiyǒu a, xià ge xīngqī wǒ jiù yào qù shǐguǎn bàn qiānzhèng le, zhè kě zěnme bàn?"},{"sp":"小雨","zh":"这可是个大问题，我也不太清楚。我帮你查一下学校的电话号码，你打电话问一下吧。","spPy":"Xiǎoyǔ","py":"Zhè kě shì ge dà wèntí, wǒ yě bú tài qīngchu. Wǒ bāng nǐ chá yíxià xuéxiào de diànhuà hàomǎ, nǐ dǎ diànhuà wèn yíxià ba."}]},{"k":2,"t":"d","lines":[{"sp":"李进","zh":"谢谢您带我参观您的公司。在参观过程中我很激动，有个问题一直想问您。","spPy":"Lǐ Jìn","py":"Xièxie nín dài wǒ cānguān nín de gōngsī. Zài cānguān guòchéng zhōng wǒ hěn jīdòng, yǒu ge wèntí yìzhí xiǎng wèn nín."},{"sp":"王老板","zh":"好啊！小伙子，咱们一边吃西瓜，一边聊。","spPy":"Wáng lǎobǎn","py":"Hǎo a! Xiǎohuǒzi, zánmen yìbiān chī xīguā, yìbiān liáo."},{"sp":"李进","zh":"您从大学毕业开始工作，到现在才十年时间，怎么给公司赚了这么多钱？这让我非常吃惊。我想向您学习一下成功的经验。","spPy":"Lǐ Jìn","py":"Nín cóng dàxué bìyè kāishǐ gōngzuò, dào xiànzài cái shí nián shíjiān, zěnme gěi gōngsī zhuànle zhème duō qián? Zhè ràng wǒ fēicháng chījīng. Wǒ xiǎng xiàng nín xuéxí yíxià chénggōng de jīngyàn."},{"sp":"王老板","zh":"这个问题以前一个记者也问过我。做生意时虽然会遇到各种压力和困难，但是大家的机会都是相同的。你看，这里有三块大小不同的西瓜，我们用西瓜的大小代表钱的多少，要是我们一起开始吃，你会先选哪块？","spPy":"Wáng lǎobǎn","py":"Zhège wèntí yǐqián yí ge jìzhě yě wènguo wǒ. Zuò shēngyi shí suīrán huì yùdào gè zhǒng yālì hé kùnnan, dànshì dàjiā de jīhuì dōu shì xiāngtóng de. Nǐ kàn, zhèli yǒu sān kuài dàxiǎo bù tóng de xīguā, wǒmen yòng xīguā de dàxiǎo dàibiǎo qián de duōshao, yàoshi wǒmen yìqǐ kāishǐ chī, nǐ huì xiān xuǎn nǎ kuài?"},{"sp":"李进","zh":"我肯定先吃最大的一块了，难道您会先吃小的，放弃吃大块的机会吗？","spPy":"Lǐ Jìn","py":"Wǒ kěndìng xiān chī zuì dà de yí kuài le, nándào nín huì xiān chī xiǎo de, fàngqì chī dà kuài de jīhuì ma?"},{"sp":"王老板","zh":"我会先吃最小的一块，因为在你没吃完最大的那块时，我还有时间再多吃一块，最后一定比你吃的西瓜多。听完我的回答，恐怕你已经知道我的答案了吧。","spPy":"Wáng lǎobǎn","py":"Wǒ huì xiān chī zuì xiǎo de yí kuài, yīnwèi zài nǐ méi chīwán zuì dà de nà kuài shí, wǒ hái yǒu shíjiān zài duō chī yí kuài, zuìhòu yídìng bǐ nǐ chī de xīguā duō. Tīngwán wǒ de huídá, kǒngpà nǐ yǐjīng zhīdào wǒ de dá'àn le ba."}]},{"k":3,"t":"d","lines":[{"sp":"小林","zh":"今年放假我又回不了家了，这次我父母又要失望了。你有什么计划？","spPy":"Xiǎo Lín","py":"Jīnnián fàngjià wǒ yòu huí bù liǎo jiā le, zhè cì wǒ fùmǔ yòu yào shīwàng le. Nǐ yǒu shénme jìhuà?"},{"sp":"小李","zh":"我计划去郊区住一个月。你不是已经买好火车票了吗？你到底怎么打算的呀？","spPy":"Xiǎo Lǐ","py":"Wǒ jìhuà qù jiāoqū zhù yí ge yuè. Nǐ bú shì yǐjīng mǎihǎo huǒchēpiào le ma? Nǐ dàodǐ zěnme dǎsuàn de ya?"},{"sp":"小林","zh":"昨天一个外地的好朋友打电话说要来旅游，让我当导游，我实在不好意思拒绝。","spPy":"Xiǎo Lín","py":"Zuótiān yí ge wàidì de hǎo péngyou dǎ diànhuà shuō yào lái lǚyóu, ràng wǒ dāng dǎoyóu, wǒ shízài bù hǎoyìsi jùjué."},{"sp":"小李","zh":"其实拒绝并不表示不愿意帮忙。遇到解决不了的问题或者无法完成的任务时，拒绝正好说明你对朋友负责。这也是对你父母负责的态度。","spPy":"Xiǎo Lǐ","py":"Qíshí jùjué bìng bù biǎoshì bú yuànyì bāngmáng. Yùdào jiějué bù liǎo de wèntí huòzhě wúfǎ wánchéng de rènwu shí, jùjué zhènghǎo shuōmíng nǐ duì péngyou fùzé. Zhè yě shì duì nǐ fùmǔ fùzé de tàidù."},{"sp":"小林","zh":"既然别人找我帮忙，说明他真的很需要我的帮助。我担心要是说“不”的话，会让他误会和伤心。","spPy":"Xiǎo Lín","py":"Jìrán biérén zhǎo wǒ bāngmáng, shuōmíng tā zhēn de hěn xūyào wǒ de bāngzhù. Wǒ dānxīn yàoshi shuō “bù” de huà, huì ràng tā wùhuì hé shāngxīn."},{"sp":"小李","zh":"别担心！如果你用一个既合适又礼貌的方法告诉朋友，他一定会原谅你的。","spPy":"Xiǎo Lǐ","py":"Bié dānxīn! Rúguǒ nǐ yòng yí ge jì héshì yòu lǐmào de fāngfǎ gàosu péngyou, tā yídìng huì yuánliàng nǐ de."}]},{"k":4,"t":"p","lines":[{"zh":"有些同学经常把“明天”和“将来”挂在嘴边，常说作业明天再完成，下次考试一定好好儿复习，等等。这种态度会浪费时间，不但会让你到最后什么事情都做不成，而且还得不到别人的同情。所以不要把什么事情都推到“明天”，一切从现在做起。就拿学汉语来说吧，首先要注意课前预习，找出第二天要学习的重点；其次，上课时要认真听，不能马虎；最后，课后要记得复习。只要这样，汉语就能越学越好，越说越自信。","py":"Yǒuxiē tóngxué jīngcháng bǎ “míngtiān” hé “jiānglái” guà zài zuǐbiān, cháng shuō zuòyè míngtiān zài wánchéng, xià cì kǎoshì yídìng hǎohāor fùxí, děngděng. Zhè zhǒng tàidù huì làngfèi shíjiān, búdàn huì ràng nǐ dào zuìhòu shénme shìqing dōu zuò bù chéng, érqiě hái dé bú dào biérén de tóngqíng. Suǒyǐ búyào bǎ shénme shìqing dōu tuīdào “míngtiān”, yíqiè cóng xiànzài zuòqǐ. Jiù ná xué Hànyǔ lái shuō ba, shǒuxiān yào zhùyì kèqián yùxí, zhǎochū dì-èr tiān yào xuéxí de zhòngdiǎn; qícì, shàngkè shí yào rènzhēn tīng, bù néng mǎhu; zuìhòu, kèhòu yào jìde fùxí. Zhǐyào zhèyàng, Hànyǔ jiù néng yuè xué yuè hǎo, yuè shuō yuè zìxìn."}]},{"k":5,"t":"p","lines":[{"zh":"当你认为自己在哪方面很优秀时，千万要冷静，不要骄傲。因为这个世界很大，“天外有天，人外有人”，很可能有人在这方面比你更厉害。你现在是第一，并不表示你永远都是第一。就像比赛一样，没有人会永远输，也没有人会一直赢。我们知道的越多，就会发现自己不懂的也越多。我们应该重视平时的积累，多向周围的人学习。如果你敢诚实地说出自己对哪方面不了解，并不说明自己比别人差，相反，这样做更能得到别人的尊重。","py":"Dāng nǐ rènwéi zìjǐ zài nǎ fāngmiàn hěn yōuxiù shí, qiānwàn yào lěngjìng, búyào jiāo'ào. Yīnwèi zhège shìjiè hěn dà, “tiān wài yǒu tiān, rén wài yǒu rén”, hěn kěnéng yǒu rén zài zhè fāngmiàn bǐ nǐ gèng lìhai. Nǐ xiànzài shì dì-yī, bìng bù biǎoshì nǐ yǒngyuǎn dōu shì dì-yī. Jiù xiàng bǐsài yíyàng, méiyǒu rén huì yǒngyuǎn shū, yě méiyǒu rén huì yìzhí yíng. Wǒmen zhīdào de yuè duō, jiù huì fāxiàn zìjǐ bù dǒng de yě yuè duō. Wǒmen yīnggāi zhòngshì píngshí de jīlěi, duō xiàng zhōuwéi de rén xuéxí. Rúguǒ nǐ gǎn chéngshí de shuōchū zìjǐ duì nǎ fāngmiàn bù liǎojiě, bìng bù shuōmíng zìjǐ bǐ biérén chà, xiāngfǎn, zhèyàng zuò gèng néng dédào biérén de zūnzhòng."}]}]},"17":{"cn":"人与自然","en":"Humans and Nature","texts":[{"k":1,"t":"d","lines":[{"sp":"小夏","zh":"最近天气越来越凉快了，风一刮，草地上就会有一层厚厚的黄叶，看来秋天已经到了。","spPy":"Xiǎo Xià","py":"Zuìjìn tiānqì yuè lái yuè liángkuai le, fēng yì guā, cǎodì shang jiù huì yǒu yì céng hòuhòu de huángyè, kànlái qiūtiān yǐjīng dào le."},{"sp":"安娜","zh":"这几天香山特别热闹，随着气温的降低，那里许多植物的叶子都由绿变黄或者变红，吸引了很多游客参观，咱们今天也去看看吧。","spPy":"Ānnà","py":"Zhè jǐ tiān Xiāng Shān tèbié rènao, suízhe qìwēn de jiàngdī, nàli xǔduō zhíwù de yèzi dōu yóu lǜ biàn huáng huòzhě biàn hóng, xīyǐnle hěn duō yóukè cānguān, zánmen jīntiān yě qù kànkan ba."},{"sp":"小夏","zh":"你看天上的云，今天肯定有大雨。再说，香山上看红叶的人太多了。咱们改天去长城吧，广播里说那里也有不少专门看红叶的好地方。","spPy":"Xiǎo Xià","py":"Nǐ kàn tiānshang de yún, jīntiān kěndìng yǒu dàyǔ. Zàishuō, Xiāng Shān shang kàn hóngyè de rén tài duō le. Zánmen gǎitiān qù Chángchéng ba, guǎngbō li shuō nàli yě yǒu bù shǎo zhuānmén kàn hóngyè de hǎo dìfang."},{"sp":"安娜","zh":"真可惜，我还想多照点儿香山的照片呢。去长城倒是一个好���意，那我们明天去吧。","spPy":"Ānnà","py":"Zhēn kěxī, wǒ hái xiǎng duō zhào diǎnr Xiāng Shān de zhàopiàn ne. Qù Chángchéng dào shì yí ge hǎo zhǔyi, nà wǒmen míngtiān qù ba."},{"sp":"小夏","zh":"明天恐怕也不行，明天是我爸的生日。","spPy":"Xiǎo Xià","py":"Míngtiān kǒngpà yě bù xíng, míngtiān shì wǒ bà de shēngrì."},{"sp":"安娜","zh":"没关系，那我们再约时间。","spPy":"Ānnà","py":"Méi guānxi, nà wǒmen zài yuē shíjiān."}]},{"k":2,"t":"d","lines":[{"sp":"小林","zh":"你的这只大黑狗毛真漂亮，而且这么聪明，每次见了都想抱一抱它。","spPy":"Xiǎo Lín","py":"Nǐ de zh�� zhī dà hēi gǒu máo zhēn piàoliang, érqiě zhème cōngming, měi cì jiànle dōu xiǎng bào yì bào tā."},{"sp":"小李","zh":"狗是很聪明的动物，只要稍微花点儿时间教教它，它就能学会很多东西。","spPy":"Xiǎo Lǐ","py":"Gǒu shì hěn cōngming de dòngwù, zhǐyào shāowēi huā diǎnr shíjiān jiāojiao tā, tā jiù néng xuéhuì hěn duō dōngxi."},{"sp":"小林","zh":"听你这么一说，我现在也想养一只狗了。每次你让它干什么，它就像能听懂你的话一样去做。你教它是不是用了什么特别的方法？","spPy":"Xiǎo Lín","py":"Tīng nǐ zhème yì shuō, wǒ xiànzài yě xiǎng yǎng yì zhī gǒu le. Měi cì nǐ ràng tā gàn shénme, tā jiù xiàng néng tīngdǒng nǐ de huà yíyàng qù zuò. Nǐ jiāo tā shì bú shì yòngle shénme tèbié de fāngfǎ?"},{"sp":"小李","zh":"要让它完成一些任务，只教一次是不够的，应该耐心地一遍一遍地教给它，使它熟悉，然后它就会严格按照你的要求做了。","spPy":"Xiǎo Lǐ","py":"Yào ràng tā wánchéng yìxiē rènwu, zhǐ jiāo yí cì shì bú gòu de, yīnggāi nàixīn de yí biàn yí biàn de jiāo gěi tā, shǐ tā shúxī, ránhòu tā jiù huì yángé ànzhào nǐ de yāoqiú zuò le."},{"sp":"小林","zh":"看来没有想的那么容易。","spPy":"Xiǎo Lín","py":"Kànlái méiyǒu xiǎng de nàme róngyì."},{"sp":"小李","zh":"狗是我们的好朋友，它能听懂人的话，明白人的心情。在你心里难受的时候，它会一直陪着你。","spPy":"Xiǎo Lǐ","py":"Gǒu shì wǒmen de hǎo péngyou, tā néng tīngdǒng rén de huà, míngbai rén de xīnqíng. Zài nǐ xīnli nánshòu de shíhou, tā huì yìzhí péizhe nǐ."}]},{"k":3,"t":"d","lines":[{"sp":"马克","zh":"上个月我去了趟北京动物园，那里约有500种动物，听导游说北京动物园是亚洲最大的动物园之一。","spPy":"Mǎkè","py":"Shàng ge yuè wǒ qùle tàng Běijīng Dòngwùyuán, nàli yuē yǒu wǔbǎi zhǒng dòngwù, tīng dǎoyóu shuō Běijīng Dòngwùyuán shì Yàzhōu zuì dà de dòngwùyuán zhī yī."},{"sp":"小夏","zh":"去年放暑假的时候，我也去过一次，我在那儿看了马、熊猫、老虎等动物。我特别喜欢熊猫，可惜它们当时大多在睡觉。","spPy":"Xiǎo Xià","py":"Qùnián fàng shǔjià de shíhou, wǒ yě qùguo yí cì, wǒ zài nàr kànle mǎ, xióngmāo, lǎohǔ děng dòngwù. Wǒ tèbié xǐhuan xióngmāo, kěxī tāmen dāngshí dàduō zài shuìjiào."},{"sp":"马克","zh":"我去的那天正赶上六一儿童节，许多父母带着孩子去动物园。入口处排队的人很多，动物园里热闹极了。熊猫们也变得特别活泼，我还给它们照了不少照片呢。","spPy":"Mǎkè","py":"Wǒ qù de nà tiān zhèng gǎnshang Liùyī Értóngjié, xǔduō fùmǔ dàizhe háizi qù dòngwùyuán. Rùkǒuchù páiduì de rén hěn duō, dòngwùyuán li rènao jíle. Xióngmāomen yě biàn de tèbié huópō, wǒ hái gěi tāmen zhàole bù shǎo zhàopiàn ne."},{"sp":"小夏","zh":"大熊猫身子胖胖的，样子可爱极了。","spPy":"Xiǎo Xià","py":"Dà xióngmāo shēnzi pàngpàng de, yàngzi kě'ài jíle."},{"sp":"马克","zh":"不过，它们数量不多，现在全世界一共才有一千多只吧。","spPy":"Mǎkè","py":"Búguò, tāmen shùliàng bù duō, xiànzài quán shìjiè yígòng cái yǒu yìqiān duō zhī ba."},{"sp":"小夏","zh":"以前只有中国有大熊猫，为了表示友好，从1957年开始，中国把大熊猫作为礼物送给其他一些国家。现在，很多国家的人们在本国都能看到大熊猫了。","spPy":"Xiǎo Xià","py":"Yǐqián zhǐyǒu Zhōngguó yǒu dà xióngmāo, wèile biǎoshì yǒuhǎo, cóng yī jiǔ wǔ qī nián kāishǐ, Zhōngguó bǎ dà xióngmāo zuòwéi lǐwù sòng gěi qítā yìxiē guójiā. Xiànzài, hěn duō guójiā de rénmen zài běnguó dōu néng kàndào dà xióngmāo le."}]},{"k":4,"t":"p","lines":[{"zh":"不仅社会上的人与人之间有竞争，森林里的各种植物之间也有竞争，这一点儿也不奇怪。植物会为了阳光、空气和水而竞争。一些高大的植物往往能获得更多的阳光、空气和水，而剩下的一些比较低矮的植物就只能长在这些高大植物的下面。由于气候条件不同，世界各地植物叶子的样子也很不相同。在暖和、水分比较多的地方，叶子往往长得又大又厚；在阳光特别厉害、水分少的地方，叶子就会长得又细又长。","py":"Bùjǐn shèhuì shang de rén yǔ rén zhījiān yǒu jìngzhēng, sēnlín li de gè zhǒng zhíwù zhījiān yě yǒu jìngzhēng, zhè yìdiǎnr yě bù qíguài. Zhíwù huì wèile yángguāng, kōngqì hé shuǐ ér jìngzhēng. Yìxiē gāodà de zhíwù wǎngwǎng néng huòdé gèng duō de yángguāng, kōngqì hé shuǐ, ér shèngxià de yìxiē bǐjiào dī'ǎi de zhíwù jiù zhǐnéng zhǎng zài zhèxiē gāodà zhíwù de xiàmiàn. Yóuyú qìhòu tiáojiàn bù tóng, shìjiè gè dì zhíwù yèzi de yàngzi yě hěn bù xiāngtóng. Zài nuǎnhuo, shuǐfèn bǐjiào duō de dìfang, yèzi wǎngwǎng zhǎng de yòu dà yòu hòu; zài yángguāng tèbié lìhai, shuǐfèn shǎo de dìfang, yèzi jiù huì zhǎng de yòu xì yòu cháng."}]},{"k":5,"t":"p","lines":[{"zh":"地球上大约71%的地方是蓝色的海洋，在美丽的海底世界里，生活着各种各样的植物和动物。我们小时候都听过美人鱼的故事，其实真正的海底世界比故事里写的更美。科学研究发现，海洋底部看上去非常安静，然而却不是一点儿声音也没有，海底的动物们一直在“说话”，只不过人的耳朵是听不到的。另外，就算在几公里深的海底也仍然能看到东西，许多鱼会发出各种颜色的亮光，像一个个排列起来的灯，美极了，就像在梦里一样。","py":"Dìqiú shang dàyuē bǎifēnzhī qīshíyī de dìfang shì lánsè de hǎiyáng, zài měilì de hǎidǐ shìjiè li, shēnghuózhe gè zhǒng gè yàng de zhíwù hé dòngwù. Wǒmen xiǎoshíhou dōu tīngguo měirényú de gùshi, qíshí zhēnzhèng de hǎidǐ shìjiè bǐ gùshi li xiě de gèng měi. Kēxué yánjiū fāxiàn, hǎiyáng dǐbù kàn shàngqù fēicháng ānjìng, rán'ér què bú shì yìdiǎnr shēngyīn yě méiyǒu, hǎidǐ de dòngwùmen yìzhí zài “shuōhuà”, zhǐ bú guò rén de ěrduo shì tīng bu dào de. Lìngwài, jiùsuàn zài jǐ gōnglǐ shēn de hǎidǐ yě réngrán néng kàndào dōngxi, xǔduō yú huì fāchū gè zhǒng yánsè de liàngguāng, xiàng yí gège páiliè qǐlái de dēng, měi jíle, jiù xiàng zài mèng li yíyàng."}]}]},"18":{"cn":"科技与世界","en":"Science, Technology and the World","texts":[{"k":1,"t":"d","lines":[{"sp":"孙月","zh":"上次女儿问我飞机是怎么起飞和降落的，真不知道该怎么回答她，她现在总是有各种各样的“为什么”。","spPy":"Sūn Yuè","py":"Shàng cì nǚ'ér wèn wǒ fēijī shì zěnme qǐfēi hé jiàngluò de, zhēn bù zhīdào gāi zěnme huídá tā, tā xiànzài zǒngshì yǒu gè zhǒng gè yàng de “wèi shénme”."},{"sp":"王静","zh":"孩子眼中的世界是美丽和奇特的。有一本书叫《新十万个为什么》，现在卖得非常火。书里的内容都是儿童想知道的科学知识，相信你女儿一定喜欢读。","spPy":"Wáng Jìng","py":"Háizi yǎnzhōng de shìjiè shì měilì hé qítè de. Yǒu yì běn shū jiào 《Xīn Shíwàn Ge Wèi Shénme》, xiànzài mài de fēicháng huǒ. Shū li de nèiróng dōu shì értóng xiǎng zhīdào de kēxué zhīshi, xiāngxìn nǐ nǚ'ér yídìng xǐhuan dú."},{"sp":"孙月","zh":"难道它和我们小时候看的《十万个为什么》不一样吗？作者是谁啊？","spPy":"Sūn Yuè","py":"Nándào tā hé wǒmen xiǎoshíhou kàn de 《Shíwàn Ge Wèi Shénme》 bù yíyàng ma? Zuòzhě shì shéi a?"},{"sp":"王静","zh":"作者的名字我没记住。《新十万个为什么》的内容更新，介绍了各种科学知识，包括地球、动物、植物、交通、科学技术、社会和文化等很多方面。","spPy":"Wáng Jìng","py":"Zuòzhě de míngzi wǒ méi jìzhù. 《Xīn Shíwàn Ge Wèi Shénme》 de nèiróng gèng xīn, jièshàole gè zhǒng kēxué zhīshi, bāokuò dìqiú, dòngwù, zhíwù, jiāotōng, kēxué jìshù, shèhuì hé wénhuà děng hěn duō fāngmiàn."},{"sp":"孙月","zh":"太好了！不过她这么小，我不知道她是否能读懂。","spPy":"Sūn Yuè","py":"Tài hǎo le! Búguò tā zhème xiǎo, wǒ bù zhīdào tā shìfǒu néng dúdǒng."},{"sp":"王静","zh":"放心吧，这本书的语言简单易懂，一定能增长孩子的科学知识。","spPy":"Wáng Jìng","py":"Fàngxīn ba, zhè běn shū de yǔyán jiǎndān yìdǒng, yídìng néng zēngzhǎng háizi de kēxué zhīshi."}]},{"k":2,"t":"d","lines":[{"sp":"李老师","zh":"现在的大学生一遇到不明白的问题，可以马上在网上查找答案，几秒钟就把问题解决了，这比我们上学的时候方便多了。","spPy":"Lǐ lǎoshī","py":"Xiànzài de dàxuéshēng yí yùdào bù míngbai de wèntí, kěyǐ mǎshàng zài wǎngshang cházhǎo dá'àn, jǐ miǎozhōng jiù bǎ wèntí jiějué le, zhè bǐ wǒmen shàngxué de shíhou fāngbiàn duō le."},{"sp":"高老师","zh":"现在的人们，尤其是大学生开始普遍使用电脑，他们的生活已经离不开电脑。据调查，70%的人遇到问题时，首先想到的就是上网找答案。","spPy":"Gāo lǎoshī","py":"Xiànzài de rénmen, yóuqí shì dàxuéshēng kāishǐ pǔbiàn shǐyòng diànnǎo, tāmen de shēnghuó yǐjīng lí bù kāi diànnǎo. Jù diàochá, bǎifēnzhī qīshí de rén yùdào wèntí shí, shǒuxiān xiǎngdào de jiù shì shàngwǎng zhǎo dá'àn."},{"sp":"李老师","zh":"电脑和互联网技术的发展使学生们的学习方式发生了很多变化，不过天天对着电脑看，眼睛实在受不了。","spPy":"Lǐ lǎoshī","py":"Diànnǎo hé hùliánwǎng jìshù de fāzhǎn shǐ xuéshengmen de xuéxí fāngshì fāshēngle hěn duō biànhuà, búguò tiāntiān duìzhe diànnǎo kàn, yǎnjing shízài shòubuliǎo."},{"sp":"高老师","zh":"不仅是学习方式，而且连生活方式也发生了很大改变。现在越来越多的学生喜欢在网上写日记，他们说这样可以让朋友及时了解自己的生活。","spPy":"Gāo lǎoshī","py":"Bùjǐn shì xuéxí fāngshì, érqiě lián shēnghuó fāngshì yě fāshēngle hěn dà gǎibiàn. Xiànzài yuè lái yuè duō de xuésheng xǐhuan zài wǎngshang xiě rìjì, tāmen shuō zhèyàng kěyǐ ràng péngyou jíshí liǎojiě zìjǐ de shēnghuó."},{"sp":"李老师","zh":"这个办法不错，既能方便大家的交流，还能节约用纸，保护环境。但是如果别人都能看到我的日记的话，多不安全啊！","spPy":"Lǐ lǎoshī","py":"Zhège bànfǎ búcuò, jì néng fāngbiàn dàjiā de jiāoliú, hái néng jiéyuē yòng zhǐ, bǎohù huánjìng. Dànshì rúguǒ biérén dōu néng kàndào wǒ de rìjì de huà, duō bù ānquán a!"},{"sp":"高老师","zh":"放心吧，可以给网上的日记加密码，那样只有得到了允许，别人才能看到。","spPy":"Gāo lǎoshī","py":"Fàngxīn ba, kěyǐ gěi wǎngshang de rìjì jiā mìmǎ, nàyàng zhǐyǒu dédàole yǔnxǔ, biérén cái néng kàndào."}]},{"k":3,"t":"d","lines":[{"sp":"王静","zh":"我昨天晚上做了一个特别奇怪的梦，梦到自己正在一座桥上走，走着走着，突然开过来一辆车，非常危险，接着又梦见我跳到车上，跟警察一起抓住了一个坏人。","spPy":"Wáng Jìng","py":"Wǒ zuótiān wǎnshang zuòle yí ge tèbié qíguài de mèng, mèngdào zìjǐ zhèngzài yí zuò qiáo shang zǒu, zǒuzhe zǒuzhe, tūrán kāi guòlái yí liàng chē, fēicháng wēixiǎn, jiēzhe yòu mèngjiàn wǒ tiàodào chē shang, gēn jǐngchá yìqǐ zhuāzhùle yí ge huàirén."},{"sp":"孙月","zh":"奇怪，你怎么总能记住自己做了什么梦？我好像从来没做过梦。","spPy":"Sūn Yuè","py":"Qíguài, nǐ zěnme zǒng néng jìzhù zìjǐ zuòle shénme mèng? Wǒ hǎoxiàng cónglái méi zuòguo mèng."},{"sp":"王静","zh":"每个人都会做梦，区别只是有多有少。有的人睡醒之后还记得梦里的事情，有的人却记不清楚了。你之所以觉得从来没做过梦，只不过是忘记了。","spPy":"Wáng Jìng","py":"Měi ge rén dōu huì zuòmèng, qūbié zhǐshì yǒu duō yǒu shǎo. Yǒude rén shuìxǐng zhīhòu hái jìde mèng li de shìqing, yǒude rén què jì bu qīngchu le. Nǐ zhīsuǒyǐ juéde cónglái méi zuòguo mèng, zhǐ bú guò shì wàngjì le."},{"sp":"孙月","zh":"你说的有道理，我一般都是一觉睡到天亮。很多人认为做梦是上天要告诉他们将来会发生的一些事情，可能上天不想让我知道吧。","spPy":"Sūn Yuè","py":"Nǐ shuō de yǒu dàolǐ, wǒ yìbān dōu shì yí jiào shuìdào tiānliàng. Hěn duō rén rènwéi zuòmèng shì shàngtiān yào gàosu tāmen jiānglái huì fāshēng de yìxiē shìqing, kěnéng shàngtiān bù xiǎng ràng wǒ zhīdào ba."},{"sp":"王静","zh":"一般晚上睡觉时，身体感觉到什么，人就容易梦到什么内容。记得有一次，我晚饭吃得太咸，那天晚上就梦见自己到处找商店买矿泉水。","spPy":"Wáng Jìng","py":"Yìbān wǎnshang shuìjiào shí, shēntǐ gǎnjuédào shénme, rén jiù róngyì mèngdào shénme nèiróng. Jìde yǒu yí cì, wǒ wǎnfàn chī de tài xián, nà tiān wǎnshang jiù mèngjiàn zìjǐ dàochù zhǎo shāngdiàn mǎi kuàngquánshuǐ."},{"sp":"孙月","zh":"很多人都试着对梦进行解释，有些人甚至专门写过这方面的书，可惜到现在仍然没有一个科学的说法。","spPy":"Sūn Yuè","py":"Hěn duō rén dōu shìzhe duì mèng jìnxíng jiěshì, yǒuxiē rén shènzhì zhuānmén xiěguo zhè fāngmiàn de shū, kěxī dào xiànzài réngrán méiyǒu yí ge kēxué de shuōfǎ."}]},{"k":4,"t":"p","lines":[{"zh":"现在手机不但价格降低了，而且作用也越来越大，打电话、发短信已经成了人们普遍使用的联系方法。除此以外，你还可以用它来听音乐、看电影、阅读、玩儿游戏、付款购物等，这大大方便了人们的生活。举一个例子，迷路时，只要用手机地图查一下地址，马上就能知道怎么去那个地点。现在的手机��像是一部可以拿在手中的电脑，现代人的生活已经越来越离不开手机了。","py":"Xiànzài shǒujī búdàn jiàgé jiàngdī le, érqiě zuòyòng yě yuè lái yuè dà, dǎ diànhuà, fā duǎnxìn yǐjīng chéngle rénmen pǔbiàn shǐyòng de liánxì fāngfǎ. Chúcǐ yǐwài, nǐ hái kěyǐ yòng tā lái tīng yīnyuè, kàn diànyǐng, yuèdú, wánr yóuxì, fùkuǎn gòuwù děng, zhè dàdà fāngbiànle rénmen de shēnghuó. Jǔ yí ge lìzi, mílù shí, zhǐyào yòng shǒujī dìtú chá yíxià dìzhǐ, mǎshàng jiù néng zhīdào zěnme qù nàge dìdiǎn. Xiànzài de shǒujī gèng xiàng shì yí bù kěyǐ ná zài shǒu zhōng de diànnǎo, xiàndài rén de shēnghuó yǐjīng yuè lái yuè lí bù kāi shǒujī le."}]},{"k":5,"t":"p","lines":[{"zh":"21世纪，我们的生活发生了巨大变化。几千公里以外的国家，以前坐船需要几个月，现在乘坐飞机不过十几个小时。原来寄信需要好几天，现在连邮局都不用去，只要在家里上网发个电子邮件，用不了一分钟，远处的朋友就能收到，比写信封用的时间都短。以前外地的新闻要几天后才能知道，现在只要打开网站，任何信息都可以在第一时间获得。现代科学技术的发展让世界变得越来越小，所以现在人们都把地球叫作“地球村”。","py":"Èrshíyī shìjì, wǒmen de shēnghuó fāshēngle jùdà biànhuà. Jǐqiān gōnglǐ yǐwài de guójiā, yǐqián zuò chuán xūyào jǐ ge yuè, xiànzài chéngzuò fēijī búguò shíjǐ ge xiǎoshí. Yuánlái jì xìn xūyào hǎo jǐ tiān, xiànzài lián yóujú dōu búyòng qù, zhǐyào zài jiā li shàngwǎng fā ge diànzǐ yóujiàn, yòng bù liǎo yì fēnzhōng, yuǎnchù de péngyou jiù néng shōudào, bǐ xiě xìnfēng yòng de shíjiān dōu duǎn. Yǐqián wàidì de xīnwén yào jǐ tiān hòu cái néng zhīdào, xiànzài zhǐyào dǎkāi wǎngzhàn, rènhé xìnxī dōu kěyǐ zài dì-yī shíjiān huòdé. Xiàndài kēxué jìshù de fāzhǎn ràng shìjiè biàn de yuè lái yuè xiǎo, suǒyǐ xiànzài rénmen dōu bǎ dìqiú jiàozuò “Dìqiúcūn”."}]}]},"19":{"cn":"生活的味道","en":"Taste of Life","texts":[{"k":1,"t":"d","lines":[{"sp":"马克","zh":"老师，您好！我希望下个学期在这里继续学习，请问还需要重新申请吗？","spPy":"Mǎkè","py":"Lǎoshī, nín hǎo! Wǒ xīwàng xià ge xuéqī zài zhèli jìxù xuéxí, qǐngwèn hái xūyào chóngxīn shēnqǐng ma?"},{"sp":"高老师","zh":"是的。给你表格，出生年月、性别、护照号码都要填，还有联系地址、联系电话。","spPy":"Gāo lǎoshī","py":"Shì de. Gěi nǐ biǎogé, chūshēng niányuè, xìngbié, hùzhào hàomǎ dōu yào tián, hái yǒu liánxì dìzhǐ, liánxì diànhuà."},{"sp":"马克","zh":"真抱歉，我不小心把护照号码填错了，您能再给我一份新的申请表吗？","spPy":"Mǎkè","py":"Zhēn bàoqiàn, wǒ bù xiǎoxīn bǎ hùzhào hàomǎ tiáncuò le, nín néng zài gěi wǒ yí fèn xīn de shēnqǐngbiǎo ma?"},{"sp":"高老师","zh":"没关系，不用道歉，谁都有粗心填错的时候。申请表都被别人拿走了，我给你重新打印一份，你等一下。","spPy":"Gāo lǎoshī","py":"Méi guānxi, búyòng dàoqiàn, shéi dōu yǒu cūxīn tiáncuò de shíhou. Shēnqǐngbiǎo dōu bèi biérén názǒu le, wǒ gěi nǐ chóngxīn dǎyìn yí fèn, nǐ děng yíxià."},{"zh":"（高老师打印，马克填表。）","py":"(Gāo lǎoshī dǎyìn, Mǎkè tián biǎo.)"},{"sp":"马克","zh":"这次我按照要求都填写完了，请问还需要做别的事情吗？","spPy":"Mǎkè","py":"Zhè cì wǒ ànzhào yāoqiú dōu tiánxiě wán le, qǐngwèn hái xūyào zuò biéde shìqing ma?"},{"sp":"高老师","zh":"请把你的护照给我，我们要把护照复印一下。","spPy":"Gāo lǎoshī","py":"Qǐng bǎ nǐ de hùzhào gěi wǒ, wǒmen yào bǎ hùzhào fùyìn yíxià."}]},{"k":2,"t":"d","lines":[{"sp":"李进","zh":"呀，你的手怎么流血了？等一下，我给你包起来。","spPy":"Lǐ Jìn","py":"Ya, nǐ de shǒu zěnme liúxiě le? Děng yíxià, wǒ gěi nǐ bāo qǐlái."},{"sp":"王静","zh":"没关系，我想给你做点儿羊肉饺子，刚才用刀切肉的时候把手弄破了。","spPy":"Wáng Jìng","py":"Méi guānxi, wǒ xiǎng gěi nǐ zuò diǎnr yángròu jiǎozi, gāngcái yòng dāo qiē ròu de shíhou bǎ shǒu nòngpò le."},{"sp":"李进","zh":"你也太不小心了，不过好像不太严重，过几天就好了。衣服上也有一点儿血，你把衣服脱下来，我给你洗洗。","spPy":"Lǐ Jìn","py":"Nǐ yě tài bù xiǎoxīn le, búguò hǎoxiàng bú tài yánzhòng, guò jǐ tiān jiù hǎo le. Yīfu shang yě yǒu yìdiǎnr xiě, nǐ bǎ yīfu tuō xiàlái, wǒ gěi nǐ xǐxi."},{"sp":"王静","zh":"看来今天吃不上羊肉饺子了。","spPy":"Wáng Jìng","py":"Kànlái jīntiān chī bú shàng yángròu jiǎozi le."},{"sp":"李进","zh":"那我们就吃点儿别的。我常去的那家理发店附近有个餐厅，那里的包子很好吃，我一会儿去买一点儿。","spPy":"Lǐ Jìn","py":"Nà wǒmen jiù chī diǎnr biéde. Wǒ cháng qù de nà jiā lǐfàdiàn fùjìn yǒu ge cāntīng, nàli de bāozi hěn hǎochī, wǒ yíhuìr qù mǎi yìdiǎnr."},{"sp":"王静","zh":"好吧，我衣服口袋里有十几块零钱，买包子应该够。","spPy":"Wáng Jìng","py":"Hǎo ba, wǒ yīfu kǒudài li yǒu shíjǐ kuài língqián, mǎi bāozi yīnggāi gòu."}]},{"k":3,"t":"d","lines":[{"sp":"马克","zh":"我早上跟你打招呼，你没看见。想不到又在这儿碰见你了。","spPy":"Mǎkè","py":"Wǒ zǎoshang gēn nǐ dǎ zhāohu, nǐ méi kànjiàn. Xiǎngbudào yòu zài zhèr pèngjiàn nǐ le."},{"sp":"安娜","zh":"真是对不起，我不是故意的，今天早上我忘戴眼镜了，看不清楚。","spPy":"Ānnà","py":"Zhēn shì duìbuqǐ, wǒ bú shì gùyì de, jīntiān zǎoshang wǒ wàng dài yǎnjìng le, kàn bu qīngchu."},{"sp":"马克","zh":"刚才我在旁边看到你跳中国舞了，没看出来你跳得这么好！难道你以前在你们国家就学过中国舞蹈吗？","spPy":"Mǎkè","py":"Gāngcái wǒ zài pángbiān kàndào nǐ tiào Zhōngguó wǔ le, méi kàn chūlái nǐ tiào de zhème hǎo! Nándào nǐ yǐqián zài nǐmen guójiā jiù xuéguo Zhōngguó wǔdǎo ma?"},{"sp":"安娜","zh":"我小时候妈妈教我跳过两年的舞，所以稍微有点儿基础。再说，舞蹈不仅是一门艺术，也是一种“语言”，这种语言与国籍无关，无论哪个国家的人都能看懂。","spPy":"Ānnà","py":"Wǒ xiǎoshíhou māma jiāo wǒ tiàoguo liǎng nián de wǔ, suǒyǐ shāowēi yǒudiǎnr jīchǔ. Zàishuō, wǔdǎo bùjǐn shì yì mén yìshù, yě shì yì zhǒng “yǔyán”, zhè zhǒng yǔyán yǔ guójí wúguān, wúlùn nǎge guójiā de rén dōu néng kàndǒng."},{"sp":"马克","zh":"太好了！我刚学习跳这种舞没多久，你帮我看看，我的这个动作对不对。","spPy":"Mǎkè","py":"Tài hǎo le! Wǒ gāng xuéxí tiào zhè zhǒng wǔ méi duōjiǔ, nǐ bāng wǒ kànkan, wǒ de zhège dòngzuò duì bú duì."},{"sp":"安娜","zh":"你这个动作做得还是不太标准，我给你跳一遍。你仔细看着，应该像我这样：先抬胳膊，然后抬腿，最后头再向右转一下。","spPy":"Ānnà","py":"Nǐ zhège dòngzuò zuò de háishì bú tài biāozhǔn, wǒ gěi nǐ tiào yí biàn. Nǐ zǐxì kànzhe, yīnggāi xiàng wǒ zhèyàng: xiān tái gēbo, ránhòu tái tuǐ, zuìhòu tóu zài xiàng yòu zhuàn yíxià."}]},{"k":4,"t":"p","lines":[{"zh":"马克去年租的房子离马路很近，对面有大大小小的商店，周围环境非常吵。所以，房子还没到期，马克就开始着急换房子了。有一天，他在小区门口看到一个租房子的广告。广告上说房子交通方便，周围很安静，厨房很大。总的来说，这套房子他很满意，于是他就记下了房东的手���号码。可回家后打电话，电话总是占线。第二天，他路过小区门口时，又仔细看了一下广告，原来在记号码的时候写错了一个数字。","py":"Mǎkè qùnián zū de fángzi lí mǎlù hěn jìn, duìmiàn yǒu dàdà-xiǎoxiǎo de shāngdiàn, zhōuwéi huánjìng fēicháng chǎo. Suǒyǐ, fángzi hái méi dàoqī, Mǎkè jiù kāishǐ zháojí huàn fángzi le. Yǒu yì tiān, tā zài xiǎoqū ménkǒu kàndào yí ge zū fángzi de guǎnggào. Guǎnggào shang shuō fángzi jiāotōng fāngbiàn, zhōuwéi hěn ānjìng, chúfáng hěn dà. Zǒng de lái shuō, zhè tào fángzi tā hěn mǎnyì, yúshì tā jiù jìxiàle fángdōng de shǒujī hàomǎ. Kě huí jiā hòu dǎ diànhuà, diànhuà zǒngshì zhànxiàn. Dì-èr tiān, tā lùguò xiǎoqū ménkǒu shí, yòu zǐxì kànle yíxià guǎnggào, yuánlái zài jì hàomǎ de shíhou xiěcuòle yí ge shùzì."}]},{"k":5,"t":"p","lines":[{"zh":"很多外国人认为所有中国人都会功夫和乒乓球，其实只是喜爱这两种运动的中国人比较多。中国人特别喜欢打乒乓球，在中国你会发现到处都有乒乓球桌。像乒乓球、羽毛球、跑步等运动对条件要求不高，所以它们都成为人们运动不错的选择。人们常说“生命在于运动”，所以很多人一到周末就会到体育馆打几场球。“乒乓球”这个名字也很有意思，“乒”和“乓”就是打球时发出的声音。在看乒乓球比赛时，尤其是在运动员发球的时候，观众要安静，禁止大声讲话或者离开座位随便走动。","py":"Hěn duō wàiguó rén rènwéi suǒyǒu Zhōngguó rén dōu huì gōngfu hé pīngpāngqiú, qíshí zhǐshì xǐ'ài zhè liǎng zhǒng yùndòng de Zhōngguó rén bǐjiào duō. Zhōngguó rén tèbié xǐhuan dǎ pīngpāngqiú, zài Zhōngguó nǐ huì fāxiàn dàochù dōu yǒu pīngpāngqiú zhuō. Xiàng pīngpāngqiú, yǔmáoqiú, pǎobù děng yùndòng duì tiáojiàn yāoqiú bù gāo, suǒyǐ tāmen dōu chéngwéi rénmen yùndòng búcuò de xuǎnzé. Rénmen cháng shuō “shēngmìng zàiyú yùndòng”, suǒyǐ hěn duō rén yí dào zhōumò jiù huì dào tǐyùguǎn dǎ jǐ chǎng qiú. “Pīngpāngqiú” zhège míngzi yě hěn yǒu yìsi, “pīng” hé “pāng” jiù shì dǎ qiú shí fāchū de shēngyīn. Zài kàn pīngpāngqiú bǐsài shí, yóuqí shì zài yùndòngyuán fā qiú de shíhou, guānzhòng yào ānjìng, jìnzhǐ dàshēng jiǎnghuà huòzhě líkāi zuòwèi suíbiàn zǒudòng."}]}]},"20":{"cn":"路上的风景","en":"The View Along the Way","texts":[{"k":1,"t":"d","lines":[{"sp":"朋友","zh":"该加油了，去机场的路上有加油站吗？","spPy":"Péngyou","py":"Gāi jiāyóu le, qù jīchǎng de lùshang yǒu jiāyóuzhàn ma?"},{"sp":"小张","zh":"我记得过了长江大桥往右一拐就有一个，大概有四五公里远。","spPy":"Xiǎo Zhāng","py":"Wǒ jìde guòle Chángjiāng Dàqiáo wǎng yòu yì guǎi jiù yǒu yí ge, dàgài yǒu sì-wǔ gōnglǐ yuǎn."},{"sp":"朋友","zh":"好，那我就放心了，别开着开着没油了。你去北京的航班是几点的？时间来得及吗？","spPy":"Péngyou","py":"Hǎo, nà wǒ jiù fàngxīn le, bié kāizhe kāizhe méi yóu le. Nǐ qù Běijīng de hángbān shì jǐ diǎn de? Shíjiān láidejí ma?"},{"sp":"小张","zh":"航班本来是十点的，后来机场网站上通知推迟了一个小时，所以九点半以前到应该没问题。","spPy":"Xiǎo Zhāng","py":"Hángbān běnlái shì shí diǎn de, hòulái jīchǎng wǎngzhàn shang tōngzhī tuīchíle yí ge xiǎoshí, suǒyǐ jiǔ diǎn bàn yǐqián dào yīnggāi méi wèntí."},{"sp":"朋友","zh":"刚才我还有点儿担心来不及呢。一会儿加完油，往西走五百米就能上高速公路。走高速公路大约半个小时就到了。","spPy":"Péngyou","py":"Gāngcái wǒ hái yǒudiǎnr dānxīn láibují ne. Yíhuìr jiāwán yóu, wǎng xī zǒu wǔbǎi mǐ jiù néng shàng gāosù gōnglù. Zǒu gāosù gōnglù dàyuē bàn ge xiǎoshí jiù dào le."},{"sp":"小张","zh":"一会儿我自己进去换登机牌，你就不用送我了，等我到了首都机场再给你发短信。","spPy":"Xiǎo Zhāng","py":"Yíhuìr wǒ zìjǐ jìnqù huàn dēngjīpái, nǐ jiù búyòng sòng wǒ le, děng wǒ dàole Shǒudū Jīchǎng zài gěi nǐ fā duǎnxìn."}]},{"k":2,"t":"d","lines":[{"sp":"孙月","zh":"女儿下个星期就要放寒假了，到时候咱们带她去旅游，放松放松，怎么样？","spPy":"Sūn Yuè","py":"Nǚ'ér xià ge xīngqī jiù yào fàng hánjià le, dào shíhou zánmen dài tā qù lǚyóu, fàngsōng fàngsōng, zěnmeyàng?"},{"sp":"丈夫","zh":"平时女儿那么多课，总是说想去旅行，但是没时间，怪可怜的。这次放假咱们带她去哪儿玩儿比较好呢？","spPy":"Zhàngfu","py":"Píngshí nǚ'ér nàme duō kè, zǒngshì shuō xiǎng qù lǚxíng, dànshì méi shíjiān, guài kělián de. Zhè cì fàngjià zánmen dài tā qù nǎr wánr bǐjiào hǎo ne?"},{"sp":"孙月","zh":"去年我同事带她儿子去广西玩儿了一趟，听说很不错，我们就去广西吧。","spPy":"Sūn Yuè","py":"Qùnián wǒ tóngshì dài tā érzi qù Guǎngxī wánrle yí tàng, tīngshuō hěn búcuò, wǒmen jiù qù Guǎngxī ba."},{"sp":"丈夫","zh":"好啊，那里的气候和北方很不同，即使是冬天，也非常暖和，还能吃到许多新鲜的水果。等女儿一回来我就告诉她这个好消息。","spPy":"Zhàngfu","py":"Hǎo a, nàli de qìhòu hé běifāng hěn bù tóng, jíshǐ shì dōngtiān, yě fēicháng nuǎnhuo, hái néng chīdào xǔduō xīnxiān de shuǐguǒ. Děng nǚ'ér yì huílái wǒ jiù gàosu tā zhège hǎo xiāoxi."},{"sp":"孙月","zh":"先别着急说。中午我们不是要去对面的饭店吃烤鸭，祝贺她考试成绩都合格吗？那时候再告诉她，不是更好？","spPy":"Sūn Yuè","py":"Xiān bié zháojí shuō. Zhōngwǔ wǒmen bú shì yào qù duìmiàn de fàndiàn chī kǎoyā, zhùhè tā kǎoshì chéngjì dōu hégé ma? Nà shíhou zài gàosu tā, bú shì gèng hǎo?"},{"sp":"丈夫","zh":"好主意，到时她知道了肯定特别开心。","spPy":"Zhàngfu","py":"Hǎo zhǔyi, dào shí tā zhīdào le kěndìng tèbié kāixīn."}]},{"k":3,"t":"d","lines":[{"sp":"马克","zh":"这么多照片，都是你这次去丽江旅行时照的？那里的自然风景可真美！","spPy":"Mǎkè","py":"Zhème duō zhàopiàn, dōu shì nǐ zhè cì qù Lìjiāng lǚxíng shí zhào de? Nàli de zìrán fēngjǐng kě zhēn měi!"},{"sp":"安娜","zh":"是啊，小城四季的风景都很美，而且环境保护得也很好，因此每年都吸引着成千上万的游客去那儿旅游。","spPy":"Ānnà","py":"Shì a, xiǎochéng sìjì de fēngjǐng dōu hěn měi, érqiě huánjìng bǎohù de yě hěn hǎo, yīncǐ měi nián dōu xīyǐnzhe chéngqiān-shàngwàn de yóukè qù nàr lǚyóu."},{"sp":"马克","zh":"这张照片上和你干杯的那个人是少数民族吗？她打扮得真漂亮。","spPy":"Mǎkè","py":"Zhè zhāng zhàopiàn shang hé nǐ gānbēi de nàge rén shì shǎoshù mínzú ma? Tā dǎban de zhēn piàoliang."},{"sp":"安娜","zh":"她是我们的导游，不是少数民族。一路上她给我们讲了很多有趣的笑话。有一次我把存包的钥匙丢了，最后还是她帮我找到的。这张照片就是找��钥匙后，我们一起照的。","spPy":"Ānnà","py":"Tā shì wǒmen de dǎoyóu, bú shì shǎoshù mínzú. Yí lù shang tā gěi wǒmen jiǎngle hěn duō yǒuqù de xiàohua. Yǒu yí cì wǒ bǎ cún bāo de yàoshi diū le, zuìhòu háishì tā bāng wǒ zhǎodào de. Zhè zhāng zhàopiàn jiù shì zhǎodào yàoshi hòu, wǒmen yìqǐ zhào de."},{"sp":"马克","zh":"明年我有机会也去那儿看看，到时把你的导游介绍给我吧。究竟哪个季节去丽江旅游比较好呢？","spPy":"Mǎkè","py":"Míngnián wǒ yǒu jīhuì yě qù nàr kànkan, dào shí bǎ nǐ de dǎoyóu jièshào gěi wǒ ba. Jiūjìng nǎge jìjié qù Lìjiāng lǚyóu bǐjiào hǎo ne?"},{"sp":"安娜","zh":"那儿最美的季节是春天和秋天，不过那时候人比较多。稍微好一点儿的时间是每年12月到第二年3月。这段时间去丽江的话，无论交通还是吃、住都很便宜。","spPy":"Ānnà","py":"Nàr zuì měi de jìjié shì chūntiān hé qiūtiān, búguò nà shíhou rén bǐjiào duō. Shāowēi hǎo yìdiǎnr de shíjiān shì měinián shí'èryuè dào dì-èr nián sānyuè. Zhè duàn shíjiān qù Lìjiāng de huà, wúlùn jiāotōng háishì chī, zhù dōu hěn piányi."}]},{"k":4,"t":"p","lines":[{"zh":"中国南北距离约5500公里，因此南北气候有很大区别。每年三四月份的时候，如果从北方坐火车到南方去旅游，一路上你会发现，不同的地方有不同的风景：窗外的树一棵一棵地变绿，北方也许还下着雪，南方却已经到处都是绿色了。南方菜很有特点，特别是汤，味道鲜美，很多北方人都喜欢喝。另外，南方和北方的语言也有很大不同。比如你跟上海人对话时，会发现上海话听起来就像外语一样。虽然上海人也会讲普通话，可是仔细听，还是有上海味儿。","py":"Zhōngguó nánběi jùlí yuē wǔqiān wǔbǎi gōnglǐ, yīncǐ nánběi qìhòu yǒu hěn dà qūbié. Měi nián sān-sì yuèfèn de shíhou, rúguǒ cóng běifāng zuò huǒchē dào nánfāng qù lǚyóu, yí lù shang nǐ huì fāxiàn, bù tóng de dìfang yǒu bù tóng de fēngjǐng: chuāngwài de shù yì kē yì kē de biàn lǜ, běifāng yěxǔ hái xiàzhe xuě, nánfāng què yǐjīng dàochù dōu shì lǜsè le. Nánfāng cài hěn yǒu tèdiǎn, tèbié shì tāng, wèidào xiānměi, hěn duō běifāng rén dōu xǐhuan hē. Lìngwài, nánfāng hé běifāng de yǔyán yě yǒu hěn dà bù tóng. Bǐrú nǐ gēn Shànghǎi rén duìhuà shí, huì fāxiàn Shànghǎi huà tīng qǐlái jiù xiàng wàiyǔ yíyàng. Suīrán Shànghǎi rén yě huì jiǎng pǔtōnghuà, kěshì zǐxì tīng, háishì yǒu Shànghǎi wèir."}]},{"k":5,"t":"p","lines":[{"zh":"一个人有时间一定要去旅行，旅行不仅能丰富一个人的经历，而且是最好的减压方法。但对我来说，最重要的是旅行能让我有机会尝到各地有名的小吃。放假的时候，我会收拾好行李，带上地图，买张火车票，向目的地出发。说起吃的东西，给我印象最深的是湖南菜。湖南菜的特点就是辣，与其他地方的辣不同，湖南菜的辣主要是咸辣、香辣和酸辣。虽然全国各地都有湖南饭馆儿，但最好还是直接去那里尝一尝。每次旅行结束后，我都会精神百倍地开始我的工作。","py":"Yí ge rén yǒu shíjiān yídìng yào qù lǚxíng, lǚxíng bùjǐn néng fēngfù yí ge rén de jīnglì, érqiě shì zuì hǎo de jiǎnyā fāngfǎ. Dàn duì wǒ lái shuō, zuì zhòngyào de shì lǚxíng néng ràng wǒ yǒu jīhuì chángdào gè dì yǒumíng de xiǎochī. Fàngjià de shíhou, wǒ huì shōushi hǎo xíngli, dàishang dìtú, mǎi zhāng huǒchēpiào, xiàng mùdìdì chūfā. Shuōqǐ chī de dōngxi, gěi wǒ yìnxiàng zuì shēn de shì Húnán cài. Húnán cài de tèdiǎn jiù shì là, yǔ qítā dìfang de là bù tóng, Húnán cài de là zhǔyào shì xiánlà, xiānglà hé suānlà. Suīrán quánguó gè dì dōu yǒu Húnán fànguǎnr, dàn zuìhǎo háishì zhíjiē qù nàli cháng yì cháng. Měi cì lǚxíng jiéshù hòu, wǒ dōu huì jīngshén bǎibèi de kāishǐ wǒ de gōngzuò."}]}]}} };

const api = {
  getLevels(){ return Object.values(hskData); },
  getLevel(id){ return hskData[id] || null; },
  getLesson(levelId, lessonId){
    const lv = hskData[levelId];
    if(!lv) return null;
    return lv.lessons.find(l => l.id === Number(lessonId)) || null;
  }
};

/* Persisted per-lesson progress (which words have ever been revealed). */
const progressStore = {
  key: 'hf-progress-v1',
  read(){
    try {
      const value = JSON.parse(localStorage.getItem(this.key));
      return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
    } catch(e){ return {}; }
  },
  seenFor(levelId, lessonId){
    const value = this.read()[levelId + '/' + lessonId];
    return Array.isArray(value) ? value : [];
  },
  markSeen(levelId, lessonId, wordId){
    const all = this.read(), k = levelId + '/' + lessonId;
    const set = new Set(Array.isArray(all[k]) ? all[k] : []); set.add(wordId);
    all[k] = [...set];
    try { localStorage.setItem(this.key, JSON.stringify(all)); } catch(e){}
  }
};

function Icon({ name, size = 20, className = '', strokeWidth = 2 }){
  const markup = ICONS[name];
  if (!markup) return null;
  return (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={className} aria-hidden="true"
      dangerouslySetInnerHTML={{ __html: markup }} />
  );
}

function useDarkMode(){
  const [dark, setDark] = useState(() => {
    try {
      const saved = localStorage.getItem('hf-theme');
      if (saved) return saved === 'dark';
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch(e){ return false; }
  });
  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    try { localStorage.setItem('hf-theme', dark ? 'dark' : 'light'); } catch(e){}
  }, [dark]);
  return [dark, setDark];
}

function useHashRoute(){
  const parse = () => {
    const hash = (window.location.hash || '').replace(/^#/, '') || '/';
    const parts = hash.split('/').filter(Boolean);
    if (parts[0] === 'hsk' && parts[1]) {
      if (parts[2] === 'lesson' && parts[3]) return { name:'lesson', levelId:parts[1], lessonId:parts[3] };
      return { name:'level', levelId:parts[1] };
    }
    return { name:'home' };
  };
  const [route, setRoute] = useState(parse);
  useEffect(() => {
    const on = () => { setRoute(parse()); window.scrollTo(0,0); };
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  return route;
}

function SpeakButton({ text }){
  const [talking, setTalking] = useState(false);
  const speak = (e) => {
    e.stopPropagation();
    if (!('speechSynthesis' in window)) return;
    const voices = speechSynthesis.getVoices();
    const chineseVoice = voices.find(voice => voice.lang.toLowerCase() === 'zh-cn')
      || voices.find(voice => voice.lang.toLowerCase().startsWith('zh'));
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.voice = chineseVoice || null;
    u.rate = text.length > 6 ? 0.8 : 0.5;
    u.pitch = 1;
    u.onend = () => setTalking(false);
    u.onerror = () => setTalking(false);
    setTalking(true);
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    setTimeout(() => setTalking(false), Math.min(30000, 2500 + text.length * 450));
  };
  return (
    <button onClick={speak} aria-label={'Hear ' + text} className={'speak' + (talking ? ' on' : '')}>
      <Icon name="volume-2" size={17}/>

/* ================================================================
   Visitor counter — free hosted counter APIs (no server needed).
   "visits"   = once per browser session, "visitors" = once per device.
   Nothing is counted on localhost / file:// and nothing is shown if the
   service cannot be reached (we never display made-up numbers).
================================================================ */
const VISIT_NS = 'hanziboss-hsk';
const COUNTER_APIS = [
  { hit: k => 'https://api.counterapi.dev/v1/' + VISIT_NS + '/' + k + '/up',  get: k => 'https://api.counterapi.dev/v1/' + VISIT_NS + '/' + k,  read: j => j.count },
  { hit: k => 'https://abacus.jasoncameron.dev/hit/' + VISIT_NS + '/' + k,     get: k => 'https://abacus.jasoncameron.dev/get/' + VISIT_NS + '/' + k, read: j => j.value }
];
async function counterCall(key, increment){
  for (const api of COUNTER_APIS) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 6000);
      const res = await fetch(increment ? api.hit(key) : api.get(key), { cache: 'no-store', signal: ctl.signal });
      clearTimeout(timer);
      if (!res.ok) continue;
      const n = Number(api.read(await res.json()));
      if (Number.isFinite(n)) return n;
    } catch (e) { /* try the next service */ }
  }
  return null;
}
let visitorStatsPromise = null;
function loadVisitorStats(){
  if (!visitorStatsPromise) visitorStatsPromise = (async () => {
    const isLocal = window.location.protocol === 'file:' || /^(localhost|127\.|\[::1\])/.test(window.location.hostname);
    let newSession = false, newVisitor = false;
    try { newSession = !sessionStorage.getItem('hb-session'); newVisitor = !localStorage.getItem('hb-visitor'); } catch (e) {}
    const [visits, visitors] = await Promise.all([
      counterCall('visits', !isLocal && newSession),
      counterCall('visitors', !isLocal && newVisitor)
    ]);
    try {
      if (!isLocal && visits !== null && newSession) sessionStorage.setItem('hb-session', '1');
      if (!isLocal && visitors !== null && newVisitor) localStorage.setItem('hb-visitor', '1');
    } catch (e) {}
    return (visits === null && visitors === null) ? null : { visits, visitors };
  })();
  return visitorStatsPromise;
}
function VisitorCounter(){
  const [stats, setStats] = useState(null);
  useEffect(() => {
    let alive = true;
    loadVisitorStats().then(s => { if (alive) setStats(s); });
    return () => { alive = false; };
  }, []);
  if (!stats) return null;
  const fmt = n => n === null ? '–' : n.toLocaleString('en-US');
  return (
    <div className="flex items-center gap-4 tabular-nums" aria-label="Visitor statistics">
      <span className="inline-flex items-center gap-1.5" title="Browser sessions that opened the site">
        <Icon name="eye" size={14}/>{fmt(stats.visits)} visits
      </span>
      <span className="inline-flex items-center gap-1.5" title="Different devices that visited">
        <Icon name="users" size={14}/>{fmt(stats.visitors)} visitors
      </span>
    </div>
  );
}

  const i = level.lessons.findIndex(l => l.id === lesson.id);

  const levels = api.getLevels();

/* ================================================================
   HSK 4 study helpers — exam-frequency tiers
   (hskFreq: hanzi -> [rank, seen×] from 27 real HSK 4 papers)
================================================================ */
const TIER_META = {
  1: { label:'Tier 1', name:'Critical',   range:'rank 1–300',
       badge:'text-seal border-seal/35 bg-seal/10 dark:text-[#ef7f72] dark:border-[#ef7f72]/35 dark:bg-seal/15', bar:'bg-seal' },
  2: { label:'Tier 2', name:'High value', range:'rank 301–600',
       badge:'text-jade-deep border-jade/40 bg-jade/10 dark:text-jade', bar:'bg-jade' },
  3: { label:'Tier 3', name:'Supporting', range:'rank 601–900',
       badge:'text-ink/70 border-ink/20 bg-ink/5 dark:text-white/70 dark:border-white/20 dark:bg-white/[0.06]', bar:'bg-ink/40 dark:bg-white/40' },
  4: { label:'Tier 4', name:'Low',        range:'rank 901+',
       badge:'text-ink/45 border-ink/15 dark:text-white/45 dark:border-white/15', bar:'bg-ink/20 dark:bg-white/25' }
};
/* characters whose exam count merges several readings (e.g. 得 de / děi) */
const SHARED_COUNT = new Set(['得','干','趟','脏','等','省','行','结果']);
const tierOf = rank => rank <= 300 ? 1 : rank <= 600 ? 2 : rank <= 900 ? 3 : 4;
const plainHanzi = h => h.replace(/[()（）]/g, '');
const speakHanzi = plainHanzi;
function freqInfo(hanzi){
  const f = hskFreq[plainHanzi(hanzi)];
  return f ? { rank:f[0], seen:f[1], tier:tierOf(f[0]), shared:SHARED_COUNT.has(plainHanzi(hanzi)) } : null;
}

function TierBadge({ tier }){

  );
  const m = TIER_META[tier];
  return (
    <span className={'inline-flex items-center rounded-full border px-2 py-0.5 text-[10px] font-bold uppercase tracking-[0.14em] whitespace-nowrap ' + m.badge}>

}

/* ================================================================
   Grammar tab — patterns, structure and bilingual examples
================================================================ */
function splitGrammarTitle(title){
  const gloss = [];
  const pattern = title.replace(/\s*\(([A-Za-z][^()]*)\)/g, (m, g) => { gloss.push(g.trim()); return ''; }).trim();
  return { pattern: pattern || title, gloss: gloss.join(' vs. ') };
}
function grammarKeywords(pattern, lessonWords){
  const runs = pattern.match(/[\u3400-\u9fff]+/g) || [];
  const vocab = new Set(lessonWords.map(w => w.hanzi));
  const seen = new Set(), out = [];
  runs.forEach(r => {
    if (seen.has(r)) return; seen.add(r);
    if (r.length < 2 && !vocab.has(r)) return;
    const f = freqInfo(r);
    if (f) out.push({ hanzi:r, f });
  });
  return out;
}

}
const speakable = s => s.replace(/\n/g, ' ').replace(/(^|\s)[AB][:：]\s*/g, '$1').replace(/_{3,}/g, '，');

/* ================================================================
   Practice — type your answer, then check that you used the target pattern.
   The textbook notes give prompts, not answer keys, so the checker looks for the
   required pattern (in order) inside a real sentence; it cannot grade meaning.
================================================================ */
function parsePractice(raw){
  const re = /[（(]([^()（）]*)[）)]/g; let m, last = null;
  while ((m = re.exec(raw)) !== null) last = m;
  const hint = last ? last[1].trim() : '';
  let body = last ? raw.slice(0, last.index) + ' ' + raw.slice(last.index + last[0].length) : raw;
  body = body.replace(/[ \t]{2,}/g, ' ').replace(/\s+([AB][:：])/g, '\n$1').replace(/[ \t]+\n/g, '\n').trim();
  const parts = body.split(/_{3,}/);
  return { hint, pre: parts[0] || '', post: parts.slice(1).join(''), hasBlank: parts.length > 1 };
}
function hintTokens(hint){
  if (!hint) return [];
  const esc = w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const toks = [];
  hint.split(/[、，,]/).forEach(part => {
    part = part.trim(); if (!part) return;
    if (part === 'V+着+V+着') { toks.push({ rx: /([\u4e00-\u9fa5])着\1着/, label: 'V着V着' }); return; }
    if (part === 'V+起')      { toks.push({ rx: /[\u4e00-\u9fa5]起/, label: 'V+起' }); return; }
    if (part === 'V+不+V')    { toks.push({ rx: /([\u4e00-\u9fa5])不\1/, label: 'V不V' }); return; }
    part.split('……').forEach(w => { w = w.trim(); if (w) toks.push({ rx: new RegExp(esc(w)), label: w }); });
  });
  return toks;
}
function checkPractice(item, input){
  const txt = input.trim();
  if (!txt) return { ok: false, msg: 'Type your answer first.' };
  const han = txt.replace(/[^\u4e00-\u9fa5]/g, '');
  if (!han) return { ok: false, msg: 'Please answer in Chinese characters.' };
  if (item.tokens.length === 0) return { ok: true, msg: 'Answer saved — this prompt has no fixed pattern, so read it back and see if it sounds natural.' };
  const visible = item.pre + item.post;
  const need = item.tokens.filter(t => !t.rx.test(visible));
  let rest = txt; const missing = [];
  need.forEach(t => {
    const m = t.rx.exec(rest);
    if (m) rest = rest.slice(m.index + m[0].length); else missing.push(t.label);
  });
  if (missing.length) return { ok: false, msg: 'Not yet — your sentence still needs ' + missing.join('、') + (need.length > 1 ? ' (in that order).' : '.') };
  const min = need.reduce((a, t) => a + t.label.length, 0) + 2;
  if (han.length < min) return { ok: false, msg: 'Good start — expand it into a fuller sentence.' };
  return { ok: true, msg: 'Pattern used correctly.' };
}

function PracticeItem({ raw, index }){
  const item = React.useMemo(() => { const p = parsePractice(raw); p.tokens = hintTokens(p.hint); return p; }, [raw]);
  const [val, setVal] = useState('');
  const [res, setRes] = useState(null);
  const run = () => setRes(checkPractice(item, val));
  const full = item.pre + val.trim() + item.post;
  return (
    <li className="pl-1">
      <div className="font-kai text-base sm:text-lg leading-[2.2] break-words">
        <span className="whitespace-pre-wrap">{item.pre}</span>
        <input type="text" value={val} lang="zh-CN" autoComplete="off" autoCapitalize="off" autoCorrect="off" spellCheck={false}
          enterKeyHint="done" aria-label={'Answer for practice item ' + (index + 1)}
          onChange={e => { setVal(e.target.value); setRes(null); }}
          onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); run(); } }}
          className={'inline-block align-baseline w-36 sm:w-52 max-w-full mx-1 bg-transparent px-1.5 text-center font-kai border-b-2 outline-none transition-colors ' +
            (res ? (res.ok ? 'border-jade text-jade-deep dark:text-jade' : 'border-seal text-seal dark:text-[#ef7f72]') : 'border-ink/35 dark:border-white/40 focus:border-jade')}/>
        <span className="whitespace-pre-wrap">{item.post}</span>
      </div>
      <div className="mt-1.5 flex flex-wrap items-center gap-2">
        {item.tokens.length > 0 && (
          <span className="inline-flex items-center gap-1.5 text-[11px] text-ink/50 dark:text-white/50">
            Use:
            {item.tokens.map((t, i) => <span key={i} className="rounded-full border border-ink/15 dark:border-white/15 px-2 py-0.5 font-kai text-xs text-ink dark:text-white">{t.label}</span>)}
          </span>
        )}
        <span className="flex-1"/>
        <button type="button" onClick={run} className="btn-ghost h-8 px-3 text-xs text-jade border-jade/50">Check</button>
        {(val || res) && <button type="button" onClick={() => { setVal(''); setRes(null); }} className="btn-ghost h-8 px-3 text-xs">Clear</button>}
      </div>
      {res && (
        <div role="status" className={'mt-2 rounded-lg px-3 py-2 text-sm ' + (res.ok ? 'bg-jade/10 text-jade-deep dark:text-jade' : 'bg-seal/10 text-seal dark:text-[#ef7f72]')}>
          <div className="flex items-start gap-2">
            <Icon name={res.ok ? 'check' : 'rotate-ccw'} size={16} className="mt-0.5 shrink-0"/>
            <span>{res.msg}</span>
          </div>
          {res.ok && val.trim() && (
            <div className="mt-2 flex items-start gap-2 border-t border-jade/20 pt-2 text-ink dark:text-white">
              <p className="font-kai text-base leading-relaxed flex-1 min-w-0 break-words whitespace-pre-wrap">{full}</p>
              <SpeakButton text={speakable(full)}/>
            </div>
          )}
        </div>
      )}
    </li>
  );
}

/* ================================================================
   Texts tab — textbook lesson texts with the grammar points highlighted
   hskTexts : level -> lesson -> { cn, en, texts:[{k, t:'d'|'p', lines:[…]}] }
   hskMatch : level -> lesson -> point n -> { scope, tok[] } (regex tokens, in order)
================================================================ */
const GCOL = [
  { mark:'bg-jade/15 text-jade-deep dark:text-jade decoration-jade', chip:'border-jade/45 text-jade-deep dark:text-jade bg-jade/10', txt:'text-jade-deep dark:text-jade' },
  { mark:'bg-seal/10 text-seal dark:text-[#ef7f72] decoration-seal', chip:'border-seal/40 text-seal dark:text-[#ef7f72] bg-seal/10', txt:'text-seal dark:text-[#ef7f72]' },
  { mark:'bg-amber-400/20 text-amber-700 dark:text-amber-300 decoration-amber-500', chip:'border-amber-500/45 text-amber-700 dark:text-amber-300 bg-amber-400/10', txt:'text-amber-700 dark:text-amber-300' },
  { mark:'bg-sky-400/15 text-sky-700 dark:text-sky-300 decoration-sky-500', chip:'border-sky-500/45 text-sky-700 dark:text-sky-300 bg-sky-400/10', txt:'text-sky-700 dark:text-sky-300' },
  { mark:'bg-violet-400/15 text-violet-700 dark:text-violet-300 decoration-violet-500', chip:'border-violet-500/45 text-violet-700 dark:text-violet-300 bg-violet-400/10', txt:'text-violet-700 dark:text-violet-300' },
  { mark:'bg-pink-400/15 text-pink-700 dark:text-pink-300 decoration-pink-500', chip:'border-pink-500/45 text-pink-700 dark:text-pink-300 bg-pink-400/10', txt:'text-pink-700 dark:text-pink-300' }
];
const gcol = n => GCOL[(n - 1) % GCOL.length];

/* spans [start,end) in `str` where the grammar point is used */
function pointSpans(cfg, str, textOk){
  const out = [];
  if (cfg.scope === 't') {                     /* pattern spread over sentences (首先…其次) */
    if (!textOk) return out;
    cfg.tok.forEach(t => {
      const r = new RegExp(t, 'g'); let m;
      while ((m = r.exec(str)) !== null) { out.push([m.index, m.index + m[0].length]); if (!m[0].length) r.lastIndex++; }
    });
    return out;
  }
  const sentRx = /[^。！？]+[。！？]*|[。！？]+/g; let sm;
  while ((sm = sentRx.exec(str)) !== null) {   /* all tokens, in order, inside one sentence */
    const base = sm.index, s = sm[0]; let pos = 0, ok = true; const spans = [];
    for (const t of cfg.tok) {
      const r = new RegExp(t, 'g'); r.lastIndex = pos;
      const m = r.exec(s);
      if (!m) { ok = false; break; }
      spans.push([base + m.index, base + m.index + m[0].length]);
      pos = m.index + m[0].length;
    }
    if (ok) spans.forEach(sp => out.push(sp));
  }
  return out;
}
function mergeSpans(spans){
  const sorted = [...spans].sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  const out = []; let last = 0;
  sorted.forEach(sp => { if (sp.s >= last) { out.push(sp); last = sp.e; } });
  return out;
}
const usageCache = {};
function grammarUsage(levelId, lessonId){
  const key = levelId + '-' + lessonId;
  if (usageCache[key]) return usageCache[key];
  const lesson = hskTexts[levelId] && hskTexts[levelId][lessonId];
  const cfgs = (hskMatch[levelId] && hskMatch[levelId][lessonId]) || {};
  const perText = [], totals = {};
  if (lesson) lesson.texts.forEach(t => {
    const joined = t.lines.map(l => l.zh).join('');
    const ok = {}, counts = {};
    Object.keys(cfgs).forEach(n => {
      const c = cfgs[n];
      ok[n] = c.scope !== 't' || c.tok.every(tk => new RegExp(tk).test(joined));
      let spans = 0;
      t.lines.forEach(l => { spans += pointSpans(c, l.zh, ok[n]).length; });
      const cnt = c.scope === 't' ? spans : Math.round(spans / c.tok.length);
      if (cnt > 0) { counts[n] = cnt; (totals[n] = totals[n] || []).push({ k: t.k, count: cnt }); }
    });
    perText.push({ ok, counts });
  });
  return (usageCache[key] = { perText, totals, cfgs });
}

function MarkedLine({ zh, cfgs, ok, active }){
  const spans = [];
  Object.keys(cfgs).forEach(n => {
    if (active && String(active) !== n) return;
    pointSpans(cfgs[n], zh, ok[n]).forEach(sp => spans.push({ s: sp[0], e: sp[1], n: +n }));
  });
  const merged = mergeSpans(spans);
  const nodes = []; let i = 0;
  merged.forEach((sp, idx) => {
    if (sp.s > i) nodes.push(zh.slice(i, sp.s));
    nodes.push(
      <mark key={idx} className={'rounded-sm px-0.5 underline decoration-2 underline-offset-4 bg-transparent ' + gcol(sp.n).mark}>
        {zh.slice(sp.s, sp.e)}<sup className="ml-px font-sans text-[9px] font-bold no-underline align-super">{sp.n}</sup>
      </mark>
    );
    i = sp.e;
  });
  if (i < zh.length) nodes.push(zh.slice(i));
  return <>{nodes}</>;
}
